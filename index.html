/* ---------- 7zz. Sternenhimmel hinter den Karten (Etappe O2) ----------
   Feste Sterne als SVG mit Prozent-Positionen: einmal gebaut, passt sich jeder Größe an, zeichnet nie neu.
   Dazu wenige funkelnde Sterne als eigene Punkte mit CSS-Animation (nur Deckkraft und Größe, läuft auf der
   Grafikkarte, kein JavaScript pro Bild). Feste Saat: bei jedem Start derselbe Himmel.                      */
const SKY_SEED = 20260925;
const SKY_STARS = 260;
const SKY_TWINKLES = 28;
const SKY_TINTS = ['#FFFFFF', '#FFFFFF', '#D6E4FF', '#FFEBD9', '#E4ECFF'];

/** Feste Sterne: x, y als Anteil (0–1), Radius in px, Deckkraft, Farbe. Die meisten sind schwach („leise"). */
function skyStars(count = SKY_STARS) {
  const rnd = seededRandom(SKY_SEED);
  return Array.from({ length: count }, () => {
    const m = rnd() ** 3;
    return { x: rnd(), y: rnd(), r: round2(0.35 + m * 1.05), a: round2(0.14 + m * 0.6), c: SKY_TINTS[Math.floor(rnd() * SKY_TINTS.length)] };
  });
}

/** Funkelnde Sterne: Position in %, Größe in px, Dauer und Versatz der Animation in s. */
function skyTwinkles(count = SKY_TWINKLES) {
  const rnd = seededRandom(SKY_SEED + 1);
  return Array.from({ length: count }, () => ({ x: rnd() * 100, y: rnd() * 100, s: 1.4 + rnd() * 1.4, d: 3.5 + rnd() * 5, delay: -rnd() * 8 }));
}

const Sky = {
  built: false,
  build() {
    const el = $('#sky');
    if (!el || this.built) return;
    const pct = (v) => `${(v * 100).toFixed(2)}%`;
    const stars = skyStars();
    const halos = stars.filter((s) => s.r > 1.05).map((s) => `<circle cx="${pct(s.x)}" cy="${pct(s.y)}" r="${(s.r * 4).toFixed(1)}" fill="url(#skyHalo)" opacity="${(s.a * 0.45).toFixed(2)}"/>`).join('');
    const dots = stars.map((s) => `<circle class="st" cx="${pct(s.x)}" cy="${pct(s.y)}" r="${s.r}" fill="${s.c}" opacity="${s.a}"/>`).join('');
    const tw = skyTwinkles().map((t) => `<i style="left:${t.x.toFixed(2)}%;top:${t.y.toFixed(2)}%;width:${t.s.toFixed(1)}px;height:${t.s.toFixed(1)}px;--d:${t.d.toFixed(1)}s;--delay:${t.delay.toFixed(1)}s"></i>`).join('');
    el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" focusable="false"><defs><radialGradient id="skyHalo"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>${halos}${dots}</svg><div class="sky-tw">${tw}</div>`;
    this.built = true;
  },
  /** Ein- und ausblenden nach Einstellung; baut den Himmel beim ersten Einblenden. Bei gesperrten Daten sichtbar. */
  apply() {
    const el = $('#sky');
    if (!el) return;
    const on = !Store.state || Store.state.settings.starfield !== false;
    el.hidden = !on;
    if (on) this.build();
  }
};

/* ---------- 7zz3. Lebendige Bewegung (Etappe O3) ----------
   Karten gleiten nur beim Seitenwechsel ein, nicht bei jedem Neuzeichnen. Große Zahlen zählen beim Seitenwechsel
   von 0 hoch und nach einer Änderung vom alten zum neuen Wert. Der Text im DOM ist dabei immer der Endwert –
   die Zwischenzahl steht nur in einem Pseudo-Element (siehe .counting). Stufen: voll, reduziert (nur Einblenden), aus. */
const MOTION_CARDS = '.hero, .kpi, .panel, .account, .welcome, .soon, .sem-card, .universe-info';
const COUNT_TARGETS = '.hero-value, .hero-side strong, .kpi-val, .account-balance';
const COUNT_MS = 750;

/** 'full' | 'reduced' | 'off' – Einstellung „Animationen" und Systemwunsch „Bewegung reduzieren". */
function motionLevel() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return 'off';
  const a = Store.state ? Store.state.settings.animations : 'voll';
  return a === 'aus' ? 'off' : a === 'reduziert' ? 'reduced' : 'full';
}

/** Zerlegt eine angezeigte Zahl wie „-1.349,37 €" oder „21,8 %" in Wert und Form. null, wenn keine Zahl drinsteht. */
function parseShownNumber(text) {
  const m = String(text).trim().match(/^([^\d\u2212-]*)([\u2212-]?)(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?(\D*)$/);
  if (!m) return null;
  const decimals = m[4] ? m[4].length : 0;
  const value = (m[2] ? -1 : 1) * Number(m[3].replace(/\./g, '') + (decimals ? '.' + m[4] : ''));
  return { value, pre: m[1], minus: m[2] || '-', decimals, grouped: m[3].includes('.'), post: m[5] };
}

/** Schreibt einen Wert in derselben Form wie die angezeigte Zahl. */
function formatShownNumber(value, shape) {
  const abs = Math.abs(value);
  const body = new Intl.NumberFormat('de-DE', { minimumFractionDigits: shape.decimals, maximumFractionDigits: shape.decimals, useGrouping: shape.grouped || abs >= 1000 }).format(abs);
  const negative = value < 0 || Object.is(value, -0); // wie Intl: -0,4 ohne Cent ergibt „-0 €“
  return `${shape.pre}${negative ? shape.minus : ''}${body}${shape.post}`;
}

/** Wischbare Roadmap (O5): Klasse „scrolls" für die weichen Ränder, den nächsten offenen Schritt in die Mitte holen.
    Läuft nach jedem Zeichnen und nach Drehen oder Größenänderung. */
function revealRoadmaps(root) {
  root.querySelectorAll('.roadmap').forEach((r) => {
    const scrolls = r.scrollWidth > r.clientWidth + 1;
    r.classList.toggle('scrolls', scrolls);
    const next = r.querySelector('.rm-node.next');
    if (next && scrolls) r.scrollLeft = Math.max(0, next.offsetLeft + next.offsetWidth / 2 - r.clientWidth / 2);
  });
}
let roadmapResizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(roadmapResizeTimer); roadmapResizeTimer = setTimeout(() => safeCall(() => revealRoadmaps(document), 'Roadmap'), 150); });

const Motion = {
  last: new Map(),
  enterTimer: 0,
  /** Nach jedem Zeichnen: Staffelung der Karten, Zählen der großen Zahlen. */
  afterRender(root, view, entering) {
    const level = motionLevel();
    if (entering) root.querySelectorAll(MOTION_CARDS).forEach((c, i) => c.style.setProperty('--i', String(Math.min(i, 12))));
    const next = new Map();
    const counting = level === 'full' && !Store.state.settings.privacy;
    root.querySelectorAll(COUNT_TARGETS).forEach((el, i) => {
      if (el.children.length) return;
      const shape = parseShownNumber(el.textContent);
      if (!shape) return;
      const key = `${view}:${i}:${shape.post.trim()}`;
      next.set(key, shape.value);
      if (!counting) return;
      const from = entering ? 0 : this.last.get(key);
      if (from === undefined || from === shape.value) return;
      const card = el.closest(MOTION_CARDS);
      const delay = entering ? Number((card && card.style.getPropertyValue('--i')) || 0) * 45 + 100 : 0;
      this.count(el, from, shape, delay);
    });
    this.last = next;
  },
  count(el, from, shape, delay = 0) {
    el.style.setProperty('--count-color', getComputedStyle(el).color);
    el.dataset.countShow = formatShownNumber(from, shape);
    el.classList.add('counting');
    const start = performance.now() + delay;
    const finish = () => { el.classList.remove('counting'); delete el.dataset.countShow; el.style.removeProperty('--count-color'); };
    const step = (now) => {
      if (!el.isConnected) return;
      const t = Math.min(1, Math.max(0, (now - start) / COUNT_MS));
      if (t >= 1) { finish(); return; }
      el.dataset.countShow = formatShownNumber(from + (shape.value - from) * (1 - (1 - t) ** 3), shape);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },
  /** Abbild eines schließenden Dialogs, das weggleitet: ohne Kennungen, Namen, Rollen und Aktionen, nicht bedienbar. */
  ghost(overlay) {
    const g = overlay.cloneNode(true);
    const src = overlay.querySelectorAll('input, select, textarea');
    g.querySelectorAll('input, select, textarea').forEach((n, i) => {
      const o = src[i];
      if (!o) return;
      if (n.type === 'checkbox' || n.type === 'radio') n.checked = o.checked; else if (n.type !== 'file') n.value = o.value;
    });
    for (const n of [g, ...g.querySelectorAll('*')]) {
      for (const a of [...n.attributes]) if (/^(id|name|for|role|href|data-.*|aria-.*)$/.test(a.name) && !(a.name === 'href' && n.tagName.toLowerCase() === 'use')) n.removeAttribute(a.name);
    }
    g.className = 'overlay-ghost';
    g.setAttribute('aria-hidden', 'true');
    g.inert = true;
    const form = g.firstElementChild, dialog = overlay.firstElementChild;
    if (form) form.setAttribute('class', form.getAttribute('class').replace(/\bdialog\b/, 'dialog-ghost'));
    document.body.append(g);
    if (form && dialog) form.scrollTop = dialog.scrollTop;
    setTimeout(() => g.remove(), 260);
    return g;
  }
};

/* ---------- 8. App & Router ---------- */
const App = {
  current: 'dashboard',

  init() {
    mountIconSprite();
    Sky.apply();
    Pwa.init();
    const status = Store.load();
    const fresh = status === true;
    if (Disk.mode === 'broken') setTimeout(() => UI.toast('Deine gespeicherten Daten ließen sich gerade nicht öffnen. Es wurde nichts überschrieben – bitte starte die App neu.'), 600);
    else if (Disk.migrated) setTimeout(() => UI.toast('Deine Daten liegen jetzt in der App-Datenbank – mit deutlich mehr Platz.'), 600);
    UI.renderNav();
    UI.initTheme();
    UI.renderSaveState();
    $('#menuBtn').addEventListener('click', () => UI.toggleSidebar());
    // Ein Listener für alle Buttons im Inhalt – überlebt jedes Neuzeichnen
    $('#content').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (btn && ACTIONS[btn.dataset.action]) safeCall(() => ACTIONS[btn.dataset.action](btn.dataset.id, btn), 'Aktion');
    });
    $('#content').addEventListener('submit', (e) => {
      const form = e.target.closest('[data-form]');
      if (!form || !FORMS[form.dataset.form]) return;
      e.preventDefault();
      safeCall(() => FORMS[form.dataset.form](Object.fromEntries(new FormData(form).entries()), form), 'Formular');
    });
    $('#backdrop').addEventListener('click', () => UI.toggleSidebar(false));
    // Plus-Button mit Schnellmenü
    const fabBtn = $('#fabBtn'), fabMenu = $('#fabMenu');
    fabBtn.innerHTML = icon('plus');
    const fabIcons = { 'expense-new': 'out', 'income-new': 'in', 'goal-new': 'target', 'transfer-new': 'zap', 'account-new': 'wallet', 'csv-import': 'file' };
    fabMenu.querySelectorAll('[data-fab]').forEach((b) => { b.querySelector('.tag').innerHTML = icon(fabIcons[b.dataset.fab]); });
    const toggleFab = (open) => {
      const show = open ?? fabMenu.hidden;
      if (show && Store.state) $('#fabQuick').innerHTML = fabQuickHtml(); // Schnellerfassung (E5) immer aktuell
      fabMenu.hidden = !show;
      fabBtn.setAttribute('aria-expanded', String(show));
      fabBtn.classList.toggle('open', show);
    };
    fabBtn.addEventListener('click', () => { if (Store.state) toggleFab(); });
    fabMenu.addEventListener('click', (e) => {
      const q = e.target.closest('[data-quick]');
      if (q) {
        toggleFab(false);
        const run = { tpl: () => bookTemplate(q.dataset.id), repeat: () => repeatLast(), new: () => openTemplateForm() }[q.dataset.quick];
        if (run) safeCall(run, 'Schnellerfassung');
        return;
      }
      const b = e.target.closest('[data-fab]');
      if (!b) return;
      toggleFab(false);
      safeCall(() => ACTIONS[b.dataset.fab](), 'Schnellmenü');
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('#fab')) toggleFab(false); });
    // Tastatur: N = neuer Eintrag, / = Suche
    document.addEventListener('keydown', (e) => {
      if (!Store.state) return;
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      if (typing || document.querySelector('.overlay') || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); toggleFab(true); const first = fabMenu.querySelector('[data-fab]'); if (first) first.focus(); } // nie eine Vorlage: Enter würde sofort buchen
      if (e.key === '/') { e.preventDefault(); $('#globalSearch').focus(); }
    });
    const search = $('#globalSearch');
    search.addEventListener('input', () => { if (Store.state) renderSearchResults(search.value); });
    search.addEventListener('focus', () => { if (Store.state) renderSearchResults(search.value); });
    $('#searchResults').addEventListener('click', (e) => {
      const item = e.target.closest('[data-view]');
      if (!item) return;
      search.value = '';
      $('#searchResults').hidden = true;
      if (item.dataset.tag !== undefined) { ACTIONS['tag-open'](item.dataset.tag); return; } // Schlagwort (E7)
      location.hash = '#/' + item.dataset.view;
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('#searchResults').hidden = true; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') UI.toggleSidebar(false); });
    window.addEventListener('hashchange', () => this.route(true));
    // Rückgängig und Wiederholen: Knöpfe und Tastatur
    document.querySelectorAll('[data-history]').forEach((b) => {
      b.innerHTML = icon(b.dataset.history);
      b.addEventListener('click', () => {
        if (!Store.state) return;
        if (b.dataset.history === 'privacy') Store.update((s) => { s.settings.privacy = !s.settings.privacy; });
        else if (b.dataset.history === 'lock') lockNow();
        else if (b.dataset.history === 'undo') Store.undo();
        else Store.redo();
      });
    });
    document.addEventListener('keydown', (e) => {
      if (!Store.state) return;
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      if (typing || document.querySelector('.overlay') || !(e.ctrlKey || e.metaKey)) return;
      const key = e.key.toLowerCase();
      if (key === 'z' && !e.shiftKey) { e.preventDefault(); Store.undo(); }
      else if (key === 'y' || (key === 'z' && e.shiftKey)) { e.preventDefault(); Store.redo(); }
    });
    // Mehrere Fenster: Änderungen aus einem anderen Tab übernehmen statt zu überschreiben
    const onExternal = (e) => {
      if (e.key !== STORAGE_KEY || !e.newValue) return;
      if (Vault.isEnvelope(e.newValue)) {
        if (!Vault.key) {
          // Sperre wurde in einem anderen Fenster eingeschaltet: hier ebenfalls sperren, nichts überschreiben
          Object.assign(Vault, { enabled: true, locked: true });
          Store.state = null;
          $('#content').innerHTML = '';
          LockScreen.show('In einem anderen Fenster wurde die App-Sperre aktiviert.');
          return;
        }
        Vault.decryptWith(Vault.key, e.newValue).then((text) => {
          Store.state = repairState(Store.migrate(JSON.parse(text))).state;
          Store.revision++;
          this.render(false);
        }).catch(() => lockNow());
        return;
      }
      if (Vault.enabled) Object.assign(Vault, { enabled: false, key: null, salt: null });
      try {
        Store.state = repairState(Store.migrate(JSON.parse(e.newValue))).state;
        Store.revision++;
        Fmt.reset();
        this.render(false);
        UI.toast('In einem anderen Fenster geändert – Ansicht aktualisiert.');
      } catch (err) { reportError('Synchronisation', err); }
    };
    window.addEventListener('storage', onExternal); // Browser-Speicher (Modus „local“)
    Disk.listen(onExternal);                        // App-Datenbank: Nachricht aus einem anderen Fenster
    window.addEventListener('error', (e) => reportError('Anzeige', e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => reportError('Hintergrund', e.reason));
    let resizeTimer = null; // Diagramme an neue Breite anpassen
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => this.render(false), 200); });
    initAutoLock();
    // Haptisches Feedback beim Tippen, wenn eingeschaltet und vom Gerät unterstützt
    document.addEventListener('pointerdown', (e) => {
      if (!Store.state || !Store.state.settings.haptics || !navigator.vibrate) return;
      if (e.target.closest('.btn, .mini, .tool-btn, .fab, .nav-link, .kpi-btn, .cal-day, .toggle, .swatch, .fab-menu button')) navigator.vibrate(8);
    }, { passive: true });
    this.ready = true;
    if (status === 'locked') { LockScreen.show(); return; }
    this.route(false);
    if (fresh && Disk.mode !== 'broken') UI.toast('Leer gestartet. Alles, was du einträgst, bleibt in diesem Browser.'); // Daten existieren, sind nur gerade nicht erreichbar
    else if (Store.repaired) UI.toast(`${Store.repaired} Unstimmigkeiten in deinen Daten wurden beim Laden automatisch repariert.`);
  },

  /** Nach dem Entsperren: Ansicht aufbauen und Speicherstatus anzeigen. */
  afterUnlock() {
    Fmt.reset();
    UI.renderSaveState();
    this.route(false);
  },

  /** Liest die Ansicht aus der Adresse (#/einnahmen …) und zeigt sie an. */
  route(byUser) {
    if (!Store.state) return;
    const id = (location.hash.match(/^#\/?([\w-]+)/) || [])[1];
    const start = VIEWS.some((v) => v.id === setting('startView')) ? setting('startView') : 'dashboard';
    this.current = VIEWS.some((v) => v.id === id) ? id : start;
    const jumpTo = focusAfterRender; // Sprungziel (z. B. „Vorlagen“ → Einstellungen → Schnellerfassung) nicht wieder nach oben scrollen
    this.render(true);
    // Schnellstart vom Startbildschirm: #/expenses?neu=ausgabe öffnet direkt das Formular
    const quick = (location.hash.match(/[?&]neu=(ausgabe|einnahme)/) || [])[1];
    if (quick) {
      history.replaceState(null, '', `#/${this.current}`);
      ACTIONS[quick === 'ausgabe' ? 'expense-new' : 'income-new']();
    }
    UI.toggleSidebar(false);
    if (byUser && !(jumpTo && document.querySelector(jumpTo))) { window.scrollTo(0, 0); $('#content').focus({ preventScroll: true }); }
  },

  /** Zeichnet die aktuelle Ansicht; animate = true nur beim Seitenwechsel. */
  render(animate) {
    if (!Store.state) return; // gesperrt: nichts anzeigen
    applySettings();
    const lockButton = document.querySelector('[data-history="lock"]');
    if (lockButton) lockButton.hidden = !Vault.enabled;
    const view = VIEWS.find((v) => v.id === this.current);
    const el = $('#content');
    // Fokus und Cursor merken, damit beim Tippen nichts verloren geht
    const active = document.activeElement;
    const keep = active && el.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)
      ? { id: active.id, name: active.name, start: active.selectionStart, end: active.selectionEnd } : null;
    $('#pageTitle').textContent = view.label;
    document.title = `${view.label} – Finanzplaner`;
    pendingCharts = [];
    Universe.stop();
    checkAchievements();
    if (!animate) el.classList.remove('view-enter'); // Karten gleiten nur beim Seitenwechsel ein
    try {
      el.innerHTML = (RENDERERS[view.id] || (() => renderSoon(view)))();
    } catch (e) {
      reportError('Ansicht', e);
      pendingCharts = [];
      el.innerHTML = `<section class="welcome"><h2>Diese Ansicht konnte nicht geladen werden</h2><p>Deine Daten sind unverändert. Probiere es erneut oder prüfe die Daten in den Einstellungen.</p><div class="head-tools"><button type="button" class="btn primary" data-action="go" data-id="dashboard">Zum Dashboard</button><button type="button" class="btn" data-action="go" data-id="settings">Einstellungen</button></div></section>`;
    }
    UI.setActiveNav(view.id);
    Charts.mount();
    if (MOUNTS[view.id]) safeCall(() => MOUNTS[view.id](), 'Ansicht');
    if (keep) {
      const selector = keep.id ? `#${keep.id}` : keep.name ? `[name="${keep.name}"]` : null;
      const next = selector ? el.querySelector(selector) : null;
      if (next) {
        next.focus({ preventScroll: true });
        try { if (keep.start !== null && next.setSelectionRange) next.setSelectionRange(keep.start, keep.end); } catch (e) {}
      }
    }
    if (focusAfterRender) { const target = $(focusAfterRender); if (target) target.focus(); focusAfterRender = null; }
    if (animate) {
      el.classList.remove('view-enter'); void el.offsetWidth; el.classList.add('view-enter');
      clearTimeout(Motion.enterTimer);
      Motion.enterTimer = setTimeout(() => el.classList.remove('view-enter'), 1400);
    }
    safeCall(() => Motion.afterRender(el, view.id, !!animate), 'Bewegung');
    safeCall(() => revealRoadmaps(el), 'Roadmap');
  }
};

document.addEventListener('DOMContentLoaded', () => { Disk.open().catch(() => 'local').then(() => App.init()); });
</script>
