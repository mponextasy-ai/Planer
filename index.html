      <span class="row-main"><span class="row-title">${esc(e.name)}</span><span class="row-sub">${esc(sub)}${x.future ? ' · geplant' : ''}</span></span>
      <span class="row-amt"><span class="num ${e.kind === 'income' ? 'amt-in' : 'amt-out'}">${e.kind === 'income' ? '+' : ''}${Fmt.money(x.amount)}</span></span>
      <span class="row-actions"><button type="button" class="mini" data-action="${edit}" data-id="${e.id}" aria-label="${esc(e.name)} bearbeiten">${icon('edit')}</button></span>
    </li>`;
  }).join('');
  return `
    <div class="report-head no-print">
      ${reportTabs('tags')}
      <span class="month-nav"><button type="button" class="btn ghost" data-action="tag-back">${icon('chevL')}Alle Schlagwörter</button></span>
      <span class="head-tools">
        <button type="button" class="btn" data-action="tag-budget" data-id="${esc(r.key)}">${icon('target')}${r.budget ? 'Rahmen ändern' : 'Rahmen festlegen'}</button>
        <button type="button" class="btn" data-action="tag-rename" data-id="${esc(r.key)}">${icon('edit')}Umbenennen</button>
        <button type="button" class="btn" data-action="tag-remove" data-id="${esc(r.key)}">${icon('trash')}Entfernen</button>
      </span>
    </div>
    <h2 class="report-title">#${esc(r.name)}</h2>
    <div class="kpis">
      ${kpi('out', 'expense', 'Ausgegeben', Fmt.money(r.spent), r.planned ? `dazu ${Fmt.money(r.planned)} geplant` : `${r.count} ${r.count === 1 ? 'Buchung' : 'Buchungen'}`)}
      ${r.received ? kpi('in', 'income', 'Eingenommen', Fmt.money(r.received), `unterm Strich ${Fmt.money(r.net, true)}`) : kpi('pie', 'brand', 'Kategorien', String(r.byCat.length), r.byCat.length ? `am meisten ${catLabel(r.byCat[0][0])}` : '–')}
      ${kpi('cal', 'saving', 'Zeitraum', r.first ? (r.first === r.last ? dateDe(r.first) : `${Math.max(1, Math.round((parseISO(r.last) - parseISO(r.first)) / 864e5) + 1)} Tage`) : '–', r.first && r.first !== r.last ? `${dateDe(r.first)} – ${dateDe(r.last)}` : 'ein Tag')}
      ${r.budget ? kpi('target', left < 0 ? 'expense' : 'income', 'Rahmen', Fmt.money(r.budget), left < 0 ? `${Fmt.money(-left)} überschritten` : `noch ${Fmt.money(left)} frei`) : ''}
    </div>
    ${r.budget ? `<div class="panel s12 tag-budget">${bar(r.spent / r.budget, r.spent > r.budget ? 'bad' : r.spent >= r.budget * 0.8 ? 'warn' : 'ok', `Rahmen ${r.name}`)}<p class="meter-sub">${Fmt.pct(r.spent / r.budget)} des Rahmens ausgegeben${r.planned ? `, mit den geplanten Buchungen ${Fmt.pct((r.spent + r.planned) / r.budget)}` : ''}.</p></div>` : ''}
    <div class="panels">
      ${series.length ? `<section class="panel s7"><h2>${r.days ? 'Je Tag' : 'Je Monat'}</h2><div class="chart-box" id="tagChart"></div></section>` : ''}
      <section class="panel ${series.length ? 's5' : 's12'}"><h2>Nach Kategorie</h2><ul class="list">${catRows}</ul></section>
      <section class="panel s12"><h2>Buchungen</h2><ul class="list">${itemRows}</ul></section>
    </div>`;
}

/* ---------- Buchung aufteilen (Etappe E6) ----------
   Eine aufgeteilte Ausgabe sind mehrere normale Einzelbuchungen mit gemeinsamer splitId (gleicher Name, Tag, Konto,
   Notiz), je eine pro Kategorie. So rechnen Budgets, Berichte, Steuer und Universum ohne Sonderfall richtig.
   Listen, die Käufe zeigen oder zählen, fassen die Teile mit groupSplits() wieder zu einem Kauf zusammen.
   Nur einmalige Ausgaben lassen sich aufteilen (nicht wiederkehrende, nicht aus dem Semester-Planer). */
const splitParts = (sid) => Store.state.entries.filter((e) => e.splitId === sid);
const entryTotal = (e) => (e && e.splitId ? round2(splitParts(e.splitId).reduce((sum, x) => sum + x.amount, 0)) : e ? e.amount : 0);
const canSplit = (e) => !!e && e.kind === 'expense' && e.interval === 'once' && e.source !== 'semester';
const taxShort = (label) => String(label).split(' (')[0];
/** Reihenfolge für „Weitere Kategorie“: was bei einem Einkauf typischerweise zusammenkommt, danach alle übrigen. */
const SPLIT_ORDER = ['lebensmittel', 'drogerie', 'haushalt', 'kleidung', 'freizeit', 'restaurants', 'studium', 'sonstiges'];

/** Teile einer Aufteilung zu einem Eintrag mit Gesamtbetrag zusammenfassen (Reihenfolge bleibt). */
function groupSplits(list) {
  const out = [], seen = new Map();
  for (const e of list) {
    if (!e.splitId) { out.push(e); continue; }
    const g = seen.get(e.splitId);
    if (g) { g.amount = round2(g.amount + e.amount); g.parts.push(e); continue; }
    const item = { ...e, parts: [e] };
    seen.set(e.splitId, item);
    out.push(item);
  }
  return out;
}

/** Aufteilung speichern: ersetzt die bisherigen Teile (oder die ursprüngliche Buchung) an ihrer Stelle. */
function saveSplit(base, oldIds, parts) {
  const sid = base.splitId || uid();
  const common = { kind: 'expense', interval: 'once', name: base.name, date: base.date, accountId: base.accountId || null, note: base.note || '', splitId: sid };
  if (base.tags && base.tags.length) common.tags = base.tags.slice(); // Schlagwörter gelten für den ganzen Kauf (E7)
  if (base.source) common.source = base.source;
  const ids = oldIds.slice();
  const entries = parts.map((pt) => ({ id: ids.shift() || uid(), ...common, category: pt.category, amount: pt.amount, tax: TAX_GROUPS[pt.tax] ? pt.tax : null, taxShare: base.taxShare || 100 }));
  Store.update((s) => {
    const first = s.entries.findIndex((e) => oldIds.includes(e.id));
    s.entries = s.entries.filter((e) => !oldIds.includes(e.id));
    s.entries.splice(first < 0 ? s.entries.length : first, 0, ...entries);
  });
  UI.toast(`Aufgeteilt: ${parts.map((pt) => `${catLabel(pt.category)} ${Fmt.money(pt.amount)}`).join(', ')}.`, { label: 'Rückgängig', run: () => Store.undo() });
}

/** Aufteilung aufheben: eine Buchung mit dem Gesamtbetrag, Kategorie und Steuer des größten Teils. */
function unsplit(sid) {
  const parts = splitParts(sid);
  if (!parts.length) return;
  const biggest = parts.slice().sort((a, b) => b.amount - a.amount)[0];
  const merged = { ...parts[0], category: biggest.category, tax: biggest.tax || null, amount: round2(parts.reduce((sum, e) => sum + e.amount, 0)) };
  delete merged.splitId;
  Store.update((s) => {
    const first = s.entries.findIndex((e) => e.splitId === sid);
    s.entries = s.entries.filter((e) => e.splitId !== sid);
    s.entries.splice(first, 0, merged);
  });
  UI.toast(`Aufteilung aufgehoben: ${merged.name} ${Fmt.money(merged.amount)} unter ${catLabel(merged.category)}.`, { label: 'Rückgängig', run: () => Store.undo() });
}

/** Ganzen Kauf löschen; Rückgängig setzt alle Teile an ihre alten Stellen zurück. */
function deleteSplitGroup(sid) {
  const removed = [];
  Store.state.entries.forEach((e, i) => { if (e.splitId === sid) removed.push([i, e]); });
  if (!removed.length) return;
  const total = round2(removed.reduce((sum, [, e]) => sum + e.amount, 0));
  Store.update((s) => { s.entries = s.entries.filter((e) => e.splitId !== sid); });
  UI.toast(`${removed[0][1].name} (${Fmt.money(total)}, aufgeteilt) gelöscht.`, { label: 'Rückgängig', run: () => Store.update((s) => { for (const [i, e] of removed) s.entries.splice(i, 0, e); }) });
}

/** Dialog „Auf Kategorien aufteilen“. src = { group: [Teile] } oder { base: Buchung bzw. Formularwerte }.
    Der erste Teil ist der Rest: Gesamtbetrag minus alle anderen Teile. */
function openSplitForm(src) {
  const group = src.group || null;
  const base = group ? { ...group[0], amount: round2(group.reduce((sum, e) => sum + e.amount, 0)) } : { ...src.base };
  const oldIds = group ? group.map((e) => e.id) : base.id ? [base.id] : [];
  const firstCat = base.category || setting('defaultCategory') || 'lebensmittel';
  let parts = group ? group.map((e) => ({ category: e.category, amount: e.amount, tax: e.tax || '' }))
    : [{ category: firstCat, amount: 0, tax: base.tax || '' }, { category: firstCat === 'lebensmittel' ? 'drogerie' : 'lebensmittel', amount: '', tax: '' }];
  const taxOptions = { '': 'Privat', ...Object.fromEntries(Object.entries(TAX_GROUPS).map(([k, l]) => [k, taxShort(l)])) };
  const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? Math.abs(n) : 0; };
  const body = `
    <p class="dialog-text">Verteile den Betrag auf mehrere Kategorien – zum Beispiel einen Einkauf mit Lebensmitteln und Drogerie. Was du nicht verteilst, bleibt als Rest im ersten Teil.</p>
    ${field('Name', `<input name="name" type="text" value="${esc(base.name || '')}" placeholder="z. B. Wocheneinkauf" required>`)}
    <div class="field-row">
      ${field('Gesamtbetrag', `<input name="amount" type="number" step="0.01" min="0" value="${base.amount ?? ''}" required>`)}
      ${field('Datum', `<input name="date" type="date" value="${base.date || toISO(today())}" required>`)}
    </div>
    <div class="field-row">
      ${field('Konto', accountSelect('accountId', base.accountId))}
      ${field('Notiz', `<input name="note" type="text" value="${esc(base.note || '')}" placeholder="optional">`)}
    </div>
    ${tagField(base.tags)}
    <div class="split-box">
      <div class="split-head" aria-hidden="true"><span>Kategorie</span><span>Betrag</span><span>Steuerlich absetzbar</span><span></span></div>
      <div id="splitRows"></div>
      <button type="button" class="btn ghost" data-split-add>${icon('plus')}Weitere Kategorie</button>
      <p class="meter-sub" id="splitStatus" aria-live="polite"></p>
    </div>
    ${group ? `<button type="button" class="btn ghost" data-split-merge>${icon('undo')}Aufteilung aufheben</button>` : ''}`;
  const dialog = UI.modal({
    title: group ? 'Aufteilung bearbeiten' : 'Auf Kategorien aufteilen', body, submitLabel: 'Aufteilen',
    onSubmit: (data) => {
      const total = round2(num(data.amount));
      if (!(total > 0)) { UI.toast('Bitte einen Gesamtbetrag größer als 0 eintragen.'); return false; }
      const others = parts.slice(1).map((pt) => ({ ...pt, amount: round2(num(pt.amount)) }));
      const rest = round2(total - others.reduce((sum, pt) => sum + pt.amount, 0));
      if (rest < 0) { UI.toast(`Die Teile sind ${Fmt.money(-rest)} größer als der Gesamtbetrag.`); return false; }
      const final = [{ ...parts[0], amount: rest }, ...others].filter((pt) => pt.amount > 0);
      if (final.length < 2) { UI.toast('Für eine Aufteilung braucht es mindestens zwei Teile mit Betrag.'); return false; }
      saveSplit({ ...base, name: (data.name || '').trim() || base.name || 'Ausgabe', date: data.date || base.date || toISO(today()), accountId: data.accountId || null, note: (data.note || '').trim(), tags: normTags(data.tags) }, oldIds, final);
    }
  });
  const ov = dialog.overlay;
  wireTagField(ov);
  const totalInput = ov.querySelector('[name="amount"]');
  const status = () => {
    const total = round2(num(totalInput.value));
    const rest = round2(total - parts.slice(1).reduce((sum, pt) => sum + num(pt.amount), 0));
    const out = ov.querySelector('.split-rest');
    if (out) { out.textContent = Fmt.money(rest); out.classList.toggle('neg', rest < 0); }
    const filled = parts.slice(1).filter((pt) => num(pt.amount) > 0).length + (rest > 0 ? 1 : 0);
    ov.querySelector('#splitStatus').textContent = rest < 0 ? `Die Teile sind ${Fmt.money(-rest)} größer als der Gesamtbetrag.`
      : filled < 2 ? 'Trag bei mindestens einer weiteren Kategorie einen Betrag ein.'
      : `${filled} Teile, zusammen ${Fmt.money(total)}${rest > 0 ? ` – ${Fmt.money(rest)} bleiben bei ${catLabel(parts[0].category)}` : ''}.`;
  };
  const paintRows = () => {
    ov.querySelector('#splitRows').innerHTML = parts.map((pt, i) => `
      <div class="split-row" data-i="${i}">
        <select data-part="category" aria-label="Kategorie Teil ${i + 1}">${Object.entries(categoryOptions('expense', pt.category)).map(([k, l]) => `<option value="${k}"${k === pt.category ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
        ${i === 0 ? `<output class="split-rest num" aria-label="Rest für Teil 1"></output>` : `<input data-part="amount" type="number" step="0.01" min="0" value="${pt.amount === '' ? '' : pt.amount}" placeholder="0,00" aria-label="Betrag Teil ${i + 1}">`}
        <select data-part="tax" aria-label="Steuerlich absetzbar, Teil ${i + 1}">${Object.entries(taxOptions).map(([k, l]) => `<option value="${k}"${k === (pt.tax || '') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
        ${i === 0 ? '<span class="split-note">Rest</span>' : `<button type="button" class="mini" data-split-remove="${i}" aria-label="Teil ${i + 1} entfernen">${icon('close')}</button>`}
      </div>`).join('');
    status();
  };
  paintRows();
  ov.addEventListener('input', (e) => {
    const row = e.target.closest('.split-row');
    if (row && e.target.dataset.part) parts[Number(row.dataset.i)][e.target.dataset.part] = e.target.value;
    status();
  });
  ov.addEventListener('change', (e) => { const row = e.target.closest('.split-row'); if (row && e.target.dataset.part) { parts[Number(row.dataset.i)][e.target.dataset.part] = e.target.value; status(); } });
  ov.addEventListener('click', (e) => {
    if (e.target.closest('[data-split-add]')) {
      const used = new Set(parts.map((pt) => pt.category));
      const avail = Object.keys(categoryOptions('expense'));
      const next = [...SPLIT_ORDER.filter((c) => avail.includes(c)), ...avail].find((c) => !used.has(c)) || firstCat;
      parts.push({ category: next, amount: '', tax: '' });
      paintRows();
      const inputs = ov.querySelectorAll('[data-part="amount"]');
      if (inputs.length) inputs[inputs.length - 1].focus();
      return;
    }
    const rm = e.target.closest('[data-split-remove]');
    if (rm) { parts.splice(Number(rm.dataset.splitRemove), 1); paintRows(); return; }
    if (e.target.closest('[data-split-merge]') && group) { dialog.close(); unsplit(group[0].splitId); }
  });
}

function renderExpenses() {
  const t = today();
  const { from, to } = monthBounds(expenseMonth);
  const monthLabel = periodLabel({ from, to });
  const all = Store.state.entries.filter((e) => e.kind === 'expense');
  const fixed = all.filter((e) => e.interval !== 'once' && isCurrent(e)).sort((a, b) => monthlyAmount(b) - monthlyAmount(a));
  const variable = groupSplits(all
    .filter((e) => e.interval === 'once' && e.date >= toISO(from) && e.date <= toISO(to)))
    .sort((a, b) => b.date.localeCompare(a.date));
  const fixedPerMonth = round2(fixed.reduce((sum, e) => sum + monthlyAmount(e), 0));
  const variableSum = round2(variable.reduce((sum, e) => sum + e.amount, 0));

  // Ausgaben nach Kategorie im gewählten Monat
  const byCategory = new Map();
  for (const e of entriesIn(from, to)) {
    if (e.kind !== 'expense') continue;
    const count = Finance.occurrences(e, from, to).length;
    if (count) byCategory.set(e.category, (byCategory.get(e.category) || 0) + count * e.amount);
  }
  const categories = [...byCategory.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxCategory = categories.length ? categories[0][1] : 1;

  const actions = (e) => `
    <span class="row-actions">
      <button type="button" class="mini" data-action="expense-edit" data-id="${e.id}" aria-label="${esc(e.name)} bearbeiten">${icon('edit')}</button>
      <button type="button" class="mini" data-action="entry-delete" data-id="${e.id}" aria-label="${esc(e.name)} löschen">${icon('trash')}</button>
    </span>`;

  const fixedRow = (e) => {
    const details = [catLabel(e.category), INTERVALS[e.interval].toLowerCase()];
    const next = Finance.occurrences(e, t, addDays(t, 400))[0];
    if (next) details.push(`nächste Zahlung ${next.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' })}`);
    const perMonthNote = e.interval !== 'monthly' ? `<span class="row-sub num">${Fmt.money(monthlyAmount(e))} im Monat</span>` : '';
    return `
      <li class="row">
        <span class="tag tone-expense">${icon('out')}</span>
        <span class="row-main"><span class="row-title">${esc(e.name)}</span><span class="row-sub">${esc(details.join(', '))}</span>${tagChips(e)}</span>
        <span class="row-amt"><span class="num amt-out">${Fmt.money(e.amount)}</span>${perMonthNote}</span>
        ${actions(e)}
      </li>`;
  };

  const variableRow = (e) => {
    const d = parseISO(e.date);
    const sub = e.parts ? `Aufgeteilt: ${e.parts.map((x) => `${catLabel(x.category)} ${Fmt.money(x.amount)}`).join(' · ')}${e.note ? ', ' + e.note : ''}` : catLabel(e.category) + (e.note ? ', ' + e.note : '');
    return `
      <li class="row${e.parts ? ' is-split' : ''}">
        <span class="date-chip"><b>${d.getDate()}</b>${d.toLocaleDateString('de-DE', { month: 'short' })}</span>
        <span class="row-main"><span class="row-title">${esc(e.name)}${e.parts ? ` <span class="split-badge" title="aufgeteilt">${icon('pie')}</span>` : ''}</span><span class="row-sub">${esc(sub)}</span>${tagChips(e)}</span>
        <span class="row-amt"><span class="num amt-out">${Fmt.money(e.amount)}</span></span>
        ${actions(e)}
      </li>`;
  };

  const categoryRows = categories.map(([cat, sum]) => `
    <li class="meter">
      <div class="meter-top"><strong>${esc(catLabel(cat))}</strong><span class="num">${Fmt.money(round2(sum))}</span></div>
      ${bar(sum / maxCategory, 'expense', 'Anteil ' + catLabel(cat))}
    </li>`).join('') || '<li class="empty">In diesem Monat noch keine Ausgaben.</li>';

  return `
    <div class="kpis">
      ${kpi('lock', 'warn', 'Fixkosten im Monat', Fmt.money(fixedPerMonth), `${fixed.length} wiederkehrende Zahlungen`)}
      ${kpi('out', 'expense', 'Variable Ausgaben', Fmt.money(variableSum), monthLabel)}
      ${kpi('pie', 'brand', 'Gesamt im Monat', Fmt.money(Finance.sum('expense', from, to)), 'fix und variabel zusammen')}
    </div>
    <div class="panels">
      <section class="panel s12">
        <h2>Fixkosten und wiederkehrende Zahlungen
          <button type="button" class="btn primary" data-action="fixed-new">${icon('plus')}Fixkosten hinzufügen</button></h2>
        <ul class="list">${fixed.map(fixedRow).join('') || '<li class="empty">Noch keine Fixkosten. Trag zuerst Miete, Handy und Versicherungen ein.</li>'}</ul>
      </section>
      <section class="panel s7">
        <h2>Variable Ausgaben
          <span class="head-tools">
            <span class="month-nav">
              <button type="button" class="mini" data-action="exp-prev" aria-label="Vorheriger Monat">${icon('chevL')}</button>
              <strong>${monthLabel}</strong>
              <button type="button" class="mini" data-action="exp-next" aria-label="Nächster Monat"${expenseMonth >= 0 ? ' disabled' : ''}>${icon('chevR')}</button>
            </span>
            <button type="button" class="btn" data-action="csv-import">${icon('file')}CSV</button>
            <button type="button" class="btn primary" data-action="expense-new">${icon('plus')}Ausgabe</button>
          </span></h2>
        <ul class="list">${variable.slice(0, expenseListLimit).map(variableRow).join('') || '<li class="empty">Keine einzelnen Ausgaben in diesem Monat.</li>'}</ul>
        ${variable.length > expenseListLimit ? `<button type="button" class="btn ghost more-btn" data-action="exp-more">Weitere ${Math.min(100, variable.length - expenseListLimit)} von ${variable.length - expenseListLimit} anzeigen</button>` : ''}
      </section>
      <section class="panel s5">
        <h2>Nach Kategorie</h2>
        <ul class="list">${categoryRows}</ul>
      </section>
    </div>`;
}

/** Durchschnittliche Ausgaben einer Kategorie der letzten Monate (Vorschlag fürs Budget). */
function averageSpending(category, months = 3) {
  let sum = 0;
  for (let i = 1; i <= months; i++) {
    const { from, to } = monthBounds(-i);
    sum += Finance.sum('expense', from, to, (e) => e.category === category);
  }
  return round2(sum / months);
}

function saveBudget(data, id) {
  const limit = Math.abs(parseFloat(String(data.limit).replace(',', '.')));
  if (!(limit > 0)) { UI.toast('Bitte ein Budget größer als 0 eintragen.'); return false; }
  Store.update((s) => {
    const index = id ? s.budgets.findIndex((b) => b.id === id) : s.budgets.findIndex((b) => b.category === data.category);
    const rollover = { enabled: data.rolloverOn === 'on', cap: Math.max(0, parseFloat(data.rolloverCap) || 0) };
    if (index > -1) { s.budgets[index].category = data.category; s.budgets[index].limit = round2(limit); s.budgets[index].rollover = rollover; }
    else s.budgets.push({ id: uid(), category: data.category, limit: round2(limit), rollover });
  });
  UI.toast(id ? 'Budget aktualisiert.' : 'Budget gesetzt.');
}

function openBudgetForm(budget) {
  const b = budget || { category: 'lebensmittel', limit: '' };
  const body = `
    ${field('Kategorie', selectEl('category', categoryOptions('expense', b.category), b.category))}
    ${field('Budget pro Monat', `<input name="limit" type="number" step="1" min="0" value="${b.limit}" required>`)}
    <div class="field-row">
      ${field('Rest übernehmen', `<label class="check-row"><input type="checkbox" name="rolloverOn"${b.rollover && b.rollover.enabled ? ' checked' : ''}> Nicht verbrauchtes Geld wandert in den nächsten Monat</label>`)}
      ${field('Obergrenze für den Übertrag', `<input name="rolloverCap" type="number" step="5" min="0" value="${(b.rollover && b.rollover.cap) || ''}" placeholder="z. B. 50">`, 'Leer = bis zur Höhe des Budgets')}
    </div>
    <p class="calc-out" id="budgetHint"></p>`;
  const dialog = UI.modal({
    title: budget ? 'Budget bearbeiten' : 'Neues Budget',
    body,
    submitLabel: budget ? 'Änderungen speichern' : 'Budget setzen',
    onSubmit: (data) => saveBudget(data, budget && budget.id)
  });
  // Vorschlag aus den letzten drei Monaten

  const hint = dialog.overlay.querySelector('#budgetHint');
  const showHint = () => {
    const avg = averageSpending(select.value);
    hint.innerHTML = avg > 0

  };
  select.addEventListener('change', showHint);
  showHint();
}

/* Prioritäten-Regler: simuliert Budgets, Sparraten und Zieltermine, ohne etwas zu ändern */
const PRIORITY_PROFILES = [
  { label: 'Sparen', budget: 0.85, fun: 0.75, saving: 1.4, text: 'weniger Konsum, deutlich höhere Sparraten' },
  { label: 'Ausgeglichen', budget: 1, fun: 1, saving: 1, text: 'deine aktuellen Werte' },
  { label: 'Mehr Freizeit', budget: 1, fun: 1.3, saving: 0.8, text: 'mehr für Freizeit, etwas weniger sparen' },
  { label: 'Konsum', budget: 1.2, fun: 1.35, saving: 0.55, text: 'großzügige Budgets, Sparziele rücken nach hinten' }
];
const FUN_CATEGORIES = ['freizeit', 'restaurants', 'reisen', 'kleidung'];
let priorityLevel = 1;

function priorityResult(level) {
  const profile = PRIORITY_PROFILES[level];
  const k = Finance.summary();
  const budgets = Store.state.budgets.map((b) => ({ b, limit: round2(b.limit * (FUN_CATEGORIES.includes(b.category) ? profile.fun : profile.budget)) }));
  const open = Store.state.goals.filter((g) => g.saved < g.target);
  const goals = open.map((g) => {
    const rate = round2(g.monthlyRate * profile.saving);
    const left = g.target - g.saved;
    return { g, rate, date: rate > 0 ? addMonths(today(), Math.ceil(left / rate)) : null, before: goalForecast(g).date };
  });
  const budgetChange = round2(budgets.reduce((sum, x) => sum + (x.limit - x.b.limit), 0));
  const savingOld = round2(open.reduce((sum, g) => sum + g.monthlyRate, 0));
  const savingNew = round2(goals.reduce((sum, x) => sum + x.rate, 0));
  return { profile, budgets, goals, budgetChange, savingOld, savingNew, rest: round2(k.rest - budgetChange - (savingNew - savingOld)) };
}

function priorityMarkup(level) {
  const r = priorityResult(level);
  const month = (d) => (d ? d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' }) : 'offen');
  const budgetRows = r.budgets.map((x) => `<li class="row"><span class="row-main"><span class="row-title">${esc(catLabel(x.b.category))}</span><span class="row-sub">heute ${Fmt.money(x.b.limit)}</span></span><span class="num ${x.limit > x.b.limit ? 'amt-out' : x.limit < x.b.limit ? 'amt-in' : ''}">${Fmt.money(x.limit)}</span></li>`).join('');

/* ---------- 7e. Sparziele, Notgroschen & Wunschliste ---------- */

/** Restbetrag, Monate und voraussichtliches Enddatum eines Sparziels. */
function goalForecast(g) {
  const left = Math.max(0, round2(g.target - g.saved));
  const months = left > 0 && g.monthlyRate > 0 ? Math.ceil(left / g.monthlyRate) : left <= 0 ? 0 : null;
  return { left, months, date: months ? addMonths(today(), months) : null };
}

/** Inflationsbereinigter Zielbetrag und die nötige Sparrate im Vergleich. */
function goalInflation(g) {
  if (!g.inflation || !g.inflation.enabled) return null;
  const rate = (g.inflation.rate ?? 2) / 100;
  const target = g.targetDate ? parseISO(g.targetDate) : null;
  const years = target ? Math.max(0, (target - today()) / (365.25 * 864e5)) : 3;
  const months = Math.max(1, Math.round(years * 12));
  const adjusted = round2(g.target * Math.pow(1 + rate, years));
  return {
    years: Math.round(years * 10) / 10, months, adjusted, extra: round2(adjusted - g.target),
    rateWithout: round2(Math.max(0, g.target - g.saved) / months),
    rateWith: round2(Math.max(0, adjusted - g.saved) / months),
    percent: g.inflation.rate ?? 2, assumed: !target
  };
}

/** Höchster hinterlegter Stundenlohn – für die Wunschliste. */
function hourlyWage() {
  return Store.state.entries.reduce((max, e) => (e.kind === 'income' && e.hourly ? Math.max(max, e.hourly.wage) : max), 0);
}

/** Durchschnittliche Gesamtausgaben pro Monat – Basis für den Notgroschen. */
function averageMonthlyExpenses(months = 3) { return Memo.get('ame' + months, () => computeAverageMonthlyExpenses(months)); }
function computeAverageMonthlyExpenses(months) {
  let sum = 0;
  for (let i = 1; i <= months; i++) { const { from, to } = monthBounds(-i); sum += Finance.sum('expense', from, to); }
  return round2(sum / months);
}

function saveGoal(data, id) {
  const target = Math.abs(parseFloat(String(data.target).replace(',', '.')));
  if (!(target > 0)) { UI.toast('Bitte einen Zielbetrag größer als 0 eintragen.'); return false; }
  const patch = {
    name: (data.name || '').trim() || 'Sparziel',
    target: round2(target),
    saved: round2(Math.abs(parseFloat(String(data.saved || '0').replace(',', '.')) || 0)),
    monthlyRate: round2(Math.abs(parseFloat(String(data.monthlyRate || '0').replace(',', '.')) || 0)),
    targetDate: data.targetDate || '',
    inflation: { enabled: data.inflationOn === 'on', rate: Math.max(0, parseFloat(String(data.inflationRate || '2').replace(',', '.')) || 2) },
    fromId: data.fromId || null,
    toId: data.toId || null
  };
  Store.update((s) => {
    const i = id ? s.goals.findIndex((g) => g.id === id) : -1;
    if (i > -1) s.goals[i] = { ...s.goals[i], ...patch };
    else s.goals.push({ id: uid(), color: '#2E62D9', ...patch });
  });
  UI.toast(id ? 'Sparziel aktualisiert.' : 'Sparziel angelegt.');
}

    <div class="field-row">

      ${field('Geplantes Kaufdatum', `<input name="targetDate" type="date" value="${g.targetDate || ''}">`, 'Basis für die Inflationsrechnung')}

/** Geld auf ein Sparziel einzahlen. */
function openDepositForm(id) {
  const goal = Store.state.goals.find((g) => g.id === id);
  if (!goal) return;
  const rest = goalForecast(goal).left;
  UI.modal({
    title: `Einzahlen: ${goal.name}`,
    body: field('Betrag', `<input name="amount" type="number" step="0.01" min="0" value="${goal.monthlyRate || ''}" required>`, `Noch ${Fmt.money(rest)} bis zum Ziel`),
    submitLabel: 'Einzahlen',
    onSubmit: (data) => {
      const amount = Math.abs(parseFloat(String(data.amount).replace(',', '.')));
      if (!(amount > 0)) { UI.toast('Bitte einen Betrag größer als 0 eintragen.'); return false; }
      Store.update((s) => { const g = s.goals.find((x) => x.id === id); g.saved = round2(g.saved + amount); });
      const updated = Store.state.goals.find((g) => g.id === id);
      UI.toast(updated.saved >= updated.target ? `${updated.name} ist erreicht.` : `${Fmt.money(amount)} auf ${updated.name} eingezahlt.`);
    }
  });
}

function saveWish(data) {
  const price = Math.abs(parseFloat(String(data.price).replace(',', '.')));
  if (!(price > 0)) { UI.toast('Bitte einen Preis größer als 0 eintragen.'); return false; }
  Store.update((s) => s.wishlist.push({ id: uid(), name: (data.name || '').trim() || 'Wunsch', price: round2(price), note: (data.note || '').trim() }));
  UI.toast('Auf die Wunschliste gesetzt.');
}

function openWishForm() {
  const body = `

    ${field('Preis', `<input name="price" type="number" step="0.01" min="0" required>`)}
    ${field('Notiz', `<input name="note" type="text" placeholder="optional">`)}`;
  UI.modal({ title: 'Neuer Wunsch', body, submitLabel: 'Speichern', onSubmit: saveWish });
}

function renderGoals() {
  const s = Store.state;
  const k = Finance.summary();
  const savedTotal = round2(s.goals.reduce((sum, g) => sum + Math.min(g.saved, g.target), 0));
  const rateTotal = round2(s.goals.filter((g) => g.saved < g.target).reduce((sum, g) => sum + g.monthlyRate, 0));
  const nextGoal = s.goals
    .map((g) => ({ g, f: goalForecast(g) }))
    .filter((x) => x.f.date)
    .sort((a, b) => a.f.months - b.f.months)[0];

  const goalRows = s.goals.map((g) => {
    const f = goalForecast(g);
    const note = f.left <= 0 ? 'Ziel erreicht'
      : f.date ? `Noch ${Fmt.money(f.left)}, bei ${Fmt.money(g.monthlyRate)} im Monat fertig im ${f.date.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}`
      : `Noch ${Fmt.money(f.left)}, trag eine Sparrate ein für ein Enddatum`;
    return `
      <li class="meter">
        <div class="meter-top"><strong>${esc(g.name)}</strong><span class="num">${Fmt.money(g.saved)} von ${Fmt.money(g.target)}</span></div>
        ${bar(g.target > 0 ? g.saved / g.target : 0, f.left <= 0 ? 'ok' : 'saving', 'Fortschritt ' + g.name)}
        <div class="meter-sub between">
          <span>${note}</span>
          <span class="goal-actions">
            <button type="button" class="btn" data-action="goal-deposit" data-id="${g.id}">${icon('plus')}Einzahlen</button>
            <button type="button" class="mini" data-action="goal-edit" data-id="${g.id}" aria-label="${esc(g.name)} bearbeiten">${icon('edit')}</button>
            <button type="button" class="mini" data-action="goal-delete" data-id="${g.id}" aria-label="${esc(g.name)} löschen">${icon('trash')}</button>
          </span>
        </div>
      </li>`;
  }).join('') || '<li class="empty">Noch kein Sparziel. Fang mit einem Notgroschen an, danach kommt der Spaß.</li>';

  // Notgroschen: drei und sechs Monatsausgaben
  const monthly = averageMonthlyExpenses();
  const emergency = s.goals.find((g) => /notgroschen|rücklage|reserve/i.test(g.name));
  const reserve = emergency ? emergency.saved : s.accounts.filter((a) => a.type === 'tagesgeld' || a.type === 'bargeld').reduce((sum, a) => sum + a.balance, 0);
  const reserveRow = (months) => {
    const target = round2(monthly * months);
    const missing = round2(Math.max(0, target - reserve));
    const ratio = target > 0 ? reserve / target : 0;
    return `
      <li class="meter">
        <div class="meter-top"><strong>${months} Monatsausgaben</strong><span class="num">${Fmt.money(target)}</span></div>
        ${bar(ratio, ratio >= 1 ? 'ok' : ratio >= 0.5 ? 'warn' : 'bad', `Notgroschen ${months} Monate`)}
        <div class="meter-sub between">
          <span>${missing > 0 ? `Es fehlen ${Fmt.money(missing)}` : 'Geschafft'}, aktuell ${Fmt.money(round2(reserve))}</span>
          ${emergency ? `<button type="button" class="mini" data-action="emergency-set" data-id="${months}" aria-label="Ziel auf ${months} Monatsausgaben setzen">${icon('target')}</button>` : ''}
        </div>
      </li>`;
  };

  // Wunschliste
  const wage = hourlyWage();
  const wishRows = s.wishlist.map((w) => {
    const hours = wage > 0 ? Math.ceil(w.price / wage) : null;
    const months = rateTotal > 0 ? w.price / rateTotal : null;
    const affordable = w.price <= k.rest;
    const facts = [];
    if (hours) facts.push(`${hours} Arbeitsstunden bei ${Fmt.money(wage)} pro Stunde`);
    if (months) facts.push(`verschiebt deine Sparziele um rund ${months.toFixed(1).replace('.', ',')} Monate`);
    if (w.note) facts.push(w.note);
    return `
      <li class="row">
        <span class="tag tone-saving">${icon('target')}</span>
        <span class="row-main">
          <span class="row-title">${esc(w.name)} <span class="badge ${affordable ? 'tone-income' : 'tone-warn'}">${affordable ? 'diesen Monat machbar' : 'dafür sparen'}</span></span>
          <span class="row-sub">${esc(facts.join(', '))}</span>
        </span>
        <span class="row-amt"><span class="num">${Fmt.money(w.price)}</span></span>
        <span class="row-actions"><button type="button" class="mini" data-action="wish-delete" data-id="${w.id}" aria-label="${esc(w.name)} entfernen">${icon('trash')}</button></span>
      </li>`;
  }).join('') || '<li class="empty">Noch kein Wunsch notiert. Ich rechne dir aus, wie viele Arbeitsstunden er kostet.</li>';

  return `
    <div class="kpis">
      ${kpi('target', 'saving', 'Gespart gesamt', Fmt.money(savedTotal), `${s.goals.length} ${s.goals.length === 1 ? 'Ziel' : 'Ziele'}`)}
      ${kpi('in', 'income', 'Sparrate pro Monat', Fmt.money(rateTotal), 'für alle offenen Ziele')}
      ${kpi('cal', 'brand', 'Nächstes Ziel', nextGoal && nextGoal.f.date ? nextGoal.f.date.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) : '–', nextGoal ? nextGoal.g.name : 'noch kein Enddatum berechenbar')}
    </div>
    <div class="panels">
      ${roadmapPanel()}
      <section class="panel s7">
        <h2>Sparziele <button type="button" class="btn primary" data-action="goal-new">${icon('plus')}Sparziel anlegen</button></h2>
        <ul class="list">${goalRows}</ul>
      </section>
      <section class="panel s5">
        <h2>Notgroschen</h2>
        <ul class="list">${reserveRow(reserveMonths())}${reserveRow(reserveMonths() * 2)}</ul>
        <p class="meter-sub">Basis sind deine durchschnittlichen Ausgaben der letzten drei Monate: ${Fmt.money(monthly)} im Monat.</p>
      </section>
      ${renderChallengesPanel()}
      <section class="panel s12">
        <h2>Wunschliste <button type="button" class="btn primary" data-action="wish-new">${icon('plus')}Wunsch hinzufügen</button></h2>
        <ul class="list">${wishRows}</ul>
      </section>
    </div>`;
}

/* ---------- 7f. Konten ---------- */
const ACCOUNT_ICONS = { giro: 'wallet', tagesgeld: 'lock', bargeld: 'wallet', depot: 'chart', krypto: 'gem', gemeinschaft: 'target', sonstige: 'pie' };
const safeColor = (c) => (/^#[0-9a-f]{6}$/i.test(c || '') ? c : '#0B6E75');

/** Kleine Verlaufslinie aus den gespeicherten Kontoständen. */
function sparkline(values, color) {
  if (!values || values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const points = values.map((v, i) => `${(i / (values.length - 1) * 100).toFixed(1)},${(26 - (v - min) / span * 24).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline points="${points}" fill="none" stroke="${safeColor(color)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function saveAccount(data, id) {
  const balance = parseFloat(String(data.balance).replace(',', '.'));
  if (!Number.isFinite(balance)) { UI.toast('Bitte einen Kontostand eintragen.'); return false; }
  const patch = {
    name: (data.name || '').trim() || 'Konto',
    type: data.type,
    balance: round2(balance),
    color: safeColor(data.color),
    interestRate: Math.min(50, Math.max(-10, parseFloat(String(data.interestRate ?? '0').replace(',', '.')) || 0))
  };
  Store.update((s) => {
    const i = id ? s.accounts.findIndex((a) => a.id === id) : -1;
    if (i > -1) s.accounts[i] = { ...s.accounts[i], ...patch };
    else s.accounts.push({ id: uid(), history: [{ date: toISO(today()), balance: patch.balance }], ...patch });
  });
  UI.toast(id ? 'Konto aktualisiert.' : 'Konto angelegt.');
}

function openAccountForm(account) {
  const a = account || { name: '', type: 'giro', balance: '', color: '#0B6E75' };
  const body = `
    ${field('Name', `<input name="name" type="text" value="${esc(a.name)}" placeholder="z. B. Girokonto" required>`)}
    <div class="field-row">
      ${field('Art', selectEl('type', ACCOUNT_TYPES, a.type))}
      ${field('Kontostand', `<input name="balance" type="number" step="0.01" value="${a.balance}" required>`)}
    </div>
    <div class="field-row">
      ${field('Farbe', `<input name="color" type="color" value="${safeColor(a.color)}">`)}
      ${field('Zins oder erwartete Rendite in % pro Jahr', `<input name="interestRate" type="number" step="0.1" min="-10" max="50" value="${a.interestRate ?? (account ? 0 : defaultRateFor(a.type))}">`, 'Tagesgeld: Zinssatz, Depot oder Krypto: erwartete Rendite')}
    </div>`;
  const dialog = UI.modal({
    title: account ? 'Konto bearbeiten' : 'Neues Konto',
    body,
    submitLabel: account ? 'Änderungen speichern' : 'Konto anlegen',
    onSubmit: (data) => saveAccount(data, account && account.id)
  });
  // Neues Konto: Standardzins passend zur Kontoart vorschlagen, solange nichts eingetippt wurde
  if (!account) {
    const type = dialog.overlay.querySelector('[name="type"]'), rate = dialog.overlay.querySelector('[name="interestRate"]');
    let touched = false;
    rate.addEventListener('input', () => { touched = true; });
    type.addEventListener('change', () => { if (!touched) rate.value = defaultRateFor(type.value); });
  }
}

/* ---------- 7g. Vermögen & Schulden ---------- */
const DEBT_TYPES = { bafoeg: 'BAföG-Darlehen', privat: 'Privatkredit', auto: 'Autokredit', dispo: 'Dispo', sonstige: 'Sonstiges' };

/** Nettovermögen der letzten Monate aus den Kontoverläufen. */
function netWorthHistory(months = 12) { return Memo.get('nwh' + months, () => computeNetWorthHistory(months)); }
function computeNetWorthHistory(months) {
  const t = today();
  const debts = Store.state.debts.reduce((sum, d) => sum + d.remaining, 0);
  const out = [];
  for (let i = months - 1; i >= 0; i--) {
    const end = new Date(t.getFullYear(), t.getMonth() - i + 1, 0);
    const iso = toISO(end > t ? t : end);
    let assets = 0;
    for (const a of Store.state.accounts) {
      const past = (a.history || []).filter((h) => h.date <= iso);
      assets += past.length ? past[past.length - 1].balance : a.history && a.history.length ? a.history[0].balance : a.balance;
    }
    out.push({ label: end.toLocaleDateString('de-DE', { month: 'short' }), value: round2(assets - debts), date: end });
  }
  return out;
}

/** Tilgungsdauer und Enddatum einer Schuld. */
function debtForecast(d) {
  if (!(d.remaining > 0)) return { months: 0, date: null, interest: 0 };
  const rate = d.monthlyRate || 0;
  if (rate <= 0) return { months: null, date: null, interest: 0 };
  const r = (d.interestRate || 0) / 100 / 12;
  if (r > 0 && rate <= d.remaining * r) return { months: Infinity, date: null, interest: 0 };
  const months = r > 0
    ? Math.ceil(Math.log(rate / (rate - d.remaining * r)) / Math.log(1 + r))
    : Math.ceil(d.remaining / rate);
  return { months, date: addMonths(today(), months), interest: round2(Math.max(0, months * rate - d.remaining)) };
}

function saveDebt(data, id) {
  const remaining = Math.abs(parseFloat(String(data.remaining).replace(',', '.')));

    type: data.type,

    interestRate: round2(Math.abs(parseFloat(String(data.interestRate || '0').replace(',', '.')) || 0)),
    note: (data.note || '').trim()

  Store.update((s) => {
    const i = id ? s.debts.findIndex((d) => d.id === id) : -1;
    if (i > -1) s.debts[i] = { ...s.debts[i], ...patch };

/* ---------- 7h. Kalender & Cashflow-Prognose ---------- */
let calendarMonth = 0;      // 0 = aktueller Monat
let calendarDay = null;     // ausgewählter Tag als 'YYYY-MM-DD'

/** Standardkonten: Zahlungskonto und Sparkonto. */
const mainAccountId = () => {
  const list = Store.state.accounts;
  const preferred = list.find((a) => a.id === setting('defaultAccountId'));
  if (preferred) return preferred.id;
  const giro = list.find((a) => a.type === 'giro') || list.find((a) => LIQUID_TYPES.includes(a.type)) || list[0];
  return giro ? giro.id : null;
};
const savingsAccountId = () => {
  const list = Store.state.accounts;
  const target = list.find((a) => a.type === 'tagesgeld') || list.find((a) => a.type === 'depot');
  return target ? target.id : null;
};
const accountName = (id) => { const a = Store.state.accounts.find((x) => x.id === id); return a ? a.name : 'Konto'; };

/**
 * Alle Geldbewegungen je Konto im Zeitraum: Einnahmen, Ausgaben, Sparraten und
 * Überweisungen. Jede Bewegung nennt das Konto, auf dem sie landet oder abgeht.
 */
function accountFlows(from, to) { return Memo.get(`af${toISO(from)}${toISO(to)}`, () => computeAccountFlows(from, to)); }
function computeAccountFlows(from, to) {
  const s = Store.state;
  const main = mainAccountId();
  const out = [];
  for (const e of entriesIn(from, to)) {
    const account = e.accountId || main;
    for (const date of Finance.occurrences(e, from, to)) {
      out.push({ date, accountId: account, amount: e.kind === 'income' ? e.amount : -e.amount, label: e.name, kind: e.kind });
    }
  }
  for (const g of s.goals) {
    if (!(g.monthlyRate > 0) || g.saved >= g.target) continue;
    for (let d = new Date(from.getFullYear(), from.getMonth(), monthStartDay()); d <= to; d = addMonths(d, 1)) {
      if (d < from) continue;
      out.push({ date: new Date(d), accountId: g.fromId || main, amount: -g.monthlyRate, label: `Sparrate ${g.name}`, kind: 'saving' });
      const target = g.toId || savingsAccountId();
      if (target) out.push({ date: new Date(d), accountId: target, amount: g.monthlyRate, label: `Sparrate ${g.name}`, kind: 'saving-in' });
    }
  }
  for (const ev of s.lifeEvents || []) {
    const date = parseISO(ev.date);
    if (date >= from && date <= to) out.push({ date, accountId: ev.accountId || main, amount: -ev.cost, label: ev.name, kind: 'event' });
  }
  for (const tr of s.transfers || []) {
    if (tr.active === false) continue;
    for (const date of Finance.occurrences(tr, from, to)) {
      out.push({ date, accountId: tr.fromId || main, amount: -tr.amount, label: tr.name, kind: 'transfer' });
      if (tr.toId) out.push({ date, accountId: tr.toId, amount: tr.amount, label: tr.name, kind: 'transfer-in' });
    }
  }
  return out.sort((a, b) => a.date - b.date);
}

/** Voraussichtlicher Kontostand eines Kontos an einem Datum. */
/**
 * Voraussichtlicher Kontostand an einem Datum. Mit Zinssatz werden die Zinsen an jedem
 * Monatsende gutgeschrieben (Zinseszins, rate / 12 pro Monat). { interest: false } rechnet ohne.
 */
function accountBalanceAt(account, target, opts) {
  const t = today();
  if (!(target > t)) return round2(account.balance);
  const flows = accountFlows(addDays(t, 1), target).filter((f) => f.accountId === account.id);
  const rate = opts && opts.interest === false ? 0 : (Number(account.interestRate) || 0) / 100;
  if (!rate) return round2(account.balance + flows.reduce((sum, f) => sum + f.amount, 0));
  let balance = account.balance, i = 0;
  for (let end = new Date(t.getFullYear(), t.getMonth() + 1, 0); ; end = new Date(end.getFullYear(), end.getMonth() + 2, 0)) {
    const until = end < target ? end : target;
    while (i < flows.length && flows[i].date <= until) balance += flows[i++].amount;
    if (end > target) break;
    if (end > t) balance *= 1 + rate / 12; // Gutschrift am Monatsende
  }
  while (i < flows.length) balance += flows[i++].amount;
  return round2(balance);
}

/** Zinsen bzw. Rendite eines Kontos bis zum Datum. */
const interestUntil = (account, target) => round2(accountBalanceAt(account, target) - accountBalanceAt(account, target, { interest: false }));

/** Nettovermögen an einem Datum: Konten (mit oder ohne Zinsen) minus verbleibende Schulden. */
function netWorthAt(date, withInterest = true) {
  const assets = Store.state.accounts.reduce((sum, a) => sum + accountBalanceAt(a, date, { interest: withInterest }), 0);
  const months = Math.max(0, Math.round((date - today()) / (864e5 * 30.44)));
  const debts = Store.state.debts.reduce((sum, d) => sum + Math.max(0, d.remaining - (d.monthlyRate || 0) * months), 0);
  return round2(assets - debts);
}

/** Sparraten als Termine: jeweils am Monatsbeginn (Standard der Erste, sonst der Gehaltstag). */
function savingEvents(from, to) {
  const out = [];
  for (const g of Store.state.goals) {
    if (!(g.monthlyRate > 0) || g.saved >= g.target) continue;
    for (let d = new Date(from.getFullYear(), from.getMonth(), monthStartDay()); d <= to; d = addMonths(d, 1)) {
      if (d >= from) out.push({ date: new Date(d), amount: -g.monthlyRate, kind: 'saving', name: `Sparrate ${g.name}` });
    }
  }
  return out;
}

/** Alle Termine im Zeitraum: Einnahmen, Ausgaben und Sparraten. */
function calendarEvents(from, to) {
  const events = Finance.flows(from, to).map((f) => ({
    date: f.date, amount: f.amount, kind: f.entry.kind, name: f.entry.name, category: f.entry.category,
    accountId: f.entry.accountId || mainAccountId()
  }));
  const transfers = [];
  for (const tr of Store.state.transfers || []) {
    if (tr.active === false) continue;
    for (const date of Finance.occurrences(tr, from, to)) {
      transfers.push({ date, amount: -tr.amount, kind: 'transfer', name: `${tr.name}: ${accountName(tr.fromId)} → ${accountName(tr.toId)}`, accountId: tr.fromId });
    }
  }
  return events.concat(savingEvents(from, to)).concat(transfers).sort((a, b) => a.date - b.date);
}

/** Täglicher Kontostand vom heutigen Tag bis Monatsende. */
function forecastPoints(monthOffset, bounds = monthBounds) {
  const t = today();
  const { from, to } = bounds(monthOffset);
  if (to < t) return null; // Vergangenheit lässt sich nicht prognostizieren
  const startDay = from > t ? from : t;
  let balance = Finance.summary().cash;
  if (from > t) for (const e of calendarEvents(addDays(t, 1), addDays(from, -1))) balance += e.amount;
  const byDay = new Map();
  for (const e of calendarEvents(addDays(startDay, 1), to)) {
    const key = toISO(e.date);
    byDay.set(key, round2((byDay.get(key) || 0) + e.amount));
  }
  const points = [];
  for (let d = new Date(startDay); d <= to; d = addDays(d, 1)) {
    balance = round2(balance + (byDay.get(toISO(d)) || 0));
    points.push({ date: new Date(d), label: String(d.getDate()), value: balance });
  }
  return points;
}

function renderCalendar() {
  const t = today();
  const { from, to } = calendarBounds(calendarMonth);
  const monthLabel = from.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  const events = calendarEvents(from, to);

  // Termine pro Tag bündeln
  const byDay = new Map();
  for (const e of events) {
    const key = toISO(e.date);
    const day = byDay.get(key) || { list: [], net: 0 };
    day.list.push(e);
    day.net = round2(day.net + e.amount);
    byDay.set(key, day);
  }

  // Gitter ab Montag der ersten Woche
  const firstWeekday = weekdayIndex(from); // Spalte des Monatsersten
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const date = addDays(from, i - firstWeekday);
    if (i >= 35 && date > to) break;
    const key = toISO(date);
    const day = byDay.get(key);
    const kinds = day ? [...new Set(day.list.map((e) => e.kind))] : [];
    cells.push(`
      <button type="button" class="cal-day${date.getMonth() !== from.getMonth() ? ' out' : ''}${key === toISO(t) ? ' today' : ''}${inLecture(date) ? ' lecture' : ''}"
        data-action="cal-day" data-id="${key}" aria-pressed="${key === calendarDay}"
        aria-label="${date.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' })}${day ? `, ${day.list.length} Termine` : ''}">
        <span>${date.getDate()}</span>
        ${day ? `<span class="cal-sum num">${day.net > 0 ? '+' : ''}${Math.round(day.net)}</span>` : ''}
        <span class="cal-dots">${kinds.map((k) => `<span class="cal-dot ${k}"></span>`).join('')}</span>
      </button>`);
  }

  // Ausgewählter Tag
  const selected = calendarDay && byDay.has(calendarDay) ? byDay.get(calendarDay) : null;
  const selectedDate = calendarDay ? parseISO(calendarDay) : null;
  const dayRows = selected
    ? selected.list.map((e) => `
      <li class="row">
        <span class="tag tone-${e.kind === 'income' ? 'income' : e.kind === 'saving' ? 'saving' : 'expense'}">${icon(e.kind === 'income' ? 'in' : e.kind === 'saving' ? 'target' : 'out')}</span>
        <span class="row-main"><span class="row-title">${esc(e.name)}</span><span class="row-sub">${esc(e.category ? catLabel(e.category) : 'Sparziel')}</span></span>
        <span class="num ${e.amount > 0 ? 'amt-in' : 'amt-out'}">${Fmt.money(e.amount, true)}</span>
      </li>`).join('')
    : `<li class="empty">${calendarDay ? 'An diesem Tag steht nichts an.' : 'Tipp auf einen Tag, um seine Zahlungen zu sehen.'}</li>`;

  // Prognose
  const points = forecastPoints(calendarMonth, calendarBounds);
  const critical = Store.state.settings.criticalBalance;
  let forecastPanel;
  if (!points) {
    forecastPanel = '<p class="empty">Für vergangene Monate gibt es keine Prognose. Wechsel zurück zum laufenden Monat.</p>';
  } else {
    const low = points.reduce((min, p) => (p.value < min.value ? p : min), points[0]);
    const end = points[points.length - 1];
    const alert = low.value < 0
      ? `<li class="alert bad">${icon('alert')}<span>Am ${Fmt.date(low.date)} rutschst du voraussichtlich ins Minus: ${Fmt.money(low.value)}.</span></li>`
      : low.value < critical
        ? `<li class="alert warn">${icon('info')}<span>Am ${Fmt.date(low.date)} wird es knapp: nur noch ${Fmt.money(low.value)} auf dem Konto.</span></li>`
        : `<li class="alert ok">${icon('check')}<span>Der Kontostand bleibt den ganzen Monat über ${Fmt.money(critical)}.</span></li>`;
    pendingCharts.push({ id: 'chartForecast', build: (w, hh) => svgLine(w, hh, points, { critical, color: low.value < 0 ? 'var(--expense)' : 'var(--brand)', label: 'Täglicher Kontostand bis Monatsende' }) });
    forecastPanel = `
      <div class="chart-box" id="chartForecast"></div>
      <ul class="alerts" style="margin-top:12px">${alert}</ul>
      <p class="meter-sub">Start ist dein heutiger Kontostand von ${Fmt.money(Finance.summary().cash)}. Tiefster Stand ${Fmt.money(low.value)} am ${Fmt.date(low.date)}, Monatsende ${Fmt.money(end.value)}.</p>`;
  }

  const weekdays = (weekStartDay() === 0 ? ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'] : ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So']).map((d) => `<div class="cal-head">${d}</div>`).join('');
  const income = round2(events.filter((e) => e.amount > 0).reduce((sum, e) => sum + e.amount, 0));
  const outgo = round2(events.filter((e) => e.amount < 0).reduce((sum, e) => sum - e.amount, 0));

  return `
    <div class="kpis">
      ${kpi('cal', 'brand', 'Termine im Monat', String(events.length), monthLabel)}
      ${kpi('in', 'income', 'Eingänge geplant', Fmt.money(income), 'Gehalt, Kindergeld und mehr')}
      ${kpi('out', 'expense', 'Abgänge geplant', Fmt.money(outgo), 'inklusive Sparraten')}
    </div>
    <div class="panels">
      <section class="panel s7">
        <h2>${monthLabel}
          <span class="head-tools">
            <span class="month-nav">
              <button type="button" class="mini" data-action="cal-prev" aria-label="Vorheriger Monat">${icon('chevL')}</button>
              <button type="button" class="btn" data-action="cal-today">Heute</button>
              <button type="button" class="btn" data-action="ics-export">${icon('cal')}Exportieren</button>
              <button type="button" class="mini" data-action="cal-next" aria-label="Nächster Monat">${icon('chevR')}</button>
            </span>
          </span></h2>
        <div class="cal">${weekdays}${cells.join('')}</div>
        <div class="legend">
          <span><i class="cal-dot income"></i>Einnahme</span>
          <span><i class="cal-dot expense"></i>Ausgabe</span>
          <span><i class="cal-dot saving"></i>Sparrate</span>
          <span><i class="cal-dot transfer"></i>Überweisung</span>
          ${(Store.state.semesters || []).length ? '<span><i class="cal-bar"></i>Vorlesungszeit</span>' : ''}
        </div>
      </section>
      <section class="panel s5">
        <h2>${selectedDate ? selectedDate.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }) : 'Tagesdetails'}</h2>
        <ul class="list">${dayRows}</ul>
      </section>
      <section class="panel s12">
        <h2>Cashflow-Prognose</h2>
        ${forecastPanel}
      </section>
    </div>`;
}

/* ---------- 7i. Verträge & Abos ---------- */
const SUBSCRIPTION_PATTERN = /spotify|netflix|prime|disney|dazn|youtube|apple|icloud|adobe|audible|fitness|gym|crunchyroll|paramount|sky|xbox|playstation|deezer|hbo|wow/i;
const isSubscription = (e) => e.kind === 'expense' && e.interval !== 'once' && (e.category === 'abos' || e.category === 'fitness' || SUBSCRIPTION_PATTERN.test(e.name));

/** Kündigungsfrist prüfen: läuft, bald kündbar oder Frist verpasst. */
function contractStatus(e) {
  const c = e.contract;
  if (!c) return null;
  if (c.cancelled && c.cancelled.effective) {
    const eff = parseISO(c.cancelled.effective);
    return { level: 'ok', badge: eff < today() ? 'beendet' : 'gekündigt', cancelled: true, deadline: eff, end: eff, days: Math.round((eff - today()) / 864e5),
      text: `Gekündigt am ${parseISO(c.cancelled.on).toLocaleDateString('de-DE')}, endet am ${eff.toLocaleDateString('de-DE')}, ${c.cancelled.confirmed ? 'Bestätigung erhalten' : 'Bestätigung noch offen'}` };
  }
  const notice = Number(c.noticeMonths) || 0;
  if (!c.endDate) {
    return { level: 'ok', badge: notice > 0 ? `${notice} Monate Frist` : 'monatlich kündbar', text: notice > 0 ? `Kündigungsfrist ${notice} Monate, kein festes Ende` : 'Jederzeit zum Monatsende kündbar' };
  }
  const end = parseISO(c.endDate);
  const deadline = addMonths(end, -notice);
  const days = Math.round((deadline - today()) / 864e5);
  if (days < 0) return { level: 'warn', badge: 'Frist verpasst', text: `Kündigungsfrist lief am ${deadline.toLocaleDateString('de-DE')} ab, der Vertrag verlängert sich`, deadline, end, days };
  if (days <= (Number(setting('reminderDays')) || 14)) return { level: 'bad', badge: 'bald kündbar', text: `Noch ${days} Tage: kündigen bis ${deadline.toLocaleDateString('de-DE')}, Vertragsende ${end.toLocaleDateString('de-DE')}`, deadline, end, days };
  return { level: 'ok', badge: 'läuft', text: `Kündbar bis ${deadline.toLocaleDateString('de-DE')}, Vertragsende ${end.toLocaleDateString('de-DE')}`, deadline, end, days };
}

function saveContract(data, id) {
  const amount = Math.abs(parseFloat(String(data.amount).replace(',', '.')));
  if (!(amount > 0)) { UI.toast('Bitte Kosten größer als 0 eintragen.'); return false; }
  const patch = {
    kind: 'expense',
    name: (data.name || '').trim() || 'Vertrag',
    category: data.category,
    amount: round2(amount),
    interval: data.interval,
    date: data.date || toISO(today()),
    contract: {
      noticeMonths: Math.max(0, parseInt(data.noticeMonths, 10) || 0), endDate: data.endDate || '',
      customerNo: (data.customerNo || '').trim(), providerAddress: (data.providerAddress || '').trim(), providerEmail: (data.providerEmail || '').trim()
    }
  };
  Store.update((s) => {
    const i = id ? s.entries.findIndex((x) => x.id === id) : -1;
    // vorhandene Vertragsdaten (z. B. Kündigung) beim Bearbeiten erhalten
    if (i > -1) s.entries[i] = { ...s.entries[i], ...patch, contract: { ...(s.entries[i].contract || {}), ...patch.contract } };
    else s.entries.push({ id: uid(), note: '', ...patch });
  });
  UI.toast(id ? 'Vertrag aktualisiert.' : 'Vertrag gespeichert.');
}

function renderContracts() {
  const contracts = Store.state.entries
    .filter((e) => e.kind === 'expense' && e.interval !== 'once' && isCurrent(e))
    .sort((a, b) => monthlyAmount(b) - monthlyAmount(a));
  const perMonth = round2(contracts.reduce((sum, e) => sum + monthlyAmount(e), 0));
  const subs = contracts.filter((e) => isSubscription(e) && !(e.contract && e.contract.cancelled));
  const subsPerMonth = round2(subs.reduce((sum, e) => sum + monthlyAmount(e), 0));

  const deadlines = contracts
    .map((e) => ({ e, status: contractStatus(e) }))
    .filter((x) => x.status && (x.status.level === 'bad' || x.status.level === 'warn'));
  const alerts = deadlines.length
    ? deadlines.map(({ e, status }) => `<li class="alert ${status.level === 'bad' ? 'warn' : 'bad'}">${icon(status.level === 'bad' ? 'info' : 'alert')}<span>${esc(e.name)}: ${esc(status.text)}.</span></li>`).join('')
    : `<li class="alert ok">${icon('check')}<span>Keine Kündigungsfrist läuft in den nächsten Wochen ab.</span></li>`;

  const rows = contracts.map((e) => {
    const status = contractStatus(e);
    const tone = !status ? '' : status.level === 'bad' ? 'tone-warn' : status.level === 'warn' ? 'tone-expense' : 'tone-income';
    const details = [catLabel(e.category), INTERVALS[e.interval].toLowerCase()];
    if (e.interval !== 'monthly') details.push(`${Fmt.money(monthlyAmount(e))} im Monat`);
    if (status) details.push(status.text);
    const before = e.priceHistory && e.priceHistory[e.priceHistory.length - 1];
    if (before) details.push(`bis ${parseISO(before.until).toLocaleDateString('de-DE')} ${Fmt.money(before.amount)}`);
    return `
      <li class="row">
        <span class="tag tone-expense">${icon('file')}</span>
        <span class="row-main">
          <span class="row-title">${esc(e.name)}${status ? ` <span class="badge ${tone}">${esc(status.badge)}</span>` : ''}</span>
          <span class="row-sub">${esc(details.join(', '))}</span>
        </span>
        <span class="row-amt"><span class="num amt-out">${Fmt.money(e.amount)}</span></span>
        <span class="row-actions">
          ${e.contract && e.contract.cancelled ? (e.contract.cancelled.confirmed ? '' : `<button type="button" class="btn" data-action="contract-confirm" data-id="${e.id}">Bestätigt</button>`) : `<button type="button" class="btn" data-action="contract-cancel" data-id="${e.id}">Kündigen</button>`}
          <button type="button" class="mini" data-action="contract-edit" data-id="${e.id}" aria-label="${esc(e.name)} bearbeiten">${icon('edit')}</button>
          <button type="button" class="mini" data-action="entry-delete" data-id="${e.id}" aria-label="${esc(e.name)} löschen">${icon('trash')}</button>
        </span>
      </li>`;
  }).join('') || '<li class="empty">Noch keine Verträge. Trag Handy, Internet, Fitnessstudio und Streaming ein, dann behältst du die Fristen im Blick.</li>';

  const subRows = subs.map((e) => `
    <li class="row">
      <span class="row-main"><span class="row-title">${esc(e.name)}</span><span class="row-sub">${esc(catLabel(e.category))}, ${Fmt.money(round2(monthlyAmount(e) * 12))} im Jahr</span></span>
      <span class="num amt-out">${Fmt.money(monthlyAmount(e))}</span>
    </li>`).join('') || '<li class="empty">Keine Abos erkannt.</li>';

  const biggest = subs.slice().sort((a, b) => monthlyAmount(b) - monthlyAmount(a))[0];
  const tip = biggest
    ? `<li class="alert warn">${icon('info')}<span>Wenn du ${esc(biggest.name)} kündigst, sparst du ${Fmt.money(round2(monthlyAmount(biggest) * 36))} in drei Jahren.</span></li>`
    : '';

  return `
    <div class="kpis">
      ${kpi('file', 'brand', 'Verträge im Monat', Fmt.money(perMonth), `${contracts.length} laufende Verträge`)}
      ${kpi('cal', 'warn', 'Im Jahr', Fmt.money(round2(perMonth * 12)), 'alle Verträge zusammen')}
      ${kpi('out', 'expense', 'Abos im Monat', Fmt.money(subsPerMonth), `${subs.length} Abos, ${Fmt.money(round2(subsPerMonth * 12))} im Jahr`)}
    </div>
    <div class="panels">
      <section class="panel s7">
        <h2>Verträge <button type="button" class="btn primary" data-action="contract-new">${icon('plus')}Vertrag hinzufügen</button></h2>
        <ul class="alerts" style="margin-bottom:14px">${alerts}</ul>
        <ul class="list">${rows}</ul>
      </section>
      <section class="panel s5">
        <h2>Abo-Analyse</h2>
        <ul class="list">${subRows}</ul>
        <div class="shop-foot">
          <div class="between"><span>Zusammen im Monat</span><strong class="num">${Fmt.money(subsPerMonth)}</strong></div>
          <div class="between"><span>Im Jahr</span><strong class="num">${Fmt.money(round2(subsPerMonth * 12))}</strong></div>
        </div>
        <ul class="alerts" style="margin-top:12px">${tip}</ul>
      </section>
    </div>`;
}

/* ---------- 7j. Studentenbereich: Werkstudent- und Minijob-Rechner ---------- */
/* Richtwerte 2026 – bei Gesetzesänderungen hier anpassen */
const LIMIT_DEFAULTS = { minijob: 603, workHours: 20, familyInsurance: 556, basicAllowance: 12348, employeeAllowance: 1230, studentHealth: 145, pensionRate: 9.3, bafoeg: 603 };
/* Liest die Jahreswerte aus den Einstellungen; fehlende Werte kommen aus den Standards */
const LIMITS = new Proxy({}, { get: (target, key) => {
  const custom = setting('limits');
  return custom && custom[key] !== undefined && Number.isFinite(Number(custom[key])) ? Number(custom[key]) : LIMIT_DEFAULTS[key];
} });
let studentCalc = null;

function defaultStudentCalc() {
  const entry = Store.state.entries.find((e) => e.kind === 'income' && e.hourly);
  const h = (entry && entry.hourly) || {};
  return { wage: h.wage || 15, hours: h.hoursPerWeek || 15, weeks: h.weeksPerYear || 48, insurance: 'student', pension: true };
}

/** Vereinfachte Brutto-Netto-Rechnung für Studentenjobs. */
function studentResult(c) {
  const grossYear = Math.max(0, c.wage * c.hours * c.weeks);
  const grossMonth = grossYear / 12;
  const isMinijob = grossMonth > 0 && grossMonth <= LIMITS.minijob;
  const pension = c.pension ? grossMonth * (isMinijob ? 0.036 : LIMITS.pensionRate / 100) : 0;
  const taxable = Math.max(0, grossYear - LIMITS.basicAllowance - LIMITS.employeeAllowance);
  const tax = taxable * 0.14 / 12;
  const health = c.insurance === 'student' ? LIMITS.studentHealth : 0;
  const net = grossMonth - pension - tax;
  return {
    grossMonth: round2(grossMonth), grossYear: round2(grossYear), pension: round2(pension), tax: round2(tax),
    net: round2(net), health, afterHealth: round2(net - health), isMinijob
  };
}

function studentWarnings(c, r) {
  const list = [];
  if (c.hours > LIMITS.workHours) list.push(['bad', `${c.hours} Stunden pro Woche: Über ${LIMITS.workHours} Stunden entfällt in der Vorlesungszeit das Werkstudentenprivileg, dann werden volle Sozialabgaben fällig.`]);
  if (r.isMinijob) list.push(['ok', `Mit ${Fmt.money(r.grossMonth)} bleibst du unter der Minijob-Grenze von ${Fmt.money(LIMITS.minijob)}. Abgaben zahlt überwiegend der Arbeitgeber.`]);
  else if (r.grossMonth > 0) list.push(['warn', `Über der Minijob-Grenze von ${Fmt.money(LIMITS.minijob)}: Als Werkstudent zahlst du ${LIMITS.pensionRate} % Rentenversicherung, Kranken- und Arbeitslosenversicherung entfallen.`]);
  if (r.grossMonth > LIMITS.familyInsurance) list.push(['warn', `Über rund ${Fmt.money(LIMITS.familyInsurance)} im Monat endet die Familienversicherung. Rechne mit etwa ${Fmt.money(LIMITS.studentHealth)} für die studentische Krankenversicherung.`]);

/* Was-wäre-wenn-Simulator */
let simulation = null;

function defaultSimulation() {
  const c = studentCalc || defaultStudentCalc();
  return { wage: c.wage, hours: c.hours, rentDelta: 0, savingDelta: 0 };
}

/** Rechnet die Kennzahlen mit den Reglerwerten neu durch. */
function simulate(sim) {
  const base = Finance.summary();
  const c = studentCalc || defaultStudentCalc();
  const workEntry = Store.state.entries.find((e) => e.kind === 'income' && e.hourly);
  const currentWork = workEntry ? workEntry.amount : 0;
  const newWork = studentResult({ wage: sim.wage, hours: sim.hours, weeks: c.weeks, insurance: c.insurance, pension: c.pension }).net;
  const income = round2(base.income - currentWork + newWork);
  const expenses = round2(base.expenses + sim.rentDelta);
  const saving = round2(Math.max(0, base.saving + sim.savingDelta));
  const rest = round2(income - expenses - saving);
  const goal = Store.state.goals.find((g) => g.saved < g.target);
  let goalDate = null;
  if (goal) {
    const rate = Math.max(0, goal.monthlyRate + sim.savingDelta);
    const left = Math.max(0, goal.target - goal.saved);
    goalDate = rate > 0 ? addMonths(today(), Math.ceil(left / rate)) : null;
  }
  return {
    income, expenses, saving, rest,
    savingsRate: income > 0 ? (income - expenses) / income : 0,
    goal, goalDate,
    wealth: round2(base.netWorth + (income - expenses) * 12),
    base
  };
}

function simResultMarkup(sim) {
  const r = simulate(sim);
  const baseGoal = r.goal ? goalForecast(r.goal) : null;

  ];
  return `<ul class="list">${rows.map(([label, value, note]) => `

}

/* ---------- 7u. Werkstudenten-Wächter und Vorlesungszeiten (Etappe B1) ----------
   Vereinfachte Prüfung als Orientierung:
   - 26-Wochen-Regel: höchstens 26 Wochen mit mehr als 20 Stunden in 12 Monaten
   - 20-Stunden-Grenze in der Vorlesungszeit (Ausnahme: überwiegend abends, nachts, am Wochenende)
   - Einkommensgrenzen: Familienversicherung, Minijob, BAföG, Grundfreibetrag          */
const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7)); // gesetzliche Woche: Montag bis Sonntag
const isoWeek = (d) => {
  const thursday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const jan4 = new Date(thursday.getFullYear(), 0, 4);
  return 1 + Math.round(((thursday - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
};

/** Der Job mit Stundenlohn liefert Lohn und Standard-Wochenstunden. */
function workSetup() {
  const job = Store.state.entries.find((e) => e.kind === 'income' && e.interval !== 'once' && e.hourly && Number(e.hourly.wage) > 0 && isCurrent(e));
  if (!job) return null;
  // share: Anteil gearbeiteter Wochen (z. B. 48 von 52 wegen Urlaub) – gilt fürs Brutto der Standardwochen
  return { job, wage: Number(job.hourly.wage), hours: Number(job.hourly.hoursPerWeek) || 0, share: Math.min(1, (Number(job.hourly.weeksPerYear) || 52) / 52), start: mondayOf(parseISO(job.date)), end: job.endDate ? parseISO(job.endDate) : null };
}

/** Stunden einer Woche: eingetragene Abweichung, sonst Standard aus dem Job. */
function weekHours(mondayISO, setup) {
  const log = (Store.state.workLog && Store.state.workLog.weeks) || {};
  if (log[mondayISO] !== undefined) return Number(log[mondayISO]) || 0;
  if (!setup) return 0;
  const monday = parseISO(mondayISO);
  if (monday < setup.start || (setup.end && monday > setup.end)) return 0;
  return setup.hours;
}

const inLecture = (date) => (Store.state.semesters || []).some((s) => s.lectureStart && s.lectureEnd && date >= parseISO(s.lectureStart) && date <= parseISO(s.lectureEnd));

function workStatus() {
  return Memo.get('work-status', () => {
    const setup = workSetup();
    const t = today(), thisMonday = mondayOf(t), limit = LIMITS.workHours;
    const weeks = [];
    for (let i = 51; i >= 0; i--) {
      const monday = addDays(thisMonday, -7 * i), iso = toISO(monday);
      weeks.push({ monday, iso, hours: weekHours(iso, setup), lecture: inLecture(addDays(monday, 2)) });
    }
    const over = weeks.filter((w) => w.hours > limit);
    const overLecture = over.filter((w) => w.lecture);
    let grossSoFar = 0, grossYear = 0;
    if (setup) {
      for (let m = mondayOf(new Date(t.getFullYear(), 0, 1)); m.getFullYear() <= t.getFullYear(); m = addDays(m, 7)) {
        if (m.getFullYear() < t.getFullYear()) continue; // Woche beginnt noch im Vorjahr
        const logged = ((Store.state.workLog && Store.state.workLog.weeks) || {})[toISO(m)] !== undefined;
        const gross = weekHours(toISO(m), setup) * setup.wage * (logged ? 1 : setup.share);
        grossYear += gross;
        if (m <= thisMonday) grossSoFar += gross;
      }
    }
    const monthly = grossYear / 12;
    const checks = [];
    const level26 = over.length > 26 ? 'bad' : over.length >= 20 ? 'warn' : 'ok';
    checks.push({ id: '26', level: level26, title: '26-Wochen-Regel', text: `${over.length} von höchstens 26 Wochen über ${limit} Stunden in den letzten zwölf Monaten.` });
    checks.push({ id: 'lecture', level: overLecture.length ? 'warn' : 'ok', title: `${limit}-Stunden-Grenze in der Vorlesungszeit`,
      text: overLecture.length ? `${overLecture.length} ${overLecture.length === 1 ? 'Woche' : 'Wochen'} der Vorlesungszeit über ${limit} Stunden – nur zulässig, wenn du überwiegend abends, nachts oder am Wochenende arbeitest.`
        : (Store.state.semesters.length ? 'In der Vorlesungszeit bleibst du unter der Grenze.' : 'Trag deine Vorlesungszeiten ein, dann prüfe ich auch diese Grenze.') });
    if (setup) {
      checks.push({ id: 'family', level: monthly > LIMITS.familyInsurance ? 'warn' : 'ok', title: 'Familienversicherung',
        text: monthly > LIMITS.familyInsurance ? `Hochgerechnet ${Fmt.money(round2(monthly))} brutto im Monat, über ${Fmt.money(LIMITS.familyInsurance)}: Du brauchst eine eigene Krankenversicherung.` : `Hochgerechnet ${Fmt.money(round2(monthly))} im Monat, unter ${Fmt.money(LIMITS.familyInsurance)}.` });
      if (setup.job.category === 'minijob') checks.push({ id: 'minijob', level: monthly > LIMITS.minijob ? 'bad' : 'ok', title: 'Minijob-Grenze',
        text: monthly > LIMITS.minijob ? `Im Schnitt ${Fmt.money(round2(monthly))} im Monat, über ${Fmt.money(LIMITS.minijob)}: Das ist kein Minijob mehr.` : `Im Schnitt ${Fmt.money(round2(monthly))} im Monat, unter ${Fmt.money(LIMITS.minijob)}.` });
      if (Store.state.entries.some((e) => e.kind === 'income' && e.category === 'bafoeg')) checks.push({ id: 'bafoeg', level: monthly > LIMITS.bafoeg ? 'warn' : 'ok', title: 'BAföG-Hinzuverdienst',
        text: monthly > LIMITS.bafoeg ? `Im Schnitt ${Fmt.money(round2(monthly))} im Monat, über ${Fmt.money(LIMITS.bafoeg)}: Dein BAföG kann gekürzt werden.` : `Im Schnitt ${Fmt.money(round2(monthly))} im Monat, unter ${Fmt.money(LIMITS.bafoeg)}.` });
      checks.push({ id: 'tax', level: grossYear > LIMITS.basicAllowance ? 'warn' : 'ok', title: 'Grundfreibetrag',
        text: grossYear > LIMITS.basicAllowance ? `Hochgerechnet ${Fmt.money(round2(grossYear))} im Jahr, über ${Fmt.money(LIMITS.basicAllowance)}: Es fällt Lohnsteuer an.` : `Hochgerechnet ${Fmt.money(round2(grossYear))} im Jahr, unter ${Fmt.money(LIMITS.basicAllowance)}: steuerfrei.` });
    }
    return { setup, weeks, over, overLecture, grossSoFar: round2(grossSoFar), grossYear: round2(grossYear), monthly: round2(monthly), checks };
  });
}

/** Typische Vorlesungszeiten deutscher Hochschulen rund um heute. */
function typicalSemesters() {
  const t = today(), out = [];
  for (let y = t.getFullYear() - 1; y <= t.getFullYear() + 1; y++) {
    out.push({ name: `SoSe ${y}`, start: `${y}-04-01`, end: `${y}-09-30`, lectureStart: `${y}-04-13`, lectureEnd: `${y}-07-17`, feeDue: `${y}-02-15`, items: [] });
    out.push({ name: `WiSe ${y}/${String(y + 1).slice(2)}`, start: `${y}-10-01`, end: `${y + 1}-03-31`, lectureStart: `${y}-10-12`, lectureEnd: `${y + 1}-02-12`, feeDue: `${y}-08-15`, items: [] });
  }
  const from = addMonths(t, -12), to = addMonths(t, 12);
  return out.filter((s) => parseISO(s.lectureEnd) >= from && parseISO(s.lectureStart) <= to);
}

/* ---------- 7v. Semester-Planer (Etappe B2) ---------- */

/** Semesterzeitraum; ohne eigene Angabe vom Monat des Vorlesungsbeginns sechs Monate lang. */
function semesterRange(s) {
  const lectureStart = s.lectureStart ? parseISO(s.lectureStart) : today();
  const lectureEnd = s.lectureEnd ? parseISO(s.lectureEnd) : addMonths(lectureStart, 4);
  const start = s.start ? parseISO(s.start) : new Date(lectureStart.getFullYear(), lectureStart.getMonth(), 1);
  let end = s.end ? parseISO(s.end) : addDays(new Date(start.getFullYear(), start.getMonth() + 6, 1), -1);
  if (end < lectureEnd) end = addDays(lectureEnd, 42);
  return { start, end };
}

/** Kosten: Summe, bereits fällig, offen, nötige Rücklage pro Monat bis zu den Fälligkeiten. */
function semesterCosts(s) {
  const t = today(), iso = toISO(t);
  const parts = [{ amount: Number(s.fee) || 0, due: s.feeDue }, ...(s.items || []).map((i) => ({ amount: Number(i.amount) || 0, due: i.due }))];
  const total = round2(parts.reduce((sum, x) => sum + x.amount, 0));
  const due = round2(parts.filter((x) => x.due && x.due <= iso).reduce((sum, x) => sum + x.amount, 0));
  const monthly = round2(parts.filter((x) => x.due && x.due > iso && x.amount > 0)
    .reduce((sum, x) => sum + x.amount / Math.max(1, Math.ceil((parseISO(x.due) - t) / (30.44 * 864e5))), 0));
  return { total, due, open: round2(total - due), monthly };
}

function semesterStatus(s) {
  const t = today(), r = semesterRange(s);
  const lectureStart = s.lectureStart ? parseISO(s.lectureStart) : null, lectureEnd = s.lectureEnd ? parseISO(s.lectureEnd) : null;
  const days = (from, to) => Math.round((to - from) / 864e5);
  if (t > r.end) return 'abgeschlossen';
  if (t < r.start) return `beginnt in ${days(t, r.start)} Tagen`;
  if (lectureStart && t < lectureStart) return `Vorlesungen beginnen in ${days(t, lectureStart)} Tagen`;
  if (lectureEnd && t <= lectureEnd) return `Vorlesungszeit, noch ${days(t, lectureEnd)} Tage bis zu den Semesterferien`;
  return `Semesterferien, das Semester endet in ${days(t, r.end)} Tagen`;
}

/** Beitrag und datierte Posten landen als Ausgaben in Kalender, Prognose und Budgets. */
function syncSemesterEntries(s) {
  const old = new Map(s.entries.filter((e) => e.source === 'semester').map((e) => [e.id, e]));
  s.entries = s.entries.filter((e) => e.source !== 'semester');
  for (const sem of s.semesters || []) {
    const add = (id, name, amount, date) => {
      if (!(Number(amount) > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return;
      const prev = old.get(id) || {};
      s.entries.push({ id, kind: 'expense', name, category: prev.category || 'studium', amount: round2(Number(amount)), interval: 'once',
        date, note: prev.note || `aus dem Semester-Planer (${sem.name})`, accountId: prev.accountId || null, source: 'semester', semesterId: sem.id });
    };
    add(`sem-${sem.id}-fee`, `Semesterbeitrag ${sem.name}`, sem.fee, sem.feeDue);
    for (const item of sem.items || []) add(`sem-${sem.id}-${item.id}`, `${item.name} (${sem.name})`, item.amount, item.due);
  }
}

function mountWorkGuard() {
  document.querySelectorAll('[data-workguard]').forEach((section) => section.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.week) {
      const raw = t.value.trim();
      Store.update((s) => {
        s.workLog = s.workLog && typeof s.workLog === 'object' ? s.workLog : { weeks: {} };
        s.workLog.weeks = s.workLog.weeks || {};
        if (raw === '') delete s.workLog.weeks[t.dataset.week];
        else s.workLog.weeks[t.dataset.week] = Math.max(0, Math.min(80, parseFloat(raw.replace(',', '.')) || 0));
      });
    } else if (t.dataset.sem) {
      Store.update((s) => {
        const sem = s.semesters.find((x) => x.id === t.dataset.sem);
        if (!sem) return;
        sem[t.dataset.field] = t.dataset.field === 'fee' ? (t.value === '' ? null : Math.max(0, parseFloat(t.value.replace(',', '.')) || 0)) : t.value;
        syncSemesterEntries(s);
      });
    } else if (t.dataset.semItem) {
      const [semId, itemId] = t.dataset.semItem.split(':');
      Store.update((s) => {
        const sem = s.semesters.find((x) => x.id === semId);
        const item = sem && (sem.items || []).find((x) => x.id === itemId);
        if (!item) return;
        item[t.dataset.field] = t.dataset.field === 'amount' ? Math.max(0, parseFloat(t.value.replace(',', '.')) || 0) : t.value;
        syncSemesterEntries(s);
      });
    }
  }));
}
