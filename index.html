    this.bgRadius = Math.max(w, h) * 0.75 * Math.sqrt(sun.s);

    // 3. Sterne: Parallaxe aus Fingerposition und Kamera, am Rand umlaufend
    // Himmelskugel: Sterne sind Richtungen, sie drehen sich mit der Kamera; Parallaxe nur noch leicht über den Finger
    const pf = this.parallax === false ? 0 : 1;
    const ox = this.pointer.x * 0.03 * pf, oy = this.pointer.y * 0.03 * pf;
    for (const st of this.stars) {
      const depth = [0.3, 0.7, 1.3][st.layer];
      const q = this.projectDir(st.dx, st.dy, st.dz);
      st.vis = !!q && q.x > -4 && q.y > -4 && q.x < w + 4 && q.y < h + 4;
      if (!st.vis) continue;
      st.sx = q.x - ox * depth;
      st.sy = q.y - oy * depth;
    }
    for (const g of this.galaxies || []) {
      const q = this.projectDir(g.dx, g.dy, g.dz);
      g.vis = !!q && q.x > -g.size && q.y > -g.size && q.x < w + g.size && q.y < h + g.size;
      if (g.vis) { g.sx = q.x - ox * 0.2; g.sy = q.y - oy * 0.2; }
    }
    for (const st of this.stars) {
      if (!st.vis) continue;
      st.r = st.size * (0.7 + st.layer * 0.35);
      st.alpha = (0.25 + 0.25 * st.layer) * (0.55 + 0.45 * Math.sin(this.time * 0.0016 * (st.layer + 1) + st.phase));
    }
    // Sternbilder liegen am Himmel: Bildschirmkoordinaten mit leichter Parallaxe
    for (const b of this.bodies) {
      if (b.kind !== 'constellation') continue;
      b.screen = b.dirs.map((dv) => this.projectDir(dv[0], dv[1], dv[2])).filter(Boolean).map((q) => [q.x - ox * 0.5, q.y - oy * 0.5]);
      b.zc = 1e9;
      if (b.screen.length < 2) { b.visible = false; b.x = b.y = -9999; b.rs = 0; b.hitR = 0; continue; }
      b.x = b.screen.reduce((a, q) => a + q[0], 0) / b.screen.length;
      b.y = b.screen.reduce((a, q) => a + q[1], 0) / b.screen.length;
      b.rs = Math.max(...b.screen.map((q) => Math.hypot(q[0] - b.x, q[1] - b.y)));
      b.hitR = Math.max(22, b.rs + 10);
      b.visible = true;
    }

    // 4. Geldflüsse zwischen Konten: Kontrollpunkt der Kurve
    for (const f of this.flows) {
      if (f.type !== 'transfer' || !f.from || !f.to) continue;
      const c = this.worldToScreen((f.from.wx + f.to.wx) / 2, (f.from.wy + f.to.wy) / 2, 60); // Bogen über der Ebene
      f.cx = c.x; f.cy = c.y;
    }

    // 4b. Kosmischer Staub: langsam schwebend, perspektivisch abgebildet
    for (const q of this.dust || []) {
      if (!this.still) { q.x += q.vx * dt; q.z += q.vz * dt; q.phase += dt * 0.0004; }
      const sp = this.worldToScreen(q.x, q.z, q.y + Math.sin(q.phase) * 6);
      q.vis = sp.ok && sp.x > -10 && sp.y > -10 && sp.x < w + 10 && sp.y < h + 10;
      q.sx = sp.x; q.sy = sp.y; q.s = sp.s;
    }
    // 4c. Sternschnuppen: ab und zu, Häufigkeit nach Partikeldichte
    if (!this.still && this.meteorsOn) {
      this.meteorClock -= dt;
      if (this.meteorClock <= 0) { this.spawnMeteor(); this.meteorClock = (2500 + Math.random() * 6000) / (this.particleFactor || 1); }
    }
    this.meteors = (this.meteors || []).filter((m) => { m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt; return m.life < m.dur; });

    // 5. Partikel: in Weltkoordinaten bewegen, dann abbilden
    if (!this.still) {
      const cap = Math.round(this.profile.particles * this.level.particles * (this.particleFactor || 1));
      for (const f of this.flows) {
        f.acc += f.rate * dt;
        while (f.acc >= 1 && this.particles.length < cap) {
          f.acc -= 1;
          this.particles.push({ flow: f, t: 0, speed: 0.00035 + Math.random() * 0.00025, wobble: Math.random() * 20 - 10, angle: Math.random() * Math.PI * 2 });
        }
      }
      // Sonnen-Eruption am Zahltag
      if (this.flare) {
        this.flare.acc += this.flare.rate * dt;
        while (this.flare.acc >= 1 && this.particles.length < cap) {
          this.flare.acc -= 1;
          this.particles.push({ flow: this.flare, t: 0, speed: 0.0008 + Math.random() * 0.0005, wobble: Math.random() * 20 - 10, angle: Math.random() * Math.PI * 2 });
        }
      }
    }
    const colors = { income: '#3FBF86', expense: '#EE6F6A', transfer: '#6D95F2', flare: '#FFB347' };
    this.particles = this.particles.filter((pa) => {
      pa.t += pa.speed * dt;
      if (pa.t >= 1) return false;
      const f = pa.flow;
      let x0, y0, x1, y1, qx, qy, qh;
      if (f.type === 'flare') { const R = 46 * 2.4; x0 = 0; y0 = 0; x1 = Math.cos(pa.angle) * R; y1 = Math.sin(pa.angle) * R; qx = x1 * 0.5 - Math.sin(pa.angle) * pa.wobble * 2; qy = y1 * 0.5 + Math.cos(pa.angle) * pa.wobble * 2; qh = 30 + pa.wobble * 2; }
      else if (f.type === 'income' && f.to) { x0 = 0; y0 = 0; x1 = f.to.wx; y1 = f.to.wy; qx = x1 / 2 + pa.wobble * 3; qy = y1 / 2 + pa.wobble; qh = 70 + pa.wobble * 2; }
      else if (f.type === 'expense' && f.from) { x0 = f.from.wx; y0 = f.from.wy; x1 = x0 + Math.cos(pa.angle) * base * 0.35; y1 = y0 + Math.sin(pa.angle) * base * 0.35; qx = (x0 + x1) / 2 + pa.wobble; qy = (y0 + y1) / 2 + pa.wobble; qh = 18 + pa.wobble; }
      else if (f.from && f.to) { x0 = f.from.wx; y0 = f.from.wy; x1 = f.to.wx; y1 = f.to.wy; qx = (x0 + x1) / 2; qy = (y0 + y1) / 2; qh = 60; }
      else return false;
      const u = 1 - pa.t;
      const sp = this.worldToScreen(u * u * x0 + 2 * u * pa.t * qx + pa.t * pa.t * x1, u * u * y0 + 2 * u * pa.t * qy + pa.t * pa.t * y1, 2 * u * pa.t * qh);
      const growth = Math.min(2.2, Math.sqrt(sp.s));
      pa.sx = sp.x; pa.sy = sp.y;
      pa.visible = sp.ok && !(sp.x < -20 || sp.y < -20 || sp.x > w + 20 || sp.y > h + 20);
      pa.size = (f.type === 'expense' ? 10 * (1 - pa.t) + 4 : f.type === 'flare' ? 14 * (1 - pa.t) + 4 : 11) * growth;
      pa.alpha = f.type === 'expense' || f.type === 'flare' ? 0.9 * (1 - pa.t) : Math.min(1, pa.t * 4) * 0.9;
      pa.color = colors[f.type];
      return true;
    });
  },

  /** Canvas 2D: Rückfallebene mit demselben Bild ohne Nachleuchten. */
  draw2D(ctx) {
    const w = this.w, h = this.h, z = this.cam.zoom, sun = this.sunScreen;
    const bg = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, this.bgRadius);
    const pal = this.palette || UNI_PALETTES.kosmos;
    bg.addColorStop(0, pal.inner);
    bg.addColorStop(1, pal.outer);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = pal.star;
    for (const st of this.stars) {
      if (!st.vis) continue;
      ctx.globalAlpha = st.alpha;
      ctx.beginPath();
      ctx.arc(st.sx, st.sy, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const mt of this.meteors || []) {
      const fade = Math.sin(Math.PI * Math.min(1, mt.life / mt.dur)), sp = Math.hypot(mt.vx, mt.vy) || 1;
      const tx = mt.x - mt.vx / sp * mt.len, ty = mt.y - mt.vy / sp * mt.len, g = ctx.createLinearGradient(mt.x, mt.y, tx, ty);
      g.addColorStop(0, `rgba(230,240,255,${(0.9 * fade * mt.bright).toFixed(3)})`);
      g.addColorStop(1, 'rgba(230,240,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(mt.x, mt.y); ctx.lineTo(tx, ty); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Nebel und Sternbilder
    for (const b of this.bodies) {
      if (b.kind !== 'nebula' || !b.visible) continue;
      const n = parseInt(b.color.slice(1), 16), t = b.over ? 0.75 : Math.min(0.6, Math.max(0, (b.ratio - 0.8) * 2.5));
      const mixc = (v, red) => Math.round(v + (red - v) * t);
      const rgbs = `${mixc((n >> 16) & 255, 238)},${mixc((n >> 8) & 255, 111)},${mixc(n & 255, 106)}`, a = 0.28 + 0.44 * Math.min(1, b.ratio);
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.rs * 1.3);
      g.addColorStop(0, `rgba(${rgbs},${a})`); g.addColorStop(0.6, `rgba(${rgbs},${a * 0.45})`); g.addColorStop(1, `rgba(${rgbs},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.rs * 1.3, 0, Math.PI * 2); ctx.fill();
    }
    for (const b of this.bodies) {
      if (b.kind !== 'constellation' || b.screen.length < 2) continue;
      const on = this.selected === b;
      ctx.strokeStyle = `rgba(190,215,255,${on ? 0.7 : 0.3})`;
      ctx.lineWidth = on ? 1.6 : 1;
      ctx.beginPath();
      b.screen.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
      ctx.fillStyle = 'rgba(235,242,255,0.95)';
      for (const [x, y] of b.screen) { ctx.beginPath(); ctx.arc(x, y, on ? 2.6 : 1.9, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.lineWidth = 1;
    ctx.strokeStyle = this.contrast ? 'rgba(160,190,230,0.22)' : 'rgba(160,190,230,0.10)';
    for (const b of this.bodies) {
      if (b.kind !== 'planet') continue;
      ctx.beginPath();
      for (let i = 0; i <= 96; i++) { const t = i / 96 * Math.PI * 2; const q = this.worldToScreen(Math.cos(t) * b.rx, Math.sin(t) * b.rx); if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y); }
      ctx.stroke();
    }
    ctx.setLineDash([4, 7]);
    ctx.lineDashOffset = -this.time * 0.03;
    ctx.strokeStyle = 'rgba(109,149,242,0.45)';
    ctx.lineWidth = 1.4;
    for (const f of this.flows) {
      if (f.type !== 'transfer' || !f.from || !f.to) continue;
      ctx.beginPath();
      ctx.moveTo(f.from.x, f.from.y);
      ctx.quadraticCurveTo(f.cx, f.cy, f.to.x, f.to.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    for (const pa of this.particles) {
      if (!pa.visible) continue;
      ctx.globalAlpha = pa.alpha;
      ctx.drawImage(this.sprite(pa.color), pa.sx - pa.size / 2, pa.sy - pa.size / 2, pa.size, pa.size);
    }
    ctx.globalAlpha = 1;
    const core = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.r);
    core.addColorStop(0, 'rgba(255,236,170,1)');
    core.addColorStop(0.35, 'rgba(255,196,90,0.75)');
    core.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(sun.x, sun.y, sun.r, 0, Math.PI * 2);
    ctx.fill();
    const ringHalf = (b, front) => {
      const n = parseInt(b.color.slice(1), 16), mixc = (v, nat) => Math.round(nat * 0.7 + v * 0.3);
      const rgbs = `${mixc((n >> 16) & 255, 219)},${mixc((n >> 8) & 255, 204)},${mixc(n & 255, 173)}`;
      for (const [rf, wf, al] of UNI_RING_BANDS) {
        ctx.strokeStyle = `rgba(${rgbs},${al})`;
        ctx.lineWidth = (1.2 + 3.5 * b.ring.share) * wf;
        const pts = this.ringPoints(b, rf, front ? 1 : 0);
        ctx.beginPath();
        for (let i = 0; i < pts.length; i += 2) { if (i) ctx.lineTo(pts[i], pts[i + 1]); else ctx.moveTo(pts[i], pts[i + 1]); }
        ctx.stroke();
      }
    };
    for (const b of this.bodies) if (b.kind === 'planet' && b.ring && b.visible) ringHalf(b, false);
    for (const b of this.bodies) {
      if (!b.visible) continue;
      if (b.kind === 'blackhole') {
        const R = b.rs * 1.9, g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R);
        g.addColorStop(0, '#000'); g.addColorStop(0.42, '#000'); g.addColorStop(0.5, 'rgba(255,120,40,0.9)');
        g.addColorStop(0.62, 'rgba(255,214,150,0.95)'); g.addColorStop(0.76, 'rgba(255,110,40,0.4)'); g.addColorStop(1, 'rgba(255,110,40,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill();
      } else if (b.kind === 'wormhole') {
        ctx.strokeStyle = 'rgba(160,190,255,0.85)';
        ctx.lineWidth = 1.6;
        for (let k = 0; k < 3; k++) { const a0 = this.time * 0.004 + k * 2.09; ctx.beginPath(); ctx.arc(b.x, b.y, b.rs * (0.8 + k * 0.35), a0, a0 + 1.6); ctx.stroke(); }
      } else if (b.kind === 'comet') {
        const zg = Math.min(2.2, Math.sqrt(z));
        for (const [tx, ty, f] of b.tail) { const size = (6 + 10 * f) * zg; ctx.globalAlpha = 0.55 * f; ctx.drawImage(this.sprite(b.color), tx - size / 2, ty - size / 2, size, size); }
        ctx.globalAlpha = 1;
        ctx.drawImage(this.sprite(b.color), b.x - 10 * zg, b.y - 10 * zg, 20 * zg, 20 * zg);
      }
    }
    for (const b of this.ordered) {
      if (!b.visible || !(b.kind === 'planet' || b.kind === 'moon' || b.kind === 'satellite')) continue;
      const r = b.rs;
      if (b.kind === 'satellite') {
        if (b.blink) { const s = r * 8; ctx.globalAlpha = b.blink; ctx.drawImage(this.sprite('#F2B84B'), b.x - s / 2, b.y - s / 2, s, s); ctx.globalAlpha = 1; }
        ctx.fillStyle = b.alert ? '#F2B84B' : '#CFE0F5';
        ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(1.5, r), 0, Math.PI * 2); ctx.fill();
        continue;
      }
      if (b.kind === 'planet') {
        const atmo = (b.atmosphere && b.atmosphere.color) || b.color;
        const glow = ctx.createRadialGradient(b.x, b.y, r * 0.4, b.x, b.y, r * 2.4);
        glow.addColorStop(0, atmo + (this.glowHalo || '66'));
        glow.addColorStop(1, atmo + '00');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(b.x, b.y, r * 2.4, 0, Math.PI * 2); ctx.fill();
        const sdx = sun.x - b.x, sdy = sun.y - b.y, sdl = Math.hypot(sdx, sdy) || 1;
        const body = ctx.createRadialGradient(b.x + sdx / sdl * r * 0.4, b.y + sdy / sdl * r * 0.4, r * 0.1, b.x, b.y, r);
        body.addColorStop(0, '#ffffff');
        body.addColorStop(0.25, b.color);
        body.addColorStop(1, '#0b1220');
        ctx.fillStyle = body;
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
        if (b.mix && b.mix.length) {
          // Farbbänder nach Ausgabenmix
          ctx.save();
          ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.clip();
          let y0 = b.y - r;
          ctx.globalAlpha = 0.38;
          for (const band of b.mix) { ctx.fillStyle = band.color; ctx.fillRect(b.x - r, y0, 2 * r, 2 * r * band.share); y0 += 2 * r * band.share; }
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      } else {
        // Mondphase = Sparfortschritt: beleuchteter Anteil von rechts
        const ph = Math.max(0, Math.min(1, b.progress));
        ctx.fillStyle = 'rgba(40,50,70,0.95)';
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
        if (ph > 0.01) {
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(b.x, b.y, r, -Math.PI / 2, Math.PI / 2);
          ctx.ellipse(b.x, b.y, r * Math.abs(1 - 2 * ph), r, 0, Math.PI / 2, -Math.PI / 2, ph < 0.5);
          ctx.fill();
        }
      }
    }
    for (const b of this.bodies) if (b.kind === 'planet' && b.ring && b.visible) ringHalf(b, true);
  },

  /** Texte und Markierungen über der Szene: Namen, Kontostände, Sparfortschritt, Auswahl, gezogenes Geld. */
  drawHud(ctx, clear) {
    if (!ctx) return;
    if (clear) { ctx.setTransform(this.hudDpr, 0, 0, this.hudDpr, 0, 0); ctx.clearRect(0, 0, this.w, this.h); }
    this.drawHudLayer(ctx);
    if (this.drag) {
      const { from, x, y, target } = this.drag;
      ctx.textAlign = 'center';
      ctx.setLineDash([6, 6]);
      ctx.lineDashOffset = -this.time * 0.05;
      ctx.strokeStyle = target ? 'rgba(120,230,170,0.95)' : 'rgba(255,214,150,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(x, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#F2C94C';
      ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5A4300';
      ctx.font = "800 12px 'Manrope', system-ui, sans-serif";
      ctx.fillText('€', x, y + 4);
      if (target) {
        ctx.strokeStyle = 'rgba(120,230,170,0.95)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(target.x, target.y, target.rs + 10, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(220,250,235,0.95)';
        ctx.font = "700 12px 'Manrope', system-ui, sans-serif";
        ctx.fillText(target.kind === 'moon' ? `In „${target.name}“ einzahlen` : `An ${target.name} überweisen`, target.x, target.y - target.rs - 16);
      }
    }
  },

  drawHudLayer(ctx) {
    const labels = this.labels || 'alle';
    const named = (b) => labels === 'alle' || (labels === 'auswahl' && this.selected === b);
    const z = this.cam.zoom;
    ctx.textAlign = 'center';
    for (const b of this.ordered) {
      if (!b.visible) continue;
      const r = b.rs;
      if (b.kind === 'planet') {
        if (named(b)) {
        ctx.fillStyle = 'rgba(230,238,250,0.92)';
        ctx.font = "700 12px 'Manrope', system-ui, sans-serif";
        ctx.fillText(b.name, b.x, b.y + r + 16);
        ctx.fillStyle = 'rgba(180,196,220,0.8)';
        ctx.font = "600 11px 'Manrope', system-ui, sans-serif";
        if (!this.hideAmounts) ctx.fillText(Fmt.money(b.balance), b.x, b.y + r + 30);
        }
      } else if ((b.kind === 'blackhole' || b.kind === 'comet') && named(b)) {
        ctx.fillStyle = b.kind === 'comet' && b.comet === 'outlier' ? 'rgba(255,170,160,0.9)' : 'rgba(220,230,248,0.85)';
        ctx.font = "600 11px 'Manrope', system-ui, sans-serif";
        const label = b.kind === 'blackhole' ? (this.hideAmounts ? 'Schulden' : `Schulden ${Fmt.money(-b.total)}`) : `${b.name} · ${parseISO(b.date).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' })}`;
        ctx.fillText(label, b.x, b.y + (b.kind === 'blackhole' ? r * 1.9 + 14 : 20));
      } else if (b.kind === 'nebula' && named(b)) {
        ctx.fillStyle = b.over ? 'rgba(255,170,160,0.85)' : 'rgba(220,230,248,0.7)';
        ctx.font = "600 11px 'Manrope', system-ui, sans-serif";
        ctx.fillText(`${b.name} · ${b.estimated ? '~' : ''}${Math.round(b.ratio * 100)} %`, b.x, b.y + 4);
      } else if (b.kind === 'constellation') {
        if (this.selected === b) { ctx.fillStyle = 'rgba(220,230,248,0.9)'; ctx.font = "700 12px 'Manrope', system-ui, sans-serif"; ctx.fillText(b.title, b.x, b.y - b.rs - 10); }
      } else if (b.kind === 'sun') {
        if (this.model && this.model.sun.payday) { ctx.fillStyle = 'rgba(255,214,150,0.95)'; ctx.font = "700 12px 'Manrope', system-ui, sans-serif"; ctx.fillText('Zahltag', b.x, b.y + this.sunScreen.r + 16); }
      } else if (b.kind === 'moon') {
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(b.x, b.y, r + 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * b.progress); ctx.stroke();
        if (z >= 1.8 && named(b)) {
          ctx.fillStyle = 'rgba(220,230,248,0.85)';
          ctx.font = "600 11px 'Manrope', system-ui, sans-serif";
          ctx.fillText(b.name, b.x, b.y + r + 15);
        }
      }
      if (this.selected === b) {
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 4]);
        ctx.lineDashOffset = -this.time * 0.02;
        ctx.beginPath(); ctx.arc(b.x, b.y, (b.kind === 'blackhole' ? r * 1.9 : r) + (b.kind === 'planet' ? 9 : 7), 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  },

  /** Antippen: nächstgelegenen Planeten oder Mond wählen (Bildschirmkoordinaten). */
  /** Treffer ohne Auswahl: Vordergrund zuerst, Nebel und Sternbilder nur, wo sonst nichts liegt; filter schränkt die Arten ein. */
  hitTest(x, y, filter) {
    const find = (background) => {
      let best = null, bestDist = Infinity;
      for (const b of this.bodies) {
        if ((b.kind === 'nebula' || b.kind === 'constellation') !== background) continue;
        if (filter && !filter(b)) continue;
        const d = Math.hypot(b.x - x, b.y - y);
        if (d < (b.hitR || 18) && d < bestDist) { best = b; bestDist = d; }
      }
      return best;
    };
    return find(false) || find(true);
  },

  pick(x, y) {
    const best = this.hitTest(x, y);
    this.select(best);
    if (best) { UniSound.play('select'); uniHaptic(8); }
    return best;
  },

  /** Kreismenü um den Druckpunkt: Knöpfe je nach Himmelskörper. */
  openMenu(body, pt) {
    this.closeMenu();
    const stage = this.canvas && this.canvas.parentElement;
    if (!stage) return;
    this.menuBody = body;
    this.select(body);
    const items = [['details', 'Details', 'file']];
    if (body.kind === 'planet') items.push(['transfer', 'Überweisen', 'wallet'], ['expense', 'Ausgabe', 'out']);
    if (body.kind === 'moon') items.push(['deposit', 'Einzahlen', 'in']);
    if (body.kind === 'satellite') items.push(['cancel', 'Kündigen', 'close']);
    items.push(['fly', 'Heranfliegen', 'orbit']);
    const R = 70, n = items.length;
    const cx = Math.min(Math.max(pt.x, R + 34), this.w - R - 34), cy = Math.min(Math.max(pt.y, R + 34), this.h - R - 34);
    const menu = document.createElement('div');
    menu.className = 'uni-menu';
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', `Aktionen für ${body.name || body.label || body.title || 'Himmelskörper'}`);
    menu.style.left = `${cx}px`;
    menu.style.top = `${cy}px`;
    menu.innerHTML = items.map(([id, label, ic], i) => {
      const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
      return `<button type="button" role="menuitem" class="uni-menu-item" data-action="uni-menu" data-id="${id}" style="transform: translate(${Math.round(Math.cos(ang) * R)}px, ${Math.round(Math.sin(ang) * R)}px)">${icon(ic)}<span>${esc(label)}</span></button>`;
    }).join('') + '<span class="uni-menu-center" aria-hidden="true"></span>';
    stage.append(menu);
    this.menu = menu;
    uniHaptic(15);
    UniSound.play('menu');
    menu.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); this.closeMenu(); if (this.canvas) this.canvas.focus(); } });
    this.menuOutside = (e) => { if (this.menu && !this.menu.contains(e.target)) this.closeMenu(); };
    setTimeout(() => { if (this.menu === menu) document.addEventListener('pointerdown', this.menuOutside, true); }, 0);
    const first = menu.querySelector('button');
    if (first) first.focus({ preventScroll: true });
  },

  closeMenu() {
    if (this.menuOutside) { document.removeEventListener('pointerdown', this.menuOutside, true); this.menuOutside = null; }
    if (this.menu) { this.menu.remove(); this.menu = null; }
  },

  /* ----- Suche mit Kameraflug (U5b) ----- */
  searchBodies(query) {
    const q = normText(String(query || '').trim());
    if (!q) return [];
    const KIND = UNI_KIND_LABEL;
    const seen = new Set(), hits = [];
    for (const b of this.bodies) {
      const key = `${b.kind}:${b.id}`;
      if (seen.has(key) || !KIND[b.kind]) continue; // Wurmlöcher haben zwei Portale
      const name = uniBodyName(b);
      const pos = normText(`${name} ${KIND[b.kind]}`).indexOf(q);
      if (pos < 0) continue;
      seen.add(key);
      hits.push({ body: b, name, kind: KIND[b.kind], score: (normText(name).startsWith(q) ? 0 : 1) + pos / 1000 });
    }
    return hits.sort((a, b) => a.score - b.score).slice(0, 8);
  },

  hitValue(b) {
    if (b.kind === 'planet') return Fmt.money(b.balance);
    if (b.kind === 'moon') return `${Math.round(b.progress * 100)} %`;
    if (b.kind === 'satellite') return `${Fmt.money(b.monthly)} / Monat`;
    if (b.kind === 'nebula') return `${b.estimated ? '~' : ''}${Math.round(b.ratio * 100)} %`;
    if (b.kind === 'comet' || b.kind === 'constellation') return parseISO(b.date).toLocaleDateString('de-DE');
    if (b.kind === 'blackhole') return Fmt.money(-b.total);
    if (b.kind === 'wormhole') return Fmt.money(b.amount);
    if (b.kind === 'sun') return Fmt.money(this.model ? this.model.sun.income : 0);
    return '';
  },

  openSearch() {
    this.closeMenu();
    if (this.searchBox) { this.searchBox.querySelector('input').focus(); return; }
    const stage = this.canvas && this.canvas.parentElement;
    if (!stage) return;
    const box = document.createElement('div');
    box.className = 'uni-search';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-label', 'Im Universum suchen');
    box.innerHTML = '<input type="search" placeholder="Konto, Sparziel, Abo, Budget …" aria-label="Himmelskörper suchen" aria-controls="uniSearchList" autocomplete="off"><ul id="uniSearchList" role="listbox" class="uni-search-list"></ul>';
    stage.append(box);
    this.searchBox = box;
    const input = box.querySelector('input'), list = box.querySelector('ul');
    let hits = [], active = 0;
    const paint = () => {
      hits = this.searchBodies(input.value);
      active = Math.min(active, Math.max(0, hits.length - 1));
      list.innerHTML = hits.length
        ? hits.map((x, i) => `<li role="option" id="uniHit${i}" aria-selected="${i === active}" data-hit="${i}" class="${i === active ? 'on' : ''}"><span><b>${esc(x.name)}</b><small>${esc(x.kind)}</small></span><span class="num">${this.hitValue(x.body)}</span></li>`).join('')
        : input.value.trim() ? '<li class="empty">Nichts gefunden.</li>' : '';
      if (hits.length) input.setAttribute('aria-activedescendant', `uniHit${active}`); else input.removeAttribute('aria-activedescendant');
    };
    const choose = (i) => {
      const x = hits[i];
      if (!x) return;
      this.closeSearch();
      if (x.body.kind === 'constellation') this.select(x.body); else this.flyTo(x.body);
    };
    input.addEventListener('input', () => { active = 0; paint(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(hits.length - 1, active + 1); paint(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); paint(); }
      else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.closeSearch(); if (this.canvas) this.canvas.focus(); }
    });
    list.addEventListener('click', (e) => { const li = e.target.closest('[data-hit]'); if (li) choose(Number(li.dataset.hit)); });
    this.searchOutside = (e) => { if (this.searchBox && !this.searchBox.contains(e.target) && !e.target.closest('[data-action="uni-search"]')) this.closeSearch(); };
    setTimeout(() => { if (this.searchBox === box) document.addEventListener('pointerdown', this.searchOutside, true); }, 0);
    input.focus({ preventScroll: true });
    paint();
  },

  closeSearch() {
    if (this.searchOutside) { document.removeEventListener('pointerdown', this.searchOutside, true); this.searchOutside = null; }
    if (this.searchBox) { this.searchBox.remove(); this.searchBox = null; }
  },

  /* ----- Minikarte (U5b): Weltausschnitt bei Zoom 1 plus Rand, mit aktuellem Sichtfenster ----- */
  miniView() {
    let ext = 1;
    for (const b of this.bodies) if (['planet', 'blackhole', 'nebula', 'comet'].includes(b.kind) && Number.isFinite(b.wx)) ext = Math.max(ext, Math.abs(b.wx) + (b.r || 0), Math.abs(b.wy) + (b.r || 0));
    ext *= 1.1;
    return {
      world: { x: -ext, y: -ext, w: ext * 2, h: ext * 2 },
      view: [[0, 0], [this.w, 0], [this.w, this.h], [0, this.h]].map(([sx, sy]) => this.screenToWorld(sx, sy))
    };
  },

  miniToWorld(mx, my) {
    const m = this.miniMap;
    return m ? { x: m.world.x + (mx - m.ox) / m.s, y: m.world.y + (my - m.oy) / m.s } : null;
  },

  drawMini() {
    const mini = this.mini, ctx = this.miniCtx;
    if (!mini || !ctx) return;
    const show = this.cam.zoom > 1.15 || Math.hypot(this.cam.x, this.cam.y) > 40;
    if (mini.hidden === show) mini.hidden = !show;
    if (!show) return;
    const mw = mini.clientWidth || 168, mh = mini.clientHeight || 108, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (mini.width !== Math.round(mw * dpr)) { mini.width = Math.round(mw * dpr); mini.height = Math.round(mh * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, mw, mh);
    const { world, view } = this.miniView();
    const s = Math.min(mw / world.w, mh / world.h), ox = (mw - world.w * s) / 2, oy = (mh - world.h * s) / 2;
    const map = (x, y) => [ox + (x - world.x) * s, oy + (y - world.y) * s];
    const [cx, cy] = map(0, 0);
    ctx.strokeStyle = 'rgba(160,190,230,0.25)';
    ctx.lineWidth = 0.8;
    for (const b of this.bodies) if (b.kind === 'planet' && b.rx) { ctx.beginPath(); ctx.arc(cx, cy, b.rx * s, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = '#FFD27A';
    ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();
    for (const b of this.bodies) {
      if (!['planet', 'blackhole', 'comet', 'nebula'].includes(b.kind)) continue;
      const [px, py] = map(b.wx, b.wy);
      ctx.fillStyle = b.kind === 'blackhole' ? '#FF8A3D' : b.kind === 'nebula' ? 'rgba(160,190,230,0.22)' : b.color;
      ctx.beginPath(); ctx.arc(px, py, b.kind === 'planet' ? Math.max(2, b.r * s * 1.2) : b.kind === 'nebula' ? Math.max(3, b.r * s) : 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    view.forEach((q, i) => { const [vx, vy] = map(q.x, q.y); if (i) ctx.lineTo(vx, vy); else ctx.moveTo(vx, vy); });
    ctx.closePath();
    ctx.stroke();
    this.miniMap = { ox, oy, s, world };
  },

  /* ----- Poster-Export (U6a): 2800 × 1752 wie das Galaxy Tab S10+, mit WebGL-Nachleuchten ----- */
  exportPoster({ amounts = true, title = 'Mein Finanz-Universum' } = {}) {
    if (!this.canvas) return Promise.resolve(null);
    // Szene oben (2800 × 1552), Bildunterschrift in einem eigenen Balken darunter – nichts überlagert sich
    const W = 2800, H = 1752, CAP = 200, HS = H - CAP, scale = W / 1216;
    const keep = { w: this.w, h: this.h, dpr: this.dpr, hudDpr: this.hudDpr, cam: { ...this.cam }, selected: this.selected, follow: this.follow, flight: this.flight, drag: this.drag, last: this.last };
    // Übersicht in Poster-Größe: logisch 1216 × 760 Punkte, Faktor 2,3
    this.w = W / scale; this.h = HS / scale; this.dpr = scale; this.hudDpr = scale;
    this.cam = { x: 0, y: 0, zoom: 1, yaw: 0, pitch: UNI_PITCH.def };
    this.selected = null; this.follow = null; this.flight = null; this.drag = null;
    this.hideAmounts = !amounts;
    this.canvas.width = W; this.canvas.height = HS;
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    const o = out.getContext('2d');
    try {
      const now = performance.now();
      this.last = now;
      if (this.gl) {
        this.gl.resize();
        if (this.hud) { this.hud.width = W; this.hud.height = HS; }
        this.simulate(now);
        this.gl.draw(this);
        this.drawHud(this.hudCtx, true);
        if (o) { o.drawImage(this.canvas, 0, 0, W, HS); if (this.hud) o.drawImage(this.hud, 0, 0, W, HS); }
      } else if (this.ctx) {
        this.ctx.setTransform(scale, 0, 0, scale, 0, 0);
        this.simulate(now);
        this.draw2D(this.ctx);
        this.drawHud(this.ctx, false);
        if (o) o.drawImage(this.canvas, 0, 0, W, HS);
      }
      if (o) {
        // Bildunterschrift im eigenen Balken
        o.fillStyle = '#05080f';
        o.fillRect(0, HS, W, CAP);
        o.fillStyle = 'rgba(160,190,230,0.25)';
        o.fillRect(0, HS, W, 2);
        o.textAlign = 'left';
        o.fillStyle = '#F2F6FC';
        o.font = "800 64px 'Manrope', system-ui, sans-serif";
        o.fillText(String(title || 'Mein Finanz-Universum').slice(0, 60), 110, H - 130);
        o.fillStyle = 'rgba(200,215,240,0.85)';
        o.font = "600 34px 'Manrope', system-ui, sans-serif";
        const when = (this.date || today()).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
        o.fillText(`${when}${amounts && this.model ? ` · Vermögen ${Fmt.money(this.model.netWorth)}` : ''} · Finanzplaner`, 110, H - 72);
      }
    } finally {
      this.hideAmounts = false;
      Object.assign(this, { cam: keep.cam, selected: keep.selected, follow: keep.follow, flight: keep.flight, drag: keep.drag, last: keep.last });
      this.resize();
      this.frame(performance.now());
    }
    this.lastPoster = out;
    return new Promise((resolve) => {
      if (!out.toBlob) { resolve(null); return; }
      out.toBlob((blob) => {
        if (blob) downloadFile(`finanz-universum-${toISO(this.date || today())}.png`, blob, 'image/png');
        resolve(blob);
      }, 'image/png');
    });
  },

  /** Kamera und Reisedatum über das nächste Neuzeichnen retten (nach einer Buchung im Universum). */
  preserveView() { if (this.canvas) this.restoreView = { cam: { ...this.cam }, timeOffset: this.timeOffset }; },

  select(body) {
    this.selected = body;
    const box = $('#universeInfo');
    if (box) {
      box.innerHTML = body ? universeInfo(body) : universeHint();
    }
    this.redraw();
  }
};

const UNI_ATMO_LABEL = { kritisch: 'kritisch, rutscht bis Monatsende ins Minus', sinkt: 'sinkt bis Monatsende', steigt: 'steigt bis Monatsende', stabil: 'stabil' };

/** Überweisen oder Einzahlen aus dem Universum: einmalig sofort oder monatlich. */
function openUniverseTransfer(fromId, target) {
  const s = Store.state;
  const from = s.accounts.find((a) => a.id === fromId) || s.accounts[0];
  if (!from) return;
  const other = s.accounts.find((a) => a.id !== from.id);
  const chosen = target || (other ? { kind: 'account', id: other.id } : null);
  const opt = (value, label, on) => `<option value="${value}"${on ? ' selected' : ''}>${esc(label)}</option>`;
  const fromOpts = s.accounts.map((a) => opt(a.id, `${a.name} (${Fmt.money(a.balance)})`, a.id === from.id)).join('');
  const accOpts = s.accounts.map((a) => opt(`account:${a.id}`, `${a.name} (${Fmt.money(a.balance)})`, chosen && chosen.kind === 'account' && chosen.id === a.id)).join('');
  const goalOpts = s.goals.map((g) => opt(`goal:${g.id}`, `${g.name} (${Fmt.money(g.saved)} von ${Fmt.money(g.target)})`, chosen && chosen.kind === 'goal' && chosen.id === g.id)).join('');
  const suggestion = Math.max(10, Math.round(Math.max(0, from.balance) * 0.1 / 10) * 10);
  const body = `
    <div class="field-row">
      ${field('Von', `<select name="from">${fromOpts}</select>`)}
      ${field('Nach', `<select name="to"><optgroup label="Konten">${accOpts}</optgroup>${goalOpts ? `<optgroup label="Sparziele">${goalOpts}</optgroup>` : ''}</select>`)}
    </div>
    <div class="field-row">
      ${field('Betrag in €', `<input name="amount" type="number" min="0.01" step="0.01" value="${suggestion}" required>`)}
      ${field('Art', selectEl('mode', { once: 'Jetzt einmalig', monthly: 'Monatlich wiederholen' }, 'once'), 'monatlich: als Geldfluss bzw. höhere Sparrate')}
    </div>`;
  UI.modal({
    title: chosen && chosen.kind === 'goal' ? 'Einzahlen' : 'Geld überweisen', body, submitLabel: 'Ausführen',
    onSubmit: (data) => {
      const amount = round2(parseFloat(String(data.amount).replace(',', '.')));
      if (!(amount > 0)) { UI.toast('Bitte einen Betrag über 0 eintragen.'); return false; }
      const [kind, id] = String(data.to || '').split(':');
      if (kind === 'account' && id === data.from) { UI.toast('Von und Nach sind dasselbe Konto.'); return false; }
      const names = { from: accountName(data.from), to: kind === 'goal' ? (s.goals.find((g) => g.id === id) || {}).name : accountName(id) };
      Universe.preserveView();
      Store.update((st) => universeBook(st, data.from, kind, id, amount, data.mode));
      UniSound.play('book');
      uniHaptic([15, 40, 15]);
      const what = data.mode === 'monthly'
        ? (kind === 'goal' ? `Sparrate für ${names.to} um ${Fmt.money(amount)} erhöht` : `${Fmt.money(amount)} monatlich von ${names.from} an ${names.to}`)
        : (kind === 'goal' ? `${Fmt.money(amount)} in ${names.to} eingezahlt` : `${Fmt.money(amount)} von ${names.from} an ${names.to} überwiesen`);
      UI.toast(`${what}.`, { label: 'Rückgängig', run: () => { Universe.preserveView(); Store.undo(); } });
    }
  });
}

/** Buchung im Datenstand: Kontostände (mit Verlauf), Sparziel oder neuer Geldfluss. */
function universeBook(s, fromId, kind, id, amount, mode) {
  const date = toISO(today());
  const from = s.accounts.find((a) => a.id === fromId);
  const move = (acc, delta) => {
    acc.balance = round2(acc.balance + delta);
    acc.history = acc.history || [];
    const same = acc.history.find((x) => x.date === date);
    if (same) same.balance = acc.balance; else acc.history.push({ date, balance: acc.balance });
  };
  if (kind === 'account') {
    const to = s.accounts.find((a) => a.id === id);
    if (!from || !to) return;
    if (mode === 'monthly') s.transfers.push({ id: uid(), name: `${from.name} → ${to.name}`, fromId, toId: id, amount, interval: 'monthly', date, active: true });
    else { move(from, -amount); move(to, amount); }
  } else if (kind === 'goal') {
    const g = s.goals.find((x) => x.id === id);
    if (!g) return;
    if (mode === 'monthly') { g.monthlyRate = round2((g.monthlyRate || 0) + amount); g.fromId = fromId; return; }
    g.saved = round2(g.saved + amount);
    const to = s.accounts.find((a) => a.id === (g.toId || savingsAccountId()));
    if (from && to && to !== from) { move(from, -amount); move(to, amount); }
  }
}

/** Kurzinfo im Seitenfeld für jeden Himmelskörper, mit „Details“ und „Heranfliegen“. */
function universeInfo(b) {
  const m = Universe.model || { sun: {} };
  const d = (iso) => parseISO(iso).toLocaleDateString('de-DE');
  let html = '';
  if (b.kind === 'planet') html = `${planetInfo(b.account)}${b.atmosphere ? `<p class="meter-sub" style="margin-top:6px">Atmosphäre: ${esc(UNI_ATMO_LABEL[b.atmosphere.state])}</p>` : ''}`;
  else if (b.kind === 'moon') html = moonInfo(b.goal);
  else if (b.kind === 'sun') html = `<h3>Sonne · Einnahmen</h3><p class="meter-sub">${m.sun.payday ? '<b>Heute ist Zahltag</b> – deshalb bricht die Sonne aus. ' : ''}In diesem Monat ${Fmt.money(m.sun.income || 0)}${m.sun.nextPayday && !m.sun.payday ? `, nächster Zahltag am ${d(m.sun.nextPayday)}` : ''}.</p>`;
  else if (b.kind === 'nebula') html = b.estimated
    ? `<h3>Nebel · Budget ${esc(b.name)}</h3><p class="meter-sub">Voraussichtlich ${Fmt.money(b.spent)} von ${Fmt.money(b.limit)}, nach deinem Drei-Monats-Schnitt${b.over ? ` – das wären ${Fmt.money(round2(b.spent - b.limit))} zu viel` : ''}.</p>`
    : `<h3>Nebel · Budget ${esc(b.name)}</h3><p class="meter-sub">${Fmt.money(b.spent)} von ${Fmt.money(b.limit)} ausgegeben${b.over ? `, ${Fmt.money(round2(b.spent - b.limit))} drüber` : `, noch ${Fmt.money(round2(b.limit - b.spent))} übrig`}.</p>`;
  else if (b.kind === 'constellation') html = `<h3>Sternbild · ${esc(b.title)}</h3><p class="meter-sub">Erfolg erreicht am ${d(b.date)}.</p>`;
  else if (b.kind === 'satellite') html = `<h3>Satellit · ${esc(b.name)}</h3><p class="meter-sub">Abo mit ${Fmt.money(b.amount)} ${esc((INTERVALS[b.interval] || '').toLowerCase())}${b.next ? `, nächste Zahlung am ${d(b.next)}` : ''}.${b.alert ? ' <b>Die Kündigungsfrist naht.</b>' : ''}</p>`;
  else if (b.kind === 'wormhole') html = `<h3>Wurmloch · ${esc(b.label)}</h3><p class="meter-sub">${esc(accountName(b.fromId))} → ${esc(accountName(b.toId))}, ${Fmt.money(b.amount)}${b.source === 'goal' ? ' im Monat' : ''}.</p>`;
  else if (b.kind === 'blackhole') html = `<h3>Schwarzes Loch · Schulden</h3><p class="meter-sub">${b.count} ${b.count === 1 ? 'Schuld' : 'Schulden'}, noch ${Fmt.money(b.total)} offen${b.monthlyRate ? `, ${Fmt.money(b.monthlyRate)} Tilgung im Monat` : ''}.</p>`;
  else if (b.kind === 'comet') html = b.comet === 'event'
    ? `<h3>Komet · ${esc(b.name)}</h3><p class="meter-sub">Geplant am ${d(b.date)} für ${Fmt.money(b.amount)}, in ${b.days} ${b.days === 1 ? 'Tag' : 'Tagen'}.</p>`
    : `<h3>Komet · Ausreißer</h3><p class="meter-sub">${esc(b.name)}: ${Fmt.money(b.amount)} am ${d(b.date)}, deutlich über deinem Schnitt für ${esc(catLabel(b.category))}.</p>`;
  const k = Universe.timeOffset || 0;
  if (k && Universe.date) {
    const at = Universe.date.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    const stand = b.kind === 'planet' ? `Im ${at}: <b>${Fmt.money(b.balance)}</b>` : b.kind === 'moon' ? `Im ${at}: <b>${Fmt.money(b.saved)}</b> gespart, ${Math.round(b.progress * 100)} %`
      : b.kind === 'blackhole' ? `Im ${at}: noch <b>${Fmt.money(b.total)}</b> offen` : b.kind === 'nebula' ? `Im ${at}: ${Math.round(b.ratio * 100)} % des Budgets` : '';
    if (stand) html = `<p class="meter-sub time-note">Zeitreise · ${stand}</p>${html}`;
  }
  return `${html}<div class="head-tools" style="margin-top:12px"><button type="button" class="btn primary" data-action="uni-sheet">Details</button><button type="button" class="btn" data-action="uni-cam" data-id="focus">${icon('orbit')}Heranfliegen</button></div>`;
}

/** Detail-Sheet je Himmelskörper: Zahlen, Zusammenhänge und der Weg zur passenden Ansicht. */
function openUniverseSheet(b) {
  const s = Store.state, m = Universe.model, t = today();
  const line = (title, sub, value, cls) => `<li class="row"><span class="row-main"><span class="row-title">${esc(title)}</span><span class="row-sub">${esc(sub || '')}</span></span><span class="num ${cls || ''}">${value}</span></li>`;
  const list = (rows, empty) => `<ul class="list">${rows.join('') || `<li class="empty">${esc(empty)}</li>`}</ul>`;
  const foot = (label, value) => `<div class="shop-foot"><div class="between"><span>${esc(label)}</span><strong class="num">${value}</strong></div></div>`;
  const go = (view, label) => `<button type="button" class="btn" data-action="uni-go" data-id="${view}">${esc(label)}</button>`;
  const d = (iso) => parseISO(iso).toLocaleDateString('de-DE');
  let title = '', body = '', tools = '';
  if (b.kind === 'sun') {
    const { from, to } = monthBounds();
    const rows = Finance.flows(from, to).filter((f) => f.amount > 0).map((f) => line(f.entry.name, f.date.toLocaleDateString('de-DE'), Fmt.money(f.amount), 'amt-in'));
    title = 'Sonne · Einnahmen';
    body = `<p class="dialog-text">${m.sun.payday ? '<b>Heute ist Zahltag</b> – deshalb bricht die Sonne aus. ' : ''}Die Sonne speist alle Planeten mit deinen Einnahmen.${m.sun.nextPayday && !m.sun.payday ? ` Nächster Zahltag: ${d(m.sun.nextPayday)}.` : ''}</p>${list(rows, 'Keine Einnahmen in diesem Monat.')}${foot('Summe im Monat', Fmt.money(m.sun.income))}`;
    tools = go('income', 'Zu den Einnahmen');
  } else if (b.kind === 'planet') {
    const a = b.account;
    const fixedRows = (b.ring ? b.ring.entryIds : []).map((id) => s.entries.find((e) => e.id === id)).filter(Boolean).map((e) => line(e.name, INTERVALS[e.interval], `${Fmt.money(monthlyAmount(e))} / Monat`));
    const subRows = m.satellites.filter((x) => x.hostId === a.id).map((x) => line(x.name, x.alert ? 'Kündigungsfrist naht' : x.next ? `nächste Zahlung ${d(x.next)}` : '', `${Fmt.money(x.monthly)} / Monat`, x.alert ? 'amt-out' : ''));
    const moonRows = m.moons.filter((x) => x.hostId === a.id).map((x) => line(x.name, `${Math.round(x.progress * 100)} % erreicht`, Fmt.money(x.saved)));
    title = `Planet · ${a.name}`;
    body = `<ul class="list">${line('Kontostand', ACCOUNT_TYPES[a.type] || '', Fmt.money(a.balance))}${b.surface ? line('Planetentyp', 'nach Kontoart', esc(PLANET_LABEL[b.surface.type])) : ''}${line('Monatsende', 'voraussichtlich', Fmt.money(accountBalanceAt(a, monthBounds().to)))}</ul>
      <h4 class="sheet-h">Ring · Fixkosten</h4>${list(fixedRows, 'Keine Fixkosten von diesem Konto.')}${b.ring ? foot(`${Math.round(b.ring.share * 100)} % deiner Einnahmen`, `${Fmt.money(b.ring.monthly)} / Monat`) : ''}
      <h4 class="sheet-h">Satelliten · Abos</h4>${list(subRows, 'Keine Abos von diesem Konto.')}
      <h4 class="sheet-h">Monde · Sparziele</h4>${list(moonRows, 'Keine Sparziele auf diesem Konto.')}
      <h4 class="sheet-h">Atmosphäre · Prognose</h4><ul class="list">${line(UNI_ATMO_LABEL[b.atmosphere.state].replace(/^./, (c) => c.toUpperCase()), 'Kontostand zum Monatsende', Fmt.money(b.atmosphere.forecast), b.atmosphere.state === 'kritisch' || b.atmosphere.state === 'sinkt' ? 'amt-out' : 'amt-in')}</ul>
      <h4 class="sheet-h">Ausgabenmix${b.surface && b.surface.type === 3 ? ' · als Wolkenbänder des Gasriesen' : ''}</h4>${list(b.mix.map((x) => line(x.name, 'Anteil an den Ausgaben von diesem Konto', `${Math.round(x.pct * 100)} %`)), 'Keine Ausgaben in diesem Monat.')}`;
    tools = go('accounts', 'Zu den Konten');
  } else if (b.kind === 'moon') {
    const g = b.goal, f = goalForecast(g);
    title = `Mond · ${g.name}`;
    body = `<ul class="list">${line('Gespart', `von ${Fmt.money(g.target)}`, Fmt.money(g.saved))}${line('Fortschritt', 'als Mondphase', `${Math.round(b.progress * 100)} %`)}${line('Sparrate', 'im Monat', Fmt.money(g.monthlyRate || 0))}${line('Ziel erreicht', f.date ? 'voraussichtlich' : '', f.months === 0 ? 'erreicht' : f.date ? d(toISO(f.date)) : 'ohne Sparrate offen')}${line('Umkreist', 'Konto', esc(accountName(b.hostId)))}</ul>`;
    tools = go('goals', 'Zu den Sparzielen');
  } else if (b.kind === 'satellite') {
    const e = s.entries.find((x) => x.id === b.id);
    const st = e && contractStatus(e);
    title = `Satellit · ${b.name}`;
    body = `<p class="dialog-text">Satelliten sind deine Abos. Sie blinken, wenn eine Kündigungsfrist naht.</p><ul class="list">${line('Betrag', INTERVALS[b.interval], Fmt.money(b.amount))}${line('Im Monat', 'umgerechnet', Fmt.money(b.monthly))}${line('Im Jahr', 'umgerechnet', Fmt.money(round2(b.monthly * 12)))}${b.next ? line('Nächste Zahlung', '', d(b.next)) : ''}${line('Kündigung', st ? st.text : 'keine Laufzeit hinterlegt', st ? esc(st.badge || '') : '')}</ul>`;
    tools = `<button type="button" class="btn primary" data-action="uni-cancel" data-id="${esc(b.id)}">Kündigen</button>${go('contracts', 'Zu den Verträgen')}`;
  } else if (b.kind === 'wormhole') {
    const tr = b.source === 'transfer' ? (s.transfers || []).find((x) => x.id === b.id) : null;
    const g = b.source === 'goal' ? s.goals.find((x) => x.id === b.id) : null;
    const next = tr ? Finance.occurrences(tr, t, addDays(t, 400))[0] : null;
    title = `Wurmloch · ${b.label}`;
    body = `<p class="dialog-text">Ein Wurmloch verbindet zwei Konten, durch die regelmäßig Geld fließt.</p><ul class="list">${line('Von', '', esc(accountName(b.fromId)))}${line('Nach', '', esc(accountName(b.toId)))}${line('Betrag', tr ? INTERVALS[tr.interval] : 'Sparrate im Monat', Fmt.money(b.amount))}${next ? line('Nächster Termin', '', d(toISO(next))) : ''}${g ? line('Für das Sparziel', '', esc(g.name)) : ''}</ul>`;
    tools = go(g ? 'goals' : 'accounts', g ? 'Zu den Sparzielen' : 'Zu den Konten');
  } else if (b.kind === 'blackhole') {
    const rows = (s.debts || []).filter((x) => x.remaining > 0).map((x) => {
      const months = x.monthlyRate > 0 ? Math.ceil(x.remaining / x.monthlyRate) : null;
      return line(x.name, months ? `${Fmt.money(x.monthlyRate)} im Monat, getilgt etwa ${addMonths(t, months).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}` : 'ohne Tilgungsrate', Fmt.money(-x.remaining), 'amt-out');
    });
    title = 'Schwarzes Loch · Schulden';
    body = `<p class="dialog-text">Je mehr Schulden offen sind, desto größer das Schwarze Loch. Mit jeder Rate schrumpft es.</p>${list(rows, 'Keine Schulden.')}${foot('Offen insgesamt', Fmt.money(-b.total))}`;
    tools = go('wealth', 'Zum Vermögen');
  } else if (b.kind === 'nebula') {
    const from = parseISO(m.month.from), to = parseISO(m.month.to);
    const daysLeft = Math.max(1, Math.round((to - t) / 864e5) + 1);
    const rows = entriesIn(from, to).filter((e) => e.kind === 'expense' && e.category === b.category)
      .flatMap((e) => Finance.occurrences(e, from, to).map((dt) => ({ e, dt }))).sort((x, y) => y.e.amount - x.e.amount).slice(0, 8)
      .map(({ e, dt }) => line(e.name, dt.toLocaleDateString('de-DE'), Fmt.money(-e.amount), 'amt-out'));
    title = `Nebel · Budget ${b.name}`;
    body = `<p class="dialog-text">Nebel sind deine Budgets. Je voller das Budget, desto dichter der Nebel, ab 80 % färbt er sich rot.</p><ul class="list">${line('Budget', b.estimated ? 'ohne Übertrag' : 'inklusive Übertrag', Fmt.money(b.limit))}${line(b.estimated ? 'Erwartet' : 'Ausgegeben', b.estimated ? `${Math.round(b.ratio * 100)} %, nach deinem Drei-Monats-Schnitt` : `${Math.round(b.ratio * 100)} %`, Fmt.money(-b.spent), 'amt-out')}${line(b.over ? 'Überschritten' : 'Übrig', b.over ? '' : `noch ${daysLeft} Tage`, Fmt.money(round2(b.limit - b.spent)), b.over ? 'amt-out' : 'amt-in')}${!b.over ? line('Pro Tag', 'bis Monatsende', Fmt.money(round2((b.limit - b.spent) / daysLeft))) : ''}</ul><h4 class="sheet-h">Größte Ausgaben</h4>${list(rows, 'Noch keine Ausgaben in diesem Monat.')}`;
    tools = go('budgets', 'Zu den Budgets');
  } else if (b.kind === 'constellation') {
    const rows = milestones().map((x) => line(x.title, x.done ? `erreicht${x.date ? ` am ${d(x.date)}` : ''}` : x.sub, x.done ? '★' : `${Math.round(Math.min(1, Math.max(0, x.value / x.target)) * 100)} %`, x.id === b.id ? 'amt-in' : ''));
    title = `Sternbild · ${b.title}`;
    body = `<p class="dialog-text">Jeder erreichte Erfolg wird zu einem Sternbild am Himmel.</p>${list(rows, 'Noch keine Erfolge.')}`;
    tools = go('dashboard', 'Zum Dashboard');
  } else if (b.kind === 'comet' && b.comet === 'event') {
    const ev = (s.lifeEvents || []).find((x) => x.id === b.id) || {};
    const main = s.accounts.find((a) => a.id === mainAccountId());
    title = `Komet · ${b.name}`;
    body = `<p class="dialog-text">Kometen sind geplante Ereignisse. Je näher der Termin, desto näher der Komet an der Sonne.</p><ul class="list">${line('Geplant am', `in ${b.days} ${b.days === 1 ? 'Tag' : 'Tagen'}`, d(b.date))}${line('Kosten', '', Fmt.money(-b.amount), 'amt-out')}${main ? line(`${main.name} an dem Tag`, 'voraussichtlich', Fmt.money(accountBalanceAt(main, parseISO(b.date)))) : ''}</ul>${ev.note ? `<p class="dialog-text">${esc(ev.note)}</p>` : ''}`;
    tools = go('student', 'Zu den Lebensereignissen');
  } else if (b.kind === 'comet') {
    const ratio = b.average > 0 ? b.amount / b.average : null;
    title = 'Komet · Ausreißer';
    body = `<ul class="list">${line(b.name, `${catLabel(b.category)}, ${d(b.date)}`, Fmt.money(-b.amount), 'amt-out')}${line('Dein Schnitt', `${catLabel(b.category)} pro Monat`, Fmt.money(b.average || 0))}</ul><p class="dialog-text">${ratio ? `Diese eine Ausgabe entspricht ${Fmt.pct(ratio)} deines üblichen Monats in dieser Kategorie.` : 'In dieser Kategorie gab es bisher kaum Ausgaben.'}</p>`;
    tools = go('expenses', 'Zu den Ausgaben');
  }
  if (!title) return;
  const sheet = Universe.sheet = UI.modal({ title, body: `${body}<div class="head-tools" style="margin-top:14px">${tools}</div>`, sheet: true });
  // Sheets liegen außerhalb von #content: eigene Verteilung für ihre Knöpfe
  sheet.overlay.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn || !sheet.overlay.contains(btn) || !ACTIONS[btn.dataset.action]) return;
    safeCall(() => ACTIONS[btn.dataset.action](btn.dataset.id, btn), `Universum: ${btn.dataset.action}`);
  });
}

function planetInfo(account) {
  const t = today();
  const recent = Store.state.entries
    .filter((e) => (e.accountId || mainAccountId()) === account.id && e.interval === 'once' && e.date <= toISO(t))
    .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
  const next = accountFlows(addDays(t, 1), addDays(t, 45)).filter((f) => f.accountId === account.id).slice(0, 5);
  const moons = Store.state.goals.filter((g) => (g.toId || savingsAccountId()) === account.id);
  const line = (title, sub, amount) => `<li class="row"><span class="row-main"><span class="row-title">${esc(title)}</span><span class="row-sub">${esc(sub)}</span></span><span class="num ${amount >= 0 ? 'amt-in' : 'amt-out'}">${Fmt.money(amount, true)}</span></li>`;
  return `
    <h3>${esc(account.name)}</h3>
    <p class="meter-sub">${esc(ACCOUNT_TYPES[account.type] || '')}</p>
    <div class="universe-big num">${Fmt.money(account.balance)}</div>
    <p class="meter-sub">Monatsende voraussichtlich ${Fmt.money(accountBalanceAt(account, monthBounds().to))}</p>
    <h4>Letzte Buchungen</h4>
    <ul class="list">${recent.map((e) => line(e.name, parseISO(e.date).toLocaleDateString('de-DE'), e.kind === 'income' ? e.amount : -e.amount)).join('') || '<li class="empty">Keine Einzelbuchungen auf diesem Konto.</li>'}</ul>
    <h4>Nächste Bewegungen</h4>
    <ul class="list">${next.map((f) => line(f.label, f.date.toLocaleDateString('de-DE'), f.amount)).join('') || '<li class="empty">Nichts geplant.</li>'}</ul>
    <h4>Verbundene Sparziele</h4>
    <ul class="list">${moons.map((g) => `<li class="row"><span class="row-main"><span class="row-title">${esc(g.name)}</span><span class="row-sub">${Fmt.money(g.saved)} von ${Fmt.money(g.target)}</span></span></li>`).join('') || '<li class="empty">Keine Sparziele auf diesem Konto.</li>'}</ul>`;
}

function moonInfo(goal) {
  const f = goalForecast(goal);
  const sources = [];
  if (goal.monthlyRate > 0) sources.push(`${Fmt.money(goal.monthlyRate)} Sparrate von ${accountName(goal.fromId || mainAccountId())}`);
  for (const t of Store.state.transfers || []) if (t.active !== false && t.toId === (goal.toId || savingsAccountId())) sources.push(`${t.name}: ${Fmt.money(t.amount)} ${INTERVALS[t.interval].toLowerCase()}`);
  return `
    <h3>${esc(goal.name)}</h3>
    <p class="meter-sub">Sparziel auf ${esc(accountName(goal.toId || savingsAccountId()))}</p>
    <div class="universe-big num">${Fmt.pct(goal.target > 0 ? goal.saved / goal.target : 0)}</div>
    ${bar(goal.target > 0 ? goal.saved / goal.target : 0, f.left <= 0 ? 'ok' : 'saving', goal.name)}
    <ul class="list" style="margin-top:10px">
      <li class="row"><span class="row-main"><span class="row-title">Gespart</span></span><span class="num">${Fmt.money(goal.saved)} von ${Fmt.money(goal.target)}</span></li>
      <li class="row"><span class="row-main"><span class="row-title">Es fehlen</span></span><span class="num">${Fmt.money(f.left)}</span></li>
      <li class="row"><span class="row-main"><span class="row-title">Voraussichtlich erreicht</span></span><span class="num">${f.left <= 0 ? 'erreicht' : f.date ? f.date.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) : 'ohne Sparrate offen'}</span></li>
    </ul>
    <h4>Geldquellen</h4>
    <ul class="list">${sources.map((x) => `<li class="row"><span class="row-main"><span class="row-sub">${esc(x)}</span></span></li>`).join('') || '<li class="empty">Noch keine regelmäßige Quelle.</li>'}</ul>`;
}

function renderUniverse() {
  const s = Store.state;
  if (!s.accounts.length) {
    return `<section class="welcome"><h2>Dein Finanz-Universum</h2><p>Sobald du Konten anlegst, entsteht hier dein Sonnensystem: Konten als Planeten, Sparziele als Monde, dazu alle Geldströme.</p><div class="head-tools"><button type="button" class="btn primary" data-action="account-new">${icon('plus')}Erstes Konto anlegen</button></div></section>`;
  }
  const { from, to } = monthBounds();
  const flows = accountFlows(from, to);
  const inflow = round2(flows.filter((f) => f.kind === 'income').reduce((sum, f) => sum + f.amount, 0));
  const outflow = round2(flows.filter((f) => f.kind === 'expense').reduce((sum, f) => sum - f.amount, 0));
  return `
    <div class="kpis">
      ${kpi('orbit', 'brand', 'Planeten', String(s.accounts.length), 'deine Konten')}
      ${kpi('target', 'saving', 'Monde', String(s.goals.length), 'deine Sparziele')}
      ${kpi('in', 'income', 'Zuflüsse im Monat', Fmt.money(inflow), 'leuchtende Ströme')}
      ${kpi('out', 'expense', 'Abflüsse im Monat', Fmt.money(outflow), 'rote Spuren ins All')}
    </div>
    <div class="universe-wrap">
      <div class="universe-stage">
        <canvas id="universeCanvas" aria-label="Interaktive Darstellung deiner Konten, Sparziele und Geldströme. Pfeiltasten verschieben, Plus und Minus zoomen, N und P wählen Himmelskörper, Enter zeigt Details, Fragezeichen zeigt alle Tastenkürzel. Die Textansicht unter der Grafik enthält alle Inhalte." role="img"></canvas>
        <canvas id="universeHud" class="universe-hud" aria-hidden="true"></canvas>
        <div class="universe-time no-print" role="group" aria-label="Zeitreise">
          <button type="button" class="uni-btn" id="uniPlay" data-action="uni-play" aria-label="Zeitreise abspielen">${icon('play')}</button>
          <input type="range" id="uniTime" min="-12" max="60" step="1" value="0" aria-label="Zeitreise in Monaten" aria-valuetext="Heute">
          <span class="uni-time-label" id="uniTimeLabel"><b>Heute</b></span>
          <button type="button" class="uni-btn uni-now" data-action="uni-now">Heute</button>
        </div>
        <button type="button" class="universe-badge" id="universeBadge" data-action="uni-dev" aria-label="Entwickleranzeige umschalten"></button>
        <div class="universe-dev" id="universeDev" hidden></div>
        <p class="uni-live" id="universeLive" aria-live="polite"></p>
        <canvas id="universeMini" class="universe-mini" hidden aria-label="Minikarte: tippen, um dorthin zu springen"></canvas>
        <div class="universe-cam no-print">
          <button type="button" class="uni-btn" data-action="uni-search" aria-label="Im Universum suchen">${icon('search')}</button>
          <button type="button" class="uni-btn" data-action="uni-poster" aria-label="Poster speichern">${icon('image')}</button>
          <button type="button" class="uni-btn" data-action="uni-cam" data-id="in" aria-label="Heranzoomen">+</button>
          <button type="button" class="uni-btn" data-action="uni-cam" data-id="out" aria-label="Herauszoomen">−</button>
          <button type="button" class="uni-btn" data-action="uni-cam" data-id="home" aria-label="Übersicht">${icon('orbit')}</button>
          <button type="button" class="uni-btn uni-3d" data-action="uni-cam" data-id="view" aria-label="Blickwinkel wechseln: schräg, steil, Draufsicht, flach">3D</button>
        </div>
        <div class="universe-legend">
          <span><i style="background:#FFC45A"></i>Einnahmequelle</span>
          <span><i style="background:#3FBF86"></i>Zufluss</span>
          <span><i style="background:#EE6F6A"></i>Abfluss</span>
          <span><i style="background:#6D95F2"></i>Überweisung</span>
        </div>
      </div>
      <aside class="universe-info" id="universeInfo">${universeHint()}</aside>
    </div>
    <div class="universe-tools no-print">

/* ---------- 7t. App-Sperre: PIN und verschlüsselte Speicherung ----------
   Schlüssel = PBKDF2 (SHA-256, 250.000 Runden) aus PIN und Zufallssalz,
   Verschlüsselung = AES-GCM mit 256 Bit. Der Schlüssel liegt nur im
   Arbeitsspeicher und wird beim Sperren verworfen.                        */
const LOCK_FAILS_KEY = 'fp.lock.fails';
const AUTOLOCK_OPTIONS = { '0': 'Sofort beim Verlassen der App', '1': 'Nach 1 Minute ohne Bedienung', '5': 'Nach 5 Minuten ohne Bedienung', '15': 'Nach 15 Minuten ohne Bedienung', '-1': 'Nur manuell' };

const Vault = {
  enabled: false, locked: false, key: null, salt: null, iterations: 250000, autoLock: 5,
  lastActive: Date.now(), hiddenAt: 0,

  available() { return !!(window.crypto && window.crypto.subtle) && window.isSecureContext !== false; },
  isEnvelope(text) { return typeof text === 'string' && text.startsWith('{"format":"fp-locked"'); },

  async derive(pin, salt, iterations) {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },

  async encryptWith(key, salt, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return JSON.stringify({ format: 'fp-locked', v: 1, iterations: this.iterations, autoLock: this.autoLock,
      salt: bytesToBase64(salt), iv: bytesToBase64(iv), data: bytesToBase64(new Uint8Array(cipher)) });
  },
  encrypt(text) { return this.encryptWith(this.key, this.salt, text); },

  async decryptWith(key, envelopeText) {
    const env = JSON.parse(envelopeText);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBytes(env.iv) }, key, base64ToBytes(env.data));
    return new TextDecoder().decode(plain);
  },

  /** Entsperren: Schlüssel ableiten und testweise entschlüsseln – falsche PIN wirft einen Fehler. */
  async unlock(pin, envelopeText) {
    const env = JSON.parse(envelopeText);
    const salt = base64ToBytes(env.salt);
    const key = await this.derive(pin, salt, env.iterations || 250000);
    const text = await this.decryptWith(key, envelopeText);
    Object.assign(this, { key, salt, iterations: env.iterations || 250000, autoLock: env.autoLock ?? 5, enabled: true, locked: false });
    return text;
  },

  /** PIN gegen den gespeicherten Stand prüfen, ohne etwas zu verändern. */
  async verify(pin) {
    const raw = Disk.get(STORAGE_KEY);
    const env = JSON.parse(raw);
    const key = await this.derive(pin, base64ToBytes(env.salt), env.iterations || 250000);
    await this.decryptWith(key, raw);
    return true;
  }
};

/** Sicherungen beim Ein- und Ausschalten der Sperre um- bzw. entschlüsseln. */
async function recodeRestorePoints(oldKey, newKey, newSalt) {
  const list = readRestorePoints();
  const next = [];
  for (const point of list) {
    try {
      const plain = Vault.isEnvelope(point.data) ? (oldKey ? await Vault.decryptWith(oldKey, point.data) : null) : point.data;
      if (plain === null) continue; // ohne passenden Schlüssel nicht lesbar – verwerfen
      next.push({ ...point, data: newKey ? await Vault.encryptWith(newKey, newSalt, plain) : plain });
    } catch (e) { /* beschädigte Sicherung auslassen */ }
  }
  await Disk.put(RESTORE_KEY, JSON.stringify(next)).catch(() => trimRestorePoints(2));
}

async function enableLock(pin, autoLock) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await Vault.derive(pin, salt, 250000);
  Object.assign(Vault, { key, salt, iterations: 250000, autoLock, enabled: true, locked: false });
  await recodeRestorePoints(null, key, salt);
  await Store.flushNow();
}

async function changePin(newPin) {
  const oldKey = Vault.key;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await Vault.derive(newPin, salt, Vault.iterations);
  await recodeRestorePoints(oldKey, key, salt);
  Object.assign(Vault, { key, salt });
  await Store.flushNow();
}

async function disableLock() {
  const oldKey = Vault.key;
  Object.assign(Vault, { enabled: false, locked: false, key: null, salt: null });
  await recodeRestorePoints(oldKey, null, null);
  await Store.flushNow();
}

/** Sperren: speichern, Daten und Schlüssel aus dem Speicher entfernen, PIN abfragen. */
async function lockNow() {
  if (!Vault.enabled || Vault.locked) return;
  await Store.flushNow();
  Vault.locked = true;
  Vault.key = null;
  Store.state = null;
  Store.undoStack = [];
  Store.redoStack = [];
  Memo.map.clear();
  document.querySelectorAll('.overlay').forEach((o) => o.remove());
  Recap.close(true);
  Universe.stop();
  $('#content').innerHTML = '';
  LockScreen.show();
}

const readFails = () => { try { return JSON.parse(localStorage.getItem(LOCK_FAILS_KEY) || '{"count":0,"until":0}'); } catch (e) { return { count: 0, until: 0 }; } };
const writeFails = (f) => { try { localStorage.setItem(LOCK_FAILS_KEY, JSON.stringify(f)); } catch (e) { /* ohne Speicher keine Sperrzeit */ } };

const LockScreen = {
  show(message) {
    let el = $('#lockScreen');
    if (!el) {
      el = document.createElement('div');
      el.id = 'lockScreen';
      el.className = 'lock-screen';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      el.setAttribute('aria-labelledby', 'lockTitle');
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
      el.innerHTML = `
        <div class="lock-card" id="lockCard">
          <span class="brand-mark" aria-hidden="true">€</span>
          <h2 id="lockTitle">Finanzplaner ist gesperrt</h2>
          <p class="lock-msg" id="lockMsg" aria-live="polite"></p>
          <form id="lockForm"><input id="lockPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN"></form>
          <div class="pinpad">${keys.map((k) => `<button type="button" data-pin="${k}" aria-label="${k === 'del' ? 'Letzte Ziffer löschen' : k === 'ok' ? 'Entsperren' : k}">${k === 'del' ? '⌫' : k === 'ok' ? 'OK' : k}</button>`).join('')}</div>
          <button type="button" class="lock-link" data-pin="forgot">PIN vergessen?</button>
          <div class="lock-forgot" id="lockForgot" hidden>
            <p>Ohne PIN lassen sich die verschlüsselten Daten nicht öffnen – auch nicht von mir. Du kannst alles löschen und neu starten und danach einen Export oder ein Backup einlesen.</p>
            <button type="button" class="btn danger" data-pin="wipe">Alles löschen und neu starten</button>
          </div>
        </div>`;
      document.body.append(el);
      const input = $('#lockPin');
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-pin]');
        if (!b) return;
        const k = b.dataset.pin;
        if (/^\d$/.test(k)) { if (input.value.length < 12) input.value += k; }
        else if (k === 'del') input.value = input.value.slice(0, -1);
        else if (k === 'ok') this.submit(input.value);
        else if (k === 'forgot') $('#lockForgot').hidden = !$('#lockForgot').hidden;
        else if (k === 'wipe') this.wipe(b);
        if (k !== 'forgot' && k !== 'wipe') input.focus();
      });
      $('#lockForm').addEventListener('submit', (e) => { e.preventDefault(); this.submit(input.value); });
    }
    document.querySelector('.app').inert = true;
    $('#fab').inert = true;
    $('#lockMsg').textContent = message || 'Gib deine PIN ein.';
    $('#lockPin').value = '';
    setTimeout(() => { const i = $('#lockPin'); if (i) i.focus(); }, 60);
  },

  hide() {
    const el = $('#lockScreen');
    if (el) el.remove();
    document.querySelector('.app').inert = false;
    $('#fab').inert = false;
  },

  async submit(pin) {
    const fails = readFails();
    if (fails.until > Date.now()) {
      $('#lockMsg').textContent = `Zu viele Fehlversuche. Bitte warte noch ${Math.ceil((fails.until - Date.now()) / 1000)} Sekunden.`;
      return;
    }
    if (!pin) return;
    $('#lockMsg').textContent = 'Entsperre …';
    try {
      const text = await Vault.unlock(pin, Disk.get(STORAGE_KEY));
      const result = repairState(Store.migrate(JSON.parse(text)));
      Store.state = result.state;
      Store.revision++;
      Store.undoStack = [];
      Store.redoStack = [];
      writeFails({ count: 0, until: 0 });
      this.hide();
      Vault.lastActive = Date.now();
      App.afterUnlock();
    } catch (e) {
      const f = readFails();
      f.count += 1;
      if (f.count >= 5) f.until = Date.now() + (f.count >= 10 ? 300000 : 30000);
      writeFails(f);
      $('#lockMsg').textContent = f.until > Date.now() ? 'Falsche PIN. Aus Sicherheitsgründen kurz gesperrt.' : `Falsche PIN. Noch ${Math.max(0, 5 - f.count)} Versuche bis zur Wartezeit.`;
      $('#lockPin').value = '';
      const card = $('#lockCard');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  },

  wipe(button) {
    if (!button.dataset.armed) {
      button.dataset.armed = '1';
      button.textContent = 'Wirklich alles endgültig löschen?';
      return;
    }
    Disk.remove(STORAGE_KEY); Disk.remove(RESTORE_KEY);
    try { localStorage.removeItem(LOCK_FAILS_KEY); } catch (e) { /* weiter */ }
    Object.assign(Vault, { enabled: false, locked: false, key: null, salt: null });
    Store.state = createEmptyState();
    Store.save();
    this.hide();
    App.afterUnlock();
    UI.toast('Alles gelöscht. Du startest neu.');
  }
};

/** Automatisches Sperren nach Inaktivität oder beim Verlassen der App. */
function initAutoLock() {
  const touch = () => { Vault.lastActive = Date.now(); };
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((type) => document.addEventListener(type, touch, { passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Store.flushNow();
      Vault.hiddenAt = Date.now();
      if (Vault.enabled && !Vault.locked && Vault.autoLock === 0) lockNow();
    } else if (Vault.enabled && !Vault.locked && Vault.autoLock > 0 && Vault.hiddenAt && Date.now() - Vault.hiddenAt > Vault.autoLock * 60000) {
      lockNow();
    }
  });
  setInterval(() => {
    if (Vault.enabled && !Vault.locked && Vault.autoLock > 0 && Date.now() - Vault.lastActive > Vault.autoLock * 60000) lockNow();
  }, 15000);
}
