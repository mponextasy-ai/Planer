/** Bewertet Sparquote, Budgettreue, Notgroschen und Vermögensentwicklung. */
function financeScore() {
  const k = Finance.summary();
  const budgets = Finance.budgetStatus();
  const monthly = averageMonthlyExpenses();
  const emergency = Store.state.goals.find((g) => /notgroschen|rücklage|reserve/i.test(g.name));
  const reserve = emergency ? emergency.saved : Store.state.accounts.filter((a) => a.type === 'tagesgeld' || a.type === 'bargeld').reduce((sum, a) => sum + a.balance, 0);
  const history = netWorthHistory(6);
  const growth = Math.abs(history[0].value) > 0 ? (history[history.length - 1].value - history[0].value) / Math.abs(history[0].value) : 0;

  const savedRatio = Math.max(0, Math.min(1, k.savingsRate / (savingsTarget() || 0.2)));
  const keptCount = budgets.filter((b) => b.ratio <= 1).length;
  const keptRatio = budgets.length ? keptCount / budgets.length : 0.6;
  const reserveRatio = monthly > 0 ? Math.max(0, Math.min(1, reserve / (monthly * reserveMonths()))) : 0;
  const growthRatio = Math.max(0, Math.min(1, growth / 0.2));

  const parts = [
    { label: 'Sparquote', value: Math.round(savedRatio * 30), max: 30, note: `${Fmt.pct(k.savingsRate)} erreicht, Ziel sind ${Math.round(savingsTarget() * 100)} %` },
    { label: 'Budgettreue', value: Math.round(keptRatio * 25), max: 25, note: budgets.length ? `${keptCount} von ${budgets.length} Budgets eingehalten` : 'noch keine Budgets gesetzt' },
    { label: 'Notgroschen', value: Math.round(reserveRatio * 25), max: 25, note: `${Fmt.money(round2(reserve))} von ${Fmt.money(round2(monthly * reserveMonths()))}` },
    { label: 'Vermögensentwicklung', value: Math.round(growthRatio * 20), max: 20, note: `${growth >= 0 ? '+' : ''}${Fmt.pct(growth)} in sechs Monaten` }
  ];
  const total = parts.reduce((sum, p) => sum + p.value, 0);
  return { total, parts, grade: total >= 80 ? 'stark' : total >= 60 ? 'solide' : total >= 40 ? 'ausbaufähig' : 'kritisch' };
}

/** Fortschrittsring für den Score. */
function scoreRing(size, value) {
  const stroke = 10, r = size / 2 - stroke / 2, circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - Math.max(0, Math.min(100, value)) / 100);
  const color = value >= 80 ? 'var(--income)' : value >= 60 ? 'var(--brand)' : value >= 40 ? 'var(--warn)' : 'var(--expense)';
  return `
    <svg class="chart ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Finanz-Score ${value} von 100">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
      <circle class="ring-value" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      ${svgText(size / 2, size / 2 + 8, String(value), 'val')}
    </svg>`;
}

/** Lokale Monatsanalyse – Hinweise ganz ohne Internet. */
function coachTips() {
  const k = Finance.summary();
  const now = monthBounds(), before = monthBounds(-1);
  const tips = [];

  const categories = [...new Set(Store.state.entries.filter((e) => e.kind === 'expense').map((e) => e.category))];
  const diffs = categories.map((c) => ({
    c,
    now: Finance.sum('expense', now.from, now.to, (e) => e.category === c),
    before: Finance.sum('expense', before.from, before.to, (e) => e.category === c)
  }));
  const up = diffs.filter((d) => d.now - d.before > 15).sort((a, b) => (b.now - b.before) - (a.now - a.before))[0];
  if (up) tips.push(['warn', `${catLabel(up.c)}: ${Fmt.money(round2(up.now - up.before))} mehr als im letzten Monat.`]);
  const down = diffs.filter((d) => d.before - d.now > 15).sort((a, b) => (b.before - b.now) - (a.before - a.now))[0];
  if (down) tips.push(['ok', `${catLabel(down.c)}: ${Fmt.money(round2(down.before - down.now))} weniger als im letzten Monat.`]);

  const goal = Store.state.goals.find((g) => g.saved < g.target && g.monthlyRate > 0);
  if (goal) {
    const left = goal.target - goal.saved;
    const nowMonths = Math.ceil(left / goal.monthlyRate);
    const fasterMonths = Math.ceil(left / (goal.monthlyRate + 20));
    if (nowMonths - fasterMonths >= 1) {
      tips.push(['info', `Erhöhe die Sparrate für ${goal.name} um 20 €, dann bist du ${nowMonths - fasterMonths} ${nowMonths - fasterMonths === 1 ? 'Monat' : 'Monate'} früher am Ziel.`]);
    }
  }

  tips.push([k.fixedRatio > 0.6 ? 'warn' : 'info', `Fixkosten liegen bei ${Fmt.pct(k.fixedRatio)} deiner Einnahmen.`]);

  const subs = Store.state.entries.filter((e) => isSubscription(e) && isCurrent(e));
  if (subs.length) {
    const perMonth = round2(subs.reduce((sum, e) => sum + monthlyAmount(e), 0));
    tips.push(['info', `${subs.length} Abos kosten dich ${Fmt.money(perMonth)} im Monat, also ${Fmt.money(round2(perMonth * 12))} im Jahr.`]);
  }
  if (k.rest > 50) tips.push(['ok', `Dir bleiben diesen Monat ${Fmt.money(k.rest)} frei. Davon ließe sich ein Teil direkt aufs Sparziel schieben.`]);
  return tips.slice(0, 5);
}

/* Monats-Challenges */
function challengeProgress(ch) {
  const { from, to } = monthBounds();
  if (ch.type === 'save') {
    const k = Finance.summary();
    const value = round2(Math.max(0, k.income - k.expenses));
    return { ratio: ch.target > 0 ? Math.min(1, value / ch.target) : 0, done: value >= ch.target, text: `${Fmt.money(value)} von ${Fmt.money(ch.target)} Überschuss` };
  }
  const spent = Finance.sum('expense', from, to, (e) => e.category === ch.category);
  if (ch.type === 'avoid') return { ratio: spent > 0 ? 1 : 0, done: spent === 0, text: spent === 0 ? 'Bisher nichts ausgegeben' : `${Fmt.money(spent)} ausgegeben` };
  return { ratio: ch.target > 0 ? Math.min(1, spent / ch.target) : 0, done: spent <= ch.target, text: `${Fmt.money(spent)} von ${Fmt.money(ch.target)}` };
}

/* ---------- 7l. Berichte ---------- */
let reportMode = 'month';   // 'month', 'year', 'tax', 'tags' (E7) oder 'prices' (E8)
let reportOffset = 0;       // 0 = aktueller Monat bzw. aktuelles Jahr

/** Zahlen eines Monats für den Bericht. */
function monthReport(offset) {
  const { from, to } = monthBounds(offset);
  const income = Finance.sum('income', from, to);
  const expenses = Finance.sum('expense', from, to);
  const fixed = Finance.sum('expense', from, to, (e) => e.interval !== 'once');
  const categories = new Map();
  const perDay = new Map();
  for (const f of Finance.flows(from, to)) {
    if (f.amount >= 0) continue;
    categories.set(f.entry.category, round2((categories.get(f.entry.category) || 0) - f.amount));
    const key = toISO(f.date);
    perDay.set(key, round2((perDay.get(key) || 0) - f.amount));
  }
  const sorted = [...categories.entries()].sort((a, b) => b[1] - a[1]);
  const single = groupSplits(entriesIn(from, to)
    .filter((e) => e.kind === 'expense' && e.interval === 'once'))
    .sort((a, b) => b.amount - a.amount).slice(0, 6);
  const days = [];
  for (let d = new Date(from); d <= to; d = addDays(d, 1)) days.push({ label: String(d.getDate()), value: perDay.get(toISO(d)) || 0 });
  return { from, to, income, expenses, fixed, variable: round2(expenses - fixed), saldo: round2(income - expenses),
    rate: income > 0 ? (income - expenses) / income : 0, categories: sorted, single, days,
    label: periodLabel({ from, to }) };
}

/** Zahlen eines Kalenderjahres für den Bericht. */
function yearReport(offset) {
  const year = today().getFullYear() + offset;
  const months = [];
  for (let m = 0; m < 12; m++) {
    const from = new Date(year, m, 1), to = new Date(year, m + 1, 0);
    months.push({ from, to, income: Finance.sum('income', from, to), expense: Finance.sum('expense', from, to) });
  }
  const income = round2(months.reduce((sum, m) => sum + m.income, 0));
  const expenses = round2(months.reduce((sum, m) => sum + m.expense, 0));
  const categories = new Map();
  const from = new Date(year, 0, 1), to = new Date(year, 11, 31);
  for (const e of entriesIn(from, to)) {
    if (e.kind !== 'expense') continue;
    const count = Finance.occurrences(e, from, to).length;
    if (count) categories.set(e.category, round2((categories.get(e.category) || 0) + count * e.amount));
  }
  const best = months.slice().sort((a, b) => (b.income - b.expense) - (a.income - a.expense))[0];
  const worst = months.slice().sort((a, b) => (a.income - a.expense) - (b.income - b.expense))[0];
  return { year, months, income, expenses, saldo: round2(income - expenses),
    rate: income > 0 ? (income - expenses) / income : 0,
    categories: [...categories.entries()].sort((a, b) => b[1] - a[1]), best, worst, label: String(year) };
}

function categoryList(entries, total) {
  return entries.slice(0, 8).map(([cat, value]) => `
    <li class="meter">
      <div class="meter-top"><strong>${esc(catLabel(cat))}</strong><span class="num">${Fmt.money(value)}</span></div>
      ${bar(total > 0 ? value / total : 0, 'expense', catLabel(cat))}
      <div class="meter-sub">${total > 0 ? Fmt.pct(value / total) + ' der Ausgaben' : ''}</div>
    </li>`).join('') || '<li class="empty">Keine Ausgaben in diesem Zeitraum.</li>';
}

/** Ungewöhnliche Ausgaben aus den eigenen Daten erkennen. */
function anomalies() {
  const s = Store.state;
  const { from, to } = monthBounds();
  const out = [];
  const categories = [...new Set(s.entries.filter((e) => e.kind === 'expense').map((e) => e.category))];
  for (const c of categories) {
    const now = Finance.sum('expense', from, to, (e) => e.category === c);
    const avg = averageSpending(c, 3);
    if (avg > 10 && now > avg * 1.3 && now - avg > 20) {
      out.push({ level: now > avg * 1.6 ? 'bad' : 'warn',
        text: `${catLabel(c)}: ${Fmt.money(now)} in diesem Monat, ${Fmt.pct((now - avg) / avg)} über deinem Schnitt von ${Fmt.money(avg)}.` });
    }
  }
  const byCategory = new Map();
  for (const e of s.entries) {
    if (e.kind !== 'expense' || e.interval !== 'once') continue;
    if (!byCategory.has(e.category)) byCategory.set(e.category, []);
    byCategory.get(e.category).push(e);
  }
  const since = toISO(addDays(today(), -30));
  for (const [c, list] of byCategory) {
    if (list.length < 5) continue;
    const amounts = list.map((e) => e.amount).sort((a, b) => a - b);
    const median = amounts[Math.floor(amounts.length / 2)];
    for (const e of list) {
      if (e.date >= since && e.amount > median * 2.5 && e.amount > 25) {
        out.push({ level: 'warn', text: `${e.name} am ${parseISO(e.date).toLocaleDateString('de-DE')}: ${Fmt.money(e.amount)} – üblich sind bei ${catLabel(c)} etwa ${Fmt.money(median)}.` });
      }
    }
  }
  return out.slice(0, 6);
}

/** Gewohnheiten aus einem halben Jahr Verlauf. */
function habits() {
  const s = Store.state;
  const since = addDays(today(), -182);
  const list = groupSplits(s.entries.filter((e) => e.kind === 'expense' && e.interval === 'once' && parseISO(e.date) >= since)); // ein Kauf, auch wenn aufgeteilt
  const weeks = 26;
  const sums = [0, 0, 0, 0, 0, 0, 0], counts = [0, 0, 0, 0, 0, 0, 0];
  for (const e of list) {
    const day = (parseISO(e.date).getDay() + 6) % 7;
    sums[day] += e.amount;
    counts[day]++;
  }
  const names = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  const full = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  const weekdays = names.map((label, i) => ({ label, value: round2(sums[i] / weeks) }));
  const sorted = weekdays.map((w, i) => ({ ...w, i })).sort((a, b) => b.value - a.value);
  const byName = new Map();
  for (const e of list) {
    const key = e.name.trim();
    const item = byName.get(key) || { count: 0, sum: 0 };
    item.count++; item.sum = round2(item.sum + e.amount);
    byName.set(key, item);
  }
  const frequent = [...byName.entries()].filter(([, v]) => v.count >= 3).sort((a, b) => b[1].count - a[1].count).slice(0, 5);
  const small = list.filter((e) => e.amount <= 15);
  let recent = 0, earlier = 0;
  for (let i = 0; i <= 2; i++) { const r = monthBounds(-i); recent += Finance.sum('expense', r.from, r.to); }
  for (let i = 3; i <= 5; i++) { const r = monthBounds(-i); earlier += Finance.sum('expense', r.from, r.to); }
  const trend = earlier > 0 ? (recent - earlier) / earlier : 0;
  return { weekdays, expensive: sorted[0], cheapest: sorted[sorted.length - 1], full, frequent, small,
    smallSum: round2(small.reduce((sum, e) => sum + e.amount, 0)), trend, count: list.length };
}

/* ---------- 7l. Jahresrückblick als Geschichte (Etappe E11) ----------
   Die Zahlen eines Kalenderjahres (das laufende bis heute) als Folge von Karten im
   Universum-Stil: Sonne = Einnahmen, Komet = größte Ausgabe, Satelliten = Abos,
   Monde = Sparziele, Planeten = Konten und Vermögen, Sternbilder = Erfolge. Es erscheinen
   nur Karten mit genug Daten. Rechts tippen = weiter, links = zurück, halten = anhalten,
   nach unten wischen = schließen. Die letzte Karte speichert oder teilt ein Bild
   (1080 × 1920, Hochformat wie ein Status) – auf Wunsch ohne Beträge.                  */
const RECAP_SEEN_KEY = 'fp.recap.seen';
const RECAP_MS = 8000;   // Anzeigedauer je Karte beim Abspielen
const RECAP_COLORS = ['#5FD6D2', '#8FA8FF', '#F28B82', '#F5BE85', '#6EE7A8', '#C3A6FF', '#F49AC1', '#A7B8CC'];
const RECAP_DAYS = ['montags', 'dienstags', 'mittwochs', 'donnerstags', 'freitags', 'samstags', 'sonntags'];
const RECAP_SUN = '#FFC45A', RECAP_OUT = '#F28B82', RECAP_IN = '#6EE7A8';
const fmtInt = (n) => new Intl.NumberFormat('de-DE').format(Math.round(n));
const fmtPctSigned = (v) => new Intl.NumberFormat('de-DE', { style: 'percent', maximumFractionDigits: 1, signDisplay: 'exceptZero' }).format(v);
const fmtPoints = (v) => new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 }).format(v * 100);

/** Nettovermögen an einem Stichtag aus dem Kontoverlauf (Schulden mit heutigem Stand, wie der Vermögensverlauf). */
function recapWorthAt(iso) { // eigener Name: netWorthAt ist die Vermögensprognose
  const debts = Store.state.debts.reduce((sum, d) => sum + d.remaining, 0);
  let assets = 0;
  for (const a of Store.state.accounts) {
    const past = (a.history || []).filter((h) => h.date <= iso);
    assets += past.length ? past[past.length - 1].balance : a.history && a.history.length ? a.history[0].balance : a.balance;
  }
  return round2(assets - debts);
}

/** Alle Zahlen für den Rückblick eines Kalenderjahres. count = 0 heißt: nichts erfasst. */
function yearRecap(year) {
  return Memo.get('recap' + year, () => {
    const s = Store.state, t = today(), now = t.getFullYear();
    const partial = year === now;
    const from = new Date(year, 0, 1), to = partial ? t : new Date(year, 11, 31);
    const empty = { year, partial, from, to, count: 0, categories: [], sources: [], months: [], stars: [], subs: { count: 0 }, goals: { list: [] } };
    if (year > now) return empty;
    const flows = Finance.flows(from, to);
    const inRange = entriesIn(from, to);
    const onceExp = groupSplits(inRange.filter((e) => e.kind === 'expense' && e.interval === 'once')); // eine Aufteilung = ein Kauf
    const count = flows.filter((f) => f.entry.interval !== 'once').length + onceExp.length
      + inRange.filter((e) => e.kind === 'income' && e.interval === 'once').length;
    if (!count) return empty;

    const income = Finance.sum('income', from, to), expenses = Finance.sum('expense', from, to);
    const fixed = Finance.sum('expense', from, to, (e) => e.interval !== 'once');
    const saldo = round2(income - expenses);

    // Monate: das laufende zählt bis heute; „bester“ und „ruhigster“ Monat nur aus abgeschlossenen
    const last = partial ? t.getMonth() : 11, months = [];
    for (let m = 0; m <= last; m++) {
      const a = new Date(year, m, 1), b = partial && m === last ? t : new Date(year, m + 1, 0);
      const inc = Finance.sum('income', a, b), exp = Finance.sum('expense', a, b);
      months.push({ m, short: a.toLocaleDateString('de-DE', { month: 'short' }).replace('.', '').slice(0, 3), name: a.toLocaleDateString('de-DE', { month: 'long' }),
        income: inc, expense: exp, saldo: round2(inc - exp), complete: !(partial && m === last), active: inc > 0 || exp > 0 });
    }
    const active = months.filter((x) => x.active);
    const closed = active.filter((x) => x.complete);
    const best = closed.length >= 2 ? closed.reduce((a, b) => (b.saldo > a.saldo ? b : a)) : null;
    const calm = closed.length >= 2 ? closed.reduce((a, b) => (b.expense < a.expense ? b : a)) : null;
    const firstActive = active.length ? active[0] : months[0];
    const lastActive = active.length ? active[active.length - 1] : months[months.length - 1];
    const range = partial ? `${firstActive.name} bis ${t.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' })}`
      : firstActive === lastActive ? firstActive.name : `${firstActive.name} bis ${lastActive.name}`;

    // Wohin das Geld floss, woher es kam
    const cats = new Map(), src = new Map();
    for (const f of flows) {
      if (f.amount < 0) cats.set(f.entry.category, round2((cats.get(f.entry.category) || 0) - f.amount));
      else { const k = String(f.entry.name || '').trim() || catLabel(f.entry.category); src.set(k, round2((src.get(k) || 0) + f.amount)); }
    }
    const categories = [...cats.entries()].sort((a, b) => b[1] - a[1])
      .map(([id, sum], i) => ({ id, label: catLabel(id), sum, share: expenses > 0 ? sum / expenses : 0, color: categoryColor(id) || RECAP_COLORS[i % RECAP_COLORS.length] }));
    const sources = [...src.entries()].sort((a, b) => b[1] - a[1]).map(([name, sum]) => ({ name, sum, share: income > 0 ? sum / income : 0 }));

    // Größte Einzelausgabe und Stammposten
    const big = onceExp.slice().sort((a, b) => b.amount - a.amount)[0];
    const biggest = big ? { name: String(big.name || '').trim() || catLabel(big.category), amount: big.amount, date: parseISO(big.date),
      category: big.parts ? [...new Set(big.parts.map((x) => catLabel(x.category)))].join(' + ') : catLabel(big.category) } : null;
    const byName = new Map();
    for (const e of onceExp) {
      const k = String(e.name || '').trim();
      if (!k) continue;
      const it = byName.get(k) || { name: k, count: 0, sum: 0 };
      it.count++; it.sum = round2(it.sum + e.amount);
      byName.set(k, it);
    }
    const frequent = [...byName.values()].filter((x) => x.count >= 3).sort((a, b) => b.count - a.count || b.sum - a.sum)[0] || null;

    // Gewohnheiten: Tage ohne Einzelausgabe (erst ab der ersten erfassten Einzelausgabe überhaupt)
    let habits = null;
    if (onceExp.length >= 20) {
      const firstOnce = s.entries.filter((e) => e.kind === 'expense' && e.interval === 'once').reduce((d, e) => (e.date < d ? e.date : d), '9999');
      const spent = new Set(onceExp.map((e) => e.date)), endIso = toISO(to), days = [];
      for (let d = new Date(year, 0, 1); d.getFullYear() === year; d = addDays(d, 1)) {
        const iso = toISO(d);
        days.push(iso > endIso ? 3 : iso < firstOnce ? 0 : spent.has(iso) ? 1 : 2); // 0 nicht erfasst, 1 Ausgabe, 2 nichts ausgegeben, 3 kommt noch
      }
      const tracked = days.filter((x) => x === 1 || x === 2).length, free = days.filter((x) => x === 2).length;
      const wd = [0, 0, 0, 0, 0, 0, 0];
      for (const e of onceExp) wd[(parseISO(e.date).getDay() + 6) % 7] += e.amount;
      if (tracked >= 28) habits = { days, tracked, free, topDay: wd.indexOf(Math.max(...wd)), frequent };
    }

    // Satelliten: Abos mit Buchungen im Jahr, teurer gewordene (Nachfolger mit höherem Preis aus E3)
    const byId = new Map(s.entries.map((e) => [e.id, e]));
    let subCost = 0;
    const subNames = new Set(), raises = new Set();
    for (const e of inRange) {
      if (!isSubscription(e)) continue;
      const n = Finance.occurrences(e, from, to).length;
      if (!n) continue;
      subCost += n * e.amount;
      subNames.add(String(e.name || '').trim().toLowerCase());
      const prev = e.replaces && byId.get(e.replaces);
      if (prev && e.date >= toISO(from) && e.date <= toISO(to) && prev.amount < e.amount) raises.add(String(e.name || '').trim());
    }
    const subs = { count: subNames.size, cost: round2(subCost), monthly: round2(subCost / Math.max(1, active.length)), raises: [...raises] };

    // Monde: Sparziele (Stand heute) und was Regeln in diesem Jahr eingezahlt haben
    const goalList = s.goals.filter((g) => g.target > 0);
    const goalSaved = round2(goalList.reduce((sum, g) => sum + g.saved, 0)), goalTarget = round2(goalList.reduce((sum, g) => sum + g.target, 0));
    let roundUp = 0;
    for (const r of s.rules || []) {
      if (r.type !== 'round-up') continue;
      for (const [k, v] of Object.entries((r.params || {}).paid || {})) if (k.slice(0, 4) === String(year)) roundUp += Number(v) || 0;
    }
    const goals = { list: goalList, saved: goalSaved, share: goalTarget > 0 ? goalSaved / goalTarget : 0,
      reached: goalList.filter((g) => g.saved >= g.target).map((g) => g.name), roundUp: round2(roundUp) };

    // Vermögen aus dem Kontoverlauf – nur, wenn er lang genug zurückreicht
    let worth = null;
    const hist = s.accounts.flatMap((a) => (a.history || []).map((h) => h.date)).sort();
    const endIso = toISO(to), yearStart = `${year - 1}-12-31`;
    if (hist.length && hist[0] < endIso) {
      const covered = hist[0] <= yearStart;
      const startIso = covered ? yearStart : hist[0];
      if (covered || (parseISO(endIso) - parseISO(startIso)) / 864e5 >= 45) {
        const points = [{ iso: startIso, value: recapWorthAt(startIso) }];
        for (let m = 0; m <= last; m++) {
          const iso = toISO(partial && m === last ? t : new Date(year, m + 1, 0));
          if (iso > startIso) points.push({ iso, value: recapWorthAt(iso) });
        }
        if (points.length >= 2) {
          const a = points[0].value, b = points[points.length - 1].value;
          worth = { start: a, end: b, change: round2(b - a), since: covered ? null : parseISO(startIso), points };
        }
      }
    }

    // Sternbilder: in diesem Jahr freigeschaltete Erfolge; Teuerung aus E8
    const stars = milestones().filter((m) => m.date && m.date.slice(0, 4) === String(year)).map((m) => ({ id: m.id, title: m.title, date: m.date }));
    const py = priceYears().find((p) => p.year === year);
    const prices = py && py.rate !== null && py.rows.length >= 2 ? { rate: py.rate, n: py.rows.length,
      top: py.rows.filter((x) => Math.abs(x.change) >= 0.005).sort((a, b) => Math.abs(b.change) - Math.abs(a.change)).slice(0, 3).map((x) => ({ name: x.item.name, change: x.change })) } : null;

    return { year, partial, from, to, count, range, income, expenses, fixed, saldo, rate: income > 0 ? saldo / income : 0,
      months, activeMonths: active.length, best, calm, categories, sources, biggest, frequent, habits, subs, goals, worth, stars, prices };
  });
}

/** Jahre mit Buchungen, neuestes zuerst (höchstens zehn). */
function recapYears() {
  const s = Store.state;
  if (!s.entries.length) return [];
  const first = Number(s.entries.reduce((d, e) => (e.date < d ? e.date : d), '9999').slice(0, 4));
  const now = today().getFullYear(), out = [];
  for (let y = now; y >= Math.max(first, now - 9); y--) if (yearRecap(y).count) out.push(y);
  return out;
}
/** Im Januar und Februar das Vorjahr, sonst das laufende Jahr. */
function recapDefaultYear() {
  const t = today(), y = t.getFullYear();
  return t.getMonth() <= 1 && yearRecap(y - 1).count ? y - 1 : y;
}
function recapSeen() {
  try { const v = JSON.parse(localStorage.getItem(RECAP_SEEN_KEY) || '[]'); return Array.isArray(v) ? v.map(Number) : []; } catch (e) { return []; }
}
function markRecapSeen(y) {
  try {
    const v = recapSeen();
    if (!v.includes(y)) { v.push(y); localStorage.setItem(RECAP_SEEN_KEY, JSON.stringify(v.slice(-10))); }
  } catch (e) { /* ohne Speicher bleibt der Hinweis eben stehen */ }
}
/** Hinweis auf dem Dashboard: ab 15. Dezember fürs laufende Jahr, im Januar fürs Vorjahr – bis er einmal angesehen wurde. */
function recapHintYear() {
  const t = today(), m = t.getMonth();
  const y = m === 11 && t.getDate() >= 15 ? t.getFullYear() : m === 0 ? t.getFullYear() - 1 : null;
  if (!y || recapSeen().includes(y)) return null;
  return yearRecap(y).count >= 20 ? y : null;
}

/* Bildteile der Karten (SVG). Ohne volle Bewegung stehen Umlaufbahnen still. */
const recapScene = {
  shade: '<radialGradient id="rcShade" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>',
  sunDefs: (id) => `<radialGradient id="${id}"><stop offset="0" stop-color="#FFF6D6"/><stop offset=".45" stop-color="#FFC45A"/><stop offset="1" stop-color="#E0781F"/></radialGradient>
    <radialGradient id="${id}G"><stop offset="0" stop-color="#FFC45A" stop-opacity=".55"/><stop offset=".45" stop-color="#FF9F43" stop-opacity=".16"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></radialGradient>`,
  ellipse: (cx, cy, rx, ry) => `M${cx - rx},${cy} a${rx},${ry} 0 1,0 ${2 * rx},0 a${rx},${ry} 0 1,0 ${-2 * rx},0`,
  /** Ein Körper auf einer Ellipsenbahn – kreist bei voller Bewegung, sonst fest an der Startstelle. */
  orbiter(cx, cy, rx, ry, body, dur, phase, motion) {
    if (motion !== 'full') {
      const a = phase * Math.PI * 2 + 0.6;
      return `<g transform="translate(${(cx + rx * Math.cos(a)).toFixed(1)} ${(cy + ry * Math.sin(a)).toFixed(1)})">${body}</g>`;
    }
    return `<g>${body}<animateMotion dur="${dur}s" begin="${(-phase * dur).toFixed(2)}s" repeatCount="indefinite" path="${recapScene.ellipse(cx, cy, rx, ry)}"/></g>`;
  },
  planet: (r, color) => `<circle r="${r}" fill="${esc(color)}"/><circle r="${r}" fill="url(#rcShade)"/>`,

  orbits(colors, motion) {
    const cx = 200, cy = 150, c = colors.length ? colors : RECAP_COLORS;
    const rings = [[74, 9, 7, 0.15], [118, 16, 10, 0.55], [168, 27, 6.5, 0.82]];
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"><defs>${recapScene.sunDefs('rcSunA')}${recapScene.shade}</defs>
      <circle class="rc-pulse" cx="${cx}" cy="${cy}" r="96" fill="url(#rcSunAG)"/>
      ${rings.map(([rx]) => `<ellipse class="rc-orbit" cx="${cx}" cy="${cy}" rx="${rx}" ry="${(rx * 0.36).toFixed(1)}"/>`).join('')}
      <circle class="rc-pop" cx="${cx}" cy="${cy}" r="24" fill="url(#rcSunA)"/>
      ${rings.map(([rx, dur, r, ph], i) => recapScene.orbiter(cx, cy, rx, rx * 0.36, recapScene.planet(r, c[i % c.length]), dur, ph, motion)).join('')}
    </svg>`;
  },

  sun(motion) {
    const rays = Array.from({ length: 16 }, (_, i) => `<line x1="200" y1="72" x2="200" y2="${46 - (i % 3) * 12}" transform="rotate(${i * 22.5} 200 150)"/>`).join('');
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"><defs>${recapScene.sunDefs('rcSunB')}</defs>
      <circle class="rc-pulse" cx="200" cy="150" r="150" fill="url(#rcSunBG)"/>
      <g class="rc-rays">${rays}${motion === 'full' ? '<animateTransform attributeName="transform" type="rotate" from="0 200 150" to="360 200 150" dur="80s" repeatCount="indefinite"/>' : ''}</g>
      <circle class="rc-pop" cx="200" cy="150" r="62" fill="url(#rcSunB)"/>
    </svg>`;
  },

  /** Ausgaben je Monat als Säulen, Einnahmen als goldene Punkte. */
  columns(months) {
    const first = Math.max(0, months.findIndex((x) => x.active));
    const list = months.slice(first), n = Math.max(1, list.length);
    const pad = 18, base = 240, top = 46, step = (400 - 2 * pad) / n, bw = Math.min(22, step * 0.56);
    const max = Math.max(1, ...list.map((x) => Math.max(x.expense, x.income)));
    const y = (v) => base - (v / max) * (base - top);
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="rcOutG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${RECAP_OUT}"/><stop offset="1" stop-color="${RECAP_OUT}" stop-opacity=".25"/></linearGradient></defs>
      <g class="rc-legend"><circle cx="${pad + 5}" cy="16" r="5" fill="${RECAP_SUN}"/><text x="${pad + 16}" y="20">Einnahmen</text><rect x="${pad + 96}" y="11" width="10" height="10" rx="2" fill="${RECAP_OUT}"/><text x="${pad + 112}" y="20">Ausgaben</text></g>
      <line x1="${pad}" x2="${400 - pad}" y1="${base}" y2="${base}" stroke="rgba(255,255,255,.18)"/>
      ${list.map((x, i) => {
        const cx = pad + step * (i + 0.5), h = Math.max(0, base - y(x.expense));
        return `<rect class="rc-grow" style="--d:${i}" x="${(cx - bw / 2).toFixed(1)}" y="${y(x.expense).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6, bw / 2).toFixed(1)}" fill="url(#rcOutG)"/>
          ${x.income > 0 ? `<circle class="rc-pop" style="--d:${i + 4}" cx="${cx.toFixed(1)}" cy="${y(x.income).toFixed(1)}" r="4.5" fill="${RECAP_SUN}"/>` : ''}
          <text class="rc-axis" x="${cx.toFixed(1)}" y="${base + 22}">${esc(x.short)}</text>`;
      }).join('')}
    </svg>`;
  },

  ring(rate, target) {
    const p = Math.max(0, Math.min(1, rate)) * 100, t = Math.max(0, Math.min(1, target));
    const a = t * Math.PI * 2 - Math.PI / 2;
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <circle class="rc-ring-bg" cx="200" cy="150" r="104"/>
      <circle class="rc-ring" cx="200" cy="150" r="104" pathLength="100" stroke-dasharray="${p.toFixed(2)} 100" transform="rotate(-90 200 150)"/>
      <line class="rc-tick" x1="${(200 + 88 * Math.cos(a)).toFixed(1)}" y1="${(150 + 88 * Math.sin(a)).toFixed(1)}" x2="${(200 + 120 * Math.cos(a)).toFixed(1)}" y2="${(150 + 120 * Math.sin(a)).toFixed(1)}"/>
      <text class="rc-ring-val num" x="200" y="150">${esc(Fmt.pct(rate))}</text>
      <text class="rc-ring-sub" x="200" y="190">Sparquote · Ziel ${esc(Fmt.pct(target))}</text>
    </svg>`;
  },

  /** Kategorien als Himmelskörper nebeneinander, Größe nach Anteil. */
  orbs(cats) {
    const max = Math.max(1, ...cats.map((c) => c.sum));
    let rs = cats.map((c) => 12 + 44 * Math.sqrt(c.sum / max));
    const gap = 14, need = rs.reduce((sum, r) => sum + 2 * r, 0) + gap * (cats.length - 1);
    if (need > 372) { const k = (372 - gap * (cats.length - 1)) / (need - gap * (cats.length - 1)); rs = rs.map((r) => r * k); }
    let x = (400 - (rs.reduce((sum, r) => sum + 2 * r, 0) + gap * (cats.length - 1))) / 2;
    const items = cats.map((c, i) => {
      const r = rs[i], cx = x + r, cy = 150 + (cats.length > 2 ? (i % 2 ? 20 : -16) : 0);
      x += 2 * r + gap;
      return `<g class="rc-bob" style="--d:${i}"><g class="rc-pop" style="--d:${i}">
        <circle cx="${cx.toFixed(1)}" cy="${cy}" r="${(r * 1.6).toFixed(1)}" fill="${esc(c.color)}" opacity=".13"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy}" r="${r.toFixed(1)}" fill="${esc(c.color)}"/><circle cx="${cx.toFixed(1)}" cy="${cy}" r="${r.toFixed(1)}" fill="url(#rcShade)"/></g></g>`;
    });
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"><defs>${recapScene.shade}</defs>
      <path class="rc-orbit" d="M-10,168 Q200,118 410,168"/>${items.join('')}</svg>`;
  },

  comet() {
    const sparks = [[92, 70, 1.6], [128, 92, 1.1], [168, 108, 1.4], [206, 130, 1], [60, 58, 1.2]].map(([x, y, r], i) => `<circle class="rc-twinkle" style="--d:${i}" cx="${x}" cy="${y}" r="${r}" fill="#DDE8FF"/>`).join('');
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"><defs>
        <linearGradient id="rcTail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9CC0FF" stop-opacity="0"/><stop offset=".7" stop-color="#BFD4FF" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient>
        <radialGradient id="rcHead"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#DDE8FF" stop-opacity=".9"/><stop offset="1" stop-color="#9CC0FF" stop-opacity="0"/></radialGradient></defs>
      ${sparks}
      <g class="rc-comet"><g transform="translate(268 182) rotate(28)">
        <path d="M-240,-12 C-150,-9 -60,-7 0,-6 A6,6 0 0 1 0,6 C-60,7 -150,9 -240,12 Z" fill="url(#rcTail)"/>
        <path d="M-170,-2 L0,-1.6 L0,1.6 L-170,2 Z" fill="#fff" opacity=".45"/>
        <circle r="30" fill="url(#rcHead)"/><circle r="6.5" fill="#fff"/>
      </g></g>
    </svg>`;
  },

  /** Überschuss je Monat um eine Nulllinie, der beste Monat leuchtet. */
  saldo(months, best) {
    const first = Math.max(0, months.findIndex((x) => x.active));
    const list = months.slice(first), n = Math.max(1, list.length);
    const pad = 18, zero = 150, span = 100, step = (400 - 2 * pad) / n, bw = Math.min(22, step * 0.56);
    const max = Math.max(1, ...list.map((x) => Math.abs(x.saldo)));
    const labelY = zero + Math.max(0, ...list.map((x) => (x.saldo < 0 ? Math.abs(x.saldo) / max * span : 0))) + 22;
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <line x1="${pad}" x2="${400 - pad}" y1="${zero}" y2="${zero}" stroke="rgba(255,255,255,.22)"/>
      ${list.map((x, i) => {
        const cx = pad + step * (i + 0.5), h = Math.max(2, Math.abs(x.saldo) / max * span), up = x.saldo >= 0, on = best && x.m === best.m;
        const fill = on ? RECAP_IN : up ? 'rgba(255,255,255,.28)' : 'rgba(242,139,130,.55)';
        return `<rect class="rc-grow${up ? '' : ' down'}${on ? ' rc-best' : ''}" style="--d:${i}" x="${(cx - bw / 2).toFixed(1)}" y="${(up ? zero - h : zero).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5, bw / 2).toFixed(1)}" fill="${fill}"/>
          <text class="rc-axis${on ? ' on' : ''}" x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}">${esc(x.short)}</text>`;
      }).join('')}
    </svg>`;
  },

  satellites(n, motion) {
    const k = Math.min(12, n), cx = 200, cy = 150;
    const sat = '<rect x="-4" y="-3" width="8" height="6" rx="1.2" fill="#E4ECF8"/><rect x="-12" y="-2" width="7" height="4" fill="#6D95F2"/><rect x="5" y="-2" width="7" height="4" fill="#6D95F2"/>';
    const orbits = [[104, 40, 14], [156, 60, 22]];
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"><defs>${recapScene.shade}</defs>
      ${orbits.map(([rx, ry]) => `<ellipse class="rc-orbit" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`).join('')}
      <circle class="rc-pulse" cx="${cx}" cy="${cy}" r="70" fill="#8FA8FF" opacity=".12"/>
      <g class="rc-pop"><circle cx="${cx}" cy="${cy}" r="38" fill="#8FA8FF"/><circle cx="${cx}" cy="${cy}" r="38" fill="url(#rcShade)"/>
      <ellipse cx="${cx}" cy="${cy}" rx="62" ry="13" fill="none" stroke="rgba(230,238,250,.45)" stroke-width="3"/></g>
      ${Array.from({ length: k }, (_, i) => { const [rx, ry, dur] = orbits[i % 2]; return recapScene.orbiter(cx, cy, rx, ry, sat, dur, i / k, motion); }).join('')}
    </svg>`;
  },

  /** Sparziele als Monde mit Fortschrittsring. */
  moons(goals) {
    const craters = [[-12, -10, 6], [10, 6, 8], [-4, 16, 4], [14, -14, 3.5]];
    return `<div class="rc-moons">${goals.map((g, i) => {
      const p = g.target > 0 ? Math.min(1, g.saved / g.target) : 0;
      return `<div class="rc-moon rc-in" style="--d:${i}"><svg viewBox="0 0 120 120">${i === 0 ? `<defs>${recapScene.shade}<radialGradient id="rcMoonG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#8E9AB0"/></radialGradient></defs>` : ''}
        <circle class="rc-ring-bg" cx="60" cy="60" r="52" style="stroke-width:6"/>
        <circle class="rc-ring" cx="60" cy="60" r="52" style="stroke-width:6" pathLength="100" stroke-dasharray="${(p * 100).toFixed(1)} 100" transform="rotate(-90 60 60)"/>
        <circle cx="60" cy="60" r="38" fill="url(#rcMoonG)"/>${craters.map(([x, y, r]) => `<circle cx="${60 + x}" cy="${60 + y}" r="${r}" fill="rgba(40,50,70,.22)"/>`).join('')}
        <circle cx="60" cy="60" r="38" fill="url(#rcShade)"/></svg>
        <b>${esc(g.name)}</b><small class="num">${esc(Fmt.pct(p))}</small></div>`;
    }).join('')}</div>`;
  },

  /** Vermögensverlauf als leuchtende Linie, die sich zeichnet. */
  line(points) {
    const vals = points.map((p) => p.value), min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
    const xs = (i) => 24 + 352 * (points.length === 1 ? 0.5 : i / (points.length - 1));
    const ys = (v) => 236 - ((v - min) / span) * 176;
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(p.value).toFixed(1)}`).join(' ');
    const lx = xs(points.length - 1), ly = ys(points[points.length - 1].value);
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="rcArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rc-accent);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--rc-accent);stop-opacity:0"/></linearGradient></defs>
      <path class="rc-fade" d="${d} L${lx.toFixed(1)},270 L${xs(0).toFixed(1)},270 Z" fill="url(#rcArea)"/>
      <path class="rc-line rc-draw" pathLength="1" d="${d}"/>
      <circle class="rc-pulse" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="16" style="fill:var(--rc-accent)" opacity=".3"/>
      <circle class="rc-pop" style="--d:12" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="6.5" fill="#fff"/>
    </svg>`;
  },

  /** Erfolge als Sternbild: helle Sterne = Erfolge, dazwischen Linien. */
  constellation(n, seed) {
    const k = Math.max(3, Math.min(8, n + 2)), rnd = seededRandom(seed), pts = [];
    for (let guard = 0; pts.length < k && guard < 500; guard++) {
      const p = { x: 40 + rnd() * 320, y: 36 + rnd() * 220 };
      if (pts.every((q) => Math.hypot(q.x - p.x, q.y - p.y) > 64)) pts.push(p);
    }
    pts.sort((a, b) => a.x - b.x);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <path class="rc-draw rc-cline" pathLength="1" d="${d}"/>
      ${pts.map((p, i) => {
        const bright = i < Math.min(n, k);
        return `<g class="rc-pop" style="--d:${i}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${bright ? 14 : 8}" fill="#FFE7A3" opacity="${bright ? 0.25 : 0.12}"/>
          <circle class="rc-twinkle" style="--d:${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${bright ? 4.2 : 2.4}" fill="#fff"/>
          ${bright ? `<path d="M${p.x.toFixed(1)},${(p.y - 13).toFixed(1)} v26 M${(p.x - 13).toFixed(1)},${p.y.toFixed(1)} h26" stroke="#FFF6D6" stroke-width="1.2" opacity=".6"/>` : ''}</g>`;
      }).join('')}
    </svg>`;
  },

  /** Ein Punkt je Tag des Jahres: hell = nichts ausgegeben. */
  dots(days, year) {
    const off = (new Date(year, 0, 1).getDay() + 6) % 7, cell = 10;
    const cols = Math.ceil((days.length + off) / 7), W = cols * cell, H = 7 * cell;
    const dots = days.map((code, i) => {
      const col = Math.floor((i + off) / 7), row = (i + off) % 7;
      return `<circle class="rc-d${code}${code === 2 ? ' rc-dot' : ''}"${code === 2 ? ` style="--c:${col}"` : ''} cx="${col * cell + 5}" cy="${row * cell + 5}" r="3.4"/>`;
    }).join('');
    return `<svg viewBox="0 -4 ${W} ${H + 26}" preserveAspectRatio="xMidYMid meet" class="rc-dots">${dots}
      <g class="rc-legend"><circle class="rc-d2" cx="5" cy="${H + 14}" r="3.4"/><text x="14" y="${H + 17}">nichts ausgegeben</text><circle class="rc-d1" cx="150" cy="${H + 14}" r="3.4"/><text x="159" y="${H + 17}">Ausgaben</text></g></svg>`;
  },

  trend(rate) {
    const up = rate >= 0;
    const d = up ? 'M28,236 C110,228 150,176 214,162 S320,96 364,66' : 'M28,76 C110,86 150,140 214,154 S320,214 364,238';
    const [ex, ey] = up ? [364, 66] : [364, 238];
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <path class="rc-line rc-draw" pathLength="1" d="${d}"/>
      <circle class="rc-pulse" cx="${ex}" cy="${ey}" r="16" style="fill:var(--rc-accent)" opacity=".3"/>
      <circle class="rc-pop" style="--d:12" cx="${ex}" cy="${ey}" r="7" fill="#fff"/>
    </svg>`;
  }
};

/** Kacheln der letzten Karte und des Bildes. Ohne Beträge: nur Anteile, Anzahlen und Namen. */
function recapTiles(r, amounts) {
  const top = r.categories[0], out = [];
  if (amounts) {
    out.push({ label: 'Einnahmen', value: Fmt.money(r.income), money: true });
    out.push({ label: 'Ausgaben', value: Fmt.money(r.expenses), money: true });
    out.push({ label: r.saldo >= 0 ? 'Übrig geblieben' : 'Mehr ausgegeben', value: Fmt.money(Math.abs(r.saldo)), sub: r.income > 0 ? `Sparquote ${Fmt.pct(r.rate)}` : '', money: true });
  } else {
    if (r.income > 0) out.push({ label: 'Sparquote', value: Fmt.pct(r.rate), sub: r.saldo >= 0 ? 'vom Einkommen übrig' : 'mehr ausgegeben als eingenommen' });
    if (r.expenses > 0) out.push({ label: 'Fixkosten', value: Fmt.pct(r.fixed / r.expenses), sub: 'der Ausgaben' });
  }
  if (top) out.push({ label: 'Am meisten für', value: top.label, sub: `${Fmt.pct(top.share)} der Ausgaben` });
  out.push({ label: 'Sterne am Himmel', value: fmtInt(r.count), sub: r.count === 1 ? 'Buchung' : 'Buchungen' });
  if (amounts && r.worth) out.push({ label: 'Vermögen', value: Fmt.money(r.worth.change, true), sub: `jetzt ${Fmt.money(r.worth.end)}`, money: true, subMoney: true });
  if (r.habits && r.habits.free > 0) out.push({ label: 'Tage ohne Ausgaben', value: fmtInt(r.habits.free), sub: `von ${fmtInt(r.habits.tracked)} erfassten` });
  if (r.best) out.push({ label: 'Bester Monat', value: r.best.name, sub: amounts ? `${Fmt.money(r.best.saldo, true)} übrig` : '', subMoney: true });
  if (r.subs.count) out.push({ label: 'Abos', value: fmtInt(r.subs.count), sub: amounts ? `${Fmt.money(r.subs.monthly)} im Monat` : 'kreisen um dich', subMoney: amounts });
  if (r.stars.length) out.push({ label: 'Erfolge', value: fmtInt(r.stars.length), sub: 'neue Sternbilder' });
  return out.slice(0, 6);
}

/** Hintergrund des Rückblicks: Sterne, die langsam auf dich zukommen; beim Kartenwechsel ein kurzer Warp. */
function recapSky(canvas, motion) {
  const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
  if (!ctx) return null;
  const rnd = seededRandom(20261231);
  const stars = Array.from({ length: 240 }, () => ({ x: rnd(), y: rnd(), z: 0.25 + rnd() * 0.75, tw: rnd() * 6.28 }));
  let w = 0, h = 0, warp = 0;
  const sky = {
    resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = canvas.clientWidth || window.innerWidth; h = canvas.clientHeight || window.innerHeight;
      canvas.width = Math.max(1, Math.round(w * dpr)); canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      sky.draw(performance.now());
    },
    warp() { if (motion === 'full') warp = 1; },
    frame(now, dt) {
      if (motion !== 'full') return;
      for (const s of stars) {
        const v = (0.018 + warp * 1.1) * s.z * dt / 1000;
        s.x += (s.x - 0.5) * v; s.y += (s.y - 0.5) * v;
        if (s.x < -0.02 || s.x > 1.02 || s.y < -0.02 || s.y > 1.02) { s.x = 0.5 + (rnd() - 0.5) * 0.5; s.y = 0.5 + (rnd() - 0.5) * 0.5; s.z = 0.25 + rnd() * 0.75; }
      }
      warp = Math.max(0, warp - dt / 650);
      sky.draw(now);
    },
    draw(now) {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
      for (const s of stars) {
        const x = s.x * w, y = s.y * h, size = 0.5 + s.z * 1.3;
        ctx.globalAlpha = Math.min(1, (0.25 + 0.6 * s.z) * (motion === 'full' ? 0.7 + 0.3 * Math.sin(now / 800 + s.tw) : 1));
        if (warp > 0.08) {
          const d = Math.hypot(x - cx, y - cy) || 1, len = warp * 46 * s.z;
          ctx.lineWidth = size; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - (x - cx) / d * len, y - (y - cy) / d * len); ctx.stroke();
        } else { ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    }
  };
  sky.resize();
  return sky;
}

/** Farbe mit Deckkraft für Canvas-Verläufe (#rgb, #rrggbb oder rgb()). */
function rcRgba(color, a) {
  const c = String(color || '').trim();
  let m = c.match(/^#([0-9a-f]{3})$/i);
  if (m) { const [r, g, b] = m[1].split('').map((x) => parseInt(x + x, 16)); return `rgba(${r},${g},${b},${a})`; }
  m = c.match(/^#([0-9a-f]{6})/i);
  if (m) { const n = parseInt(m[1], 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
  m = c.match(/^rgba?\(([^)]+)\)/i);
  if (m) { const [r, g, b] = m[1].split(/[\s,/]+/).map(Number); return `rgba(${r},${g},${b},${a})`; }
  return `rgba(95,214,210,${a})`;
}

/** Das Jahr als Bild im Hochformat (1080 × 1920), in der gewählten Farbwelt. null, wenn der Browser kein Canvas kann. */
async function recapImage(r, { amounts = true } = {}) {
  if (!r || !r.count) return null;
  const W = 1080, H = 1920;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext ? cv.getContext('2d') : null;
  if (!g || !cv.toBlob) return null;
  try {
    if (document.fonts && document.fonts.load) {
      await Promise.race([Promise.all(['800 100px Manrope', '700 40px Manrope', '600 30px Manrope'].map((f) => document.fonts.load(f))), new Promise((ok) => setTimeout(ok, 1500))]);
    }
  } catch (e) { /* dann mit Systemschrift */ }
  const css = getComputedStyle(document.documentElement);
  const tok = (k, fb) => (css.getPropertyValue(k) || '').trim() || fb;
  const brand = tok('--brand', '#5FD6D2'), brand2 = tok('--brand-2', brand), bg = tok('--bg', '#050D12');
  const font = (w, s) => `${w} ${s}px Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif`;
  const ink = '#F4F7FB', muted = 'rgba(226,234,246,0.76)';
  const spacing = (v) => { if ('letterSpacing' in g) g.letterSpacing = v; };
  const rr = (x, y, w, h, rad) => {
    g.beginPath(); g.moveTo(x + rad, y);
    g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad);
    g.closePath();
  };
  const fit = (text, weight, size, maxW, min = 26) => {
    let s = size, t = String(text);
    g.font = font(weight, s);
    while (s > min && g.measureText(t).width > maxW) { s -= 2; g.font = font(weight, s); }
    while (t.length > 1 && g.measureText(t).width > maxW) t = t.slice(0, -2) + '…';
    return t;
  };
  const glow = (x, y, rad, color, a) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, rcRgba(color, a)); gr.addColorStop(1, rcRgba(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  };

  // Hintergrund: Nebel der Farbwelt und Sterne (gleiches Jahr, gleicher Himmel)
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  glow(W * 0.9, 120, 980, brand, 0.3);
  glow(0, H * 0.62, 900, brand2, 0.16);
  glow(W * 0.5, H + 100, 800, brand, 0.12);
  const rnd = seededRandom(r.year * 97 + 13);
  g.fillStyle = '#fff';
  for (let i = 0; i < 420; i++) {
    const x = rnd() * W, y = rnd() * H, s = 0.6 + Math.pow(rnd(), 3) * 2.6;
    g.globalAlpha = 0.2 + rnd() * 0.7; g.beginPath(); g.arc(x, y, s, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  // Sonnensystem oben rechts: Sonne = Einnahmen, drei Planeten in den Farben der größten Kategorien
  const sx = W - 190, sy = 150;
  g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 2;
  for (const rx of [120, 180, 250]) { g.beginPath(); g.ellipse(sx, sy, rx, rx * 0.36, 0, 0, Math.PI * 2); g.stroke(); }
  const halo = g.createRadialGradient(sx, sy, 0, sx, sy, 170);
  halo.addColorStop(0, 'rgba(255,196,90,0.55)'); halo.addColorStop(0.45, 'rgba(255,159,67,0.16)'); halo.addColorStop(1, 'rgba(255,159,67,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(sx, sy, 170, 0, Math.PI * 2); g.fill();
  const core = g.createRadialGradient(sx - 14, sy - 14, 4, sx, sy, 50);
  core.addColorStop(0, '#FFF6D6'); core.addColorStop(0.5, '#FFC45A'); core.addColorStop(1, '#E0781F');
  g.fillStyle = core; g.beginPath(); g.arc(sx, sy, 50, 0, Math.PI * 2); g.fill();
  const cols = (r.categories.length ? r.categories.map((c) => c.color) : RECAP_COLORS).slice(0, 3);
  [[120, 3.9, 14], [180, 0.9, 21], [250, 2.3, 12]].forEach(([rx, a, pr], i) => {
    const px = sx + rx * Math.cos(a), py = sy + rx * 0.36 * Math.sin(a);
    g.fillStyle = cols[i % cols.length]; g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
    const sh = g.createRadialGradient(px - pr * 0.4, py - pr * 0.45, 1, px, py, pr);
    sh.addColorStop(0, 'rgba(255,255,255,0.45)'); sh.addColorStop(0.45, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.55)');
    g.fillStyle = sh; g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
  });

  // Titel
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  spacing('6px'); g.fillStyle = brand; g.font = font(800, 32); g.fillText('MEIN FINANZJAHR', 76, 190);
  spacing('-6px');
  const yg = g.createLinearGradient(64, 250, 700, 420);
  yg.addColorStop(0, '#FFFFFF'); yg.addColorStop(0.55, brand); yg.addColorStop(1, brand2);
  g.fillStyle = yg; g.font = font(800, 230); g.fillText(String(r.year), 64, 410);
  spacing('0px');
  const range = fit(`${r.range}${r.partial ? ' · Stand heute' : ''}`, 600, 38, W - 150);
  g.fillStyle = muted; g.fillText(range, 78, 480);

  // Kacheln
  const tiles = recapTiles(r, amounts), tw = (W - 2 * 72 - 28) / 2, th = 236;
  tiles.forEach((t, i) => {
    const x = 72 + (i % 2) * (tw + 28), y = 560 + Math.floor(i / 2) * (th + 26);
    rr(x, y, tw, th, 34); g.fillStyle = rcRgba(bg, 0.8); g.fill(); g.fillStyle = 'rgba(255,255,255,0.05)'; g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 2; g.stroke();
    g.fillStyle = rcRgba(i % 2 ? brand2 : brand, 0.9); g.beginPath(); g.arc(x + 44, y + 54, 7, 0, Math.PI * 2); g.fill();
    const label = fit(t.label, 700, 30, tw - 100); g.fillStyle = muted; g.fillText(label, x + 62, y + 65);
    const value = fit(t.value, 800, 66, tw - 72, 34); g.fillStyle = ink; g.fillText(value, x + 36, y + 150);
    if (t.sub) { const sub = fit(t.sub, 600, 28, tw - 72, 22); g.fillStyle = muted; g.fillText(sub, x + 36, y + 198); }
  });

  // Wohin das Geld floss
  const cats = r.categories.slice(0, 4);
  if (cats.length) {
    g.fillStyle = ink; g.font = font(800, 38); g.fillText('Wohin dein Geld floss', 72, 1412);
    const topSum = cats[0].sum || 1;
    cats.forEach((c, i) => {
      const y = 1484 + i * 88, right = amounts ? Fmt.money(c.sum) : Fmt.pct(c.share);
      g.fillStyle = c.color; g.beginPath(); g.arc(84, y - 11, 11, 0, Math.PI * 2); g.fill();
      g.font = font(700, 32); const rw = g.measureText(right).width;
      const name = fit(c.label, 700, 32, W - 144 - 50 - rw - 30); g.fillStyle = ink; g.fillText(name, 110, y);
      g.font = font(700, 32); g.textAlign = 'right'; g.fillStyle = muted; g.fillText(right, W - 72, y); g.textAlign = 'left';
      rr(72, y + 20, W - 144, 10, 5); g.fillStyle = 'rgba(255,255,255,0.09)'; g.fill();
      rr(72, y + 20, Math.max(10, (W - 144) * c.sum / topSum), 10, 5); g.fillStyle = c.color; g.fill();
    });
  }

  g.fillStyle = 'rgba(200,215,240,0.62)'; g.font = font(600, 26);
  g.fillText(`Finanzplaner · erstellt am ${today().toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' })}`, 72, H - 70);
  Recap.lastCanvas = cv; // für Tests und Vorschau
  return new Promise((ok) => cv.toBlob((b) => ok(b), 'image/png'));
}

const Recap = {
  el: null, frame: null, stage: null, bars: [], data: null, slides: [], index: 0, elapsed: 0, last: 0, raf: 0,
  paused: false, held: false, ptr: null, suppress: false, motion: 'full', amounts: true, sky: null, previous: null,
  pushed: false, image: null, lastCanvas: null, skipPops: 0, wantPush: false,

  open(year) {
    const y = Number(year) || recapDefaultYear();
    if (this.el) { this.load(y); return; }
    this.motion = motionLevel();
    this.amounts = !setting('privacy');
    this.previous = document.activeElement;
    const el = document.createElement('div');
    el.className = 'recap';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.innerHTML = `
      <canvas class="rc-sky" aria-hidden="true"></canvas>
      <button type="button" class="rc-btn rc-side rc-side-prev" data-rc="prev" aria-hidden="true" tabindex="-1">${icon('chevL')}</button>
      <div class="rc-frame">
        <div class="rc-bars" aria-hidden="true"></div>
        <div class="rc-top">
          <span class="rc-brand"></span>
          <button type="button" class="rc-btn" data-rc="pause"></button>
          <button type="button" class="rc-btn" data-rc="close" aria-label="Rückblick schließen">${icon('close')}</button>
        </div>
        <button type="button" class="rc-tap rc-prev" data-rc="prev" aria-label="Vorherige Karte"></button>
        <button type="button" class="rc-tap rc-next" data-rc="next" aria-label="Nächste Karte"></button>
        <div class="rc-stage" aria-live="polite"></div>
        <div class="rc-foot"><span class="rc-pos"></span><span class="rc-hint">${this.motion === 'off' ? 'Tippen: weiter' : 'Tippen: weiter · Halten: anhalten'}</span></div>
      </div>
      <button type="button" class="rc-btn rc-side rc-side-next" data-rc="next" aria-hidden="true" tabindex="-1">${icon('chevR')}</button>`;
    document.body.append(el);
    this.el = el;
    this.frame = $('.rc-frame', el);
    this.stage = $('.rc-stage', el);
    this.onClick = (e) => this.click(e);
    this.onDown = (e) => this.down(e);
    this.onMove = (e) => this.move(e);
    this.onUp = (e) => this.up(e);
    this.onCancel = () => this.cancel();
    this.onKey = (e) => this.key(e);
    this.onResize = () => { if (this.sky) this.sky.resize(); };
    this.onChange = (e) => { if (e.target && e.target.name === 'rcAmounts') { this.amounts = e.target.checked; this.image = null; this.refreshTiles(); } };
    el.addEventListener('click', this.onClick);
    el.addEventListener('change', this.onChange);
    this.frame.addEventListener('pointerdown', this.onDown);
    window.addEventListener('pointermove', this.onMove);
    window.addEventListener('pointerup', this.onUp);
    window.addEventListener('pointercancel', this.onCancel);
    document.addEventListener('keydown', this.onKey, true);
    window.addEventListener('resize', this.onResize);
    // Zurück-Taste schließt: eigener Verlaufseintrag – erst, wenn ein noch laufendes history.back() angekommen ist
    if (this.skipPops > 0) this.wantPush = true; else this.pushEntry();
    this.sky = recapSky($('.rc-sky', el), this.motion);
    this.load(y);
    const closeBtn = $('[data-rc="close"]', el);
    if (closeBtn) closeBtn.focus({ preventScroll: true });
    this.last = 0;
    this.raf = requestAnimationFrame((t) => this.tick(t));
  },

  /** Ein Jahr laden (auch beim Wechsel auf der letzten Karte) und bei Karte 1 beginnen. */
  load(year) {
    const hint = recapHintYear();
    this.data = yearRecap(year);
    this.slides = recapSlides(this.data, this.motion);
    this.index = 0; this.elapsed = 0; this.image = null; this.held = false;
    this.paused = this.motion === 'off';
    markRecapSeen(year);
    if (hint === year) App.render(false); // Hinweis auf dem Dashboard verschwindet (unter dem Rückblick)
    this.el.setAttribute('aria-label', `Jahresrückblick ${year}`);
    $('.rc-brand', this.el).innerHTML = `Jahresrückblick <b>${year}</b>`;
    $('.rc-bars', this.el).innerHTML = this.slides.map(() => '<i><b></b></i>').join('');
    this.bars = [...this.el.querySelectorAll('.rc-bars b')];
    this.render();
  },

  close(silent) {
    if (!this.el) return;
    cancelAnimationFrame(this.raf);
    const el = this.el;
    this.el = null; this.sky = null; this.ptr = null; this.held = false;
    clearTimeout(this.holdTimer);
    document.removeEventListener('keydown', this.onKey, true);
    window.removeEventListener('pointermove', this.onMove);
    window.removeEventListener('pointerup', this.onUp);
    window.removeEventListener('pointercancel', this.onCancel);
    window.removeEventListener('resize', this.onResize);
    this.wantPush = false;
    if (!silent && motionLevel() === 'full') { el.classList.add('rc-out'); setTimeout(() => el.remove(), 240); } else el.remove();
    if (this.pushed) { this.pushed = false; this.skipPops++; try { history.back(); } catch (e) { this.skipPops--; } }
    const back = this.previous;
    this.previous = null;
    if (back && back.isConnected && back.focus) back.focus({ preventScroll: true });
  },

  render() {
    const sl = this.slides[this.index], last = this.index === this.slides.length - 1;
    this.frame.style.setProperty('--rc-accent', sl.accent);
    this.stage.innerHTML = recapSlideHtml(sl, this.index, this.slides.length, this.data, this.amounts);
    this.el.classList.toggle('rc-last', last);
    $('.rc-pos', this.el).textContent = `${this.index + 1} / ${this.slides.length}`;
    for (const b of this.el.querySelectorAll('[data-rc="prev"]')) b.disabled = this.index === 0;
    for (const b of this.el.querySelectorAll('[data-rc="next"]')) b.disabled = last;
    this.updatePause();
    this.updateBars();
    this.countUp();
    if (sl.finale) this.prepareImage();
    const active = document.activeElement;
    if (!active || active === document.body || active.disabled || !this.el.contains(active)) {
      const target = sl.finale ? $('[data-rc="save"]', this.el) : $('[data-rc="next"].rc-tap', this.el);
      if (target) target.focus({ preventScroll: true });
    }
  },

  go(i) {
    const n = Math.max(0, Math.min(this.slides.length - 1, i));
    if (n === this.index || !this.el) return;
    this.index = n;
    this.elapsed = 0;
    if (this.sky) this.sky.warp();
    this.render();
  },

  pushEntry() {
    try { history.pushState({ recap: true }, ''); this.pushed = true; } catch (e) { this.pushed = false; }
  },
  /** popstate: eigenes history.back() überspringen, sonst (Zurück-Taste) schließen. */
  popped() {
    if (this.skipPops > 0) {
      this.skipPops--;
      if (!this.skipPops && this.wantPush && this.el) { this.wantPush = false; this.pushEntry(); }
      return;
    }
    if (this.el) { this.pushed = false; this.close(true); }
  },

  togglePause() { this.paused = !this.paused; this.updatePause(); },
  updatePause() {
    const b = $('[data-rc="pause"]', this.el);
    if (!b) return;
    b.innerHTML = icon(this.paused ? 'play' : 'pause');
    b.setAttribute('aria-label', this.paused ? 'Abspielen' : 'Anhalten');
    b.hidden = this.index === this.slides.length - 1;
    this.el.classList.toggle('rc-paused', this.paused);
  },
  updateBars() {
    const last = this.slides.length - 1;
    this.bars.forEach((b, i) => {
      const v = i < this.index ? 1 : i > this.index ? 0 : this.index === last ? 1 : Math.min(1, this.elapsed / RECAP_MS);
      b.style.transform = `scaleX(${v.toFixed(3)})`;
    });
  },

  tick(now) {
    if (!this.el) return;
    const dt = this.last ? Math.min(100, now - this.last) : 16;
    this.last = now;
    if (this.index < this.slides.length - 1 && !this.paused && !this.held && !document.hidden) {
      this.elapsed += dt;
      if (this.elapsed >= RECAP_MS) this.go(this.index + 1);
    }
    this.updateBars();
    if (this.sky) this.sky.frame(now, dt);
    this.raf = requestAnimationFrame((t) => this.tick(t));
  },

  /** Zahlen zählen von 0 hoch; der Screenreader liest nur den Endwert. */
  countUp() {
    if (this.motion === 'off') return;
    const root = this.stage.firstElementChild;
    const items = [...this.stage.querySelectorAll('.rc-num[data-to]')];
    if (!items.length) return;
    const start = performance.now();
    const step = (now) => {
      if (!this.el || !root || !root.isConnected) return;
      const p = Math.max(0, Math.min(1, (now - start - 280) / 1300)), e = 1 - Math.pow(1 - p, 3);
      for (const it of items) {
        const v = it.querySelector('.rc-v'), final = it.querySelector('.rc-sr').textContent;
        if (!v) continue;
        const to = Number(it.dataset.to), f = it.dataset.fmt;
        v.textContent = p >= 1 ? final : f === 'money' ? Fmt.money(round2(to * e)) : f === 'signed' ? Fmt.money(round2(to * e), true)
          : f === 'pctSigned' ? fmtPctSigned(to * e) : fmtInt(to * e);
      }
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },

  refreshTiles() {
    const box = $('.rc-tiles', this.stage);
    if (box) box.outerHTML = recapTilesHtml(this.data, this.amounts);
    this.prepareImage();
  },

  prepareImage() {
    if (!this.image) this.image = recapImage(this.data, { amounts: this.amounts }).catch((e) => { reportError('Rückblick-Bild', e); return null; });
    return this.image;
  },

  async save(share) {
    const y = this.data.year, name = `finanzjahr-${y}${this.amounts ? '' : '-ohne-betraege'}.png`;
    const blob = await this.prepareImage();
    if (!blob) { UI.toast('Das Bild ließ sich in diesem Browser nicht erstellen.'); return 'none'; }
    if (share) {
      const file = new File([blob], name, { type: 'image/png' });
      try {
        await navigator.share({ files: [file], title: `Mein Finanzjahr ${y}` });
        UI.toast('Bild geteilt.');
        return 'shared';
      } catch (e) {
        if (e && e.name === 'AbortError') { UI.toast('Teilen abgebrochen. Es wurde nichts weitergegeben.'); return 'cancelled'; }
        if (e && e.name === 'NotAllowedError') { UI.toast('Dein Bild ist fertig.', { label: 'Jetzt teilen', run: () => navigator.share({ files: [file] }).catch(() => {}), ms: 10000 }); return 'blocked'; }
        if (downloadFile(name, blob, 'image/png')) UI.toast('Teilen ging nicht – das Bild wurde gespeichert.');
        return 'file';
      }
    }
    if (downloadFile(name, blob, 'image/png')) UI.toast('Bild gespeichert – du findest es bei deinen Downloads.');
    return 'file';
  },

  click(e) {
    const t = e.target.closest('[data-rc]');
    if (this.suppress) {
      this.suppress = false;
      if (!t || t.classList.contains('rc-tap')) return;
    }
    if (!t) {
      // Leere Fläche der letzten Karte: links tippen = zurück
      if (e.target.closest('.rc-slide') && !e.target.closest('button, label, input, a')) {
        const box = this.frame.getBoundingClientRect();
        if (e.clientX < box.left + box.width * 0.32) this.go(this.index - 1);
      }
      return;
    }
    const act = t.dataset.rc;
    if (act === 'next') this.go(this.index + 1);
    else if (act === 'prev') this.go(this.index - 1);
    else if (act === 'pause') this.togglePause();
    else if (act === 'close') this.close();
    else if (act === 'replay') { this.paused = this.motion === 'off'; this.go(0); }
    else if (act === 'save') this.save(false);
    else if (act === 'share') this.save(true);
    else if (act === 'year') this.load(Number(t.dataset.year));
  },

  key(e) {
    if (!this.el) return;
    e.stopPropagation(); // keine App-Tastenkürzel hinter dem Rückblick
    const tag = (e.target && e.target.tagName) || '';
    if (e.key === 'Escape') { e.preventDefault(); this.close(); }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); this.go(this.index + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); this.go(this.index - 1); }
    else if (e.key === ' ' && !/^(BUTTON|INPUT|A)$/.test(tag)) { e.preventDefault(); this.togglePause(); }
    else if (e.key === 'Tab') {
      const items = [...this.el.querySelectorAll('button, input, a[href]')].filter((x) => !x.disabled && x.tabIndex !== -1 && !x.hidden && x.getClientRects().length);
      if (!items.length) return;
      const first = items[0], lastItem = items[items.length - 1];
      if (e.shiftKey && (document.activeElement === first || !this.el.contains(document.activeElement))) { e.preventDefault(); lastItem.focus(); }
      else if (!e.shiftKey && (document.activeElement === lastItem || !this.el.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
    }
  },

  // Gesten: halten = anhalten, seitlich wischen = blättern, nach unten wischen = schließen
  down(e) {
    if (e.button > 0 || e.target.closest('button:not(.rc-tap), input, label, a')) return;
    this.ptr = { x: e.clientX, y: e.clientY, moved: false };
    clearTimeout(this.holdTimer);
    this.holdTimer = setTimeout(() => { if (this.ptr && !this.ptr.moved && this.el) { this.held = true; this.el.classList.add('rc-held'); } }, 260);
  },
  move(e) {
    if (!this.ptr) return;
    const dx = e.clientX - this.ptr.x, dy = e.clientY - this.ptr.y;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) this.ptr.moved = true;
    if (dy > 12 && dy > Math.abs(dx) && this.motion === 'full') this.frame.style.transform = `translateY(${Math.round(Math.min(dy, 260) * 0.45)}px)`;
  },
  up(e) {
    if (!this.ptr) return;
    clearTimeout(this.holdTimer);
    const dx = e.clientX - this.ptr.x, dy = e.clientY - this.ptr.y, wasHeld = this.held;
    this.ptr = null; this.held = false;
    if (!this.el) return;
    this.el.classList.remove('rc-held');
    this.frame.style.transform = '';
    const swallow = () => { this.suppress = true; setTimeout(() => { this.suppress = false; }, 400); };
    if (wasHeld) { swallow(); return; }
    if (dy > 110 && dy > Math.abs(dx)) { swallow(); this.close(); return; }
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { swallow(); this.go(this.index + (dx < 0 ? 1 : -1)); }
  },
  cancel() {
    clearTimeout(this.holdTimer);
    this.ptr = null; this.held = false;
    if (this.el) { this.el.classList.remove('rc-held'); this.frame.style.transform = ''; }
  }
};
window.addEventListener('popstate', () => Recap.popped());

/* ---------- 7m. Einstellungen, Daten und Suche ---------- */

const APP_VERSION = '3.22';

/** Vollständiger Export: alle Bereiche, Einstellungen und Kennungen in einer Datei. */
function exportPayload() {
  return JSON.stringify({
    app: 'finanzplaner', format: 1, appVersion: APP_VERSION, schema: Store.state.version || 1,
    exportedAt: new Date().toISOString(), data: Store.state
  }, null, 2);
}

/** Liest sowohl das neue Exportformat als auch alte reine Zustandsdateien. */
function parsePayload(text) {
  const parsed = JSON.parse(text);
  const data = parsed && parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed;
  if (!data || typeof data !== 'object' || !Array.isArray(data.entries)) throw new Error('Kein Finanzplaner-Export');
  return data;
}

/** Merkt sich den letzten Export für die Export-Erinnerung (nicht rückgängig machbar, kein Neuzeichnen). */
function markExported() {
  if (!Store.state) return;
  Store.state.meta.lastExport = toISO(today());
  Store.save();
}

/** Datei im Browser herunterladen. */
function downloadFile(name, content, type) {
  try {
    const blob = new Blob([content], { type: type || 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch (e) {
    UI.toast('Der Browser erlaubt hier keinen Download. Öffne die Datei direkt im Browser.');
    return false;
  }
}

/** Alle Buchungen als CSV, mit Semikolon und Komma – so öffnet Excel sie korrekt. */
function entriesToCsv() {
  const rows = [['Art', 'Name', 'Kategorie', 'Betrag', 'Intervall', 'Datum', 'Notiz', 'Schlagwörter']];
  for (const e of Store.state.entries) {
    rows.push([e.kind === 'income' ? 'Einnahme' : 'Ausgabe', e.name, catLabel(e.category),
      String(e.amount).replace('.', ','), INTERVALS[e.interval] || e.interval, e.date, e.note || '', (e.tags || []).join(', ')]);
  }
  return '\ufeff' + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
}

/** Übernimmt importierte Daten – bei vorhandenen Einträgen erst nach Rückfrage. */
function applyImported(data) {
  if (!data || !Array.isArray(data.entries)) { UI.toast('Diese Datei enthält keine Finanzplaner-Daten.'); return; }
  const summary = `${data.entries.length} Buchungen, ${(data.accounts || []).length} Konten, ${(data.goals || []).length} Sparziele, ${(data.budgets || []).length} Budgets`;
  const write = () => {
    writeRestorePoint('vor dem Import');
    Store.replace(repairState(Store.migrate(data)).state);
    Store.state.meta.isDemo = false;
    Store.state.meta.isNew = false;
    Store.save();
    Fmt.reset();
    timeTarget = null;
    App.render(true);
    UI.toast(`Übernommen: ${summary}.`);
  };
  if (isEmptyState()) { write(); return; }
  UI.modal({
    title: 'Daten übernehmen',
    body: `<p class="dialog-text">Die Datei enthält ${esc(summary)}. Deine aktuellen Daten werden dabei ersetzt.</p>`,
    submitLabel: 'Jetzt übernehmen',
    danger: true,
    onSubmit: write
  });
}

/** Export in die Zwischenablage, damit er sich in einer anderen Version einfügen lässt. */
function copyExport() {
  const text = exportPayload();
  const done = () => { markExported(); UI.toast('Vollständiger Export kopiert. In der anderen Version unter Einstellungen einfügen.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => showExportText(text));
  } else {
    showExportText(text);
  }
}

function showExportText(text) {
  UI.modal({
    title: 'Export zum Kopieren',
    body: `<label class="field"><span>Alles markieren und kopieren</span><textarea class="paste-area" readonly>${esc(text)}</textarea></label>`,
    submitLabel: 'Fertig',
    onSubmit: () => {}
  });
}

/** Import über Einfügen: Text aus einer anderen Version übernehmen. */
function openPasteImport() {
  UI.modal({
    title: 'Daten einfügen',
    body: `<label class="field"><span>Export aus der anderen Version</span><textarea name="payload" class="paste-area" placeholder="Hier den kopierten Text einfügen" required></textarea><em>Alles wird übernommen: Buchungen, Konten, Budgets, Ziele, Schulden, Verträge, Regeln und Einstellungen.</em></label>`,
    submitLabel: 'Übernehmen',
    onSubmit: (data) => {
      try { applyImported(parsePayload(String(data.payload || ''))); }
      catch (e) { UI.toast('Der eingefügte Text ist kein Finanzplaner-Export.'); return false; }
    }
  });
}

/* Verschlüsseltes Backup mit Web Crypto (AES-GCM, Schlüssel aus dem Passwort) */
const cryptoReady = () => typeof crypto !== 'undefined' && crypto.subtle;
const bytesToBase64 = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 4096) s += String.fromCharCode(...bytes.subarray(i, i + 4096)); return btoa(s); };
const base64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

async function deriveKey(password, salt, usage) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, [usage]);
}

async function createBackup(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt, 'encrypt');
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(exportPayload()));
  return JSON.stringify({ format: 'fp-backup', version: 1, salt: bytesToBase64(salt), iv: bytesToBase64(iv), data: bytesToBase64(new Uint8Array(cipher)) });
}

async function readBackup(file, password) {
  const key = await deriveKey(password, base64ToBytes(file.salt), 'decrypt');
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBytes(file.iv) }, key, base64ToBytes(file.data));
  return parsePayload(new TextDecoder().decode(plain));
}

/** Datei einlesen: normales JSON oder verschlüsseltes Backup. */
function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(String(reader.result)); }
    catch (e) { UI.toast('Die Datei lässt sich nicht lesen.'); return; }
    if (data && data.app === 'finanzplaner' && data.data) { applyImported(data.data); return; }
    if (data && data.format === 'fp-backup') {
      if (!cryptoReady()) { UI.toast('Verschlüsselte Backups brauchen einen Browser mit Web Crypto.'); return; }
      UI.modal({
        title: 'Backup entsperren',
        body: field('Passwort', `<input name="password" type="password" required>`, 'Das Passwort, mit dem du das Backup erstellt hast'),
        submitLabel: 'Entsperren',
        onSubmit: (input) => {
          readBackup(data, input.password)
            .then(applyImported)
            .catch(() => UI.toast('Falsches Passwort oder beschädigte Datei.'));
        }
      });
      return;
    }
    applyImported(data);
  };
  reader.readAsText(file);
}

/* ---------- Sicherung teilen (Etappe E2) ----------
   Die verschlüsselte Sicherung geht über das Teilen-Menü des Tablets an Drive, Samsung Cloud, E-Mail …
   Chrome teilt nur bestimmte Dateitypen (u. a. .txt, nicht .json oder .fpb) – deshalb als Textdatei „….fpb.txt“.
   Der Import erkennt Sicherungen am Inhalt, nicht an der Endung. Geteilt wird nur verschlüsselt. */
const BACKUP_SHARE_TYPE = 'text/plain';
const backupFileName = (ext) => `finanzplaner-backup-${toISO(today())}.${ext}`;

/** Kann dieser Browser Dateien über das Teilen-Menü weitergeben? */
function canShareFiles() {
  try {
    return typeof navigator !== 'undefined' && typeof navigator.share === 'function' && typeof navigator.canShare === 'function'
      && navigator.canShare({ files: [new File(['probe'], 'probe.txt', { type: BACKUP_SHARE_TYPE })] }) === true;
  } catch (e) { return false; }
}

/** Teilt die fertige Sicherung: 'shared' | 'cancelled' | 'blocked' (Tipp zu lange her) | 'unsupported'. */
async function shareBackup(content) {
  const file = new File([content], backupFileName('fpb.txt'), { type: BACKUP_SHARE_TYPE });
  if (!canShareFiles() || !navigator.canShare({ files: [file] })) return 'unsupported';
  try {
    await navigator.share({ files: [file], title: 'Finanzplaner-Sicherung' });
    return 'shared';
  } catch (e) {
    if (e && e.name === 'AbortError') return 'cancelled';
    if (e && e.name === 'NotAllowedError') return 'blocked';
    throw e;
  }
}

/** Sicherung ausliefern: teilen oder als Datei speichern. Nur Erfolg zählt für die Export-Erinnerung. */
function deliverBackup(content, target) {
  const save = (message) => { if (downloadFile(backupFileName('fpb'), content)) markExported(); UI.toast(message); };
  if (target !== 'share') { save('Verschlüsseltes Backup gespeichert.'); return Promise.resolve('file'); }
  return shareBackup(content).then((result) => {
    if (result === 'shared') { markExported(); UI.toast('Sicherung geteilt – verschlüsselt.'); }
    else if (result === 'cancelled') UI.toast('Teilen abgebrochen. Es wurde nichts weitergegeben.');
    else if (result === 'blocked') UI.toast('Deine Sicherung ist fertig.', { label: 'Jetzt teilen', run: () => deliverBackup(content, 'share'), ms: 10000 });
    else save('Teilen geht hier nicht – die Sicherung wurde als Datei gespeichert.');
    return result;
  }).catch((e) => { reportError('Teilen', e); save('Teilen hat nicht geklappt – die Sicherung wurde als Datei gespeichert.'); return 'file'; });
}

/* Globale Suche */
function searchAll(term) {
  const q = term.trim().toLowerCase();
  if (q.length < 2) return [];
  const results = [];
  const add = (view, title, sub) => results.push({ view, title, sub });
  for (const e of Store.state.entries) {
    if (e.name.toLowerCase().includes(q) || catLabel(e.category).toLowerCase().includes(q) || (e.note || '').toLowerCase().includes(q)) {
      add(e.kind === 'income' ? 'income' : e.interval === 'once' ? 'expenses' : 'contracts',
        e.name, `${e.kind === 'income' ? 'Einnahme' : 'Ausgabe'}, ${catLabel(e.category)}, ${Fmt.money(e.amount)}`);
    }
  }
  const tq = q.replace(/^#/, '');
  for (const t of allTags().values()) if (tq.length >= 2 && t.key.includes(tq)) results.unshift({ view: 'reports', tag: t.key, title: `#${t.name}`, sub: `Schlagwort, ${t.count} ${t.count === 1 ? 'Buchung' : 'Buchungen'}` }); // E7: zuerst
  for (const g of Store.state.goals) if (g.name.toLowerCase().includes(q)) add('goals', g.name, `Sparziel, ${Fmt.money(g.saved)} von ${Fmt.money(g.target)}`);
  for (const a of Store.state.accounts) if (a.name.toLowerCase().includes(q)) add('accounts', a.name, `Konto, ${Fmt.money(a.balance)}`);
  for (const d of Store.state.debts) if (d.name.toLowerCase().includes(q)) add('wealth', d.name, `Schuld, ${Fmt.money(d.remaining)}`);
  for (const wish of Store.state.wishlist) if (wish.name.toLowerCase().includes(q)) add('goals', wish.name, `Wunsch, ${Fmt.money(wish.price)}`);
  return results.slice(0, 8);
}

function renderSearchResults(term) {
  const box = $('#searchResults');
  if (!box) return;
  const results = searchAll(term);
  if (!results.length) {
    box.hidden = term.trim().length < 2;
    box.innerHTML = term.trim().length >= 2 ? '<p class="empty">Nichts gefunden.</p>' : '';
    return;
  }
  box.hidden = false;
  box.innerHTML = results.map((r) => `
    <button type="button" class="search-item" data-view="${r.view}"${r.tag ? ` data-tag="${esc(r.tag)}"` : ''}>
      <span class="row-title">${esc(r.title)}</span><span class="row-sub">${esc(r.sub)}</span>
    </button>`).join('');
}

/** Prüft die Daten auf Unstimmigkeiten und bietet eine Reparatur an. */
function runSelfCheck() {
  const copy = JSON.parse(JSON.stringify(Store.state));
  const { state, fixes } = repairState(copy);
  if (!fixes) { UI.toast('Alles in Ordnung: keine Unstimmigkeiten gefunden.'); return; }
  UI.modal({
    title: 'Daten prüfen',
    body: `<p class="dialog-text">Ich habe ${fixes} ${fixes === 1 ? 'Stelle' : 'Stellen'} gefunden, zum Beispiel Verweise auf gelöschte Konten oder ungültige Beträge. Soll ich das automatisch reparieren?</p>`,
    submitLabel: 'Reparieren',
    onSubmit: () => { writeRestorePoint('vor der Reparatur'); Store.replace(state); App.render(false); UI.toast(`${fixes} Stellen repariert.`); }

}

function restorePoint(index) {
  const point = readRestorePoints()[index];
  if (!point) return;
  UI.modal({
    title: 'Stand wiederherstellen',
    body: `<p class="dialog-text">Der Stand vom ${esc(new Date(point.at).toLocaleString('de-DE'))} (${esc(point.reason)}) wird geladen. Der aktuelle Stand bleibt über Rückgängig erreichbar.</p>`,
    submitLabel: 'Wiederherstellen',
    danger: true,
    onSubmit: () => {
      const text = Vault.isEnvelope(point.data)
        ? (Vault.key ? Vault.decryptWith(Vault.key, point.data) : Promise.reject(new Error('gesperrt')))
        : Promise.resolve(point.data);
      text.then((json) => {
        Store.replace(repairState(Store.migrate(JSON.parse(json))).state);
        App.render(true);
        UI.toast('Stand wiederhergestellt.', { label: 'Rückgängig', run: () => Store.undo() });
      }).catch(() => UI.toast('Dieser Wiederherstellungspunkt lässt sich nicht öffnen – eventuell mit einer früheren PIN verschlüsselt.'));
    }
  });
}
