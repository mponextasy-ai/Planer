function openCategoryDelete(id) {
  const kind = categoryKind;
  const def = categoryDefs(kind).find((c) => c.id === id);
  if (!def || !def.custom) return;
  const used = Store.state.entries.filter((e) => e.category === id).length;
  const fallback = kind === 'income' ? 'sonstige' : 'sonstiges';
  const options = Object.fromEntries(categoryDefs(kind).filter((c) => c.id !== id && !c.hidden).map((c) => [c.id, c.label]));
  UI.modal({
    title: `Kategorie „${def.label}" löschen`,
    body: `<p class="dialog-text">${used ? `${used} Einträge nutzen diese Kategorie. Wohin sollen sie umziehen?` : 'Diese Kategorie wird von keinem Eintrag genutzt.'}</p>${field('Umhängen nach', selectEl('target', options, fallback))}`,
    submitLabel: 'Löschen',
    danger: true,
    onSubmit: (data) => {
      const target = data.target || fallback;
      Store.update((s) => {
        for (const e of s.entries) if (e.category === id) e.category = target;
        const moved = s.budgets.find((b) => b.category === id);
        if (moved) { if (s.budgets.some((b) => b.category === target)) s.budgets = s.budgets.filter((b) => b !== moved); else moved.category = target; }
        for (const list of [s.challenges || [], s.personalRules || [], s.templates || []]) for (const x of list) if (x.category === id) x.category = target;
        for (const key of Object.keys(s.categoryRules || {})) if (s.categoryRules[key] === id) s.categoryRules[key] = target;
        if (s.settings.defaultCategory === id) s.settings.defaultCategory = target;
        s.categories[kind] = (s.categories[kind] || []).filter((c) => c.id !== id);
      });
      UI.toast(`„${def.label}" gelöscht${used ? `, ${used} Einträge umgehängt` : ''}.`, { label: 'Rückgängig', run: () => Store.undo() });
    }
  });
}

/* ---------- 7n. Finanz-Zeitmaschine ---------- */
let timeTarget = null; // Zieldatum als 'YYYY-MM-DD'

/** Rechnet Kontostand, Vermögen, Sparziele und Schulden auf ein Zieldatum hoch. */
function projection(targetISO) {
  const t = today();
  const target = parseISO(targetISO);
  if (!(target > t)) return null;

  const events = calendarEvents(addDays(t, 1), target);
  for (const ev of Store.state.lifeEvents) {
    const date = parseISO(ev.date);
    if (date > t && date <= target) events.push({ date, amount: -ev.cost, kind: 'event', name: ev.name });
  }
  events.sort((a, b) => a.date - b.date);

  const days = Math.round((target - t) / 864e5);
  const stepDays = days <= 120 ? 7 : days <= 800 ? 14 : 30;
  const longRange = days > 400;
  let balance = Finance.summary().cash;
  const points = [{ date: new Date(t), label: 'heute', value: round2(balance) }];
  let index = 0;
  for (let d = addDays(t, stepDays); d <= target; d = addDays(d, stepDays)) {
    while (index < events.length && events[index].date <= d) balance += events[index++].amount;
    points.push({
      date: new Date(d), value: round2(balance),
      label: d.toLocaleDateString('de-DE', longRange ? { month: 'short', year: '2-digit' } : { day: '2-digit', month: 'short' })
    });
  }
  while (index < events.length) balance += events[index++].amount;
  const finalBalance = round2(balance);

  const months = Math.max(0, Math.round(days / 30.44));
  const goals = Store.state.goals.map((g) => {
    const saved = Math.min(g.target, round2(g.saved + g.monthlyRate * months));
    return { goal: g, saved, done: saved >= g.target };
  });
  const debts = Store.state.debts.map((d) => ({ debt: d, remaining: round2(Math.max(0, d.remaining - d.monthlyRate * months)) }));
  const accountsAt = Store.state.accounts.map((a) => ({ account: a, balance: accountBalanceAt(a, target) }));
  const liquidAt = round2(accountsAt.filter((x) => LIQUID_TYPES.includes(x.account.type)).reduce((sum, x) => sum + x.balance, 0));
  const otherAt = round2(accountsAt.filter((x) => !LIQUID_TYPES.includes(x.account.type)).reduce((sum, x) => sum + x.balance, 0));
  const liquid = accountsAt.length ? liquidAt : finalBalance;
  const netWorth = round2(liquid + otherAt - debts.reduce((sum, x) => sum + x.remaining, 0));

  const span = target - t;
  const markers = events
    .filter((e) => Math.abs(e.amount) >= 250)
    .slice(0, 14)
    .map((e) => ({ ratio: (e.date - t) / span, label: `${e.name}: ${Fmt.money(e.amount)} am ${e.date.toLocaleDateString('de-DE')}`, color: e.amount > 0 ? 'var(--income)' : e.kind === 'event' ? 'var(--saving)' : 'var(--expense)' }));

  const interest = round2(Store.state.accounts.reduce((sum, a) => sum + interestUntil(a, target), 0));
  return { target, points, finalBalance: liquid, netWorth, interest, goals, debts, months, markers, accountsAt, base: Finance.summary(), events };
}

/* ---------- 7o. Wenn-Dann-Regeln ---------- */
const RULE_TYPES = {
  'salary-split': 'Beim Gehalt einen Teil sparen',
  'surplus-transfer': 'Überschuss aufs Tagesgeld',
  'goal-chain': 'Sparrate auf das nächste Ziel',
  'budget-alert': 'Warnen, wenn ein Budget reißt',
  'round-up': 'Ausgaben aufrunden und sparen'
};

/* ---------- Aufrunden-Sparen (Etappe E9) ----------
   Jede einmalige Ausgabe (ein aufgeteilter Kauf zählt als einer) wird virtuell auf volle 1, 2, 5 oder 10 € aufgerundet.
   Die Differenzen sammeln sich je Monat; abgeschlossene Monate schlägt die App zum Einzahlen aufs Sparziel vor.
   Gezählt wird ab params.since (Monatsbeginn beim Anlegen), eingezahlte Monate stehen in params.paid[monatsbeginn]. */
const ROUND_STEPS = { 1: 'volle 1 €', 2: 'volle 2 €', 5: 'volle 5 €', 10: 'volle 10 €' };
const ROUND_MAX_MONTHS = 12;
/** Gehalts- und Überschuss-Regel: im laufenden App-Monat schon ausgeführt? Liefert den Betrag oder 0. */
const ruleDoneThisMonth = (rule) => Number(((rule.params || {}).paid || {})[toISO(monthBounds().from)]) || 0;
function markRuleDone(state, id, amount) {
  const r = state.rules.find((x) => x.id === id);
  if (r) r.params = { ...(r.params || {}), paid: { ...((r.params || {}).paid || {}), [toISO(monthBounds().from)]: round2(amount) } };
}
const roundUpOf = (amount, step) => { const a = round2(amount); return round2(Math.ceil(a / step - 1e-9) * step - a); };

/** Aufrunden für einen App-Monat (monthBounds-Versatz): Betrag und Anzahl der Käufe ab since. */
function roundUpMonth(offset, step, since) {
  const { from, to } = monthBounds(offset);
  const lo = since && since > toISO(from) ? since : toISO(from), hi = toISO(to);
  const buys = groupSplits(Store.state.entries.filter((e) => e.kind === 'expense' && e.interval === 'once' && e.date >= lo && e.date <= hi));
  let amount = 0, count = 0;
  for (const e of buys) { const r = roundUpOf(e.amount, step); if (r > 0) { amount += r; count++; } }
  return { key: toISO(from), from, to, label: periodLabel({ from, to }, false), amount: round2(amount), count, buys: buys.length };
}

/** Stand einer Aufrunden-Regel: laufender Monat, offene (abgeschlossene, nicht eingezahlte) Monate, Zielsparziel. */
function roundUpStatus(rule) {
  const s = Store.state, p = rule.params || {};
  const step = ROUND_STEPS[p.step] ? Number(p.step) : 1;
  const since = p.since || toISO(monthBounds().from);
  const paid = p.paid || {};
  const current = roundUpMonth(0, step, since);
  const pending = [];
  for (let o = -1; o >= -ROUND_MAX_MONTHS; o--) {
    const b = monthBounds(o);
    if (toISO(b.to) < since) break;
    if (paid[toISO(b.from)] !== undefined) continue;
    const m = roundUpMonth(o, step, since);
    if (m.amount > 0) pending.unshift(m);
  }
  const chosen = s.goals.find((g) => g.id === p.goalId);
  const goal = chosen && chosen.saved < chosen.target ? chosen : s.goals.find((g) => g.saved < g.target) || chosen || null;
  return { step, since, current, pending, pendingTotal: round2(pending.reduce((sum, m) => sum + m.amount, 0)), goal, redirected: !!(chosen && goal && goal.id !== chosen.id) };
}

/** Grobe Vorschau: Durchschnitt der letzten drei abgeschlossenen Monate (ohne since). */
function roundUpPreview(step) {
  const ms = [-1, -2, -3].map((o) => roundUpMonth(o, step, null));
  const withBuys = ms.filter((m) => m.buys > 0);
  if (!withBuys.length) return null;
  return { amount: round2(withBuys.reduce((sum, m) => sum + m.amount, 0) / withBuys.length), count: Math.round(withBuys.reduce((sum, m) => sum + m.count, 0) / withBuys.length) };
}

/** Prüft alle Regeln gegen die aktuellen Zahlen. */
function evaluateRules() {
  const s = Store.state;
  const k = Finance.summary();
  return s.rules.map((rule) => {
    const p = rule.params || {};
    if (rule.type === 'salary-split') {
      const goal = s.goals.find((g) => g.id === p.goalId) || s.goals.find((g) => g.saved < g.target) || s.goals[0];
      const salary = s.entries.filter((e) => e.kind === 'income' && e.interval === 'monthly').reduce((sum, e) => sum + e.amount, 0);
      const amount = round2(salary * (p.percent || 20) / 100);
      const done = ruleDoneThisMonth(rule); // E9: höchstens einmal pro Monat
      return { rule, level: done ? 'ok' : 'info', when: `Wenn dein Gehalt von ${Fmt.money(round2(salary))} eingeht`,
        then: done ? `diesen Monat erledigt: ${Fmt.money(done)} auf ${goal ? goal.name : 'dein Sparziel'} eingezahlt` : `${p.percent || 20} % davon, also ${Fmt.money(amount)}, wandern auf ${goal ? goal.name : 'dein Sparziel'}`,
        action: !done && goal && amount > 0 ? { label: 'Jetzt einzahlen', id: 'rule-run', arg: rule.id } : null };
    }
    if (rule.type === 'surplus-transfer') {
      const surplus = round2(k.income - k.expenses - k.saving);
      const account = s.accounts.find((a) => a.id === p.accountId) || s.accounts.find((a) => a.type === 'tagesgeld');
      const over = round2(surplus - (p.threshold || 200));
      const done = ruleDoneThisMonth(rule); // E9: höchstens einmal pro Monat
      return { rule, level: over > 0 || done ? 'ok' : 'info', when: `Wenn mehr als ${Fmt.money(p.threshold || 200)} übrig bleiben`,
        then: done ? `diesen Monat erledigt: ${Fmt.money(done)} auf ${account ? account.name : 'dein Tagesgeld'} verschoben` : over > 0 ? `${Fmt.money(over)} könnten auf ${account ? account.name : 'dein Tagesgeld'} wandern` : `aktuell bleiben ${Fmt.money(surplus)}, das reicht noch nicht`,
        action: !done && over > 0 && account ? { label: `${Fmt.money(over)} verschieben`, id: 'rule-run', arg: rule.id } : null };
    }
    if (rule.type === 'goal-chain') {
      const finished = s.goals.find((g) => g.saved >= g.target && g.monthlyRate > 0);
      const next = s.goals.find((g) => g.saved < g.target);
      return { rule, level: finished ? 'ok' : 'info', when: 'Wenn ein Sparziel erreicht ist',
        then: finished && next ? `${Fmt.money(finished.monthlyRate)} von ${finished.name} gehen an ${next.name}` : 'Sobald ein Ziel voll ist, geht die Rate an das nächste',
        action: finished && next ? { label: 'Rate übertragen', id: 'rule-run', arg: rule.id } : null };
    }
    if (rule.type === 'round-up') {
      const st = roundUpStatus(rule);
      const months = st.pending.map((m) => m.label).join(', ');
      const target = st.goal ? st.goal.name : 'dein Sparziel';
      return { rule, level: st.pendingTotal > 0 ? 'ok' : 'info', when: `Bei jeder Ausgabe auf ${ROUND_STEPS[st.step]} aufrunden`,
        then: `${st.current.label} bisher ${Fmt.money(st.current.amount)} aus ${st.current.count} ${st.current.count === 1 ? 'Ausgabe' : 'Ausgaben'}${st.pendingTotal > 0 ? ` · bereit für ${target}: ${Fmt.money(st.pendingTotal)} aus ${months}` : ` · wandert nach Monatsende auf ${target}`}`,
        action: st.pendingTotal > 0 && st.goal ? { label: `${Fmt.money(st.pendingTotal)} einzahlen`, id: 'rule-run', arg: rule.id } : null, roundUp: st };
    }
    const over = Finance.budgetStatus().filter((b) => b.ratio >= 1);
    return { rule, level: over.length ? 'warn' : 'ok', when: 'Wenn ein Budget überschritten wird',
      then: over.length ? `${over.map((b) => catLabel(b.category)).join(', ')} liegt über dem Limit` : 'alle Budgets liegen im Rahmen', action: null };
  });
}

/** Führt die Aktion einer Regel aus. */
function runRule(id) {
  const s = Store.state;
  const rule = s.rules.find((r) => r.id === id);
  if (!rule) return;
  const p = rule.params || {};
  if (rule.type === 'salary-split') {
    const goal = s.goals.find((g) => g.id === p.goalId) || s.goals.find((g) => g.saved < g.target) || s.goals[0];
    const salary = s.entries.filter((e) => e.kind === 'income' && e.interval === 'monthly').reduce((sum, e) => sum + e.amount, 0);
    const amount = round2(salary * (p.percent || 20) / 100);
    if (!goal || !(amount > 0)) return;
    if (ruleDoneThisMonth(rule)) { UI.toast('Diesen Monat schon eingezahlt.'); return; }
    const booked = round2(Math.min(amount, Math.max(0, goal.target - goal.saved)));
    Store.update((st) => { const g = st.goals.find((x) => x.id === goal.id); g.saved = round2(g.saved + booked); markRuleDone(st, id, booked); });
    UI.toast(booked < amount ? `${Fmt.money(booked)} auf ${goal.name} eingezahlt – das Ziel ist jetzt voll.` : `${Fmt.money(amount)} auf ${goal.name} eingezahlt.`, { label: 'Rückgängig', run: () => Store.undo() });
    return;
  }
  if (rule.type === 'surplus-transfer') {
    const k = Finance.summary();
    const amount = round2(k.income - k.expenses - k.saving - (p.threshold || 200));
    const target = s.accounts.find((a) => a.id === p.accountId) || s.accounts.find((a) => a.type === 'tagesgeld');
    const source = s.accounts.find((a) => a.type === 'giro');
    if (!(amount > 0) || !target || !source) { UI.toast('Dafür fehlt noch ein Überschuss oder ein Zielkonto.'); return; }
    if (ruleDoneThisMonth(rule)) { UI.toast('Diesen Monat schon verschoben.'); return; }
    Store.update((st) => {
      markRuleDone(st, id, amount);
      const from = st.accounts.find((a) => a.id === source.id), to = st.accounts.find((a) => a.id === target.id);
      from.balance = round2(from.balance - amount);
      to.balance = round2(to.balance + amount);
      const date = toISO(today());
      [from, to].forEach((a) => { a.history = a.history || []; const same = a.history.find((x) => x.date === date); if (same) same.balance = a.balance; else a.history.push({ date, balance: a.balance }); });
    });
    UI.toast(`${Fmt.money(amount)} auf ${target.name} verschoben.`, { label: 'Rückgängig', run: () => Store.undo() });
    return;
  }
  if (rule.type === 'round-up') {
    const st = roundUpStatus(rule);
    if (!(st.pendingTotal > 0) || !st.goal) { UI.toast(st.goal ? 'Gerade ist nichts zum Einzahlen offen – abgeschlossene Monate kommen hier an.' : 'Lege zuerst ein Sparziel an.'); return; }
    const room = round2(Math.max(0, st.goal.target - st.goal.saved));
    const booked = round2(Math.min(st.pendingTotal, room));
    Store.update((x) => {
      const g = x.goals.find((y) => y.id === st.goal.id);
      g.saved = round2(g.saved + booked);
      const r = x.rules.find((y) => y.id === id);
      r.params = { ...r.params, paid: { ...(r.params.paid || {}) } };
      for (const m of st.pending) r.params.paid[m.key] = m.amount;
    });
    const months = st.pending.map((m) => m.label).join(', ');
    UI.toast(booked < st.pendingTotal ? `${Fmt.money(booked)} aus ${months} auf ${st.goal.name} eingezahlt – das Ziel ist jetzt voll.` : `Aufgerundet: ${Fmt.money(booked)} aus ${months} auf ${st.goal.name} eingezahlt.`, { label: 'Rückgängig', run: () => Store.undo() });
    return;
  }
  if (rule.type === 'goal-chain') {
    const finished = s.goals.find((g) => g.saved >= g.target && g.monthlyRate > 0);
    const next = s.goals.find((g) => g.saved < g.target);
    if (!finished || !next) { UI.toast('Gerade ist kein Ziel fertig.'); return; }
    Store.update((st) => {
      const done = st.goals.find((g) => g.id === finished.id), open = st.goals.find((g) => g.id === next.id);
      open.monthlyRate = round2(open.monthlyRate + done.monthlyRate);
      done.monthlyRate = 0;
    });
    UI.toast(`Sparrate geht jetzt an ${next.name}.`);
  }
}

/* ---------- 7p. Persönliche Finanzregeln ---------- */
const PERSONAL_TYPES = {
  'min-balance': 'Girokonto nie unter …',
  'min-saving-rate': 'Mindestens … % sparen',
  'max-category': 'Kategorie höchstens … € im Monat',
  'max-count': 'Kategorie höchstens … Mal pro Woche'
};

/** Prüft jede Regel: erfüllt, gefährdet oder verletzt. */
function evaluatePersonalRules() {
  const k = Finance.summary();
  const t = today();
  const { from, to } = monthBounds();
  return (Store.state.personalRules || []).map((r) => {
    const v = Number(r.value) || 0;
    if (r.type === 'min-balance') {
      const main = Store.state.accounts.find((a) => a.id === mainAccountId());
      if (!main) return { r, status: 'gefährdet', title: `Girokonto nie unter ${Fmt.money(v)}`, text: 'Lege ein Girokonto an, damit ich das prüfen kann.' };
      let balance = main.balance, low = balance, lowDate = t;
      for (const f of accountFlows(addDays(t, 1), to)) {
        if (f.accountId !== main.id) continue;
        balance += f.amount;
        if (balance < low) { low = balance; lowDate = f.date; }
      }
      const status = main.balance < v ? 'verletzt' : low < v ? 'gefährdet' : 'erfüllt';
      return { r, status, title: `${main.name} nie unter ${Fmt.money(v)}`,
        text: status === 'erfüllt' ? `Tiefster Stand bis Monatsende: ${Fmt.money(round2(low))}.` : `Tiefster Stand ${Fmt.money(round2(low))} am ${lowDate.toLocaleDateString('de-DE')}.` };
    }
    if (r.type === 'min-saving-rate') {
      const rate = k.savingsRate * 100;
      const status = rate >= v ? 'erfüllt' : rate >= v * 0.75 ? 'gefährdet' : 'verletzt';
      return { r, status, title: `Mindestens ${v} % sparen`, text: `Aktuell ${Fmt.pct(k.savingsRate)} Sparquote.` };
    }
    if (r.type === 'max-category') {
      const spent = Finance.sum('expense', from, to, (e) => e.category === r.category);
      const ratio = v > 0 ? spent / v : 0;
      const status = ratio > 1 ? 'verletzt' : ratio >= budgetWarn() ? 'gefährdet' : 'erfüllt';
      return { r, status, title: `${catLabel(r.category)} höchstens ${Fmt.money(v)}`, text: `Bisher ${Fmt.money(spent)} in diesem Monat, ${Fmt.money(round2(Math.max(0, v - spent)))} Luft.` };
    }
    const weekBegin = addDays(t, -weekdayIndex(t));
    const count = Store.state.entries.filter((e) => e.kind === 'expense' && e.interval === 'once' && e.category === r.category && e.date >= toISO(weekBegin) && e.date <= toISO(t)).length;
    const status = count > v ? 'verletzt' : count === v ? 'gefährdet' : 'erfüllt';
    return { r, status, title: `${catLabel(r.category)} höchstens ${v} Mal pro Woche`, text: `Diese Woche ${count} Mal.` };
  });
}

/* ---------- 7q. Roadmap mit freischaltbaren Erfolgen ---------- */

/** Alle Meilensteine mit aktuellem Wert und Ziel. */
function milestones() {
  const s = Store.state;
  const k = Finance.summary();
  const monthly = averageMonthlyExpenses() || 1;
  const emergency = s.goals.find((g) => /notgroschen|rücklage|reserve/i.test(g.name));
  const reserve = emergency ? emergency.saved : s.accounts.filter((a) => a.type === 'tagesgeld' || a.type === 'bargeld').reduce((sum, a) => sum + a.balance, 0);
  const list = [
    { id: 'start', title: 'Erster Eintrag', value: s.entries.length ? 1 : 0, target: 1, sub: 'die Reise beginnt' },
    { id: 'wealth-500', title: 'Erste 500 €', value: k.netWorth, target: 500, sub: 'Nettovermögen' },
    { id: 'reserve-1', title: 'Erster Notgroschen', value: reserve, target: monthly, sub: 'eine Monatsausgabe auf der Seite' },
    { id: `rate-${Math.round(savingsTarget() * 100)}`, title: `${Math.round(savingsTarget() * 100)} % Sparquote`, value: k.savingsRate, target: savingsTarget(), sub: 'in einem Monat', pct: true },
    ...s.goals.map((g) => ({ id: 'goal-' + g.id, title: `${g.name} erreicht`, value: g.saved, target: g.target, sub: `Sparziel über ${Fmt.money(g.target)}` })),
    { id: 'reserve-3', title: 'Notgroschen komplett', value: reserve, target: monthly * reserveMonths(), sub: `${reserveMonths()} Monatsausgaben` },
    ...(s.debts.length ? [{ id: 'debt-free', title: 'Schuldenfrei', value: k.debts <= 0 ? 1 : 0, target: 1, sub: 'alle Schulden getilgt' }] : []),
    { id: 'wealth-10k', title: '10.000 € Vermögen', value: k.netWorth, target: 10000, sub: 'Nettovermögen' }
  ];
  return list.map((m) => ({ ...m, done: !!(s.achievements || {})[m.id] || m.value >= m.target, date: (s.achievements || {})[m.id] }));
}

/** Schaltet neu erreichte Erfolge frei – dauerhaft, mit dezentem Konfetti. */
function checkAchievements() {
  const s = Store.state;
  if (!s || isEmptyState()) return;
  s.achievements = s.achievements || {};
  const fresh = [];
  for (const m of milestones()) {
    if (m.value >= m.target && !s.achievements[m.id]) { s.achievements[m.id] = toISO(today()); fresh.push(m); }
  }
  if (!fresh.length) return;
  Store.save();
  if (fresh.length <= 2 && App.ready) {
    confetti();
    UI.toast(`Erfolg freigeschaltet: ${fresh.map((m) => m.title).join(' und ')}`);
  }
}

function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (Store.state && Store.state.settings.animations === 'aus') return;
  const box = document.createElement('div');
  box.className = 'confetti';
  for (let i = 0; i < 26; i++) {
    const piece = document.createElement('i');
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = PALETTE[i % PALETTE.length];
    piece.style.animationDelay = `${Math.random() * 0.35}s`;
    piece.style.setProperty('--dx', `${Math.round(Math.random() * 160 - 80)}px`);
    box.append(piece);
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 2400);
}

function roadmapPanel() {
  const list = milestones();
  const done = list.filter((m) => m.done).length;
  const lastDone = list.reduce((acc, m, i) => (m.done ? i : acc), -1);
  const fill = list.length > 1 ? Math.max(0, lastDone) / (list.length - 1) * 100 : 0;
  const nodes = list.map((m, i) => {
    const ratio = m.target > 0 ? Math.max(0, Math.min(1, m.value / m.target)) : 0;
    const state = m.done ? 'done' : i === lastDone + 1 ? 'next' : 'open';
    return `
      <li class="rm-node ${state}">
        <span class="rm-dot">${m.done ? icon('check') : ''}</span>
        <span class="rm-title">${esc(m.title)}</span>
        <span class="rm-sub">${m.done ? (m.date ? `erreicht am ${parseISO(m.date).toLocaleDateString('de-DE')}` : 'erreicht') : `${Math.round(ratio * 100)} %, ${esc(m.sub)}`}</span>
      </li>`;
  }).join('');
  return `
    <section class="panel s12">
      <h2>Deine Roadmap <span class="badge tone-brand">${done} von ${list.length} Erfolgen</span></h2>
      <div class="roadmap" style="--fill:${fill.toFixed(1)}%">
        <span class="rm-track"><i></i></span>
        <ol>${nodes}</ol>
      </div>
    </section>`;
}

/* ---------- 7r. Finanz-Universum ----------
   Konten sind Planeten, Sparziele Monde, Einnahmen leuchtende Zuflüsse aus dem
   Zentrum, Ausgaben Abflüsse ins All, Überweisungen animierte Bahnen.
   Gezeichnet auf Canvas in Geräteauflösung, damit alles scharf bleibt.        */
const UNIVERSE_QUALITY = {
  sparsam: { stars: 0.5, particles: 90, rate: 0.5, dpr: 1.25, fps: 30 },
  ausgewogen: { stars: 1, particles: 260, rate: 1, dpr: 2, fps: 120 },
  ultra: { stars: 1.6, particles: 420, rate: 1.4, dpr: 2.5, fps: 120 }
};
const universeProfile = () => UNIVERSE_QUALITY[setting('universeQuality')] || UNIVERSE_QUALITY.ausgewogen;

/* ---------- Universum 2.0, Etappe U1: Szenenmodell und Kamera ----------
   buildUniverseModel(datum) leitet die Szene nur aus Datenstand und Datum ab: kein Zufall, kein DOM,
   verändert nichts. Universe zeichnet das Modell mit einer Kamera (Weltursprung = Sonne, eine
   Welteinheit = ein Bildschirmpunkt bei Zoom 1). Canvas 2D bleibt Rückfallebene für WebGL (U2).     */

/** Kontostand an einem Datum: Zukunft über die Prognose, Vergangenheit über den Kontoverlauf. */
function balanceOn(account, date) {
  const t = today();
  if (date > t) return accountBalanceAt(account, date);
  const iso = toISO(date);
  if (iso === toISO(t)) return round2(account.balance);
  let best = null;
  for (const h of account.history || []) if (h.date <= iso && (!best || h.date > best.date)) best = h;
  return round2(best ? best.balance : account.balance);
}

/** Gesparter Betrag eines Ziels an einem Datum; in der Zukunft mit Sparrate, höchstens bis zum Ziel. */
function goalSavedOn(goal, date) {
  const t = today();
  if (!(date > t) || !(goal.monthlyRate > 0)) return round2(goal.saved);

      const drawSpheres = (list, occluder) => {

        const d = sphGeo.data = grow(sphGeo.data, list.length * 30);
          list.forEach((b, i) => {
            const c = rgb(b.kind === 'satellite' ? (b.alert ? '#F2B84B' : '#CFE0F5') : b.color);
            const atmo = b.kind === 'planet' && b.atmosphere ? rgb(b.atmosphere.color) : c;
            const mix = b.kind === 'planet' ? (b.mix || []) : [];
            const band = (k) => rgb((mix[Math.min(k, mix.length - 1)] || {}).color || b.color);
            const sf = b.kind === 'planet' && b.surface ? b.surface : null;
            const [dx, dy, lz] = U.lightDir(b), ln = 1;
            d.set([b.x, b.y, b.rs, c[0], c[1], c[2], b.kind === 'planet' ? 1 : b.kind === 'satellite' ? b.blink * 1.6 : 0, atmo[0], atmo[1], atmo[2],
              ...band(0), ...band(1), ...band(2), mix.length ? mix[0].share : 0, mix.length > 1 ? mix[1].share : 0, b.kind === 'moon' ? b.progress : 0,
              b.kind === 'moon' ? 2 : b.kind === 'planet' ? 1 : 0,
              sf ? sf.type : 0, sf ? sf.seed : hash01(`${b.kind}-${b.id}`), sf ? sf.spin : 0, sf ? sf.tilt : 0, dx / ln, dy / ln, lz / ln], i * 30);
            });
        gl.useProgram(sph.prog);
        gl.uniform1f(sph.u.uTime, U.time);
        gl.uniform1f(sph.u.uOcc, occluder ? 1 : 0);
        gl.bindVertexArray(sphGeo.vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, sphGeo.buf);
        gl.bufferData(gl.ARRAY_BUFFER, d.subarray(0, list.length * 30), gl.DYNAMIC_DRAW);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, list.length);
      };
      const drawSun = (mask) => {
        gl.useProgram(sunP.prog);
        gl.uniform2f(sunP.u.uRes, U.w, U.h);
        gl.uniform2f(sunP.u.uCenter, U.sunScreen.x, U.sunScreen.y);
        gl.uniform1f(sunP.u.uRadius, U.sunScreen.disk);
        gl.uniform1f(sunP.u.uExt, 4.2);
        gl.uniform1f(sunP.u.uTime, U.time);
        gl.uniform1f(sunP.u.uMask, mask ? 1 : 0);
        gl.uniform1f(sunP.u.uGlow, Math.max(0.35, (U.glowStrength ?? 0.85) / 0.85));
        gl.uniform1f(sunP.u.uPayday, U.model && U.model.sun.payday ? 1 : 0);
        gl.bindVertexArray(emptyVao);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      };
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      drawSpheres(behind, false);
      drawSun(false);
      // Partikel, Portale und Kometen leuchten additiv
      gl.blendFunc(gl.ONE, gl.ONE);
      drawPoints(U.particles.length + U.bodies.length * 11, (put) => {
        for (const pa of U.particles) if (pa.visible) put(pa.sx, pa.sy, pa.size * 1.6, rgb(pa.color), pa.alpha, 1);
        const zg = Math.min(2.2, Math.sqrt(U.cam.zoom));
        for (const b of U.bodies) {
          if (!b.visible) continue;
          if (b.kind === 'wormhole') put(b.x, b.y, b.rs * 4.4, [0.43, 0.58, 0.95], 0.95, 4);
          else if (b.kind === 'comet') {
            const c = rgb(b.color);
            for (const [tx, ty, f] of b.tail) put(tx, ty, (6 + 10 * f) * zg, c, 0.55 * f, 1);
            put(b.x, b.y, 20 * zg, c, 1, 1);
          }
        }
      });
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      drawSpheres(before, false);
      if (ringStrips.some((r) => r.front)) {
        gl.useProgram(lin.prog);
        gl.bindVertexArray(linVao);
        gl.uniform3f(lin.u.uDash, 0, 0, 0);
        for (const r of ringStrips) if (r.front) { gl.uniform4f(lin.u.uColor, r.color[0], r.color[1], r.color[2], r.alpha); gl.drawArrays(gl.TRIANGLE_STRIP, strips[r.i].start, strips[r.i].end - strips[r.i].start); }
      }
      // Linsenreflexe: nur wenn die Sonne zu sehen ist; schwächer, wenn Körper sie verdecken
      const flare = U.flares === false ? 0 : U.flareStrength();
      if (flare > 0.01) {
        const S = U.sunScreen, R = S.disk, ax = U.w / 2 - S.x, ay = U.h / 2 - S.y;
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        drawPoints(UNI_FLARES.length + 2, (put) => {
          for (const [t, sz, c, al, kind] of UNI_FLARES) put(S.x + ax * t, S.y + ay * t, R * sz, c, al * flare, kind);
          put(S.x, S.y, R * 9, [0.55, 0.72, 1], 0.55 * flare, 7);
          put(S.x, S.y, R * 4.4, [1, 0.93, 0.8], 0.5 * flare, 8);
        });
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      }
      // Nachleuchten
      raysNow = false;
      if (scene) {
        gl.disable(gl.BLEND);
        gl.bindVertexArray(emptyVao);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, bA.fb);
        gl.viewport(0, 0, bA.w, bA.h);
        gl.useProgram(bright.prog);
        gl.bindTexture(gl.TEXTURE_2D, scene.tex);
        gl.uniform1i(bright.u.uTex, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.useProgram(blur.prog);
        gl.uniform1i(blur.u.uTex, 0);
        // zwei Durchgänge waagerecht und senkrecht, der zweite mit doppeltem Abstand: weicher, weiter Schein
        for (const spread of [1, 2]) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, bB.fb);
          gl.bindTexture(gl.TEXTURE_2D, bA.tex);
          gl.uniform2f(blur.u.uDir, spread / bA.w, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.bindFramebuffer(gl.FRAMEBUFFER, bA.fb);
          gl.bindTexture(gl.TEXTURE_2D, bB.tex);
          gl.uniform2f(blur.u.uDir, 0, spread / bA.h);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        // Lichtstrahlen: Maske (Sonne hell, Körper davor schwarz) radial zur Sonne weichzeichnen
        const S = U.sunScreen;
        const rayOn = !!rA && U.rays !== false && (U.glowStrength ?? 0.85) > 0 && (U.rayFade || 0) > 0.01;
        if (rayOn) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, rA.fb);
          gl.viewport(0, 0, rA.w, rA.h);
          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.clearColor(0, 0, 0, 0);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          drawSun(true);
          drawSpheres(before, true);
          gl.disable(gl.BLEND);
          gl.bindVertexArray(emptyVao);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, rB.fb);
          gl.useProgram(rays.prog);
          gl.bindTexture(gl.TEXTURE_2D, rA.tex);
          gl.uniform1i(rays.u.uTex, 0);
          gl.uniform2f(rays.u.uSun, S.x / U.w, 1 - S.y / U.h);
          gl.uniform1f(rays.u.uDecay, 0.955);
          gl.uniform1f(rays.u.uWeight, 0.05);
          gl.uniform1f(rays.u.uDensity, 0.92);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        raysNow = rayOn;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, pw, ph);
        gl.useProgram(comp.prog);
        gl.bindTexture(gl.TEXTURE_2D, scene.tex);
        gl.uniform1i(comp.u.uScene, 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, bA.tex);
        gl.uniform1i(comp.u.uBloom, 1);
        gl.uniform1f(comp.u.uStrength, U.glowStrength ?? 0.85);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, rayOn ? rB.tex : bA.tex);
        gl.uniform1i(comp.u.uRays, 2);
        gl.uniform1f(comp.u.uRayStrength, rayOn ? (U.glowStrength ?? 0.85) * U.rayFade : 0);
        const sx = pw / U.w;
        gl.uniform2f(comp.u.uSunPx, S.x * sx, (U.h - S.y) * sx);
        gl.uniform1f(comp.u.uSunR, S.disk * sx);
        gl.uniform2f(comp.u.uView, pw, ph);
        gl.uniform1f(comp.u.uUseMask, 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.activeTexture(gl.TEXTURE0);
      }
      gl.bindVertexArray(null);
    }
  };
}

/* ---------- Universum 2.0, Etappe U6a: Klang und Haptik ----------
   Leise, synthetisch erzeugte Töne (Web Audio, keine Dateien), nur mit Einstellung „Klänge im Universum“. */
const UniSound = {
  ac: null,
  play(kind) {
    if (!Store.state || !Store.state.settings.universeSound) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = this.ac || new AC(); } catch (e) { return; }
    const ac = this.ac, t = ac.currentTime;
    if (ac.state === 'suspended' && ac.resume) ac.resume();
    const tone = (freq, start, dur, type = 'sine', gain = 0.05, glide = 0) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t + start);
      if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + start + dur);
      g.gain.setValueAtTime(0.0001, t + start);
      g.gain.exponentialRampToValueAtTime(gain, t + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
      o.connect(g);
      g.connect(ac.destination);
      o.start(t + start);
      o.stop(t + start + dur + 0.05);
    };
    const sounds = {
      select: () => tone(660, 0, 0.12),
      fly: () => tone(300, 0, 0.5, 'sine', 0.04, 900),
      drop: () => { tone(520, 0, 0.12); tone(780, 0.09, 0.18); },
      book: () => { tone(523, 0, 0.14); tone(659, 0.1, 0.14); tone(784, 0.2, 0.26); },
      menu: () => tone(440, 0, 0.08, 'triangle', 0.035)
    };
    if (sounds[kind]) sounds[kind]();
  }
};

// Optik V4: Himmel. Galaktische Ebene schräg durch die Standardansicht, Zentrum leicht seitlich im Bild; drei Emissionsnebel.
const UNI_SKY = (() => {
  const n = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const rot = (a, b, t) => n([a[0] * Math.cos(t) + b[0] * Math.sin(t), a[1] * Math.cos(t) + b[1] * Math.sin(t), a[2] * Math.cos(t) + b[2] * Math.sin(t)]);
  const f = [0, -Math.sin(UNI_PITCH.def), -Math.cos(UNI_PITCH.def)];
  const pole = n(cross(f, n([1, 0.6, 0]))), side = n(cross(pole, f));
  return { pole, core: rot(f, side, 0.25), nebulae: [rot(rot(f, side, -0.26), pole, 0.2), rot(f, side, 1.4), rot(rot(f, side, 2.6), pole, -0.3)], size: [2048, 1024] };
})();

  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.playTimer) clearInterval(this.playTimer);
    if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
    this.closeMenu();
    this.closeSearch();
    this.raf = null;
    this.playTimer = null;
    this.canvas = null;
  },

  /* ----- Zeitreise (U4): −12 bis +60 Monate, Szene zum Datum ohne Bruch in Bewegung und Kamera ----- */
  travel(offset) {
    const k = Math.max(-12, Math.min(60, Math.round(Number(offset) || 0)));
    this.timeOffset = k;
    this.date = k === 0 ? today() : addMonths(today(), k);
    if (!this.canvas) return;
    const keyOf = (b) => `${b.kind}:${b.id}:${b.end || ''}`;
    const angles = new Map(this.bodies.map((b) => [keyOf(b), b.angle]));
    const followKey = this.follow ? keyOf(this.follow) : null;
    const selectedKey = this.selected ? keyOf(this.selected) : null;
    const flightKey = this.flight && this.flight.target ? keyOf(this.flight.target) : null;
    const oldParticles = this.particles;
    this.build();
    for (const b of this.bodies) { const a = angles.get(keyOf(b)); if (a !== undefined) b.angle = a; }
    const byKey = new Map(this.bodies.map((b) => [keyOf(b), b]));
    this.follow = followKey ? byKey.get(followKey) || null : null;
    if (flightKey) { const t = byKey.get(flightKey); if (t) this.flight.target = t; else this.flight = null; }
    // laufende Partikel auf die Ströme des neuen Datums umhängen
    const flowKey = (f) => `${f.type}|${f.fromId || ''}|${f.toId || ''}|${f.id || ''}`;
    const flows = new Map(this.flows.map((f) => [flowKey(f), f]));
    this.particles = oldParticles.map((pa) => { const f = pa.flow.type === 'flare' ? this.flare : flows.get(flowKey(pa.flow)); return f ? { ...pa, flow: f } : null; }).filter(Boolean);
    this.updateTimeUi();
    if (uniTextOpen) this.renderText();
    const sel = selectedKey ? byKey.get(selectedKey) : null;
    if (sel) this.select(sel); else { this.selected = null; this.redraw(); }
  },

  togglePlay() {
    if (this.playTimer) { this.stopPlay(); return; }
    if (this.timeOffset >= 60) this.travel(-12);
    this.playTimer = setInterval(() => {
      if (!this.canvas || this.timeOffset >= 60) { this.stopPlay(); return; }
      this.travel(this.timeOffset + 1);
      if (this.timeOffset >= 60) this.stopPlay();
    }, uniPlayMs());
    this.updateTimeUi();
  },

  stopPlay() {
    if (this.playTimer) clearInterval(this.playTimer);
    this.playTimer = null;
    this.updateTimeUi();
  },

  updateTimeUi() {
    const k = this.timeOffset || 0;
    const when = k === 0 ? 'Heute' : this.date.toLocaleDateString('de-DE', { month: 'short', year: 'numeric' });
    const rel = k === 0 ? '' : k > 0 ? `in ${k} ${k === 1 ? 'Monat' : 'Monaten'}` : `vor ${-k} ${k === -1 ? 'Monat' : 'Monaten'}`;
    const slider = $('#uniTime'), label = $('#uniTimeLabel'), play = $('#uniPlay'), now = document.querySelector('.universe-time [data-action="uni-now"]');
    if (slider) { slider.value = String(k); slider.setAttribute('aria-valuetext', rel ? `${when}, ${rel}` : when); }
    if (label) label.innerHTML = `<b>${esc(when)}</b><small>${rel ? `${esc(rel)} · ` : ''}Vermögen ${Fmt.money(this.model ? this.model.netWorth : 0)}</small>`;
    if (play) { play.innerHTML = icon(this.playTimer ? 'pause' : 'play'); play.setAttribute('aria-label', this.playTimer ? 'Zeitreise anhalten' : 'Zeitreise abspielen'); }
    if (now) now.disabled = k === 0;
  },

  /** Rückfall auf Canvas 2D: frisches Canvas-Element (ein Element kann nur eine Kontextart haben). */
  fallback(reason) {
    const old = this.canvas || $('#universeCanvas');
    this.stop();
    this.forceCanvas = true;
    console.warn('Universum zeichnet mit Canvas 2D:', reason);
    if (old && old.isConnected) old.replaceWith(old.cloneNode(false));
    this.start();
  },

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.w = Math.max(280, rect.width);
    this.h = Math.max(320, rect.height);
    this.dpr = Math.max(0.5, Math.min(this.profile.dpr, window.devicePixelRatio || 1) * this.level.dprScale);
    this.canvas.width = Math.round(this.w * this.dpr);
    this.canvas.height = Math.round(this.h * this.dpr);
    if (this.gl) this.gl.resize();
    else if (this.ctx) this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.hud) {
      this.hudDpr = this.gl ? Math.min(2, window.devicePixelRatio || 1) : 1;
      this.hud.width = this.gl ? Math.round(this.w * this.hudDpr) : 0;
      this.hud.height = this.gl ? Math.round(this.h * this.hudDpr) : 0;
    }
  },

  /** Neue Qualitätsstufe übernehmen: Auflösung, Sterne, Nachleuchten. */
  applyLevel() {
    this.level = UNI_LEVELS[this.governor.level];
    this.resize();
    this.buildStars();
    if (this.gl) this.gl.setBloom(this.glowStrength > 0 ? this.level.bloom : 0);
    this.updateBadge();
  },

  updateBadge() {
    const el = $('#universeBadge');
    if (el) el.textContent = `${this.renderer === 'webgl2' ? 'WebGL2' : 'Canvas'} · Qualität ${this.level.name}${this.governor && this.governor.changes ? ' (automatisch)' : ''}`;
  },

  /** Leuchtpunkt als vorberechnetes Bild – schnell genug für viele Partikel. */
  sprite(color) {
    if (this.sprites[color]) return this.sprites[color];
    const c = document.createElement('canvas');
    c.width = c.height = 48;
    const g = c.getContext('2d');
    if (!g) return c;
    const grad = g.createRadialGradient(24, 24, 0, 24, 24, 24);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.18, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 48, 48);
    this.sprites[color] = c;
    return c;
  },

  /** Übernimmt das Szenenmodell und ergänzt nur, was fürs Zeichnen nötig ist. */
  build() {
    const model = this.model = buildUniverseModel(this.date || today());
    const accounts = new Map(Store.state.accounts.map((a) => [a.id, a]));
    const goals = new Map(Store.state.goals.map((g) => [g.id, g]));
    const planets = model.planets.map((pl) => ({ kind: 'planet', ...pl, account: accounts.get(pl.id), r: pl.radius, wx: 0, wy: 0, x: 0, y: 0, depth: 1 }));
    const byId = new Map(planets.map((pl) => [pl.id, pl]));
    const moons = model.moons.map((m) => ({ kind: 'moon', ...m, goal: goals.get(m.id), host: byId.get(m.hostId), r: m.radius, wx: 0, wy: 0, x: 0, y: 0, depth: 1 }));
    for (const ring of model.rings) { const pl = byId.get(ring.hostId); if (pl) pl.ring = ring; }
    const satellites = model.satellites.map((sa) => ({ kind: 'satellite', ...sa, host: byId.get(sa.hostId), r: sa.radius, wx: 0, wy: 0, x: 0, y: 0, depth: 1 }));
    const portals = [];
    for (const wh of model.wormholes) {
      const from = byId.get(wh.fromId), to = byId.get(wh.toId);
      if (!from || !to) continue;
      portals.push({ kind: 'wormhole', ...wh, end: 'in', near: from, far: to, r: 7, wx: 0, wy: 0, x: 0, y: 0, depth: 1 });
      portals.push({ kind: 'wormhole', ...wh, end: 'out', near: to, far: from, r: 7, wx: 0, wy: 0, x: 0, y: 0, depth: 1 });
    }
    const extra = [{ kind: 'sun', id: 'sun', name: 'Sonne', r: 30, wx: 0, wy: 0, x: 0, y: 0, depth: 1 }];
    if (model.blackHole) extra.push({ kind: 'blackhole', id: 'blackhole', name: 'Schulden', ...model.blackHole, r: model.blackHole.radius, wx: 0, wy: 0, x: 0, y: 0, depth: 1 });
    for (const c of model.comets) extra.push({ ...c, kind: 'comet', comet: c.kind, r: 5, wx: 0, wy: 0, x: 0, y: 0, depth: 1, tail: [] });
    for (const nb of model.nebulae) extra.push({ ...nb, kind: 'nebula', r: nb.radius, wx: 0, wy: 0, x: 0, y: 0, depth: 1 });
    // Sternbilder: Punkte der Standardansicht als feste Richtungen am Himmel
    const skyDir = (nx, ny) => {
      const cp = Math.cos(UNI_PITCH.def), sp = Math.sin(UNI_PITCH.def), t = Math.tan(UNI_FOV / 2);
      const a = (nx - 0.5) * 2 * t * 1.6, bb = -(ny - 0.5) * 2 * t;
      const d = [a, -sp + cp * bb, -cp - sp * bb], l = Math.hypot(d[0], d[1], d[2]);
      return [d[0] / l, d[1] / l, d[2] / l];
    };
    for (const cs of model.constellations) extra.push({ ...cs, kind: 'constellation', r: 20, wx: 0, wy: 0, x: 0, y: 0, depth: 1, screen: [], dirs: cs.points.map(([nx, ny]) => skyDir(nx, ny)) });
    this.flare = model.sun.payday ? { type: 'flare', rate: 0.012 * this.profile.rate * (this.particleFactor || 1), acc: 0 } : null;
    this.bodies = [...planets, ...moons, ...satellites, ...portals, ...extra];
    this.ordered = this.bodies.slice();
    const rnd = seededRandom(model.stars.seed);
    const maxFlow = Math.max(1, ...model.flows.map((f) => f.amount));
    this.flows = model.flows.map((f) => ({ ...f, from: byId.get(f.fromId), to: byId.get(f.toId), rate: (0.0012 + 0.006 * Math.sqrt(f.amount / maxFlow)) * this.profile.rate * (this.particleFactor || 1), acc: rnd() }));
    this.buildStars();
    this.particles = [];
  },

  /** Sternenhimmel: eigener Zufallsstrom, damit die ersten Sterne bei jeder Stufe gleich bleiben. */
  buildStars() {
    const rnd = seededRandom(this.model.stars.seed + 1);
    // Himmelskugel: gleichmäßig verteilte Richtungen; etwa 1/24 davon liegt im Blickfeld, daher 24-mal so viele wie früher
    this.stars = Array.from({ length: Math.round(this.model.stars.count * this.profile.stars * this.level.stars * 24) }, () => {
      const st = { x: rnd(), y: rnd(), layer: rnd() < 0.6 ? 0 : rnd() < 0.7 ? 1 : 2, size: rnd() * 1.3 + 0.3, phase: rnd() * 6.28, sx: 0, sy: 0, r: 0, alpha: 0, vis: false };
      const zz = st.x * 2 - 1, ang = st.y * Math.PI * 2, rr = Math.sqrt(1 - zz * zz);
      st.dx = rr * Math.cos(ang); st.dy = zz; st.dz = rr * Math.sin(ang);
      return st;
    });
    // Kosmischer Staub (V5): schwebt im Raum um das System, gibt Tiefe beim Drehen und Verschieben
    const rd = seededRandom(this.model.stars.seed + 11), span = Math.max(this.w, this.h) * 0.9;
    this.dust = Array.from({ length: Math.round(70 * (this.level.particles || 1) * (this.particleFactor || 1)) }, () => ({
      x: (rd() * 2 - 1) * span, z: (rd() * 2 - 1) * span, y: -60 + rd() * 260, vx: (rd() - 0.5) * 0.004, vz: (rd() - 0.5) * 0.004,
      size: 1 + rd() * 1.6, phase: rd() * 6.28, sx: 0, sy: 0, s: 0, vis: false }));
    // Hintergrundgalaxien (V4): feste Richtungen am Himmel, die erste in der Standardansicht
    const rg = seededRandom(this.model.stars.seed + 7), P = UNI_PITCH.def;
    this.galaxies = Array.from({ length: 9 }, (_, i) => {
      let d;
      if (i === 0) { const f = [-0.14, -Math.sin(P) + 0.11 * Math.cos(P), -Math.cos(P) - 0.11 * Math.sin(P)], l = Math.hypot(...f); d = f.map((v) => v / l); }
      else { const zz = rg() * 2 - 1, an = rg() * Math.PI * 2, rr = Math.sqrt(1 - zz * zz); d = [rr * Math.cos(an), zz, rr * Math.sin(an)]; }
      const kind = i === 0 ? 10 : 9 + Math.floor(rg() * 4);
      return { dx: d[0], dy: d[1], dz: d[2], kind, rot: Math.min(0.99, rg()), size: 16 + rg() * 26, alpha: 0.55 + rg() * 0.35, color: kind === 12 ? [1, 0.85, 0.65] : [0.62, 0.72, 1], sx: 0, sy: 0, vis: false };
    });
  },

  /* ----- Kamera ----- */
  /**
   * Perspektivische Kamera (V2): Ziel (cam.x, cam.y) auf der Bahnebene, Drehung yaw, Neigung pitch, Abstand aus dem Zoom.
   * Welt: X = wx, Y = wh (Höhe), Z = wy. Bei Zoom 1 entspricht eine Welteinheit am Ziel einem Bildschirmpunkt.
   */
  camera() {
    const c = this.cam, yaw = Number.isFinite(c.yaw) ? c.yaw : 0, pitch = Number.isFinite(c.pitch) ? c.pitch : UNI_PITCH.def;
    const k = this._camKey;
    if (k && k[0] === c.x && k[1] === c.y && k[2] === c.zoom && k[3] === yaw && k[4] === pitch && k[5] === this.w && k[6] === this.h) return this._cam;
    const fpx = (this.h / 2) / Math.tan(UNI_FOV / 2), D = fpx / c.zoom;
    const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
    this._cam = { fpx, D, yaw, pitch, px: c.x + D * sy * cp, py: D * sp, pz: c.y + D * cy * cp, fx: -sy * cp, fy: -sp, fz: -cy * cp, rx: cy, rz: -sy, ux: -sy * sp, uy: cp, uz: -cy * sp };
    this._camKey = [c.x, c.y, c.zoom, yaw, pitch, this.w, this.h];
    return this._cam;
  },

  project(X, Y, Z) {
    const C = this.camera();
    const vx = X - C.px, vy = Y - C.py, vz = Z - C.pz;
    const zc = vx * C.fx + vy * C.fy + vz * C.fz;
    const s = C.fpx / Math.max(zc, 1);
    return { x: this.w / 2 + (vx * C.rx + vz * C.rz) * s, y: this.h / 2 - (vx * C.ux + vy * C.uy + vz * C.uz) * s, s, z: zc, ok: zc > 1 };
  },

  /** Richtung am Himmel (unendlich fern): nur Drehung, keine Verschiebung. */
  projectDir(dx, dy, dz) {
    const C = this.camera();
    const zc = dx * C.fx + dy * C.fy + dz * C.fz;
    if (zc <= 0.02) return null;
    return { x: this.w / 2 + C.fpx * (dx * C.rx + dz * C.rz) / zc, y: this.h / 2 - C.fpx * (dx * C.ux + dy * C.uy + dz * C.uz) / zc };
  },

  worldToScreen(wx, wy, wh = 0) { return this.project(wx, wh, wy); },

  /** Bildschirmpunkt → Punkt auf der Bahnebene (Schnitt des Sehstrahls, oberhalb des Horizonts begrenzt). */
  screenToWorld(sx, sy) {
    const C = this.camera();
    const a = (sx - this.w / 2) / C.fpx, b = -(sy - this.h / 2) / C.fpx;
    const dx = C.fx + C.rx * a + C.ux * b, dy = Math.min(-1e-4, C.fy + C.uy * b), dz = C.fz + C.rz * a + C.uz * b;
    const t = -C.py / dy;
    return { x: C.px + dx * t, y: C.pz + dz * t };
  },

  /** Punkt der Ebene unter einem Bildschirmpunkt der Standardansicht (für fest platzierte Körper). */
  defaultPlane(sx, sy) {
    const keep = this.cam;
    this.cam = { x: 0, y: 0, zoom: 1, yaw: 0, pitch: UNI_PITCH.def };
    const p = this.screenToWorld(sx, sy);
    this.cam = keep;
    return p;
  },

  /** Zoomt so, dass der Punkt unter (sx, sy) – etwa zwischen den Fingern – liegen bleibt. */
  zoomAt(sx, sy, factor) {
    const before = this.screenToWorld(sx, sy);
    this.cam.zoom = Math.min(UNI_ZOOM.max, Math.max(UNI_ZOOM.min, this.cam.zoom * factor));
    const after = this.screenToWorld(sx, sy);
    this.cam.x += before.x - after.x;
    this.cam.y += before.y - after.y;
    this.flight = null;
    this.follow = null;
    this.redraw();
  },

  /** Verschiebt so, dass der Punkt unter dem Finger mitwandert (Finger jetzt bei sx, sy). */
  panBy(dx, dy, sx = this.w / 2 + dx, sy = this.h / 2 + dy) {
    const before = this.screenToWorld(sx - dx, sy - dy), after = this.screenToWorld(sx, sy);
    this.cam.x += before.x - after.x;
    this.cam.y += before.y - after.y;
    this.flight = null;
    this.follow = null;
    this.redraw();
  },

  /** Blick um das Ziel drehen (Mitfahren bleibt erhalten). */
  rotateBy(d) {
    const TAU = Math.PI * 2;
    this.cam.yaw = (((Number.isFinite(this.cam.yaw) ? this.cam.yaw : 0) + d) % TAU + TAU) % TAU;
    this.flight = null;
    this.redraw();
  },

  /** Neigung ändern: größer = steiler von oben. */
  tiltBy(d) {
    const cur = Number.isFinite(this.cam.pitch) ? this.cam.pitch : UNI_PITCH.def;
    this.cam.pitch = Math.min(UNI_PITCH.max, Math.max(UNI_PITCH.min, cur + d));
    this.flight = null;
    this.redraw();
  },

  /** Blickwinkel-Knopf: schräg, steil, Draufsicht, flach. */
  cycleView() {
    const cur = Number.isFinite(this.cam.pitch) ? this.cam.pitch : UNI_PITCH.def;
    let i = UNI_VIEWS.findIndex((v) => Math.abs(v - cur) < 0.02);
    const next = UNI_VIEWS[(i + 1) % UNI_VIEWS.length];
    if (this.still) { this.cam.pitch = next; this.redraw(); return; }
    this.flight = { from: { ...this.cam }, target: this.follow || null, to: { x: this.cam.x, y: this.cam.y, zoom: this.cam.zoom, pitch: next }, t0: null, dur: 600 };
  },

  /** Eine Sternschnuppe: schräg abwärts über den Himmel, blendet ein und aus. */
  spawnMeteor(rnd = Math.random) {
    const dir = rnd() < 0.5 ? 1 : -1, a = 0.35 + rnd() * 0.5, speed = 0.7 + rnd() * 0.5;
    (this.meteors = this.meteors || []).push({ x: rnd() * this.w, y: rnd() * this.h * 0.5, vx: Math.cos(a) * speed * dir, vy: Math.sin(a) * speed,
      life: 0, dur: 500 + rnd() * 600, len: 90 + rnd() * 90, bright: 0.6 + rnd() * 0.4 });
  },

  /** Wie frei die Sonne zu sehen ist (0–1): 13 Punkte der Scheibe gegen Körper davor, zum Bildrand hin ausgeblendet. */
  sunVisibility() {
    const S = this.sunScreen;
    if (!S || !Number.isFinite(S.x)) return 0;
    const R = S.disk || S.r * 0.45;
    const inside = Math.min(S.x + R, this.w - S.x + R, S.y + R, this.h - S.y + R);
    const edge = Math.max(0, Math.min(1, inside / (Math.min(this.w, this.h) * 0.12)));
    if (edge <= 0) return 0;
    const occ = this.bodies.filter((b) => b.visible && (b.kind === 'planet' || b.kind === 'moon' || b.kind === 'satellite') && b.zc < S.z);
    let covered = 0;
    for (let k = 0; k <= 12; k++) {
      const px = k === 12 ? S.x : S.x + Math.cos(k / 12 * Math.PI * 2) * R * 0.6, py = k === 12 ? S.y : S.y + Math.sin(k / 12 * Math.PI * 2) * R * 0.6;
      if (occ.some((b) => Math.hypot(b.x - px, b.y - py) < b.rs)) covered++;
    }
    return edge * (1 - covered / 13);
  },

  /** Stärke der Linsenreflexe: Sichtbarkeit der Sonne mal Einstellung „Leuchteffekte“ (normal = 1). */
  flareStrength() { return (this.sunVis || 0) * ((this.glowStrength ?? 0.85) / 0.85); },

  /** Licht echt räumlich aus Richtung der Sonne (Ursprung), in Bildschirmachsen: x rechts, y unten, z zum Betrachter. */
  lightDir(b) {
    const C = this.camera(), vx = -b.wx, vy = -(b.wh || 0), vz = -b.wy;
    const x = vx * C.rx + vz * C.rz, y = -(vx * C.ux + vy * C.uy + vz * C.uz), z = -(vx * C.fx + vy * C.fy + vz * C.fz), l = Math.hypot(x, y, z) || 1;
    return [x / l, y / l, z / l];
  },

  /** Punkte eines Rings um einen Planeten, flach in der Bahnebene; half 1 = vordere Hälfte (zur Kamera). */
  ringPoints(b, rf, half) {
    const C = this.camera();
    const hx = C.px - this.cam.x, hz = C.pz - this.cam.y, hl = Math.hypot(hx, hz) || 1;
    const tx = hx / hl, tz = hz / hl, R = b.r * rf, out = [];
    for (let i = 0; i <= 32; i++) {
      const t = Math.PI * (half ? i / 32 : 1 + i / 32);
      const p = this.worldToScreen(b.wx + Math.cos(t) * R * C.rx + Math.sin(t) * R * tx, b.wy + Math.cos(t) * R * C.rz + Math.sin(t) * R * tz, b.wh || 0);
      out.push(p.x, p.y);
    }
    return out;
  },

  /** Fokusflug: sanft zum Himmelskörper, danach fährt die Kamera mit. */
  flyTo(body, zoom = UNI_ZOOM.focus) {
    if (!body) return;
    this.select(body);
    UniSound.play('fly');
    if (this.still) { this.cam = { ...this.cam, x: body.wx, y: body.wy, zoom }; this.flight = null; this.follow = body; this.redraw(); return; }
    this.flight = { from: { ...this.cam }, target: body, to: { zoom }, t0: null, dur: 750 };
    this.follow = null;
  },

  /** Zurück zur Übersicht mit der Sonne in der Mitte. */
  overview() {
    if (this.still) { this.cam = { x: 0, y: 0, zoom: 1, yaw: 0, pitch: UNI_PITCH.def }; this.flight = null; this.follow = null; this.redraw(); return; }
    this.flight = { from: { ...this.cam }, target: null, to: { x: 0, y: 0, zoom: 1, yaw: 0, pitch: UNI_PITCH.def }, t0: null, dur: 650 };
    this.follow = null;
  },

  updateCamera(ts) {
    const f = this.flight;
    if (f) {
      if (f.t0 === null) f.t0 = ts;
      const t = Math.min(1, Math.max(0, (ts - f.t0) / f.dur));
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const tx = f.target ? f.target.wx : f.to.x, ty = f.target ? f.target.wy : f.to.y;
      this.cam.x = f.from.x + (tx - f.from.x) * e;
