/** CSV lesen: Trennzeichen erkennen, Anführungszeichen und Zeilenumbrüche in Feldern beachten. */
function parseCsv(text) {
  const sample = text.split(/\r?\n/).slice(0, 20).join('\n');
  const counts = [';', ',', '\t'].map((d) => [d, sample.split(d).length - 1]).sort((a, b) => b[1] - a[1]);
  const delimiter = counts[0][0];
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === delimiter) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return { delimiter, rows: rows.filter((r) => r.some((v) => v.trim() !== '')) };
}

function parseBankDate(raw) {
  const s = String(raw || '').trim();
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (m) { let y = Number(m[3]); if (y < 100) y += 2000; return toISO(new Date(y, Number(m[2]) - 1, Number(m[1]))); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return toISO(new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])));
  return null;
}

/** Beträge in deutschem und englischem Format, mit Minus vorne oder hinten. */
function parseBankAmount(raw) {
  let s = String(raw || '').replace(/€|eur/gi, '').replace(/\s/g, '').trim();
  if (!s) return NaN;
  let negative = false;
  if (/^\(.*\)$/.test(s)) { negative = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { negative = true; s = s.slice(0, -1); }
  if (s.startsWith('+')) s = s.slice(1);
  if (s.startsWith('-')) { negative = !negative; s = s.slice(1); }
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  s = lastComma > lastDot ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  const n = parseFloat(s);
  return negative ? -n : n;
}

const COLUMN_CANDIDATES = {
  date: ['buchungstag', 'buchungsdatum', 'booking date', 'datum', 'buchung', 'date', 'wertstellung', 'valutadatum', 'valuta'],
  amount: ['betrag', 'betrag (eur)', 'betrag (euro)', 'betrag (€)', 'amount (eur)', 'amount', 'umsatz in eur', 'umsatz', 'betrag in eur'],
  payee: ['beguenstigter/zahlungspflichtiger', 'auftraggeber/empfaenger', 'partner name', 'name zahlungsbeteiligter', 'empfaenger', 'payee', 'zahlungsempfaenger*in', 'zahlungsempfaenger', 'name', 'auftraggeber', 'zahlungsbeteiligter'],
  purpose: ['verwendungszweck', 'payment reference', 'vorgang/verwendungszweck', 'buchungstext', 'beschreibung', 'description', 'umsatztext', 'vorgang'],
  sign: ['soll/haben', 's/h', 'soll-haben-kennzeichen'],
  payeeIn: ['zahlungspflichtige*r', 'zahlungspflichtiger'],
  payeeOut: ['zahlungsempfaenger*in', 'zahlungsempfaenger'],
  balance: ['saldo nach buchung', 'saldo', 'kontostand', 'balance', 'saldo in eur', 'saldo (eur)'] // Etappe E4
};

function findColumn(headers, candidates) {
  for (const c of candidates) { const i = headers.indexOf(c); if (i > -1) return i; }
  // nur ganze Wörter: "betrag (eur)" passt zu "betrag", "datei erstellt" aber nicht zu "date"
  for (const c of candidates) { const i = headers.findIndex((h) => h.startsWith(c + ' ') || h.startsWith(c + '(')); if (i > -1) return i; }
  return -1;
}

function detectBank(h) {
  const has = (x) => h.some((c) => c.includes(x));
  if (has('auftragskonto') && has('beguenstigter')) return 'Sparkasse';
  if (has('zahlungsempfaenger*in') || (has('buchungsdatum') && has('glaeubiger'))) return 'DKB';
  if (has('partner name') || (has('booking date') && has('payment reference'))) return 'N26';
  if (has('auftraggeber/empfaenger')) return 'ING';
  if (has('umsatz in eur')) return 'comdirect';
  if (has('name zahlungsbeteiligter') || has('soll/haben')) return 'Volks- oder Raiffeisenbank';
  return '';
}

/** Findet die Kopfzeile – manche Banken setzen Kontoinfos davor. */
function detectColumns(rows) {
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const norm = rows[i].map((h) => normText(h));
    const date = findColumn(norm, COLUMN_CANDIDATES.date), amount = findColumn(norm, COLUMN_CANDIDATES.amount);
    // Kopfzeile nur, wenn darunter wirklich Datum und Betrag stehen
    const plausible = date > -1 && amount > -1 && date !== amount && rows.slice(i + 1, i + 4)
      .some((r) => parseBankDate(r[date]) && Number.isFinite(parseBankAmount(r[amount])));
    if (plausible) {
      const map = { date, amount };
      for (const role of ['payee', 'purpose', 'sign', 'payeeIn', 'payeeOut', 'balance']) map[role] = findColumn(norm, COLUMN_CANDIDATES[role]);
      return { headerIndex: i, headers: rows[i], map, bank: detectBank(norm) };
    }
  }
  return null;
}

/** Kategorie bestimmen: gelernt > eigene Buchungen > Stichwort > Sonstiges. */
function categorize(kind, payee, purpose, learned, known) {
  const key = payeeKey(payee || purpose);
  const valid = kind === 'income' ? CATEGORIES.income : CATEGORIES.expense;
  const rules = { ...(Store.state.categoryRules || {}), ...(learned || {}) };
  const ruleKey = `${kind}:${key}`;
  if (key && valid[rules[ruleKey]]) return { category: rules[ruleKey], source: 'gelernt' };
  if (key && known && valid[known.get(ruleKey)]) return { category: known.get(ruleKey), source: 'aus deinen Buchungen' };
  const text = ` ${normText(`${payee} ${purpose}`)} `;
  for (const [cat, words] of kind === 'income' ? INCOME_KEYWORDS : EXPENSE_KEYWORDS) {
    if (words.some((w) => text.includes(w))) return { category: cat, source: 'Stichwort' };
  }
  return { category: kind === 'income' ? 'sonstige' : 'sonstiges', source: 'nicht erkannt' };
}

/** Markiert Buchungen, die es schon gibt – einzeln oder als eingeplante Fixkosten. */
function flagKnown(rows) {
  const s = Store.state;
  const once = new Set(groupSplits(s.entries.filter((e) => e.interval === 'once')).map((e) => `${e.date}|${e.kind}|${Number(e.amount).toFixed(2)}`)); // Aufteilungen mit Gesamtbetrag (E6)
  const recurring = s.entries.filter((e) => e.interval !== 'once');
  for (const r of rows) {
    if (once.has(`${r.date}|${r.kind}|${r.amount.toFixed(2)}`)) { r.flag = 'schon vorhanden'; r.include = false; continue; }
    const d = parseISO(r.date);
    const covered = recurring.find((e) => e.kind === r.kind && Math.abs(e.amount - r.amount) <= Math.max(0.01, e.amount * 0.01)
      && Finance.occurrences(e, addDays(d, -4), addDays(d, 4)).length);
    if (covered) { r.flag = `als „${covered.name}“ eingeplant`; r.include = false; continue; }
    // Etappe E3: gleiche Zahlung, anderer Betrag (z. B. Abo teurer) – nicht zusätzlich als Einzelbuchung zählen
    const changed = recurring.find((e) => e.kind === r.kind && isCurrent(e) && payeeMatches(e, r) && occursNear(e, r.date));
    if (changed) { r.flag = `Betrag geändert bei „${changed.name}“`; r.include = false; r.priceOf = changed.id; }
  }
}

/* ---------- Preisänderungen erkennen (Etappe E3) ---------- */
/** Gleicher Preis: höchstens 1 % oder 1 Cent Unterschied (Abbuchungen sind centgenau). */
const samePrice = (a, b) => Math.abs(a - b) <= Math.max(0.01, Math.max(a, b) * 0.01);
/** Fällt die geplante Buchung in ±4 Tagen um dieses Datum an? */
const occursNear = (e, iso) => { const d = parseISO(iso); return Finance.occurrences(e, addDays(d, -4), addDays(d, 4)).length > 0; };
/** Passt der Empfänger zur geplanten Buchung? Gleicher Schlüssel oder das erste markante Wort des Namens steht im Text. */
function payeeMatches(e, r) {
  const own = payeeKey(e.name), key = payeeKey(r.payee || r.purpose || r.name || '');
  if (!own) return false;
  if (own === key) return true;
  const word = own.split(' ').find((w) => w.length >= 4);
  return !!word && (' ' + normText(`${r.payee || ''} ${r.purpose || ''} ${r.name || ''}`).replace(/[^a-z0-9& ]/g, ' ') + ' ').includes(' ' + word);
}

/** Geplante Zahlungen, deren Betrag laut Kontoauszug nicht mehr stimmt: neuer Betrag, seit wann, wie oft,
    und frühere Einzelbuchungen zum neuen Preis (bis 3.13 zusätzlich importiert – sonst doppelt gezählt). */
function detectPriceChanges(rows) {
  const s = Store.state;
  const out = [];
  for (const e of s.entries) {
    if (e.interval === 'once' || e.source === 'semester' || !isCurrent(e)) continue;
    const hits = rows.filter((r) => r.kind === e.kind && payeeMatches(e, r) && occursNear(e, r.date)).sort((a, b) => a.date.localeCompare(b.date));
    if (!hits.length) continue;
    const latest = hits[hits.length - 1];
    if (samePrice(latest.amount, e.amount)) continue;
    let first = hits.length - 1;
    while (first > 0 && samePrice(hits[first - 1].amount, latest.amount)) first--;
    const since = hits[first].date;
    const from = toISO(addDays(parseISO(since), -4));
    const dupes = s.entries.filter((x) => x.interval === 'once' && x.kind === e.kind && x.source === 'csv' && x.date >= from && samePrice(x.amount, latest.amount)
      && payeeMatches(e, { payee: x.name, purpose: x.note || '', name: x.name }) && occursNear(e, x.date)).map((x) => x.id);
    out.push({ entryId: e.id, name: e.name, kind: e.kind, old: e.amount, amount: latest.amount, since, count: hits.length - first, dupes, include: true });
  }
  return out;
}

/** Preisänderung übernehmen: bisherige Buchung endet am Tag vor dem neuen Betrag, eine Nachfolgerin übernimmt
    Konto, Kategorie, Notiz, Steuer- und Vertragsdaten. So bleiben vergangene Monate mit dem alten Betrag richtig. */
function applyPriceChange(s, pc) {
  const e = s.entries.find((x) => x.id === pc.entryId);
  if (!e) return;
  s.entries = s.entries.filter((x) => !pc.dupes.includes(x.id)); // deckt ab jetzt der Plan ab
  const near = Finance.occurrences(e, addDays(parseISO(pc.since), -4), addDays(parseISO(pc.since), 4))[0];
  const start = near ? toISO(near) : pc.since;
  if (e.date >= start) { e.amount = pc.amount; return; } // Plan beginnt erst mit dem neuen Betrag
  const end = toISO(addDays(parseISO(start), -1));
  const next = JSON.parse(JSON.stringify(e));
  delete next.replacedBy;
  Object.assign(next, { id: uid(), amount: pc.amount, date: start, replaces: e.id, priceHistory: [...(e.priceHistory || []), { amount: e.amount, until: end }] });
  delete e.contract; // Fristen und Kündigung gehören zur laufenden Buchung
  e.endDate = e.endDate && e.endDate < end ? e.endDate : end;
  e.replacedBy = next.id;
  s.entries.push(next);
}

function buildImportRows(table, det, map, learned) {
  const known = new Map();
  for (const e of Store.state.entries) { const k = `${e.kind}:${payeeKey(e.name)}`; if (!known.has(k)) known.set(k, e.category); }
  const out = [];
  for (const r of table.rows.slice(det.headerIndex + 1)) {
    if (isBalanceRow(r)) continue; // z. B. „Endsaldo“ am Ende der Datei
    const date = parseBankDate(r[map.date]);
    let amount = parseBankAmount(r[map.amount]);
    if (!date || !Number.isFinite(amount) || amount === 0) continue;
    if (map.sign > -1 && /^s/i.test(String(r[map.sign] || '').trim())) amount = -Math.abs(amount);
    let payee = map.payee > -1 ? r[map.payee] : '';
    if (map.payeeIn > -1 && map.payeeOut > -1) payee = amount > 0 ? r[map.payeeIn] : r[map.payeeOut];
    payee = cleanText(payee);
    const purpose = cleanText(map.purpose > -1 ? r[map.purpose] : '');
    const kind = amount > 0 ? 'income' : 'expense';
    const cat = categorize(kind, payee, purpose, learned, known);
    const name = (payee || purpose || 'Buchung').replace(/\/\/.*$/, '').slice(0, 60).trim() || 'Buchung';
    out.push({ date, amount: round2(Math.abs(amount)), kind, payee, purpose, name, category: cat.category, source: cat.source, include: true, flag: '' });
  }
  flagKnown(out);
  return out;
}

/* ---------- Kontostand-Abgleich beim CSV-Import (Etappe E4) ----------
   Banken nennen den Stand auf zwei Arten: als Angabe vor oder nach der Tabelle („Saldo“ bei ING, „Kontostand vom …“
   bei der DKB, „Neuer Kontostand“ bei comdirect, „Endsaldo“) oder als Spalte mit dem Stand nach jeder Buchung
   („Saldo“ bei ING, „Saldo nach Buchung“ bei Volks- und Raiffeisenbanken). Sparkasse und N26 liefern keinen Stand. */
const BALANCE_LABEL = /^(?:neuer |aktueller )?(?:kontostand|saldo|endsaldo|schlusssaldo)(?: (?:vom|am|per|zum))?(?: (\d{1,2}\.\d{1,2}\.\d{2,4}))?$/;
const BALANCE_OLD_LABEL = /^(?:alter kontostand|anfangssaldo|vorheriger kontostand)$/;
const BALANCE_STALE_DAYS = 14;
const balanceLabelOf = (cell) => normText(cell).replace(/:$/, '');
const isBalanceRow = (r) => r.some((c) => { const n = balanceLabelOf(c); return BALANCE_LABEL.test(n) || BALANCE_OLD_LABEL.test(n); });

/** Kontostand laut Datei: { amount, date, source } oder null. Eine ausdrückliche Angabe hat Vorrang vor der Spalte. */
function readBankBalance(table, det, map) {
  const labels = [];
  table.rows.forEach((r, i) => {
    if (i === det.headerIndex) return;
    const j = r.findIndex((c) => BALANCE_LABEL.test(balanceLabelOf(c)));
    if (j < 0) return;
    for (let k = j + 1; k < r.length; k++) {
      if (parseBankDate(r[k])) continue;
      let amount = parseBankAmount(r[k]);
      if (!Number.isFinite(amount)) continue;
      if (/^s$/i.test(String(r[k + 1] || '').trim())) amount = -Math.abs(amount); // Soll/Haben-Kennzeichen
      const m = balanceLabelOf(r[j]).match(BALANCE_LABEL);
      labels.push({ amount: round2(amount), date: (m[1] && parseBankDate(m[1])) || r.map(parseBankDate).find(Boolean) || null, source: 'Angabe' });
      return;
    }
  });
  const list = [];
  for (const r of table.rows.slice(det.headerIndex + 1)) {
    if (isBalanceRow(r)) continue;
    const date = parseBankDate(r[map.date]);
    let amt = parseBankAmount(r[map.amount]);
    if (!date || !Number.isFinite(amt)) continue;
    if (map.sign > -1 && /^s/i.test(String(r[map.sign] || '').trim())) amt = -Math.abs(amt);
    const bal = map.balance > -1 ? parseBankAmount(r[map.balance]) : NaN;
    list.push({ date, amt, bal });
  }
  const latest = list.reduce((d, x) => (x.date > d ? x.date : d), '') || null;
  let column = null;
  const withBal = list.filter((x) => Number.isFinite(x.bal));
  if (withBal.length) {
    // Reihenfolge: nach Datum; bei gleichem Datum entscheidet, in welcher Richtung Stand + Betrag = nächster Stand
    const fits = (o) => o.reduce((n, x, j) => n + (j > 0 && Math.abs(x.bal - (o[j - 1].bal + x.amt)) < 0.005 ? 1 : 0), 0);
    const rev = withBal.slice().reverse();
    const first = withBal[0].date, last = withBal[withBal.length - 1].date;
    const chrono = first < last ? withBal : first > last ? rev : (fits(rev) > fits(withBal) ? rev : withBal);
    const end = chrono[chrono.length - 1];
    column = { amount: round2(end.bal), date: end.date, source: 'Saldo-Spalte' };
  }
  if (labels.length) {
    const best = labels.filter((l) => l.date).sort((a, b) => b.date.localeCompare(a.date))[0] || labels[0];
    return { ...best, date: best.date || (column && column.date) || latest };
  }
  return column;
}

/** Vergleich mit dem Stand in der App. Mit Verlauf und lückenloser Datei: Stand + Buchungen seitdem = Bankstand? */
function balanceCheck(bank, account, rows) {
  if (!bank || !account) return null;
  const hist = (account.history || []).map((h) => h.date).filter(Boolean).sort();
  const lastUpdate = hist.length ? hist[hist.length - 1] : null;
  const diff = round2(bank.amount - account.balance);
  const stale = !!bank.date && bank.date < toISO(addDays(today(), -BALANCE_STALE_DAYS));
  const appNewer = !!(lastUpdate && bank.date && lastUpdate > bank.date);
  const dates = rows.map((r) => r.date).sort();
  let recon = null;
  if (lastUpdate && dates.length && dates[0] <= lastUpdate && (!bank.date || lastUpdate <= bank.date)) {
    const since = rows.filter((r) => r.date > lastUpdate);
    const delta = round2(since.reduce((sum, r) => sum + (r.kind === 'income' ? r.amount : -r.amount), 0));
    const expected = round2(account.balance + delta);
    recon = { since: lastUpdate, count: since.length, delta, expected, gap: round2(bank.amount - expected) };
  }
  return { accountId: account.id, name: account.name, bank: bank.amount, date: bank.date, source: bank.source, app: account.balance, lastUpdate, diff, stale, appNewer, recon, suggest: diff !== 0 && !stale && !appNewer };
}

/** Regelmäßige Zahlungen erkennen: gleicher Empfänger, gleicher Betrag, fester Rhythmus. */
function detectRecurring(rows) {
  const groups = new Map();
  for (const r of rows) {
    if (r.flag) continue;
    const key = `${r.kind}:${payeeKey(r.payee || r.purpose)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const existing = new Set(Store.state.entries.filter((e) => e.interval !== 'once').map((e) => `${e.kind}:${payeeKey(e.name)}`));
  const out = [];
  for (const [key, list] of groups) {
    if (list.length < 3 || existing.has(key)) continue;
    const sorted = list.slice().sort((a, b) => a.date.localeCompare(b.date));
    const avg = sorted.reduce((sum, r) => sum + r.amount, 0) / sorted.length;
    // Etappe E3: gleichbleibend (±5 %) oder in Preisstufen (höchstens zwei Änderungen, jede frühere Stufe mindestens zweimal)
    const steps = [];
    for (const r of sorted) { const cur = steps[steps.length - 1]; if (cur && samePrice(cur.amount, r.amount)) cur.count++; else steps.push({ amount: r.amount, from: r.date, count: 1 }); }
    const stable = !sorted.some((r) => Math.abs(r.amount - avg) > Math.max(1, avg * 0.05));
    const stepped = steps.length >= 2 && steps.length <= 3 && steps.slice(0, -1).every((st) => st.count >= 2);
    if (!stable && !stepped) continue;
    const gaps = sorted.slice(1).map((r, i) => (parseISO(r.date) - parseISO(sorted[i].date)) / 864e5);
    const avgGap = gaps.reduce((sum, g) => sum + g, 0) / gaps.length;
    let interval = null;
    if (avgGap >= 26 && avgGap <= 35 && gaps.every((g) => g >= 20 && g <= 41)) interval = 'monthly';
    else if (avgGap >= 6 && avgGap <= 8 && gaps.every((g) => g >= 5 && g <= 9)) interval = 'weekly';
    else if (avgGap >= 84 && avgGap <= 96) interval = 'quarterly';
    if (!interval) continue;
    const last = sorted[sorted.length - 1];
    const prices = stepped ? steps.map(({ amount, from }) => ({ amount, from })) : null; // bei Stufen gilt der neueste Preis, nicht der Schnitt
    out.push({ name: last.name, kind: last.kind, category: last.category, amount: prices ? last.amount : round2(avg), interval, lastDate: last.date, count: sorted.length, prices, include: true });
  }
  return out;
}

const nextOccurrence = (rc) => {
  const last = parseISO(rc.lastDate);
  return toISO(rc.interval === 'weekly' ? addDays(last, 7) : addMonths(last, rc.interval === 'quarterly' ? 3 : 1));
};

/** Datei wählen – funktioniert aus jedem Knopf heraus, auch aus dem Plus-Menü. */
function pickCsvFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv,text/csv,text/plain';
  input.addEventListener('change', () => { if (input.files && input.files[0]) readCsvFile(input.files[0]); });
  input.click();
}

/** Kontoauszüge kommen als UTF-8 oder Windows-1252 – beides wird erkannt. */
function decodeBankFile(buffer) {
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
  catch (e) { text = new TextDecoder('windows-1252').decode(buffer); }
  return text.replace(/^\ufeff/, '');
}

function readCsvFile(file) {
  const reader = new FileReader();
  reader.onload = () => safeCall(() => openCsvImport(decodeBankFile(reader.result), file.name), 'CSV-Import');
  reader.onerror = () => UI.toast('Die Datei ließ sich nicht lesen.');
  reader.readAsArrayBuffer(file);
}

function openCsvImport(text, fileName) {
  const table = parseCsv(text);
  const det = detectColumns(table.rows);
  if (!det) { UI.toast('In dieser Datei habe ich keine Spalten für Datum und Betrag gefunden.'); return; }
  const st = { map: { ...det.map }, learned: {}, rows: [], recurring: [], prices: [], accountId: mainAccountId(), bank: null, balanceCheck: null, balanceInclude: false };
  const refreshBalance = () => {
    st.balanceCheck = balanceCheck(st.bank, Store.state.accounts.find((a) => a.id === st.accountId), st.rows);
    st.balanceInclude = !!(st.balanceCheck && st.balanceCheck.suggest);
  };
  const rebuild = () => { st.rows = buildImportRows(table, det, st.map, st.learned); st.recurring = detectRecurring(st.rows); st.prices = detectPriceChanges(st.rows); st.bank = readBankBalance(table, det, st.map); refreshBalance(); };
  rebuild();

  const columnOptions = (withNone) => Object.fromEntries([...(withNone ? [['-1', '– keine –']] : []), ...det.headers.map((h, i) => [String(i), h || `Spalte ${i + 1}`])]);
  const optionCache = {};
  const rowCategoryOptions = (kind, selected) => {
    if (!optionCache[kind]) optionCache[kind] = Object.entries(categoryOptions(kind)).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('');
    return optionCache[kind].includes(`value="${selected}"`)
      ? optionCache[kind].replace(`value="${selected}"`, `value="${selected}" selected`)
      : `<option value="${selected}" selected>${esc(catLabel(selected))}</option>${optionCache[kind]}`;
  };
  const body = `
    <p class="dialog-text" id="csvSummary"></p>
    <div class="field-row">
      ${field('Auf welches Konto?', accountSelect('csvAccount', st.accountId))}
      <div class="field"><span>Datei</span><em style="font-size:13px">${esc(fileName)}${det.bank ? `, Format ${esc(det.bank)} erkannt` : ', Format unbekannt – Spalten bitte prüfen'}</em></div>
    </div>
    <details class="calc"${det.bank ? '' : ' open'}><summary>Spalten zuordnen</summary>
      <div class="field-row">${field('Datum', selectEl('map-date', columnOptions(false), String(st.map.date)))}${field('Betrag', selectEl('map-amount', columnOptions(false), String(st.map.amount)))}</div>
      <div class="field-row">${field('Name', selectEl('map-payee', columnOptions(true), String(st.map.payeeIn > -1 && st.map.payeeOut > -1 ? st.map.payeeOut : st.map.payee)))}${field('Verwendungszweck', selectEl('map-purpose', columnOptions(true), String(st.map.purpose)))}</div>
      <div class="field-row">${field('Kontostand (Saldo)', selectEl('map-balance', columnOptions(true), String(st.map.balance)), 'optional, für den Abgleich')}</div>
    </details>
    <div id="csvBalance"></div>
    <div id="csvRecurring"></div>
    <div id="csvRows" class="csv-rows"></div>`;
  const dialog = UI.modal({ title: 'Kontoauszug importieren', body, submitLabel: 'Importieren', wide: true, onSubmit: () => commitCsvImport(st) });
  const q = (sel) => dialog.overlay.querySelector(sel);
  const submit = q('button[type="submit"]');

  const counts = () => {
    const chosen = st.rows.filter((r) => r.include);
    const rec = st.recurring.filter((r) => r.include).length;
    const pr = st.prices.filter((x) => x.include).length;
    const parts = [];
    if (rec) parts.push(`${rec} einplanen`);
    if (pr) parts.push(`${pr} ${pr === 1 ? 'Betrag' : 'Beträge'} anpassen`);
    if (st.balanceInclude && st.balanceCheck) parts.push('Kontostand setzen');
    const headText = `${chosen.length} Buchungen importieren`;
    submit.textContent = !chosen.length && !rec && !pr && parts.length ? 'Nur Kontostand setzen'
      : parts.length ? `${headText}${parts.length > 1 ? ', ' + parts.slice(0, -1).join(', ') : ''} und ${parts[parts.length - 1]}` : headText;
  };
  const paint = () => {
    const dates = st.rows.map((r) => r.date).sort();
    const sumIn = round2(st.rows.filter((r) => r.kind === 'income').reduce((s, r) => s + r.amount, 0));
    const sumOut = round2(st.rows.filter((r) => r.kind === 'expense').reduce((s, r) => s + r.amount, 0));
    const known = st.rows.filter((r) => r.flag).length;
    const recognised = st.rows.filter((r) => r.source !== 'nicht erkannt').length;
    q('#csvSummary').innerHTML = st.rows.length
      ? `<b>${st.rows.length} Buchungen</b> vom ${parseISO(dates[0]).toLocaleDateString('de-DE')} bis ${parseISO(dates[dates.length - 1]).toLocaleDateString('de-DE')}: Einnahmen ${Fmt.money(sumIn)}, Ausgaben ${Fmt.money(sumOut)}. ${recognised} automatisch kategorisiert${known ? `, ${known} schon erfasst und abgewählt` : ''}.`
      : 'Mit dieser Spaltenzuordnung finde ich keine Buchungen. Prüfe Datum und Betrag.';
    const dateDe = (iso) => parseISO(iso).toLocaleDateString('de-DE');
    const bc = st.balanceCheck;
    let balanceHtml = '';
    if (bc && bc.diff === 0) {
      balanceHtml = `<h4 class="sheet-h">Kontostand</h4><ul class="list"><li class="alert ok">${icon('check')}<span>Stimmt überein: Bank und App zeigen für ${esc(bc.name)} beide ${Fmt.money(bc.bank)}.</span></li></ul>`;
    } else if (bc) {
      const notes = [];
      if (bc.stale) notes.push(`Der Kontoauszug ist vom ${dateDe(bc.date)} – ist das noch dein aktueller Stand? Deshalb nicht vorausgewählt.`);
      if (bc.appNewer) notes.push(`In der App hast du den Stand am ${dateDe(bc.lastUpdate)} eingetragen, also nach dem Kontoauszug. Deshalb nicht vorausgewählt.`);
      const r = bc.recon;
      if (r && r.count === 0) notes.push(`Seit deinem Stand vom ${dateDe(r.since)} ist laut Kontoauszug nichts gebucht worden – vielleicht war der Stand in der App nicht ganz aktuell.`);
      else if (r && r.gap === 0) notes.push(`Das passt: Dein Stand vom ${dateDe(r.since)} plus ${r.count} ${r.count === 1 ? 'Buchung' : 'Buchungen'} seitdem (${Fmt.money(r.delta, true)}) ergibt genau den Bankstand.`);
      else if (r) notes.push(`Dein Stand vom ${dateDe(r.since)} plus ${r.count} ${r.count === 1 ? 'Buchung' : 'Buchungen'} seitdem (${Fmt.money(r.delta, true)}) ergäbe ${Fmt.money(r.expected)} – ${Fmt.money(Math.abs(r.gap))} weichen vom Bankstand ab. Vielleicht war der Stand in der App nicht ganz aktuell.`);
      balanceHtml = `
      <h4 class="sheet-h">Kontostand abgleichen</h4>
      <ul class="list">
        <li class="row csv-row">
          <input type="checkbox" data-balance="1"${st.balanceInclude ? ' checked' : ''} aria-label="Kontostand von ${esc(bc.name)} auf ${Fmt.money(bc.bank)} setzen">
          <span class="row-main"><span class="row-title">Stand von ${esc(bc.name)} auf ${Fmt.money(bc.bank)} setzen</span><span class="row-sub">laut Bank${bc.date ? ` am ${dateDe(bc.date)}` : ''} · in der App bisher ${Fmt.money(bc.app)}${bc.lastUpdate ? ` (Stand ${dateDe(bc.lastUpdate)})` : ''}</span></span>
          <span class="num ${bc.diff > 0 ? 'amt-in' : 'amt-out'}">${Fmt.money(bc.diff, true)}</span>
        </li>
      </ul>${notes.map((n) => `<p class="meter-sub">${n}</p>`).join('')}`;
    }
    q('#csvBalance').innerHTML = balanceHtml;
    const priceHtml = st.prices.length ? `
      <h4 class="sheet-h">Beträge geändert – ab dann übernehmen?</h4>
      <ul class="list">${st.prices.map((pc, i) => `
        <li class="row csv-row">
          <input type="checkbox" data-price="${i}"${pc.include ? ' checked' : ''} aria-label="Neuen Betrag für ${esc(pc.name)} übernehmen">
          <span class="row-main"><span class="row-title">${esc(pc.name)}</span><span class="row-sub">bisher ${Fmt.money(pc.old)}, seit ${dateDe(pc.since)} ${Fmt.money(pc.amount)} (${pc.count} Mal abgebucht)${pc.dupes.length ? ` · ${pc.dupes.length} frühere Einzelbuchung${pc.dupes.length === 1 ? '' : 'en'} zum neuen Betrag übernimmt der Plan` : ''}</span></span>
          <span class="num ${(pc.kind === 'expense') === (pc.amount > pc.old) ? 'amt-out' : 'amt-in'}">${pc.amount > pc.old ? '+' : '−'}${Fmt.money(Math.abs(round2(pc.amount - pc.old)))}</span>
        </li>`).join('')}</ul>` : '';
    q('#csvRecurring').innerHTML = priceHtml + (st.recurring.length ? `
      <h4 class="sheet-h">Regelmäßige Zahlungen erkannt – ab dem nächsten Termin einplanen?</h4>
      <ul class="list">${st.recurring.map((rc, i) => `
        <li class="row csv-row">
          <input type="checkbox" data-rec="${i}"${rc.include ? ' checked' : ''} aria-label="${esc(rc.name)} einplanen">
          <span class="row-main"><span class="row-title">${esc(rc.name)}</span><span class="row-sub">${esc(INTERVALS[rc.interval])}, ${rc.count} Mal gefunden, nächster Termin ${parseISO(nextOccurrence(rc)).toLocaleDateString('de-DE')}${rc.prices ? ` · Preis geändert: ${rc.prices.map((x) => Fmt.money(x.amount)).join(' → ')} (seit ${dateDe(rc.prices[rc.prices.length - 1].from)})` : ''}</span></span>
          <span class="num ${rc.kind === 'income' ? 'amt-in' : 'amt-out'}">${Fmt.money(rc.kind === 'income' ? rc.amount : -rc.amount, true)}</span>
        </li>`).join('')}</ul>` : '');
    const shown = st.rows.slice(0, 150);
    q('#csvRows').innerHTML = `
      <h4 class="sheet-h">Buchungen</h4>
      <ul class="list">${shown.map((r, i) => `
        <li class="row csv-row${r.include ? '' : ' off'}">
          <input type="checkbox" data-row="${i}"${r.include ? ' checked' : ''} aria-label="${esc(r.name)} übernehmen">
          <span class="row-main"><span class="row-title">${esc(r.name)}${r.flag ? ` <span class="badge tone-warn">${esc(r.flag)}</span>` : ''}</span><span class="row-sub">${parseISO(r.date).toLocaleDateString('de-DE')}${r.purpose ? ', ' + esc(r.purpose.slice(0, 70)) : ''}</span></span>
          <select data-cat="${i}" aria-label="Kategorie für ${esc(r.name)}">${rowCategoryOptions(r.kind, r.category)}</select>
          <span class="num ${r.kind === 'income' ? 'amt-in' : 'amt-out'}">${Fmt.money(r.kind === 'income' ? r.amount : -r.amount, true)}</span>
        </li>`).join('')}</ul>
      ${st.rows.length > 150 ? `<p class="meter-sub">Weitere ${st.rows.length - 150} Buchungen werden mit ihrer erkannten Kategorie übernommen.</p>` : ''}`;
    counts();
  };
  paint();

  dialog.overlay.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.row !== undefined) {
      const r = st.rows[Number(t.dataset.row)];
      r.include = t.checked;
      t.closest('.csv-row').classList.toggle('off', !r.include);
      counts();
    } else if (t.dataset.rec !== undefined) {
      st.recurring[Number(t.dataset.rec)].include = t.checked;
      counts();
    } else if (t.dataset.price !== undefined) {
      st.prices[Number(t.dataset.price)].include = t.checked;
      counts();
    } else if (t.dataset.balance !== undefined) {
      st.balanceInclude = t.checked;
      counts();
    } else if (t.dataset.cat !== undefined) {
      // Korrektur merken und auf gleiche Empfänger übertragen
      const r = st.rows[Number(t.dataset.cat)];
      r.category = t.value;
      r.source = 'manuell';
      const key = `${r.kind}:${payeeKey(r.payee || r.purpose)}`;
      st.learned[key] = t.value;
      st.rows.forEach((other, j) => {
        if (other === r || other.source === 'manuell' || `${other.kind}:${payeeKey(other.payee || other.purpose)}` !== key) return;
        other.category = t.value;
        other.source = 'gelernt';
        const sel = q(`[data-cat="${j}"]`);
        if (sel) sel.value = t.value;
      });
    } else if (t.name === 'csvAccount') {
      st.accountId = t.value;
      refreshBalance();
      paint();
    } else if (t.name && t.name.startsWith('map-')) {
      const role = t.name.slice(4);
      st.map[role] = Number(t.value);
      if (role === 'payee') { st.map.payeeIn = -1; st.map.payeeOut = -1; }
      rebuild();
      paint();
    }
  });
}

function commitCsvImport(st) {
  const chosen = st.rows.filter((r) => r.include);
  const recurring = st.recurring.filter((r) => r.include);
  const prices = (st.prices || []).filter((x) => x.include);
  const bc = st.balanceInclude && st.balanceCheck && st.balanceCheck.diff !== 0 && st.balanceCheck.accountId === st.accountId ? st.balanceCheck : null;
  if (!chosen.length && !recurring.length && !prices.length && !bc) { UI.toast('Keine Buchung ausgewählt.'); return false; }
  const accountId = st.accountId || null;
  Store.update((s) => {
    s.categoryRules = { ...(s.categoryRules || {}), ...st.learned };
    for (const r of chosen) {
      s.entries.push({ id: uid(), kind: r.kind, name: r.name, category: r.category, amount: r.amount, interval: 'once', date: r.date, note: r.purpose.slice(0, 140), accountId, source: 'csv' });
    }
    for (const rc of recurring) {
      s.entries.push({ id: uid(), kind: rc.kind, name: rc.name, category: rc.category, amount: rc.amount, interval: rc.interval, date: nextOccurrence(rc), note: 'aus dem Kontoauszug erkannt', accountId });
    }
    for (const pc of prices) applyPriceChange(s, pc);
    const a = bc && s.accounts.find((x) => x.id === bc.accountId);
    if (a) { // wie „Stand aktualisieren“: heutiger Eintrag im Verlauf
      const date = toISO(today());
      a.balance = bc.bank;
      a.history = a.history || [];
      const sameDay = a.history.find((h) => h.date === date);
      if (sameDay) sameDay.balance = a.balance; else a.history.push({ date, balance: a.balance });
      if (a.history.length > 60) a.history.shift();
    }
  });
  const said = [];
  if (chosen.length || (!bc && !recurring.length && !prices.length)) said.push(`${chosen.length} Buchungen importiert`);
  if (recurring.length) said.push(`${recurring.length} regelmäßige Zahlungen eingeplant`);
  if (prices.length) said.push(`${prices.length} ${prices.length === 1 ? 'Betrag' : 'Beträge'} angepasst`);
  if (bc) said.push(`Kontostand von ${bc.name} auf ${Fmt.money(bc.bank)} gesetzt`);
  const sentence = said.join(', ');
  UI.toast(`${sentence.charAt(0).toUpperCase()}${sentence.slice(1)}.`, { label: 'Rückgängig', run: () => Store.undo() });
}

/* ---------- 7v. Steuer-Helfer (Etappe B3) ----------
   Schätzung nach Grundtarif (§ 32a EStG, Tarif 2026; frühere Jahre mit Tarif 2025),
   ohne Solidaritätszuschlag und Kirchensteuer. Ersetzt keine Steuerberatung.       */
const TAX_GROUPS = {
  arbeitsmittel: 'Arbeitsmittel (Laptop, Software, Schreibwaren)',
  fachliteratur: 'Fachliteratur',
  studium: 'Studiengebühren und Semesterkosten',
  fahrt: 'Fahrt- und Reisekosten',
  umzug: 'Umzug für Studium oder Job',
  bewerbung: 'Bewerbungen',
  sonstige: 'Sonstige Studien- oder Berufskosten'
};
const TAX_KEYWORDS = [
  ['arbeitsmittel', ['laptop', 'notebook', 'tablet', 'drucker', 'monitor', 'software', 'schreibwaren', 'toner', 'taschenrechner']],
  ['fachliteratur', ['fachbuch', 'lehrbuch', 'buecher', ' buch', 'skript', 'thalia', 'hugendubel']],
  ['studium', ['semesterbeitrag', 'studiengebuehr', 'rueckmeldung', 'pruefungsgebuehr']],
  ['fahrt', ['semesterticket', 'deutschlandticket', 'flixbus', 'deutsche bahn', ' db ']],
  ['umzug', ['umzug', 'umzugswagen', 'makler']],
  ['bewerbung', ['bewerbung', 'passfoto', 'bewerbungsfoto']]
];
let taxYear = null;

/** Einkommensteuer nach Grundtarif. */
function incomeTax(income, year) {
  const x = Math.floor(Math.max(0, income));
  if (year >= 2026) {
    if (x <= 12348) return 0;
    if (x <= 17799) { const y = (x - 12348) / 10000; return Math.floor((914.51 * y + 1400) * y); }
    if (x <= 69878) { const z = (x - 17799) / 10000; return Math.floor((173.10 * z + 2397) * z + 1034.87); }
    if (x <= 277825) return Math.floor(0.42 * x - 11135.63);
    return Math.floor(0.45 * x - 19470.38);
  }
  if (x <= 12096) return 0;
  if (x <= 17443) { const y = (x - 12096) / 10000; return Math.floor((932.30 * y + 1400) * y); }
  if (x <= 68480) { const z = (x - 17443) / 10000; return Math.floor((176.64 * z + 2397) * z + 1015.13); }
  if (x <= 277825) return Math.floor(0.42 * x - 10911.92);
  return Math.floor(0.45 * x - 19246.67);
}

/** Entfernungspauschale: ab 2026 38 Cent ab dem ersten Kilometer, davor 30 Cent bis 20 km. */
const kmAllowance = (km, days, year) => {
  const k = Math.max(0, Number(km) || 0), d = Math.max(0, Number(days) || 0);
  return round2(year >= 2026 ? k * d * 0.38 : (Math.min(20, k) * 0.30 + Math.max(0, k - 20) * 0.38) * d);
};

function taxProfile(year) {
  const saved = (Store.state.taxYears || {})[year] || {};
  return { studyType: 'erst', gross: '', withheld: '', uniKm: 0, uniDays: 0, jobKm: 0, jobDays: 0, homeDays: 0, health: '', ...saved };
}

/** Bruttolohn eines Jahres: aus Stundenlohn und Wochenstunden, sonst aus den Einnahmen. Minijob ist pauschal versteuert. */
function yearGross(year) {
  const setup = workSetup();
  if (setup && setup.job.category !== 'minijob') {
    let sum = 0;
    const log = (Store.state.workLog && Store.state.workLog.weeks) || {};
    for (let m = mondayOf(new Date(year, 0, 1)); m.getFullYear() <= year; m = addDays(m, 7)) {
      if (m.getFullYear() < year) continue;
      const iso = toISO(m);
      sum += weekHours(iso, setup) * setup.wage * (log[iso] !== undefined ? 1 : setup.share);
    }
    return { amount: round2(sum), source: 'aus Stundenlohn und Wochenstunden' };
  }
  const amount = Finance.sum('income', new Date(year, 0, 1), new Date(year, 11, 31), (e) => ['werkstudent', 'nebenjob'].includes(e.category));
  return { amount, source: amount ? 'aus deinen Einnahmen (Auszahlungen, als Näherung)' : 'keine Einkünfte aus Arbeit gefunden' };
}

const numOr = (value, fallback) => (value !== '' && value !== null && value !== undefined && Number.isFinite(Number(value)) ? Number(value) : fallback);

function taxReport(year) {
  const prof = taxProfile(year);
  const from = new Date(year, 0, 1), to = new Date(year, 11, 31);
  const items = [];
  for (const e of entriesIn(from, to)) {
    if (e.kind !== 'expense' || !TAX_GROUPS[e.tax]) continue;
    const count = Finance.occurrences(e, from, to).length;
    if (!count) continue;
    const share = Math.min(100, Math.max(0, numOr(e.taxShare, 100))) / 100;
    items.push({ e, group: e.tax, count, amount: round2(e.amount * count), counted: round2(e.amount * count * share), share });
  }
  const itemsTotal = round2(items.reduce((s, i) => s + i.counted, 0));
  const uniTravel = kmAllowance(prof.uniKm, prof.uniDays, year);
  const jobTravel = kmAllowance(prof.jobKm, prof.jobDays, year);
  const home = Math.min(210, Math.max(0, Number(prof.homeDays) || 0)) * 6;
  const studyCosts = round2(itemsTotal + uniTravel);
  const jobCosts = round2(jobTravel + home);
  const g = yearGross(year);
  const gross = numOr(prof.gross, g.amount);
  const erst = prof.studyType !== 'zweit';
  const pausch = gross > 0 ? Math.min(LIMIT_DEFAULTS.employeeAllowance, gross) : 0;
  const wkActual = erst ? jobCosts : round2(jobCosts + studyCosts);
  const werbungskosten = round2(Math.max(pausch, wkActual));
  const einkuenfte = round2(gross - werbungskosten);
  const loss = !erst && einkuenfte < 0 ? round2(-einkuenfte) : 0;
  const studySA = erst ? round2(Math.min(6000, studyCosts)) : 0;
  const health = numOr(prof.health, gross / 12 > LIMITS.familyInsurance ? LIMITS.studentHealth * 12 : 0);
  const pension = round2(gross * LIMITS.pensionRate / 100);
  const vorsorge = round2(pension + health);
  const beforeStudy = Math.max(0, einkuenfte) - vorsorge - 36;
  const zve = Math.max(0, round2(beforeStudy - studySA));
  const tax = incomeTax(zve, year);
  const withheld = numOr(prof.withheld, null);
  return {
    year, prof, items, itemsTotal, uniTravel, jobTravel, home, studyCosts, jobCosts, gross, grossSource: prof.gross !== '' && prof.gross !== undefined ? 'laut deiner Eingabe' : g.source,
    erst, pausch, wkActual, werbungskosten, einkuenfte, loss, studySA, health, pension, vorsorge, zve, tax, withheld,
    refund: withheld === null ? null : round2(withheld - tax),
    studyWasted: erst && studyCosts > 0 && beforeStudy <= 0
  };
}

/** Ausgaben, die nach Studien- oder Berufskosten aussehen, aber noch nicht markiert sind. */
function taxSuggestions(year) {
  const from = new Date(year, 0, 1), to = new Date(year, 11, 31);
  const out = [];
  for (const e of Store.state.entries) {
    if (e.kind !== 'expense' || e.tax || e.taxDismissed || !Finance.occurrences(e, from, to).length) continue;
    const text = ` ${normText(`${e.name} ${e.note || ''}`)} `;
    let group = e.category === 'studium' ? 'studium' : null;
    for (const [g, words] of TAX_KEYWORDS) if (!group && words.some((w) => text.includes(w))) group = g;
    if (group) out.push({ e, group });
  }
  return out.slice(0, 12);
}

/** Liste für ELSTER: nach Bereichen geordnet, als Zeilen [Bereich, Posten, Datum, Betrag, Anteil, angesetzt]. */
function taxExportRows(r) {
  const studyArea = r.erst ? 'Sonderausgaben: Kosten der Erstausbildung (Studium)' : 'Anlage N: Werbungskosten (Studium)';
  const rows = [['Bereich', 'Posten', 'Datum oder Häufigkeit', 'Betrag', 'Anteil', 'Angesetzt']];
  for (const i of r.items) {
    const when = i.e.interval === 'once' ? parseISO(i.e.date).toLocaleDateString('de-DE') : `${INTERVALS[i.e.interval]}, ${i.count}×`;
    rows.push([`${studyArea} – ${TAX_GROUPS[i.group]}`, i.e.name, when, i.amount, `${Math.round(i.share * 100)} %`, i.counted]);
  }
  if (r.uniTravel) rows.push([studyArea, `Fahrten zur Hochschule: ${r.prof.uniKm} km an ${r.prof.uniDays} Tagen`, 'Entfernungspauschale', r.uniTravel, '100 %', r.uniTravel]);
  if (r.jobTravel) rows.push(['Anlage N: Werbungskosten (Job)', `Fahrten zur Arbeit: ${r.prof.jobKm} km an ${r.prof.jobDays} Tagen`, 'Entfernungspauschale', r.jobTravel, '100 %', r.jobTravel]);
  if (r.home) rows.push(['Anlage N: Werbungskosten (Job)', `Homeoffice: ${Math.min(210, Number(r.prof.homeDays))} Tage × 6 €`, 'Tagespauschale', r.home, '100 %', r.home]);
  return rows;
}

function taxExportCsv(r) {
  const fmt = (v) => (typeof v === 'number' ? String(v).replace('.', ',') : v);
  return '\ufeff' + taxExportRows(r).map((row) => row.map((v) => `"${String(fmt(v)).replace(/"/g, '""')}"`).join(';')).join('\r\n');
}

function taxExportText(r) {
  const lines = [`Steuer-Übersicht ${r.year} (Schätzung aus dem Finanzplaner)`, ''];
  for (const row of taxExportRows(r).slice(1)) lines.push(`${row[0]}: ${row[1]} (${row[2]}) – angesetzt ${Fmt.money(row[5])}`);
  lines.push('', `Werbungskosten angesetzt: ${Fmt.money(r.werbungskosten)}`, `Studienkosten als Sonderausgaben: ${Fmt.money(r.studySA)}`, `Zu versteuerndes Einkommen (geschätzt): ${Fmt.money(r.zve)}`, `Einkommensteuer (geschätzt): ${Fmt.money(r.tax)}`);
  if (r.refund !== null) lines.push(`Voraussichtliche Erstattung: ${Fmt.money(r.refund)}`);
  if (r.loss) lines.push(`Verlustvortrag: ${Fmt.money(r.loss)}`);
  return lines.join('\n');
}

function renderTax() {
  if (!taxYear) taxYear = today().getFullYear();
  const r = taxReport(taxYear);
  const p = r.prof;
  const num = (name, label, value, attrs, hint) => field(label, `<input name="${name}" type="number" value="${esc(String(value ?? ''))}" ${attrs}>`, hint || '');
  const groups = Object.keys(TAX_GROUPS).map((g) => {
    const list = r.items.filter((i) => i.group === g);
    if (!list.length) return '';
    return `<li class="tax-group"><h4 class="sheet-h">${esc(TAX_GROUPS[g])}</h4><ul class="list">${list.map((i) => `
      <li class="row">
        <span class="row-main"><span class="row-title">${esc(i.e.name)}</span><span class="row-sub">${i.e.interval === 'once' ? parseISO(i.e.date).toLocaleDateString('de-DE') : `${INTERVALS[i.e.interval]}, ${i.count} Zahlungen`}, ${Fmt.money(i.amount)}</span></span>
        <input type="number" class="hours-input" name="ts-${i.e.id}" data-taxshare="${i.e.id}" min="0" max="100" step="5" value="${Math.round(i.share * 100)}" aria-label="Beruflicher Anteil in Prozent"><span class="row-sub">%</span>
        <span class="num amt-out">${Fmt.money(i.counted)}</span>
        <button type="button" class="mini" data-action="tax-remove" data-id="${i.e.id}" aria-label="${esc(i.e.name)} nicht mehr absetzen">${icon('close')}</button>
      </li>`).join('')}</ul></li>`;
  }).join('');
  const computed = [
    r.uniTravel ? `<li class="row"><span class="row-main"><span class="row-title">Fahrten zur Hochschule</span><span class="row-sub">${p.uniKm} km an ${p.uniDays} Tagen</span></span><span class="num amt-out">${Fmt.money(r.uniTravel)}</span></li>` : '',
    r.jobTravel ? `<li class="row"><span class="row-main"><span class="row-title">Fahrten zur Arbeit</span><span class="row-sub">${p.jobKm} km an ${p.jobDays} Tagen</span></span><span class="num amt-out">${Fmt.money(r.jobTravel)}</span></li>` : '',
    r.home ? `<li class="row"><span class="row-main"><span class="row-title">Homeoffice</span><span class="row-sub">${Math.min(210, Number(p.homeDays))} Tage × 6 €</span></span><span class="num amt-out">${Fmt.money(r.home)}</span></li>` : ''
  ].join('');
  const steps = [
    ['Bruttoarbeitslohn', Fmt.money(r.gross), r.grossSource],

      ${r.refund !== null ? kpi('wallet', r.refund >= 0 ? 'income' : 'expense', r.refund >= 0 ? 'Erstattung' : 'Nachzahlung', Fmt.money(Math.abs(r.refund)), 'geschätzt') : kpi('wallet', 'saving', 'Verlustvortrag', Fmt.money(r.loss), r.erst ? 'nur im Zweitstudium möglich' : 'für spätere Jahre')}

            ${num('withheld', 'Einbehaltene Lohnsteuer in €', p.withheld, 'min="0" step="0.01" placeholder="von der Lohnsteuerbescheinigung"')}

function mountTax() {
  const form = $('#taxForm');
  if (form) form.addEventListener('change', () => {
    const d = new FormData(form);
    const keep = (k) => { const v = String(d.get(k) ?? '').trim(); return v === '' ? '' : Math.max(0, parseFloat(v.replace(',', '.')) || 0); };
    Store.update((s) => {
      s.taxYears = s.taxYears || {};
      s.taxYears[taxYear] = { studyType: d.get('studyType') === 'zweit' ? 'zweit' : 'erst', gross: keep('gross'), withheld: keep('withheld'), health: keep('health'),
        uniKm: Number(keep('uniKm')) || 0, uniDays: Number(keep('uniDays')) || 0, jobKm: Number(keep('jobKm')) || 0, jobDays: Number(keep('jobDays')) || 0, homeDays: Number(keep('homeDays')) || 0 };
    });
  });
  document.querySelectorAll('[data-taxpanel]').forEach((section) => section.addEventListener('change', (e) => {
    const id = e.target.dataset.taxshare;
    if (!id) return;
    Store.update((s) => { const x = s.entries.find((y) => y.id === id); if (x) x.taxShare = Math.min(100, Math.max(0, Number(e.target.value) || 0)); });
  }));
}

/* ---------- 7w. Monatsabschluss (Etappe C2) ----------
   Vier Schritte: Plan gegen Ist, Übertrag bestätigen, Budgets für den nächsten Monat,
   Überschuss auf Sparziele verteilen. Ergebnis landet in state.closings und im Bericht.  */

/** Letzter abgelaufener Budgetmonat, der noch nicht abgeschlossen ist und Buchungen hat. */
function closingTarget() {
  const range = monthBounds(-1);
  if ((Store.state.closings || []).some((c) => c.month === toISO(range.from))) return null;
  const hasData = Store.state.entries.some((e) => Finance.occurrences(e, range.from, range.to).length);
  return hasData ? range : null;
}

/** Kennzahlen eines abgelaufenen Monats. */
function closingFigures(range) {
  const income = Finance.sum('income', range.from, range.to);
  const expenses = Finance.sum('expense', range.from, range.to);
  const saving = round2(accountFlows(range.from, range.to).filter((f) => f.kind === 'saving').reduce((s, f) => s - f.amount, 0));
  const budgets = Store.state.budgets.map((b) => {
    const spent = Finance.sum('expense', range.from, range.to, (e) => e.category === b.category);
    return { id: b.id, category: b.category, limit: b.limit, spent, diff: round2(b.limit - spent) };
  });
  return { income, expenses, saving, surplus: round2(income - expenses - saving), rate: income > 0 ? (income - expenses) / income : 0, budgets };
}

function openMonthClose() {
  const range = closingTarget();
  if (!range) { UI.toast('Der letzte Monat ist schon abgeschlossen.'); return; }
  const fig = closingFigures(range);
  const label = periodLabel(range);
  const openGoals = Store.state.goals.filter((g) => g.saved < g.target);
  const remainingTotal = openGoals.reduce((s, g) => s + (g.target - g.saved), 0);
  const wiz = {
    step: 1,
    skip: new Set(),
    limits: Object.fromEntries(Store.state.budgets.map((b) => [b.id, b.limit])),
    alloc: Object.fromEntries(openGoals.map((g) => [g.id, fig.surplus > 0 && remainingTotal > 0 ? Math.floor(fig.surplus * (g.target - g.saved) / remainingTotal) : 0])),
    move: true
  };
  const steps = ['Plan gegen Ist', 'Übertrag', 'Budgets', 'Überschuss'];
  const dialog = UI.modal({
    title: `Monatsabschluss ${label}`,
    body: `<ol class="wizard-steps" id="wizSteps"></ol><div id="wizStep"></div>`,
    submitLabel: 'Weiter',
    wide: true,
    onSubmit: () => {
      if (wiz.step < 4) { wiz.step++; paint(); return false; }
      const total = Object.values(wiz.alloc).reduce((s, v) => s + (Number(v) || 0), 0);
      if (total > Math.max(0, fig.surplus) + 0.005) { UI.toast(`Du verteilst ${Fmt.money(total)}, der Überschuss beträgt aber nur ${Fmt.money(Math.max(0, fig.surplus))}.`); return false; }
      finishMonthClose(range, fig, wiz);
    }
  });
  const q = (s) => dialog.overlay.querySelector(s);
  const submit = q('button[type="submit"]');
  const rolloverBudgets = Store.state.budgets.filter((b) => b.rollover && b.rollover.enabled);

  const paint = () => {
    q('#wizSteps').innerHTML = steps.map((s, i) => `<li class="${i + 1 === wiz.step ? 'on' : i + 1 < wiz.step ? 'done' : ''}"><b>${i + 1}</b>${esc(s)}</li>`).join('');
    submit.textContent = wiz.step < 4 ? 'Weiter' : 'Monat abschließen';
    const back = wiz.step > 1 ? `<button type="button" class="btn ghost wiz-back" data-wiz-back>${icon('chevL')}Zurück</button>` : '';
    let html = '';
    if (wiz.step === 1) {
      const worst = fig.budgets.filter((b) => b.diff < 0).sort((a, b) => a.diff - b.diff)[0];
      html = `
        <div class="kpis">
          ${kpi('in', 'income', 'Einnahmen', Fmt.money(fig.income), label)}
          ${kpi('out', 'expense', 'Ausgaben', Fmt.money(fig.expenses), `davon gespart ${Fmt.money(fig.saving)}`)}
          ${kpi('percent', 'saving', 'Sparquote', Fmt.pct(fig.rate), `Ziel ${Math.round(savingsTarget() * 100)} %`)}
        </div>
        <ul class="list">${fig.budgets.map((b) => `
          <li class="row"><span class="row-main"><span class="row-title">${esc(catLabel(b.category))}</span><span class="row-sub">Budget ${Fmt.money(b.limit)}, ausgegeben ${Fmt.money(b.spent)}</span></span>
          <span class="num ${b.diff >= 0 ? 'amt-in' : 'amt-out'}">${b.diff >= 0 ? 'noch ' : ''}${Fmt.money(b.diff)}</span></li>`).join('') || '<li class="empty">Keine Budgets gesetzt.</li>'}</ul>
        ${worst ? `<p class="dialog-text">Größte Überschreitung: ${esc(catLabel(worst.category))} mit ${Fmt.money(-worst.diff)}.</p>` : fig.budgets.length ? '<p class="dialog-text">Alle Budgets eingehalten.</p>' : ''}`;
    } else if (wiz.step === 2) {
      html = rolloverBudgets.length ? `
        <p class="dialog-text">Diese Budgets nehmen ihren Rest in den laufenden Monat mit. Abwählen, wenn du das diesmal nicht willst.</p>
        <ul class="list">${rolloverBudgets.map((b) => {
          const fb = fig.budgets.find((x) => x.id === b.id);
          const carry = round2(Math.min(b.rollover.cap > 0 ? b.rollover.cap : b.limit, Math.max(0, fb ? fb.diff : 0)));
          return `<li class="row"><label class="check-row wiz-check"><input type="checkbox" data-wiz-skip="${b.id}"${wiz.skip.has(b.id) ? '' : ' checked'}> ${esc(catLabel(b.category))}: ${Fmt.money(carry)} übertragen</label></li>`;
        }).join('')}</ul>` : '<p class="dialog-text">Kein Budget nutzt den Übertrag. Du kannst ihn pro Budget im Bereich Budgets einschalten.</p>';
    } else if (wiz.step === 3) {
      html = Store.state.budgets.length ? `
        <p class="dialog-text">Budgets für die kommenden Monate. Der Vorschlag ist dein Schnitt der letzten drei Monate.</p>
        <ul class="list">${Store.state.budgets.map((b) => `
          <li class="row"><span class="row-main"><span class="row-title">${esc(catLabel(b.category))}</span><span class="row-sub">bisher ${Fmt.money(b.limit)}, Schnitt ${Fmt.money(averageSpending(b.category))}</span></span>
          <input type="number" class="hours-input" name="wl-${b.id}" data-wiz-limit="${b.id}" min="0" step="5" value="${wiz.limits[b.id]}" aria-label="Neues Budget für ${esc(catLabel(b.category))}"></li>`).join('')}</ul>` : '<p class="dialog-text">Noch keine Budgets – du kannst sie im Bereich Budgets anlegen.</p>';
    } else {
      const total = Object.values(wiz.alloc).reduce((s, v) => s + (Number(v) || 0), 0);
      html = fig.surplus > 0 ? `
        <p class="dialog-text">Übrig geblieben sind <b>${Fmt.money(fig.surplus)}</b> nach Ausgaben und Sparraten. Verteile sie auf deine Ziele, der Rest bleibt auf dem Konto.</p>
        <ul class="list">${openGoals.map((g) => `
          <li class="row"><span class="row-main"><span class="row-title">${esc(g.name)}</span><span class="row-sub">${Fmt.money(g.saved)} von ${Fmt.money(g.target)}</span></span>
          <input type="number" class="hours-input" name="wa-${g.id}" data-wiz-alloc="${g.id}" min="0" step="1" value="${wiz.alloc[g.id]}" aria-label="Betrag für ${esc(g.name)}"></li>`).join('') || '<li class="empty">Keine offenen Sparziele.</li>'}</ul>
        <div class="shop-foot"><div class="between"><span>Verteilt</span><strong class="num" id="wizTotal">${Fmt.money(total)}</strong></div><div class="between"><span>Bleibt auf dem Konto</span><span class="num" id="wizRest">${Fmt.money(round2(fig.surplus - total))}</span></div></div>
        <label class="check-row wiz-check" style="margin-top:10px"><input type="checkbox" data-wiz-move${wiz.move ? ' checked' : ''}> Geld auch vom Girokonto auf das Sparkonto des Ziels verschieben</label>`
        : `<p class="dialog-text">Kein Überschuss: Der Monat endete bei ${Fmt.money(fig.surplus)} nach Ausgaben und Sparraten. Nichts zu verteilen – der Abschluss hält den Monat trotzdem fest.</p>`;
    }
    q('#wizStep').innerHTML = html + back;
  };
  paint();

  dialog.overlay.addEventListener('click', (e) => { if (e.target.closest('[data-wiz-back]')) { wiz.step = Math.max(1, wiz.step - 1); paint(); } });
  dialog.overlay.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.wizSkip) { if (t.checked) wiz.skip.delete(t.dataset.wizSkip); else wiz.skip.add(t.dataset.wizSkip); }
    else if (t.dataset.wizLimit) wiz.limits[t.dataset.wizLimit] = Math.max(0, parseFloat(String(t.value).replace(',', '.')) || 0);
    else if (t.dataset.wizAlloc) {
      wiz.alloc[t.dataset.wizAlloc] = Math.max(0, parseFloat(String(t.value).replace(',', '.')) || 0);
      const total = Object.values(wiz.alloc).reduce((s, v) => s + (Number(v) || 0), 0);
      q('#wizTotal').textContent = Fmt.money(total);
      q('#wizRest').textContent = Fmt.money(round2(fig.surplus - total));
    } else if (t.dataset.wizMove !== undefined) wiz.move = t.checked;
  });
}

function finishMonthClose(range, fig, wiz) {
  const allocations = Object.entries(wiz.alloc).map(([goalId, amount]) => ({ goalId, amount: round2(Number(amount) || 0) })).filter((a) => a.amount > 0);
  Store.update((s) => {
    for (const [id, limit] of Object.entries(wiz.limits)) { const b = s.budgets.find((x) => x.id === id); if (b && limit > 0) b.limit = round2(limit); }
    const date = toISO(today());
    for (const a of allocations) {
      const g = s.goals.find((x) => x.id === a.goalId);
      if (!g) continue;
      g.saved = round2(Math.min(g.target, g.saved + a.amount));
      if (!wiz.move) continue;
      const from = s.accounts.find((x) => x.id === mainAccountId());
      const to = s.accounts.find((x) => x.id === (g.toId || savingsAccountId()));
      if (!from || !to || from === to) continue;
      from.balance = round2(from.balance - a.amount);
      to.balance = round2(to.balance + a.amount);
      for (const acc of [from, to]) {
        acc.history = acc.history || [];
        const same = acc.history.find((h) => h.date === date);
        if (same) same.balance = acc.balance; else acc.history.push({ date, balance: acc.balance });
      }
    }
    s.closings.push({
      id: uid(), month: toISO(range.from), to: toISO(range.to), closedAt: date,
      income: fig.income, expenses: fig.expenses, saving: fig.saving, surplus: fig.surplus, rate: fig.rate,
      budgets: fig.budgets, skipRollover: [...wiz.skip], allocations
    });
  });
  const moved = allocations.reduce((s, a) => s + a.amount, 0);
  UI.toast(`${periodLabel(range)} abgeschlossen${moved ? `, ${Fmt.money(moved)} auf deine Ziele verteilt` : ''}.`, { label: 'Rückgängig', run: () => Store.undo() });
  confetti();
}

/** Zusammenfassung eines abgeschlossenen Monats für den Monatsbericht. */
function closingPanel(range, offset) {
  const c = (Store.state.closings || []).find((x) => x.month === toISO(range.from));
  if (c) {
    const goals = c.allocations.map((a) => { const g = Store.state.goals.find((x) => x.id === a.goalId); return `${g ? g.name : 'Ziel'} ${Fmt.money(a.amount)}`; });
    return `<section class="panel s12"><h2>Monatsabschluss <span class="badge tone-income">abgeschlossen am ${parseISO(c.closedAt).toLocaleDateString('de-DE')}</span></h2>
      <ul class="list">
        <li class="row"><span class="row-main"><span class="row-title">Überschuss</span><span class="row-sub">nach Ausgaben und ${Fmt.money(c.saving)} Sparraten</span></span><span class="num ${c.surplus >= 0 ? 'amt-in' : 'amt-out'}">${Fmt.money(c.surplus)}</span></li>
        <li class="row"><span class="row-main"><span class="row-title">Verteilt</span><span class="row-sub">${esc(goals.join(', ') || 'nichts verteilt')}</span></span><span class="num">${Fmt.money(c.allocations.reduce((s, a) => s + a.amount, 0))}</span></li>
        <li class="row"><span class="row-main"><span class="row-title">Budgets eingehalten</span><span class="row-sub">${c.skipRollover.length ? `Übertrag ausgesetzt für ${c.skipRollover.length} Budget${c.skipRollover.length === 1 ? '' : 's'}` : 'Übertrag wie eingestellt'}</span></span><span class="num">${c.budgets.filter((b) => b.diff >= 0).length} von ${c.budgets.length}</span></li>
      </ul></section>`;
  }
  const target = closingTarget();
  if (offset === -1 && target && toISO(target.from) === toISO(range.from)) {
    return `<section class="panel s12"><h2>Monatsabschluss</h2><p class="meter-sub">Dieser Monat ist noch nicht abgeschlossen.</p><div class="head-tools" style="margin-top:10px"><button type="button" class="btn primary" data-action="close-month">Monatsabschluss starten</button></div></section>`;
  }
  return '';
}

/* ---------- 7x. Kündigungs-Assistent (Etappe C3) ----------
   Berechnet den nächstmöglichen Termin (Verträge ab März 2022: nach stillschweigender
   Verlängerung monatlich kündbar) und erstellt ein Schreiben zum Kopieren, Mailen oder Drucken. */
const fmtDate = (d) => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

function cancellationDate(e, newRules = true) {
  const t = today();
  const c = e.contract || {};
  const notice = Number(c.noticeMonths) || 0;
  if (c.endDate) {
    let end = parseISO(c.endDate);
    if (addMonths(end, -notice) >= t) return { date: end, reason: `Laufzeitende, Kündigung bis ${fmtDate(addMonths(end, -notice))} möglich` };
    if (newRules) return { date: addMonths(t, 1), reason: 'die Frist zum Laufzeitende ist verpasst; nach der automatischen Verlängerung gilt eine Kündigungsfrist von einem Monat' };
    while (addMonths(end, -notice) < t) end = addMonths(end, 12);
    return { date: end, reason: 'die Frist ist verpasst, der Vertrag verlängert sich um ein Jahr' };
  }
  if (notice > 0) return { date: addMonths(t, notice), reason: `${notice} ${notice === 1 ? 'Monat' : 'Monate'} Kündigungsfrist ab heute` };
  const next = Finance.occurrences(e, addDays(t, 1), addDays(t, 400))[0];
  return next ? { date: addDays(next, -1), reason: 'zum Ende des bereits bezahlten Zeitraums' } : { date: new Date(t.getFullYear(), t.getMonth() + 1, 0), reason: 'zum Monatsende' };
}

/* ---------- 7y. Kalender-Export als .ics (Etappe C4) ----------
   iCalendar nach RFC 5545: ganztägige Termine, wiederkehrende Zahlungen als Serien (RRULE),
   Kündigungsfristen mit Erinnerung (VALARM), Zeilen nach 75 Bytes gefaltet, Zeilenende CRLF.  */
const icsDate = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const icsEscape = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const ICS_FREQ = { daily: ['DAILY', 1], weekly: ['WEEKLY', 1], monthly: ['MONTHLY', 1], quarterly: ['MONTHLY', 3], halfyearly: ['MONTHLY', 6], yearly: ['YEARLY', 1] };

/** Faltet lange Zeilen nach 75 Bytes (UTF-8), Fortsetzungszeilen beginnen mit Leerzeichen. */
function icsFold(line) {
  let out = '', bytes = 0;
  for (const ch of line) {
    const code = ch.codePointAt(0);
    const size = code < 0x80 ? 1 : code < 0x800 ? 2 : code < 0x10000 ? 3 : 4; // Bytes in UTF-8
    if (bytes + size > 75) { out += '\r\n '; bytes = 1; }
    out += ch;
    bytes += size;
  }
  return out;
}

/**
 * Serienregel; am 31. als „letzter Tag im Monat“. Termine am 29. oder 30. exportiert buildIcs
 * als Einzeltermine, weil Kalender-Apps die dafür nötige Regel (BYSETPOS) unterschiedlich umsetzen.
 */
const icsNeedsSingles = (item) => ['monthly', 'quarterly', 'halfyearly'].includes(item.interval) && [29, 30].includes(parseISO(item.date).getDate());
function icsRule(item) {
  const [freq, interval] = ICS_FREQ[item.interval] || ['MONTHLY', 1];
  const parts = [`FREQ=${freq}`];
  if (interval > 1) parts.push(`INTERVAL=${interval}`);
  if (freq === 'MONTHLY' && parseISO(item.date).getDate() === 31) parts.push('BYMONTHDAY=-1');
  if (item.endDate) parts.push(`UNTIL=${icsDate(parseISO(item.endDate))}`);
  return parts.join(';');
}

function buildIcs(opts) {
  const s = Store.state, t = today();
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const money = (v) => (opts.amounts ? ` ${Fmt.money(v, true)}` : '');
  const events = [];
  const add = ({ uid, start, end, summary, description, rrule, alarmDays }) => {
    const lines = ['BEGIN:VEVENT', `UID:${uid}@finanzplaner`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(start)}`,
      `DTEND;VALUE=DATE:${icsDate(end || addDays(start, 1))}`, `SUMMARY:${icsEscape(summary)}`];
    if (description) lines.push(`DESCRIPTION:${icsEscape(description)}`);
    if (rrule) lines.push(`RRULE:${rrule}`);
    lines.push('TRANSP:TRANSPARENT');
    if (alarmDays) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(summary)}`, `TRIGGER:-P${alarmDays}D`, 'END:VALARM');
    lines.push('END:VEVENT');
    events.push(lines);
  };
  const alarmFor = (e) => (opts.alarms && e.kind === 'expense' && e.amount >= 100 ? 1 : 0);
  // Serie oder – am 29./30. – Einzeltermine für 24 Monate mit denselben Daten wie in der App
  const addSeries = (item, event) => {
    if (!icsNeedsSingles(item)) { add({ ...event, rrule: icsRule(item) }); return; }
    for (const date of Finance.occurrences(item, t, addMonths(t, 24))) add({ ...event, uid: `${event.uid}-${icsDate(date)}`, start: date });
  };

  if (opts.payments) {
    for (const e of s.entries) {
      const signed = e.kind === 'income' ? e.amount : -e.amount;
      if (e.interval === 'once') {
        if (parseISO(e.date) < t) continue;
        add({ uid: e.id, start: parseISO(e.date), summary: `${e.name}${money(signed)}`, description: `${catLabel(e.category)}${e.note ? ', ' + e.note : ''}`, alarmDays: alarmFor(e) });
      } else {
        if (e.endDate && parseISO(e.endDate) < t) continue;
        addSeries(e, { uid: e.id, start: parseISO(e.date), summary: `${e.name}${money(signed)}`, description: `${catLabel(e.category)}, ${INTERVALS[e.interval]}${e.note ? ', ' + e.note : ''}`, alarmDays: alarmFor(e) });
      }
    }
  }
  if (opts.savings) {
    const day = monthStartDay();
    for (const g of s.goals) {
      if (!(g.monthlyRate > 0) || g.saved >= g.target) continue;
      const first = new Date(t.getFullYear(), t.getMonth() + (t.getDate() > day ? 1 : 0), day);
      const f = goalForecast(g);
      add({ uid: `${g.id}-sparrate`, start: first, summary: `Sparrate ${g.name}${money(-g.monthlyRate)}`, description: `Sparziel ${g.name}`,
        rrule: `FREQ=MONTHLY;BYMONTHDAY=${day}${f.date ? `;UNTIL=${icsDate(f.date)}` : ''}` });
    }
    for (const tr of s.transfers || []) {
      if (tr.active === false) continue;
      if (tr.interval === 'once' && parseISO(tr.date) < t) continue;
      const event = { uid: tr.id, start: parseISO(tr.date), summary: `${tr.name}${money(-tr.amount)}`, description: `${accountName(tr.fromId)} → ${accountName(tr.toId)}` };
      if (tr.interval === 'once') add(event); else addSeries(tr, event);
    }
  }
  if (opts.deadlines) {
    for (const e of s.entries) {
      const c = e.contract;
      if (!c) continue;
      if (c.cancelled && c.cancelled.effective) {
        const eff = parseISO(c.cancelled.effective);
        if (eff >= t) add({ uid: `${e.id}-ende`, start: eff, summary: `Vertrag endet: ${e.name}`, description: c.cancelled.confirmed ? 'Kündigung bestätigt' : 'Kündigungsbestätigung noch offen' });
        continue;
      }
      if (!c.endDate) continue;
      const deadline = addMonths(parseISO(c.endDate), -(Number(c.noticeMonths) || 0));
      if (deadline < t) continue;
      add({ uid: `${e.id}-frist`, start: deadline, summary: `Kündigungsfrist: ${e.name}`, description: `Letzter Tag, um ${e.name} zum ${fmtDate(parseISO(c.endDate))} zu kündigen.`,
        alarmDays: Number(setting('reminderDays')) || 14 });
    }
  }
  if (opts.semesters) {
    for (const sem of s.semesters || []) {
      if (!sem.lectureStart || !sem.lectureEnd || parseISO(sem.lectureEnd) < t) continue;
      add({ uid: `${sem.id}-vorlesung`, start: parseISO(sem.lectureStart), end: addDays(parseISO(sem.lectureEnd), 1), summary: `Vorlesungszeit ${sem.name}` });
    }
  }
  if (opts.events) {
    for (const ev of s.lifeEvents || []) {
      if (parseISO(ev.date) < t) continue;
      add({ uid: ev.id, start: parseISO(ev.date), summary: `Geplant: ${ev.name}${money(-ev.cost)}`, description: ev.note });
    }
  }
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Finanzplaner//Kalender-Export//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Finanzplaner', ...events.flat(), 'END:VCALENDAR'];
  return { text: lines.map(icsFold).join('\r\n') + '\r\n', count: events.length };
}

function openIcsExport() {
  const groups = [
    ['payments', 'Zahlungen', 'wiederkehrende als Serien, geplante einmalige als einzelne Termine', true],
    ['savings', 'Sparraten und Geldflüsse', 'Überweisungen zwischen deinen Konten', true],
    ['deadlines', 'Kündigungsfristen', `mit Erinnerung ${setting('reminderDays')} Tage vorher, gekündigte Verträge mit Vertragsende`, true],
    ['semesters', 'Vorlesungszeiten', 'aus dem Semester-Planer', true],

    ['amounts', 'Beträge im Titel', 'ausschalten, wenn dein Kalender geteilt oder mit anderen synchronisiert wird', !setting('privacy')]
  ];
  const body = `
    <p class="dialog-text">Erzeugt eine Kalender-Datei (.ics) für den Samsung- oder Google-Kalender. Auf dem Tablet öffnest du sie nach dem Speichern und wählst den Kalender zum Importieren.</p>
    <div class="toggles">${groups.map(([name, title, sub, on]) => toggleRow(name, title, sub, on)).join('')}</div>
    <p class="meter-sub" id="icsCount" style="margin-top:10px"></p>`;
  const optionsOf = (form) => Object.fromEntries(groups.map(([name]) => [name, !!form.querySelector(`[name="${name}"]`).checked]));
  const dialog = UI.modal({
    title: 'Termine exportieren', body, submitLabel: 'Kalender-Datei speichern',
    onSubmit: () => {
      const ics = buildIcs(optionsOf(dialog.overlay.querySelector('form')));
      if (!ics.count) { UI.toast('Für diese Auswahl gibt es keine Termine.'); return false; }
      if (downloadFile('finanzplaner-termine.ics', ics.text, 'text/calendar;charset=utf-8')) UI.toast(`${ics.count} Termine exportiert. Öffne die Datei, um sie in deinen Kalender zu übernehmen.`);
    }
  });
  const form = dialog.overlay.querySelector('form');
  const count = () => { const n = buildIcs(optionsOf(form)).count; dialog.overlay.querySelector('#icsCount').textContent = `${n} ${n === 1 ? 'Termin bzw. Serie' : 'Termine und Serien'} werden exportiert.`; };
  form.addEventListener('change', count);
  count();
}

/* ---------- 7z. Installation als App (Etappe D2) ----------
   Nur über eine echte Web-Adresse (https oder localhost): Manifest und Service Worker anmelden.
   Als lokale Datei bleibt alles wie bisher. Begleitdateien: manifest.webmanifest, sw.js, Symbole. */
const Pwa = {
  deferredPrompt: null,
  persisted: null,
  canPersist: false,
  offlineReady: false,

  hosted(protocol = location.protocol, host = location.hostname) {
    return protocol === 'https:' || (protocol === 'http:' && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(host));
  },
  standalone() {
    try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; }
  },

  init() {
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); this.deferredPrompt = e; this.refresh(); });
    window.addEventListener('appinstalled', () => {
      this.deferredPrompt = null;
      UI.toast('Der Finanzplaner ist jetzt als App installiert.');
      this.requestPersist(true);
      this.refresh();
    });
    if (navigator.storage && navigator.storage.persisted) {
      this.canPersist = typeof navigator.storage.persist === 'function';
      navigator.storage.persisted().then((v) => { this.persisted = v; this.refresh(); }).catch(() => {});
    }
    if (!this.hosted()) return;
    if (!document.querySelector('link[rel="manifest"]')) {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.append(link);
    }
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      this.offlineReady = hadController;
      navigator.serviceWorker.register('sw.js')
        .then(() => navigator.serviceWorker.ready)
        .then(() => { this.offlineReady = true; this.refresh(); })
        .catch((err) => console.warn('Service Worker nicht verfügbar:', err));
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        this.offlineReady = true;
        if (hadController) UI.toast('Eine neue Version ist installiert.', { label: 'Neu laden', run: () => location.reload() });
      });
    }
  },

  refresh() { if (Store.state && App.current === 'settings') App.render(false); },

  async install() {
    const prompt = this.deferredPrompt;
    if (!prompt) return;
    this.deferredPrompt = null;
    prompt.prompt();
    try { await prompt.userChoice; } catch (e) { /* Auswahl egal */ }
    this.refresh();
  },

  async requestPersist(silent) {
    if (!(navigator.storage && typeof navigator.storage.persist === 'function')) { if (!silent) UI.toast('Dieser Browser bietet das nicht an.'); return; }
    try {
      this.persisted = await navigator.storage.persist();
      if (!silent) UI.toast(this.persisted ? 'Deine Daten sind jetzt vor automatischem Löschen geschützt.' : 'Der Browser hat abgelehnt. Als installierte App klappt es meist.');
    } catch (e) { if (!silent) UI.toast('Der Speicherschutz ist gerade nicht möglich.'); }
    this.refresh();
  }
};

/** Zeilen für die Einstellungen: Installation, Offline, Speicherschutz. */
function pwaRows() {
  const row = ([title, sub, button]) => `<li class="row"><span class="row-main"><span class="row-title">${esc(title)}</span><span class="row-sub">${esc(sub)}</span></span>${button || ''}</li>`;
  const hosted = Pwa.hosted();
  const install = Pwa.standalone() ? ['Läuft als installierte App', 'Startet vom Startbildschirm, ohne Browserleiste']
    : Pwa.deferredPrompt ? ['Als App installieren', 'Legt den Finanzplaner mit eigenem Symbol auf den Startbildschirm', '<button type="button" class="btn primary" data-action="pwa-install">Installieren</button>']
    : hosted ? ['Als App installieren', 'Im Browser-Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“ wählen']
    : ['Als App installieren', 'Dazu muss die App einmal online liegen, zum Beispiel kostenlos bei GitHub Pages. Die Anleitung liegt im Paket (ANLEITUNG-INSTALLATION.md).'];
  const offline = ['Offline', !hosted ? 'Diese Datei läuft lokal und braucht ohnehin kein Internet.' : Pwa.offlineReady ? 'Bereit: startet auch ohne Internet.' : 'Wird beim ersten Start eingerichtet.'];
  const storage = Pwa.persisted === true ? ['Speicherschutz aktiv', 'Der Browser löscht deine Daten nicht bei Speichermangel']
    : Pwa.canPersist ? ['Speicherschutz', 'Bittet den Browser, deine Daten nie automatisch zu löschen', '<button type="button" class="btn" data-action="pwa-persist">Anfordern</button>'] : null;
  const mb = (key) => `${((Disk.get(key) || '').length / 1048576).toFixed(1).replace('.', ',')} MB`;
  const where = Disk.mode === 'idb' ? ['Speicherort: App-Datenbank', `IndexedDB mit viel Platz · Daten etwa ${mb(STORAGE_KEY)}, Sicherungen etwa ${mb(RESTORE_KEY)}`]
    : Disk.mode === 'broken' ? ['Speicherort gerade nicht erreichbar', 'Deine Daten liegen in der App-Datenbank, die sich nicht öffnen ließ. Es wird nichts überschrieben – bitte die App neu starten.']
    : ['Speicherort: Browser-Speicher', `begrenzt auf etwa 5 MB · Daten etwa ${mb(STORAGE_KEY)}, Sicherungen etwa ${mb(RESTORE_KEY)}`];
  return [where, install, offline, storage].filter(Boolean).map(row).join('');
}
