  },

  /** Kurze Meldung unten; optional mit Aktion (z. B. Rückgängig). */
  toast(message, action) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = `<span>${esc(message)}</span>`;
    if (action) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = action.label;
      btn.addEventListener('click', () => { action.run(); el.remove(); });
      el.append(btn);
    }
    $('#toasts').append(el);
    const ms = (action && action.ms) || 5000; // z. B. „Jetzt teilen“ braucht mehr Zeit zum Antippen
    setTimeout(() => el.classList.add('leaving'), ms - 300);
    setTimeout(() => el.remove(), ms);
  },

  /**
   * Dialog mit Formular. body = HTML der Felder, onSubmit(daten) speichert.
   * Gibt onSubmit false zurück, bleibt der Dialog offen (z. B. bei Fehleingabe).
   */
  modal({ title, body, submitLabel = 'Speichern', danger = false, onSubmit, sheet = false, wide = false }) {
    const previous = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <form class="dialog${sheet ? ' sheet' : ''}${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" novalidate>
        ${sheet ? '<div class="sheet-grip" aria-hidden="true"><i></i></div>' : ''}
        <div class="dialog-head">
          <h2 id="dialogTitle">${esc(title)}</h2>
          <button type="button" class="mini" data-close aria-label="Schließen">${icon('close')}</button>
        </div>
        <div class="dialog-body">${body}</div>
        <div class="dialog-foot">
          ${sheet ? '<button type="button" class="btn primary" data-close>Schließen</button>' : `<button type="button" class="btn ghost" data-close>Abbrechen</button>
          <button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${esc(submitLabel)}</button>`}
        </div>
      </form>`;

    const close = () => {
      if (overlay.isConnected && motionLevel() === 'full') Motion.ghost(overlay);
      overlay.remove();
      document.removeEventListener('keydown', onKey, true);
      if (previous && previous.focus) previous.focus();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
      if (e.key !== 'Tab') return;
      const items = [...overlay.querySelectorAll('button, input, select, textarea, summary')].filter((el) => !el.disabled);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };

    overlay.addEventListener('click', (e) => { if (e.target === overlay || e.target.closest('[data-close]')) close(); });
    overlay.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!onSubmit) { close(); return; }
      const data = Object.fromEntries(new FormData(e.target).entries());
      let result;
      try { result = onSubmit(data); }
      catch (err) { reportError('Speichern', err); return; }
      if (result !== false) close();
    });
    // Bottom Sheet: nach unten wischen schließt
    const grip = overlay.querySelector('.sheet-grip');
    if (grip) {
      const dialog = overlay.querySelector('.dialog');
      let startY = null;
      grip.addEventListener('pointerdown', (e) => { startY = e.clientY; grip.setPointerCapture(e.pointerId); dialog.style.transition = 'none'; });
      grip.addEventListener('pointermove', (e) => { if (startY !== null) dialog.style.transform = `translateY(${Math.max(0, e.clientY - startY)}px)`; });
      const release = (e) => {
        if (startY === null) return;
        const moved = e.clientY - startY;
        startY = null;
        dialog.style.transition = 'transform .2s ease';
        if (moved > 90) close(); else dialog.style.transform = '';
      };
      grip.addEventListener('pointerup', release);
      grip.addEventListener('pointercancel', release);
    }
    document.addEventListener('keydown', onKey, true);
    document.body.append(overlay);
    setTimeout(() => { const f = overlay.querySelector('input, select'); if (f) f.focus(); }, 30);
    return { overlay, close };
  }
};

/* ---------- 7. Ansichten ---------- */

/* ---------- 7a. Diagramme: eigene SVG-Engine ----------
   Gezeichnet wird in echter Pixelgröße des Containers (1:1), dadurch sind
   Linien, Text und Kanten auf jedem Bildschirm gestochen scharf.          */
const PALETTE = ['#0B6E75', '#2E62D9', '#C8433F', '#B86E12', '#178A5A', '#7A4FD1', '#C2578F', '#4E6275'];
let pendingCharts = []; // { id, build(width, height) }

const shortMoney = (v) => Fmt.money(v).replace(',00', '');


const Charts = {
  /** Zeichnet die Diagramme der Ansicht in der gemessenen Breite; das SVG skaliert zusätzlich mit. */
  mount() {
    const queue = pendingCharts;
    pendingCharts = [];
    for (const item of queue) {
      const box = document.getElementById(item.id);
      if (!box) continue;
      const width = Math.round(box.clientWidth) || Math.min(880, (window.innerWidth || 900) - 80);
      const height = Math.round(box.clientHeight) || 260;
      box.innerHTML = item.build(Math.max(260, width), Math.max(180, height));
    }
  }
};

/* --- Bausteine --- */
const svgText = (x, y, text, cls, anchor) => `<text x="${Number(x).toFixed(1)}" y="${Number(y).toFixed(1)}" class="${cls || 'lbl'}" text-anchor="${anchor || 'middle'}">${esc(text)}</text>`;
const axisNumber = (v) => new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(v);
const chartStyle = () => (Store.state.settings && Store.state.settings.chartStyle) || 'sanft';

/** Wenige, runde Achsenwerte. */
function niceTicks(min, max, count) {
  const span = (max - min) || Math.abs(max) || 1;
  const rough = span / (count || 3);
  const step = Math.pow(10, Math.floor(Math.log10(rough)));
  const err = rough / step;
  const unit = step * (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1);
  const ticks = [];
  for (let v = Math.floor(min / unit) * unit; v <= max + unit / 2; v += unit) ticks.push(round2(v));
  return ticks.length > 1 ? ticks : [min, max];
}

/** Weiche Kurve durch alle Punkte (Catmull-Rom als Bezier). */
function smoothPath(pts) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
const straightPath = (pts) => 'M' + pts.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L');

/** Feines Achsenkreuz: wenige Linien, Zahlen ohne Währungszeichen. */
function axisFrame(w, h, ticks, y, padL, padR) {
  return ticks.map((t) => `<line class="grid" x1="${padL}" x2="${w - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" opacity="${t === 0 ? 1 : 0.55}"/>${svgText(padL - 10, y(t) + 4, axisNumber(t), 'lbl', 'end')}`).join('');
}

/** Einnahmen und Ausgaben je Woche der letzten 52 Wochen. */
function weeklyFlow(weeks) { return Memo.get('wf' + weeks, () => computeWeeklyFlow(weeks)); }
function computeWeeklyFlow(weeks) {
  const t = today();
  const endOfWeek = addDays(t, 6 - weekdayIndex(t));              // letzter Tag dieser Woche
  const start = addDays(endOfWeek, -(weeks * 7) + 1);             // Montag vor 52 Wochen
  const buckets = [];
  for (let i = 0; i < weeks; i++) {
    const from = addDays(start, i * 7);
    buckets.push({ from, to: addDays(from, 6), income: 0, expense: 0 });
  }
  for (const f of Finance.flows(start, endOfWeek)) {
    const index = Math.floor(Math.round((f.date - start) / 864e5) / 7);
    if (index < 0 || index >= buckets.length) continue;
    if (f.amount > 0) buckets[index].income += f.amount; else buckets[index].expense -= f.amount;
  }
  return buckets.map((b) => ({ from: b.from, to: b.to, income: round2(b.income), expense: round2(b.expense) }));
}

/** Säulendiagramm: Einnahmen nach oben, Ausgaben nach unten, eine Säule je Woche. */
/** Leuchtlinie (Etappe O4): breiter, zarter Schein unter einer Diagrammlinie. Bewusst ohne SVG-Filter,
    damit die leichte Daueranimation der Diagramme billig bleibt. Stärke nach Diagrammstil. */
const LINE_GLOW = { sanft: 0.16, klar: 0.09, 'kräftig': 0.24 };
function lineGlow(d, color, width, style) {
  return `<path class="line-glow" d="${d}" fill="none" stroke="${color}" stroke-width="${(width * 4).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" opacity="${LINE_GLOW[style] || LINE_GLOW.sanft}"/>`;
}

function svgColumns(w, h, weeks, unit) {
  const style = chartStyle();
  const padL = w < 400 ? 44 : 54, padR = 10, padT = 12, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const maxValue = Math.max(1, ...weeks.flatMap((b) => [b.income, b.expense]));
  const ticks = niceTicks(0, maxValue, 2).filter((t) => t > 0);
  const top = ticks[ticks.length - 1] || maxValue;
  const midY = padT + innerH / 2;
  const y = (v) => midY - (v / top) * (innerH / 2);
  const step = innerW / weeks.length;
  const colW = Math.max(1.5, step * (style === 'klar' ? 0.42 : style === 'kräftig' ? 0.78 : 0.6));
  const radius = style === 'klar' ? 0 : Math.min(1.5, colW / 3);

  // Gitter oben und unten gespiegelt, Beschriftung als absoluter Wert
  let grid = `<line class="grid" x1="${padL}" x2="${w - padR}" y1="${midY.toFixed(1)}" y2="${midY.toFixed(1)}"/>${svgText(padL - 10, midY + 4, '0', 'lbl', 'end')}`;
  for (const t of ticks) {
    for (const sign of [1, -1]) {
      const yy = y(t * sign);
      grid += `<line class="grid" x1="${padL}" x2="${w - padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" opacity=".5"/>${svgText(padL - 10, yy + 4, axisNumber(t), 'lbl', 'end')}`;
    }
  }

  // Saldo als 4-Wochen-Schnitt, damit die Kurve nicht zappelt
  const saldoPts = weeks.map((b, i) => {
    const window = weeks.slice(Math.max(0, i - 3), i + 1);
    const avg = window.reduce((sum, x) => sum + (x.income - x.expense), 0) / window.length;
    return [padL + step * i + step / 2, y(Math.max(-top, Math.min(top, avg)))];
  });

  let cols = '', hits = '', labels = '';
  let lastMonth = -1;
  weeks.forEach((b, i) => {
    const x = padL + step * i + (step - colW) / 2;
    const upper = Math.max(0, midY - y(b.income));
    const lower = Math.max(0, y(-b.expense) - midY);
    if (upper > 0.4) cols += `<rect class="col" style="animation-delay:${Math.round(i * 9)}ms" x="${x.toFixed(1)}" y="${y(b.income).toFixed(1)}" width="${colW.toFixed(1)}" height="${upper.toFixed(1)}" rx="${radius}" fill="var(--income)" opacity=".92"/>`;
    if (lower > 0.4) cols += `<rect class="col col-down" style="animation-delay:${Math.round(i * 9)}ms" x="${x.toFixed(1)}" y="${midY.toFixed(1)}" width="${colW.toFixed(1)}" height="${lower.toFixed(1)}" rx="${radius}" fill="var(--expense)" opacity=".92"/>`;
    hits += `<rect class="hit" x="${(padL + step * i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${innerH.toFixed(1)}"><title>${unit === 'Monat' ? b.from.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }) : 'Woche ab ' + b.from.toLocaleDateString('de-DE')}: Einnahmen ${Fmt.money(b.income)}, Ausgaben ${Fmt.money(b.expense)}, Saldo ${Fmt.money(round2(b.income - b.expense))}</title></rect>`;
    if (b.from.getMonth() !== lastMonth && step * i > 6 && i < weeks.length - 1) {
      lastMonth = b.from.getMonth();
      if (i % Math.max(1, Math.round(4.34 * (w < 480 ? 2 : 1))) === 0 || w >= 480) {
        labels += svgText(padL + step * i, h - 8, b.from.toLocaleDateString('de-DE', { month: 'short' }), 'lbl');
      }
    }
  });

  return `
    <svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Einnahmen und Ausgaben je Woche der letzten 52 Wochen">
      ${grid}${cols}
      ${lineGlow(style === 'klar' ? straightPath(saldoPts) : smoothPath(saldoPts), 'var(--brand)', 1.8, style)}<path class="line" d="${style === 'klar' ? straightPath(saldoPts) : smoothPath(saldoPts)}" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      ${labels}${hits}
    </svg>
    <div class="legend">
      <span><i class="cal-dot income"></i>Einnahmen pro ${unit || 'Woche'}</span>
      <span><i class="cal-dot expense"></i>Ausgaben pro ${unit || 'Woche'}</span>
      <span><i class="cal-dot" style="background:var(--brand)"></i>Saldo geglättet</span>
    </div>`;
}

/** Ringdiagramm mit Legende und Summe in der Mitte. */
function svgDonut(w, h, items, centerLabel) {
  const style = chartStyle();
  const total = round2(items.reduce((sum, i) => sum + i[1], 0));
  const stacked = w < 460;
  const size = Math.round(Math.max(150, Math.min(stacked ? h * 0.56 : h - 12, stacked ? w * 0.7 : w * 0.46)));
  const cx = size / 2, cy = size / 2, r = size / 2 - 4;
  const inner = r * (style === 'klar' ? 0.86 : style === 'kräftig' ? 0.62 : 0.78);
  let angle = -Math.PI / 2;

  const arcs = items.map(([id, value], idx) => {
    const label = id === 'rest' ? 'Weitere' : CATEGORIES.expense[id] || CATEGORIES.income[id] || id;
    const fraction = total > 0 ? value / total : 0;
    const sweep = fraction * Math.PI * 2;
    const gapAngle = Math.min(0.03, sweep * 0.1);
    const a0 = angle + gapAngle / 2, a1 = angle + sweep - gapAngle / 2;
    angle += sweep;
    const pt = (a, rad) => `${(cx + Math.cos(a) * rad).toFixed(2)},${(cy + Math.sin(a) * rad).toFixed(2)}`;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    return `<path class="arc" style="animation-delay:${idx * 60}ms" d="M${pt(a0, r)} A${r},${r} 0 ${large} 1 ${pt(a1, r)} L${pt(a1, inner)} A${inner},${inner} 0 ${large} 0 ${pt(a0, inner)} Z" fill="${categoryColor(id) || PALETTE[idx % PALETTE.length]}"><title>${esc(label)}: ${Fmt.money(value)}, ${Fmt.pct(fraction)}</title></path>`;
  }).join('');

  const legend = items.map(([id, value], idx) => {
    const label = id === 'rest' ? 'Weitere' : CATEGORIES.expense[id] || CATEGORIES.income[id] || id;
    return `<li><i style="background:${categoryColor(id) || PALETTE[idx % PALETTE.length]}"></i><span>${esc(label)}</span><b class="num">${Fmt.money(value)}</b></li>`;
  }).join('');

  return `
    <div class="donut-wrap${stacked ? ' stack' : ''}">
      <svg class="chart" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(centerLabel || 'Verteilung')}: ${esc(Fmt.money(total))}">
        ${arcs}
        ${svgText(cx, cy - 2, centerLabel || 'Gesamt', 'lbl')}
        ${svgText(cx, cy + 20, axisNumber(total) + ' €', 'val')}
      </svg>
      <ul class="donut-legend">${legend}</ul>
    </div>`;
}

/** Säulendiagramm für Werte über die Zeit, z. B. Vermögen je Monat. */
function svgValueBars(w, h, points, opts) {
  const o = opts || {};
  if (!points || !points.length) return '<p class="empty">Noch keine Daten für ein Diagramm.</p>';
  const style = chartStyle();
  const padL = w < 400 ? 46 : 56, padR = 12, padT = 16, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const values = points.map((p) => p.value);
  const ticks = niceTicks(Math.min(0, ...values), Math.max(0, ...values), 3);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const y = (v) => padT + (hi - v) / (hi - lo || 1) * innerH;
  const baseline = y(Math.max(lo, 0));
  const step = innerW / points.length;
  const colW = Math.max(3, step * (style === 'klar' ? 0.4 : style === 'kräftig' ? 0.78 : 0.58));
  const color = o.color || 'var(--brand)';

  let bars = '', labels = '', hits = '';
  const every = Math.ceil(points.length / Math.max(3, Math.floor(innerW / 62)));
  points.forEach((p, i) => {
    const x = padL + step * i + (step - colW) / 2;
    const top = Math.min(y(p.value), baseline), height = Math.abs(baseline - y(p.value));
    bars += `<rect class="col${p.value < 0 ? ' col-down' : ''}" style="animation-delay:${i * 35}ms" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${colW.toFixed(1)}" height="${Math.max(1, height).toFixed(1)}" rx="${Math.min(3, colW / 4).toFixed(1)}" fill="${p.value < 0 ? 'var(--expense)' : color}" opacity=".92"/>`;
    hits += `<rect class="hit" x="${(padL + step * i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${innerH.toFixed(1)}"><title>${esc(p.label)}: ${Fmt.money(p.value)}</title></rect>`;
    if (i % every === 0 || i === points.length - 1) labels += svgText(padL + step * i + step / 2, h - 9, p.label, 'lbl');
  });

  return `
    <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(o.label || 'Verlauf')}">
      ${axisFrame(w, h, ticks, y, padL, padR)}${bars}${labels}${hits}
    </svg>`;
}

/** Liniendiagramm mit Fläche, feinem Gitter und Werten beim Darüberfahren. */
function svgLine(w, h, points, opts) {
  const o = opts || {};
  if (!points || points.length < 2) return '<p class="empty">Noch zu wenig Verlauf für ein Diagramm.</p>';
  const style = chartStyle();
  const padL = w < 400 ? 46 : 56, padR = 12, padT = 16, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const values = points.map((p) => p.value);
  const extra = o.critical !== undefined ? [o.critical] : [];
  const ticks = niceTicks(Math.min(...values, ...extra, 0), Math.max(...values, ...extra), 3);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const x = (i) => padL + (points.length === 1 ? innerW / 2 : i * innerW / (points.length - 1));
  const y = (v) => padT + (hi - v) / (hi - lo || 1) * innerH;
  const coords = points.map((p, i) => [x(i), y(p.value)]);
  const curve = style === 'klar' ? straightPath(coords) : smoothPath(coords);
  const base = h - padB;
  const gid = 'l' + uid();
  const color = o.color || 'var(--brand)';

  const every = Math.ceil(points.length / Math.max(3, Math.floor(innerW / 62)));
  const labels = points.map((p, i) => (i % every === 0 || i === points.length - 1) ? svgText(x(i), h - 9, p.label, 'lbl') : '').join('');
  const hits = points.map((p, i) => `<rect class="hit" x="${(x(i) - innerW / points.length / 2).toFixed(1)}" y="${padT}" width="${(innerW / points.length).toFixed(1)}" height="${innerH.toFixed(1)}"><title>${esc(p.label)}: ${Fmt.money(p.value)}</title></rect>`).join('');
  const dots = ''; // Werte erscheinen beim Darüberfahren, keine Punkte im Diagramm
  const critical = o.critical !== undefined
    ? `<line x1="${padL}" x2="${w - padR}" y1="${y(o.critical).toFixed(1)}" y2="${y(o.critical).toFixed(1)}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="4 5" opacity=".8"/>` : '';
  const area = style === 'klar' ? ''
    : `<path class="area" d="${curve} L${coords[coords.length - 1][0].toFixed(1)},${base} L${coords[0][0].toFixed(1)},${base} Z" fill="url(#${gid})"/>`;

  return `
    <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(o.label || 'Verlauf')}">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="${style === 'kräftig' ? '.4' : '.2'}"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${axisFrame(w, h, ticks, y, padL, padR)}${critical}${(o.markers || []).map((mk) => {
        const mx = padL + Math.max(0, Math.min(1, mk.ratio)) * innerW;
        return `<g class="marker"><line x1="${mx.toFixed(1)}" x2="${mx.toFixed(1)}" y1="${padT}" y2="${(h - padB).toFixed(1)}" stroke="${mk.color || 'var(--muted)'}" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/><circle cx="${mx.toFixed(1)}" cy="${padT}" r="3" fill="${mk.color || 'var(--muted)'}"/><title>${esc(mk.label)}</title></g>`;
      }).join('')}${area}
      ${lineGlow(curve, color, style === 'kräftig' ? 3 : 2.2, style)}<path class="line" d="${curve}" fill="none" stroke="${color}" stroke-width="${style === 'kräftig' ? 3 : 2.2}" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${labels}${hits}
    </svg>`;
}

/* ---------- Finanz-Kompass: wohin jeder verdiente Euro fließt ---------- */
const COMPASS_GROUPS = [
  ['wohnen', 'Wohnen', ['wohnen', 'energie']],
  ['lebensmittel', 'Lebensmittel', ['lebensmittel', 'drogerie']],
  ['vertraege', 'Verträge', ['abos', 'fitness', 'kommunikation', 'versicherung', 'studium']],
  ['freizeit', 'Freizeit', ['freizeit', 'restaurants', 'reisen', 'kleidung']],
  ['sonstiges', 'Sonstiges', ['mobilitaet', 'tanken', 'haushalt', 'sonstiges']]
];

/** Verteilung der Einnahmen auf Lebensbereiche, in Cent je verdientem Euro. */
function compassData() {
  const { from, to } = monthBounds();
  const k = Finance.summary();
  const parts = COMPASS_GROUPS.map(([id, label, categories]) => ({
    id, label, value: round2(categories.reduce((sum, c) => sum + Finance.sum('expense', from, to, (e) => e.category === c), 0))
  }));
  parts.splice(2, 0, { id: 'sparen', label: 'Sparen', value: round2(k.saving) });
  const spent = round2(parts.reduce((sum, p) => sum + p.value, 0));
  const free = round2(Math.max(0, k.income - spent));
  const list = parts.concat([{ id: 'frei', label: 'Frei verfügbar', value: free }]).filter((p) => p.value > 0);
  return { list, income: k.income, cents: (value) => (k.income > 0 ? Math.round(value / k.income * 100) : 0) };
}

function compassSentence(data) {
  if (!(data.income > 0)) return 'Sobald Einnahmen erfasst sind, zeige ich dir hier, wohin jeder Euro fließt.';
  const top = data.list.slice().sort((a, b) => b.value - a.value).slice(0, 3)
    .map((p) => `${data.cents(p.value)} Cent in ${p.label}`);
  return `Von jedem verdienten Euro fließen aktuell ${top.join(', ')}.`;
}

/** Hero: verfügbares Geld + Zahlungsband des Monats. */
function renderHero(k, t, from, to) {
  const monthName = t.toLocaleDateString('de-DE', { month: 'long' });
  const span = Math.round((to - from) / 864e5) + 1; // Tage im Budgetmonat
  const pos = (d) => ((Math.round((d - from) / 864e5) + 0.5) / span * 100).toFixed(2);
  const dayLabel = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });

  // Wiederkehrende Zahlungen pro Tag bündeln
  const days = new Map();
  for (const f of Finance.flows(from, to)) {
    if (f.entry.interval === 'once') continue;
    const key = toISO(f.date);
    const g = days.get(key) || { date: f.date, net: 0, items: [] };
    g.net += f.amount;
    g.items.push(`${f.entry.name} ${Fmt.money(f.amount, true)}`);
    days.set(key, g);
  }
  const groups = [...days.values()];
  const open = groups.filter((g) => g.date > t).length;
  const dots = groups.map((g) =>
    `<span class="band-dot ${g.net >= 0 ? 'in' : 'out'}${g.date < t ? ' past' : ''}" style="left:${pos(g.date)}%" title="${esc(Fmt.date(g.date) + ': ' + g.items.join(', '))}"></span>`).join('');

  return `
  <section class="hero" aria-labelledby="heroLabel">
    <div class="hero-top">
      <div>
        <div class="hero-label" id="heroLabel">${monthStartDay() === 1 ? `Noch verfügbar im ${monthName}` : `Noch verfügbar bis ${dayLabel(to)}`}</div>
        <div class="hero-value num${k.rest < 0 ? ' neg' : ''}">${Fmt.money(k.rest)}</div>
        <div class="hero-note">nach allen Ausgaben und ${Fmt.money(k.saving)} Sparraten</div>
      </div>
      <div class="hero-side">
        <div><span>Kontostand heute</span><strong class="num">${Fmt.money(k.cash)}</strong></div>
        <div><span>Prognose zum ${Fmt.date(to)}</span><strong class="num${k.forecast < 0 ? ' neg' : ''}">${Fmt.money(k.forecast)}</strong></div>
      </div>
    </div>
    <div class="band" role="img" aria-label="Zahlungsplan ${monthName}: ${groups.length} Zahlungstage, davon ${open} noch offen">
      <div class="band-track"></div>
      <div class="band-past" style="width:${pos(t)}%"></div>
      ${dots}
      <div class="band-today" style="left:${pos(t)}%"></div>
    </div>
    <div class="band-legend"><span>${dayLabel(from)}</span><span>${open} Zahlungstermine offen</span><span>${dayLabel(to)}</span></div>
  </section>`;
}

          Sparrate ${Fmt.money(inf.rateWith)} statt ${Fmt.money(inf.rateWithout)} über ${inf.months} Monate${inf.assumed ? ' (ohne Kaufdatum mit drei Jahren gerechnet)' : ''}.
        </div>` : ''; })()}

  // Budgets mit Ampel

    const diff = b.limit - b.spent;
    const word = { ok: 'Im Rahmen', warn: 'Knapp', bad: 'Überzogen' }[b.level];

      <li class="meter">
        <div class="meter-top"><strong>${esc(catLabel(b.category))}</strong><span class="num">${Fmt.money(b.spent)} von ${Fmt.money(b.limit)}</span></div>
        ${bar(b.ratio, b.level, 'Budget ' + catLabel(b.category))}
        <div class="meter-sub"><span class="lvl lvl-${b.level}">${word}</span>${diff >= 0 ? `noch ${Fmt.money(diff)} übrig` : `${Fmt.money(-diff)} darüber`}</div>

  const widgets = {
    hero: { title: 'Monatsüberblick', bare: true, html: renderHero(k, t, from, to) },
    kpis: { title: 'Kennzahlen', bare: true, html: `<div class="kpis">
      ${kpi('in', 'income', 'Einnahmen', Fmt.money(k.income), `Vormonat: ${Fmt.money(k.prevIncome)}`, 'income')}
      ${kpi('out', 'expense', 'Ausgaben', Fmt.money(k.expenses), `Fix ${Fmt.money(k.fixed)}, variabel ${Fmt.money(k.variable)}`, 'expenses')}
      ${kpi('percent', 'saving', 'Sparquote', Fmt.pct(k.savingsRate), rateNote, 'rate')}
      ${kpi('lock', 'warn', 'Fixkostenquote', Fmt.pct(k.fixedRatio), fixNote, 'fixed')}
      ${kpi('gem', 'brand', 'Nettovermögen', Fmt.money(k.netWorth), `Schulden: ${Fmt.money(k.debts)}`, 'networth')}

    quick: { title: 'Schnell buchen', span: 12, tools: `<a href="#/settings" data-action="tpl-manage">Vorlagen</a>`, html: quickWidget() },
    coach: { title: 'Dein Coach', span: 12, html: `<ul class="alerts">${tips}</ul>` },
    flow: { title: 'Einnahmen und Ausgaben je Woche', span: 7, tools: chartTools, chart: 'chartFlow', html: '<div class="chart-box" id="chartFlow"></div>' },
    categories: { title: 'Ausgaben nach Kategorie', span: 5, chart: 'chartCategories', html: '<div class="chart-box" id="chartCategories"></div>' },
    compass: { title: 'Finanz-Kompass', span: 12, chart: 'chartCompass', html: `<div class="chart-box" id="chartCompass" style="height:270px"></div><p class="compass-line">${esc(compassSentence(compass))}</p>` },
    upcoming: { title: 'Nächste Zahlungen', span: 7, link: ['#/calendar', 'Kalender'], html: `<ul class="list">${upcoming}</ul>` },
    alerts: { title: 'Hinweise', span: 5, html: `<ul class="alerts">${alerts}</ul>` },
    goals: { title: 'Sparziele', span: 6, link: ['#/goals', 'Alle ansehen'], html: `<ul class="list">${goals}</ul>` },
    budgets: { title: 'Budgets', span: 6, link: ['#/budgets', 'Alle ansehen'], html: `<ul class="list">${budgetRows}</ul>` },
    wealth: { title: 'Vermögensentwicklung', span: 12, link: ['#/wealth', 'Details'], chart: 'chartWealth', html: '<div class="chart-box" id="chartWealth"></div>' },
    roadmap: { title: 'Roadmap', bare: true, html: roadmapPanel() },
    score: { title: 'Finanz-Score', span: 12, html: `
      <div class="score">
        ${scoreRing(132, score.total)}
        <div>
          <p class="score-grade">${esc(score.grade)}</p>
          <ul class="score-parts">${score.parts.map((p) => `<li><span>${esc(p.label)}</span><b class="num">${p.value}/${p.max}</b><em>${esc(p.note)}</em></li>`).join('')}</ul>
        </div>
      </div>` }
  };

  const layout = dashboardLayout(Object.keys(widgets));
  const header = `
    <div class="hello">
      <div>
        <h2>${greeting}${s.settings.name ? ', ' + esc(s.settings.name) : ''}</h2>
        <p>${t.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}${s.meta.isDemo ? '<span class="chip">Beispieldaten</span>' : ''}</p>
      </div>
      <button type="button" class="btn no-print" data-action="dash-edit">${icon(dashboardEditing ? 'check' : 'grid')}${dashboardEditing ? 'Fertig' : 'Dashboard anpassen'}</button>
    </div>`;

  if (dashboardEditing) {
    pendingCharts = [];
    return header + renderWidgetEditor(widgets, layout);
  }

  const visible = layout.order.filter((id) => !layout.hidden.includes(id));
  const charts = new Set(visible.map((id) => widgets[id].chart).filter(Boolean));
  pendingCharts = pendingCharts.filter((c) => charts.has(c.id));

  const body = visible.map((id) => {
    const wd = widgets[id];
    if (wd.bare) return `<div class="s12 bare-widget" data-widget="${id}">${wd.html}</div>`;
    const right = wd.tools || (wd.link ? `<a href="${wd.link[0]}">${wd.link[1]}</a>` : '');
    return `<section class="panel s${wd.span}" data-widget="${id}"><h2>${esc(wd.title)} ${right}</h2>${wd.html}</section>`;
  }).join('');

  return `${header}<div class="panels">${body}</div>`;
}

/* ---------- Anpassbares Dashboard ---------- */
let dashboardEditing = false;
const DEFAULT_HIDDEN_WIDGETS = ['roadmap'];

/** Gespeicherte Reihenfolge, neue Widgets werden hinten angehängt. */
function dashboardLayout(allIds) {
  const saved = Store.state.settings.dashboard || {};
  const order = (saved.order || []).filter((id) => allIds.includes(id));
  // Neue Bausteine an ihren vorgesehenen Platz: hinter den nächsten Vorgänger, den es schon gibt (vorher: ganz hinten)
  allIds.forEach((id, i) => {
    if (order.includes(id)) return;
    const before = allIds.slice(0, i).reverse().find((x) => order.includes(x));
    order.splice(before ? order.indexOf(before) + 1 : 0, 0, id);
  });
  const hidden = (saved.hidden || DEFAULT_HIDDEN_WIDGETS).filter((id) => allIds.includes(id));
  return { order, hidden };
}

function saveDashboardLayout(order, hidden) {
  Store.update((s) => { s.settings.dashboard = { order, hidden }; });
}

function renderWidgetEditor(widgets, layout) {

/** Ziehen mit Finger, Stift oder Maus – Pointer-Events funktionieren auf Android und am Desktop. */
function mountWidgetEditor() {
  const list = $('#widgetList');
  if (!list) return;
  let dragging = null, startY = 0;
  list.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.handle');
    if (!handle) return;
    dragging = handle.closest('.widget-item');
    startY = e.clientY;
    dragging.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  list.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dragging.style.transform = `translateY(${e.clientY - startY}px)`;
    const items = [...list.children];
    const index = items.indexOf(dragging);
    const rect = dragging.getBoundingClientRect();
    const middle = rect.top + rect.height / 2;
    const prev = items[index - 1], next = items[index + 1];
    if (prev) {
      const pr = prev.getBoundingClientRect();
      if (middle < pr.top + pr.height / 2) { list.insertBefore(dragging, prev); startY -= pr.height + 8; dragging.style.transform = `translateY(${e.clientY - startY}px)`; return; }
    }
    if (next) {
      const nr = next.getBoundingClientRect();
      if (middle > nr.top + nr.height / 2) { list.insertBefore(next, dragging); startY += nr.height + 8; dragging.style.transform = `translateY(${e.clientY - startY}px)`; }
    }
  });
  const finish = () => {
    if (!dragging) return;
    dragging.classList.remove('dragging');
    dragging.style.transform = '';
    dragging = null;
    const order = [...list.children].map((li) => li.dataset.id);
    const hidden = [...list.children].filter((li) => li.classList.contains('is-hidden')).map((li) => li.dataset.id);
    saveDashboardLayout(order, hidden);
  };
  list.addEventListener('pointerup', finish);
  list.addEventListener('pointercancel', finish);
}

function moveWidget(id, step) {
  const current = dashboardLayout(currentWidgetIds());
  const i = current.order.indexOf(id), j = i + step;
  if (i < 0 || j < 0 || j >= current.order.length) return;
  [current.order[i], current.order[j]] = [current.order[j], current.order[i]];
  saveDashboardLayout(current.order, current.hidden);
}

function toggleWidget(id) {
  const current = dashboardLayout(currentWidgetIds());
  const hidden = current.hidden.includes(id) ? current.hidden.filter((x) => x !== id) : current.hidden.concat(id);
  saveDashboardLayout(current.order, hidden);
}

/** Monatlicher Gegenwert eines wiederkehrenden Eintrags. */
const PER_MONTH = { once: 0, daily: 365 / 12, weekly: 52 / 12, monthly: 1, quarterly: 1 / 3, halfyearly: 1 / 6, yearly: 1 / 12 };
const monthlyAmount = (e) => round2(e.amount * (PER_MONTH[e.interval] || 0));

/* Formular-Helfer, auch für spätere Bereiche */
const field = (label, input, hint = '') => `<label class="field"><span>${esc(label)}</span>${input}${hint ? `<em>${esc(hint)}</em>` : ''}</label>`;
const selectEl = (name, options, value) => `<select name="${name}">${Object.entries(options).map(([k, l]) => `<option value="${k}"${k === value ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;

/** Auswahlfeld für Konten; ohne Konten ein deaktivierter Hinweis. */
function accountSelect(name, value) {
  const list = Store.state.accounts;
  if (!list.length) return `<select name="${name}" disabled><option>Noch kein Konto angelegt</option></select>`;
  const options = Object.fromEntries(list.map((a) => [a.id, `${a.name} (${ACCOUNT_TYPES[a.type] || a.type})`]));
  return selectEl(name, options, value || (name === 'toId' ? savingsAccountId() : mainAccountId()));
}

/** Legt eine Einnahme an oder ändert sie. */
function saveIncome(data, id) {
  const amount = Math.abs(parseFloat(String(data.amount).replace(',', '.')));
  if (!(amount > 0)) { UI.toast('Bitte einen Betrag größer als 0 eintragen.'); return false; }
  const wage = parseFloat(data.wage), hours = parseFloat(data.hoursPerWeek);
  const patch = {
    kind: 'income',
    name: (data.name || '').trim() || 'Einnahme',
    category: data.category,
    amount: round2(amount),
    interval: data.interval,
    date: data.date || toISO(today()),
    note: (data.note || '').trim(),
    accountId: data.accountId || null,
    hourly: wage > 0 && hours > 0 ? { wage, hoursPerWeek: hours, weeksPerYear: parseFloat(data.weeksPerYear) || 52 } : null,
    tags: normTags(data.tags) // Etappe E7
  };
  if (!patch.tags.length) patch.tags = undefined;
  Store.update((s) => {
    const i = id ? s.entries.findIndex((x) => x.id === id) : -1;
    if (i > -1) s.entries[i] = { ...s.entries[i], ...patch };
    else s.entries.push({ id: uid(), ...patch });
  });
  UI.toast(id ? 'Einnahme aktualisiert.' : 'Einnahme gespeichert.');
}

/** Löscht ein Element aus einer Liste und bietet 5 Sekunden lang Rückgängig an. */
function removeWithUndo(listName, id, label) {
  const list = Store.state[listName];
  const index = list.findIndex((x) => x.id === id);
  if (index < 0) return;
  const removed = list[index];
  Store.update((s) => s[listName].splice(index, 1));
  UI.toast(`${label || removed.name} gelöscht.`, { label: 'Rückgängig', run: () => Store.update((s) => s[listName].splice(index, 0, removed)) });
}

const deleteEntry = (id) => removeWithUndo('entries', id);

/** Etappe E3: Eine wiederkehrende Buchung, deren Betrag sich geändert hat, endet am Tag davor und verweist mit
    replacedBy auf ihren Nachfolger (replaces, priceHistory). Sie bleibt für die Vergangenheit gültig, erscheint aber
    nicht mehr in Listen. Existiert der Nachfolger nicht mehr (gelöscht), ist sie wieder sichtbar. */
const isSuperseded = (e) => !!e.replacedBy && Memo.get('entryIds', () => new Set(Store.state.entries.map((x) => x.id))).has(e.replacedBy);

/* ---------- Schnellerfassung (Etappe E5) ----------
   Vorlagen buchen mit einem Tipp eine einmalige Buchung von heute (Plus-Menü, Dashboard). „Letzte wiederholen“
   kopiert die zuletzt von Hand angelegte Einzelbuchung auf heute. Beides sofort rückgängig machbar. */
const QUICK_FAB_MAX = 6;
const QUICK_DASH_MAX = 12;
const sameTemplate = (a, b) => a.kind === b.kind && String(a.name).trim().toLowerCase() === String(b.name).trim().toLowerCase() && round2(a.amount) === round2(b.amount);
const validAccount = (id) => (id && Store.state.accounts.some((a) => a.id === id) ? id : mainAccountId());

/** Zuletzt angelegte Einzelbuchung, die du selbst erfasst hast (nicht aus dem Kontoauszug oder Semester-Planer). */
function lastManualEntry() {
  const list = Store.state.entries;
  for (let i = list.length - 1; i >= 0; i--) {
    const e = list[i];
    if (e.interval === 'once' && e.source !== 'csv' && e.source !== 'semester') return e;
  }
  return null;
}

/** Oft gebucht (mindestens dreimal in 90 Tagen, gleicher Name und Betrag), noch keine Vorlage. */
function templateSuggestions(limit = 3) {
  const s = Store.state;
  const since = toISO(addDays(today(), -90));
  const groups = new Map();
  for (const e of s.entries) {
    if (e.interval !== 'once' || e.date < since || e.source === 'semester' || e.splitId) continue;
    const key = `${e.kind}|${String(e.name).trim().toLowerCase()}|${round2(e.amount)}`;
    const g = groups.get(key) || { count: 0, last: e };
    g.count++;
    if (e.date >= g.last.date) g.last = e;
    groups.set(key, g);
  }
  return [...groups.values()]
    .map((g) => ({ kind: g.last.kind, name: String(g.last.name).trim(), amount: round2(g.last.amount), category: g.last.category, accountId: g.last.accountId || null, note: '', count: g.count }))
    .filter((x) => x.count >= 3 && !s.templates.some((t) => sameTemplate(t, x)))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name))
    .slice(0, limit);
}

function bookTemplate(id) {
  const t = Store.state.templates.find((x) => x.id === id);
  if (!t) return;
  const entry = { id: uid(), kind: t.kind, name: t.name, category: t.category, amount: t.amount, interval: 'once', date: toISO(today()), note: t.note || '', accountId: validAccount(t.accountId) };
  if (t.kind === 'expense') Object.assign(entry, { tax: null, taxShare: 100 });
  Store.update((s) => s.entries.push(entry));
  UI.toast(`${t.name} ${Fmt.money(t.amount)} gebucht.`, { label: 'Rückgängig', run: () => Store.undo() });
}

function repeatLast() {
  const e = lastManualEntry();
  if (!e) { UI.toast('Noch keine Buchung zum Wiederholen.'); return; }
  const group = e.splitId ? splitParts(e.splitId) : [e]; // aufgeteilter Kauf (E6): alle Teile
  const sid = e.splitId ? uid() : null;
  const copies = group.map((x) => ({ ...JSON.parse(JSON.stringify(x)), id: uid(), date: toISO(today()), accountId: x.accountId ? validAccount(x.accountId) : x.accountId || null, ...(sid ? { splitId: sid } : {}) }));
  Store.update((s) => s.entries.push(...copies));
  UI.toast(`${e.name} ${Fmt.money(entryTotal(e))} erneut gebucht${sid ? ' (aufgeteilt)' : ''}.`, { label: 'Rückgängig', run: () => Store.undo() });
}

function saveTemplate(data, id) {
  const name = String(data.name || '').trim().slice(0, 60);

  if (!name) { UI.toast('Bitte einen Namen eintragen.'); return false; }
  if (!(amount > 0)) { UI.toast('Bitte einen Betrag größer als 0 eintragen.'); return false; }
  const kind = data.kind === 'income' ? 'income' : 'expense';
  const tpl = { name, kind, amount: round2(amount), category: data.category || (kind === 'income' ? 'sonstige' : 'sonstiges'), accountId: data.accountId || null, note: String(data.note || '').trim().slice(0, 140) };
  if (Store.state.templates.some((x) => x.id !== id && sameTemplate(x, tpl))) { UI.toast('Diese Vorlage gibt es schon.'); return false; }
  Store.update((s) => {
    const i = id ? s.templates.findIndex((x) => x.id === id) : -1;
    if (i > -1) s.templates[i] = { ...s.templates[i], ...tpl };
    else s.templates.push({ id: uid(), ...tpl });
  });
  UI.toast(id ? 'Vorlage aktualisiert.' : `Vorlage „${name}“ gespeichert – ein Tipp im Plus-Menü bucht sie.`);
}

function moveTemplate(id, step) {
  const list = Store.state.templates, i = list.findIndex((t) => t.id === id), j = i + step;
  if (i < 0 || j < 0 || j >= list.length) return;
  Store.update((s) => { const [t] = s.templates.splice(i, 1); s.templates.splice(j, 0, t); });
}

/* ---------- Persönliche Teuerung (Etappe E8) ----------
   Gemessen werden nur Preise gleicher Dinge, nicht Ausgabensummen (die ändern sich auch, wenn man mehr kauft):
   – Fixkosten und Abos: Kette aus aktueller Buchung und Vorgängern (replaces, aus E3), Preis = Betrag am Stichtag.
   – Einkäufe mit festem Preis: gleicher Name, einmalig, mindestens 4 Käufe; Preis am Stichtag = Median der Käufe in den
     90 Tagen davor, nur wenn mindestens 75 % davon höchstens 15 % vom Median abweichen (Supermarkt-Körbe fallen raus).
   Rate = Preisänderungen gewichtet mit den Ausgaben für den Posten im Zeitraum; Abdeckung = Anteil an allen Ausgaben. */
const PRICE_WINDOW = 90, PRICE_STABLE = 0.15, PRICE_MIN_BUYS = 2, PRICE_MIN_GROUP = 4;
const median = (list) => { const a = list.slice().sort((x, y) => x - y), m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
const pctSigned = (v) => { const r = Math.round(v * 1000) / 1000; return r === 0 ? Fmt.pct(0) : `${r > 0 ? '+' : '−'}${Fmt.pct(Math.abs(r))}`; };

/** Beobachtbare Posten (über Memo): { type: 'fix', chain } oder { type: 'buy', buys }. */
function priceItems() {
  return Memo.get('priceItems', () => {
    const s = Store.state, byId = new Map(s.entries.map((e) => [e.id, e]));
    const items = [];
    for (const e of s.entries) {
      if (e.kind !== 'expense' || e.interval === 'once' || !isCurrent(e) || e.source === 'semester') continue;
      const chain = [e];
      for (let x = e; x.replaces && byId.has(x.replaces) && chain.length < 60;) { x = byId.get(x.replaces); chain.unshift(x); }
      items.push({ type: 'fix', key: 'fix:' + e.id, name: e.name, category: e.category, chain });
    }
    const groups = new Map();
    for (const e of s.entries) {
      if (e.kind !== 'expense' || e.interval !== 'once' || e.splitId || e.source === 'semester') continue;
      const k = payeeKey(e.name) || String(e.name).trim().toLowerCase();
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    }
    for (const [k, list] of groups) {
      if (list.length < PRICE_MIN_GROUP) continue;
      list.sort((a, b) => a.date.localeCompare(b.date));
      const cats = new Map();
      for (const e of list) cats.set(e.category, (cats.get(e.category) || 0) + 1);
      items.push({ type: 'buy', key: 'buy:' + k, name: list[list.length - 1].name, category: [...cats.entries()].sort((a, b) => b[1] - a[1])[0][0], buys: list });
    }
    return items;
  });
}

/** Preis eines Postens am Stichtag oder null. */
function priceAt(item, iso) {
  if (item.type === 'fix') {
    const m = item.chain.find((x) => x.date <= iso && (!x.endDate || x.endDate >= iso));
    return m ? { price: m.amount, since: m.date } : null;
  }
  const from = toISO(addDays(parseISO(iso), -PRICE_WINDOW));
  const win = item.buys.filter((e) => e.date > from && e.date <= iso).map((e) => e.amount);
  if (win.length < PRICE_MIN_BUYS) return null;
  const med = median(win);
  const near = win.filter((v) => Math.abs(v - med) <= med * PRICE_STABLE + 0.005).length;
  return near >= Math.ceil(win.length * 0.75) ? { price: round2(med), n: win.length } : null;
}

/** Ausgaben für den Posten nach Stichtag A bis einschließlich B. */
function spendBetween(item, aIso, bIso) {
  const from = addDays(parseISO(aIso), 1), to = parseISO(bIso);
  if (item.type === 'fix') return round2(item.chain.reduce((sum, x) => sum + Finance.occurrences(x, from, to).length * x.amount, 0));
  return round2(item.buys.filter((e) => e.date > aIso && e.date <= bIso).reduce((sum, e) => sum + e.amount, 0));
}

/** Persönliche Teuerung zwischen zwei Stichtagen. rate null, wenn kein Posten an beiden Tagen einen Preis hat. */
function priceChange(aIso, bIso) {
  return Memo.get(`price${aIso}${bIso}`, () => {
    const rows = [];
    for (const it of priceItems()) {
      const a = priceAt(it, aIso), b = priceAt(it, bIso);
      if (!a || !b) continue;
      const weight = spendBetween(it, aIso, bIso);
      if (weight > 0) rows.push({ item: it, then: a.price, now: b.price, change: b.price / a.price - 1, weight, since: it.type === 'fix' && b.since > aIso ? b.since : null });
    }
    const covered = round2(rows.reduce((sum, r) => sum + r.weight, 0));
    const spent = Finance.sum('expense', addDays(parseISO(aIso), 1), parseISO(bIso));
    const cats = new Map();
    for (const r of rows) {
      const c = cats.get(r.item.category) || { category: r.item.category, weight: 0, sum: 0, names: [] };
      c.weight += r.weight; c.sum += r.weight * r.change; c.names.push(r.item.name);
      cats.set(r.item.category, c);
    }
    return {
      from: aIso, to: bIso, rows, covered, spent, coverage: spent > 0 ? Math.min(1, covered / spent) : 0,
      rate: covered > 0 ? rows.reduce((sum, r) => sum + r.weight * r.change, 0) / covered : null,
      byCat: [...cats.values()].map((c) => ({ ...c, rate: c.sum / c.weight }))
        .sort((a, b) => (Math.abs(b.rate) >= 0.0005) - (Math.abs(a.rate) >= 0.0005) || b.weight - a.weight) // mit Änderung zuerst
    };
  });
}

/** Je Kalenderjahr: Jahresende gegen Vorjahresende, das laufende Jahr bis heute. Nur Jahre mit Beobachtungen. */
function priceYears() {
  const exp = Store.state.entries.filter((e) => e.kind === 'expense');
  if (!exp.length) return [];
  const first = Number(exp.reduce((d, e) => (e.date < d ? e.date : d), '9999').slice(0, 4));
  const now = today().getFullYear(), out = [];
  for (let y = Math.max(first + 1, now - 5); y <= now; y++) {
    const r = priceChange(`${y - 1}-12-31`, y === now ? toISO(today()) : `${y}-12-31`);
    if (r.rows.length) out.push({ year: y, partial: y === now, ...r });
  }
  return out;
}

/** Ausgaben je Kategorie: dieses Jahr bis heute gegen denselben Zeitraum im Vorjahr (Menge und Preis zusammen). */
function categoryYoY() {
  const t = today(), y = t.getFullYear();
  const aFrom = new Date(y, 0, 1), bFrom = new Date(y - 1, 0, 1), bTo = new Date(y - 1, t.getMonth(), t.getDate());
  const exp = Store.state.entries.filter((e) => e.kind === 'expense');
  // Nur vergleichen, wenn es schon zu Beginn des Vorjahres Buchungen gab – sonst sähe z. B. die Miete aus wie „+800 %“
  const earliest = exp.reduce((d, e) => (e.date < d ? e.date : d), '9999');
  if (earliest > toISO(addDays(bFrom, 14))) return { year: y, until: t, rows: [], totalNow: 0, totalBefore: 0, tooShort: true };
  const cats = new Set(exp.map((e) => e.category));
  const rows = [];
  for (const c of cats) {
    const now = Finance.sum('expense', aFrom, t, (e) => e.category === c), before = Finance.sum('expense', bFrom, bTo, (e) => e.category === c);
    if (now > 0 && before > 0) rows.push({ category: c, now, before, change: now / before - 1 });
  }
  return { year: y, until: t, rows: rows.sort((a, b) => b.now - a.now).slice(0, 10), totalNow: Finance.sum('expense', aFrom, t), totalBefore: Finance.sum('expense', bFrom, bTo) };
}

/** Preisänderungen, die schon sichtbar sind, auch wenn es noch keinen Preis von vor einem Jahr gibt (Ketten aus E3). */
function observedPriceSteps() {
  return priceItems().filter((it) => it.type === 'fix' && it.chain.length > 1 && it.chain[0].amount !== it.chain[it.chain.length - 1].amount)
    .map((it) => ({ name: it.name, category: it.category, then: it.chain[0].amount, now: it.chain[it.chain.length - 1].amount, since: it.chain[it.chain.length - 1].date }));
}

function openApplyInflation() {
  const r = priceChange(toISO(addDays(today(), -365)), toISO(today()));
  if (r.rate === null) return;
  const pct = Math.min(20, Math.max(0, Math.round(r.rate * 1000) / 10));
  const goals = Store.state.goals.filter((g) => g.inflation && g.inflation.enabled);
  const was = setting('defaultInflation') ?? 2;
  UI.modal({
    title: 'Deine Teuerung für Sparziele verwenden',
    body: `<p class="dialog-text">Sparziele mit Inflationsausgleich rechnen bisher mit ${String(was).replace('.', ',')} % pro Jahr. Deine persönliche Teuerung der letzten 12 Monate: ${pctSigned(r.rate)} – erfasst für ${Fmt.pct(r.coverage)} deiner Ausgaben.</p>
      ${field('Inflationsrate pro Jahr in %', `<input name="rate" type="number" step="0.1" min="0" max="20" value="${pct}">`, 'Gerundet; negative Werte zählen als 0')}
      ${goals.length ? `<label class="check-row"><input type="checkbox" name="existing" checked> Auch bei ${goals.length === 1 ? 'dem bestehenden Sparziel' : `den ${goals.length} bestehenden Sparzielen`} mit Inflationsausgleich</label>` : ''}`,
    submitLabel: 'Übernehmen',
    onSubmit: (d) => {
      const v = parseFloat(String(d.rate).replace(',', '.'));
      if (!Number.isFinite(v) || v < 0 || v > 20) { UI.toast('Bitte eine Rate zwischen 0 und 20 % eintragen.'); return false; }
      const rate = Math.round(v * 10) / 10;
      const both = d.existing === 'on' && goals.length;
      Store.update((s) => {
        s.settings.defaultInflation = rate;
        if (both) for (const g of s.goals) if (g.inflation && g.inflation.enabled) g.inflation.rate = rate;
      });
      UI.toast(`Sparziele rechnen jetzt mit ${String(rate).replace('.', ',')} % Inflation${both ? ` – auch ${goals.length === 1 ? 'das bestehende' : `die ${goals.length} bestehenden`}` : ' (neue Sparziele)'}.`, { label: 'Rückgängig', run: () => Store.undo() });
    }
  });
}

function renderPrices() {
  const t = today(), iso = toISO(t);
  const cur = priceChange(toISO(addDays(t, -365)), iso);
  const head = `<div class="report-head no-print">${reportTabs('prices')}</div>`;
  const dateDe = (d) => parseISO(d).toLocaleDateString('de-DE');
  const typeText = (it) => (it.type === 'fix' ? INTERVALS[it.chain[it.chain.length - 1].interval] : `Einkauf, ${it.buys.length} Mal`);
  const how = `<details class="calc"><summary>So rechnet die App</summary><p class="meter-sub">Verglichen werden nur Preise gleicher Dinge: Fixkosten und Abos (Betrag heute gegen den Betrag vor einem Jahr – Preisänderungen aus dem Kontoauszug-Import werden als Verlauf gespeichert) und Einkäufe mit festem Preis wie Mensa oder Busticket (gleicher Name, mindestens vier Käufe, Preis = mittlerer Betrag der letzten 90 Tage, nur wenn die Beträge höchstens 15 % schwanken). Einkäufe mit wechselndem Inhalt wie der Supermarkt zählen nicht – dort lässt sich Preis nicht von Menge trennen. Gewichtet wird mit dem, was du im Zeitraum dafür ausgegeben hast. Hast du einen Betrag von Hand überschrieben, sieht die App keine Preisänderung.</p></details>`;
  if (cur.rate === null) {
    const steps = observedPriceSteps();
    return `${head}<section class="welcome"><h2>Deine persönliche Teuerung</h2>
      <p>Hier vergleicht die App, was dieselben Dinge heute kosten und vor einem Jahr: Abos, Miete, Versicherungen und Einkäufe mit festem Preis, die du immer wieder machst. Dafür braucht es Buchungen von vor mindestens einem Jahr – importiere ältere Kontoauszüge oder schau in ein paar Monaten wieder vorbei.</p>
      ${steps.length ? `<h3 class="sheet-h">Bisher beobachtete Preisänderungen</h3><ul class="list">${steps.map((x) => `<li class="row"><span class="row-main"><span class="row-title">${esc(x.name)}</span><span class="row-sub">${esc(catLabel(x.category))}, seit ${dateDe(x.since)}</span></span><span class="row-amt"><span class="num">${Fmt.money(x.then)} → ${Fmt.money(x.now)}</span><span class="row-sub num ${x.now > x.then ? 'amt-out' : 'amt-in'}">${pctSigned(x.now / x.then - 1)}</span></span></li>`).join('')}</ul>` : ''}</section>${how}`;
  }
  const changed = cur.rows.filter((r) => Math.abs(r.change) >= 0.0005).sort((a, b) => Math.abs(b.change) - Math.abs(a.change));
  const same = cur.rows.filter((r) => Math.abs(r.change) < 0.0005).sort((a, b) => b.weight - a.weight);
  const up = changed.filter((r) => r.change > 0).length, down = changed.length - up;
  const was = setting('defaultInflation') ?? 2;
  const tone = (v) => (Math.round(v * 1000) > 0 ? 'amt-out' : Math.round(v * 1000) < 0 ? 'amt-in' : '');
  const years = priceYears();
  const yoy = categoryYoY();
  const changedRows = changed.map((r) => `
    <li class="row"><span class="row-main"><span class="row-title">${esc(r.item.name)}</span><span class="row-sub">${esc(catLabel(r.item.category))} · ${esc(typeText(r.item))}${r.since ? ` · neuer Preis seit ${dateDe(r.since)}` : ''}</span></span>
      <span class="row-amt"><span class="num">${Fmt.money(r.then)} → ${Fmt.money(r.now)}</span><span class="row-sub num ${tone(r.change)}">${pctSigned(r.change)}</span></span></li>`).join('')
    || '<li class="empty">Keiner der erfassten Posten hat seinen Preis geändert.</li>';
  const catRows = cur.byCat.map((c) => `
    <li class="meter"><div class="meter-top"><strong>${esc(catLabel(c.category))}</strong><span class="num ${tone(c.rate)}">${pctSigned(c.rate)}</span></div>
      <div class="meter-sub">${esc(c.names.slice(0, 4).join(', '))}${c.names.length > 4 ? ` und ${c.names.length - 4} weitere` : ''} · ${Fmt.money(round2(c.weight))} in 12 Monaten</div></li>`).join('');
  const yearRows = years.map((y) => `
    <li class="row"><span class="row-main"><span class="row-title">${y.year}${y.partial ? ' seit Jahresbeginn' : ''}</span><span class="row-sub">${y.rows.length} ${y.rows.length === 1 ? 'Posten' : 'Posten'}, erfasst ${Fmt.pct(y.coverage)} der Ausgaben</span></span>
      <span class="row-amt"><span class="num ${tone(y.rate)}">${pctSigned(y.rate)}</span></span></li>`).join('');
  const yoyRows = yoy.rows.map((r) => `
    <li class="row"><span class="row-main"><span class="row-title">${esc(catLabel(r.category))}</span><span class="row-sub">${Fmt.money(r.before)} → ${Fmt.money(r.now)}</span></span>
      <span class="row-amt"><span class="num ${tone(r.change)}">${pctSigned(r.change)}</span></span></li>`).join('');
  return `${head}
    <h2 class="report-title">Deine Teuerung</h2>
    <div class="kpis">
      ${kpi('percent', cur.rate > 0.0005 ? 'expense' : 'income', 'Letzte 12 Monate', pctSigned(cur.rate), 'für die gleichen Dinge')}
      ${kpi('pie', 'brand', 'Erfasst', Fmt.pct(cur.coverage), `deiner Ausgaben, ${cur.rows.length} Posten`)}
      ${kpi('chart', 'warn', 'Teurer geworden', String(up), `${down} günstiger, ${same.length} gleich`)}
      ${kpi('target', 'saving', 'Für Sparziele', `${String(was).replace('.', ',')} %`, 'Inflation, mit der sie rechnen')}
    </div>
    ${cur.rate > 0.0005 && Math.abs(Math.round(cur.rate * 1000) / 10 - was) >= 0.1 ? `<p class="prices-apply"><button type="button" class="btn primary" data-action="prices-apply">${icon('target')}Deine Teuerung für Sparziele übernehmen</button></p>` : ''}
    <div class="panels">
      <section class="panel s7"><h2>Was sich verändert hat</h2><ul class="list">${changedRows}</ul>
        ${same.length ? `<p class="meter-sub">Gleich geblieben: ${esc(same.slice(0, 6).map((r) => r.item.name).join(', '))}${same.length > 6 ? ` und ${same.length - 6} weitere` : ''}.</p>` : ''}</section>
      <section class="panel s5"><h2>Je Kategorie</h2><ul class="list">${catRows}</ul></section>
      ${years.length ? `<section class="panel s5"><h2>Über die Jahre</h2><ul class="list">${yearRows}</ul></section>` : ''}
      ${yoy.rows.length ? `<section class="panel s7"><h2>Ausgaben je Kategorie ${yoy.year - 1} → ${yoy.year}</h2><p class="meter-sub">Jeweils 1. Januar bis ${yoy.until.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' })} – das sind Menge und Preis zusammen, also keine Teuerung.</p><ul class="list">${yoyRows}</ul></section>` : ''}
    </div>${how}`;
}

/* ---------- Schlagwörter (Etappe E7) ----------
   Buchungen tragen optional tags: ['Italien-Reise', …] – quer zu den Kategorien, mehrere je Buchung. Verglichen wird
   ohne Groß-/Kleinschreibung; die Schreibweise, die es schon gibt, gewinnt. Teile einer Aufteilung teilen sich die
   Schlagwörter. Auswertung unter Berichte → Schlagwörter, optional mit Rahmen (state.tagMeta[schlüssel].budget). */
const TAG_MAX = 8, TAG_LEN = 30, TAG_DAY_SPAN = 62; // bis gut zwei Monate Spanne: Tagesbalken
const tagKey = (t) => String(t).replace(/\s+/g, ' ').trim().toLowerCase();
const hasTag = (e, key) => !!e.tags && e.tags.some((x) => tagKey(x) === key);

/** Eingabe (Text mit Kommas, Semikolons oder #, oder Liste) → bereinigte Liste. canon: vorhandene Schreibweise übernehmen. */
function normTags(input, canon = true) {
  const raw = Array.isArray(input) ? input : String(input || '').replace(/(^|\s)#/g, '$1,').split(/[,;\n]/);
  const known = canon && Store.state ? allTags() : null;
  const out = [], seen = new Set();
  for (const r of raw) {
    const t = String(r ?? '').replace(/\s+/g, ' ').trim().replace(/^#+/, '').trim().slice(0, TAG_LEN).trim();
    const k = tagKey(t);
    if (!t || seen.has(k)) continue;
    seen.add(k);
    out.push(known && known.has(k) ? known.get(k).name : t);
    if (out.length >= TAG_MAX) break;
  }
  return out;
}

/** Alle Schlagwörter: Schlüssel → { key, name, count (Buchungen, Aufteilung als eine), last (spätestes Datum) }. */
function allTags() {
  return Memo.get('tags', () => {
    const map = new Map(), splits = new Set();
    for (const e of Store.state.entries) {
      if (!e.tags || !e.tags.length) continue;
      const first = !e.splitId || !splits.has(e.splitId);
      if (e.splitId) splits.add(e.splitId);
      for (const t of e.tags) {
        const k = tagKey(t);
        const x = map.get(k) || { key: k, name: t, count: 0, last: '' };
        if (first) x.count++;
        if (e.date > x.last) x.last = e.date;
        map.set(k, x);
      }
    }
    return map;
  });
}

/** Auswertung eines Schlagworts bis heute: Einzelbuchungen mit Datum, wiederkehrende mit jedem Termin bis heute.
    Einzelbuchungen nach heute zählen als „geplant“. */
function tagReport(key) {
  const entries = Store.state.entries.filter((e) => hasTag(e, key));
  if (!entries.length) return null;
  const t = today(), iso = toISO(t);
  let spent = 0, received = 0, planned = 0, count = 0, first = '', last = '';
  const byCat = new Map(), byMonth = new Map(), byDay = new Map(), items = [];
  for (const e of groupSplits(entries.filter((x) => x.interval === 'once'))) {
    if (e.date > iso) { if (e.kind === 'expense') planned = round2(planned + e.amount); items.push({ e, date: e.date, amount: e.amount, future: true }); continue; }
    items.push({ e, date: e.date, amount: e.amount });
  }
  for (const e of entries.filter((x) => x.interval !== 'once')) {
    const dates = Finance.occurrences(e, parseISO(e.date), t);
    if (dates.length) items.push({ e, date: toISO(dates[dates.length - 1]), amount: round2(e.amount * dates.length), times: dates.length, from: toISO(dates[0]) });
  }
  const book = (e, date, amount) => {
    if (e.kind === 'income') received = round2(received + amount);
    else {
      spent = round2(spent + amount);
      byCat.set(e.category, round2((byCat.get(e.category) || 0) + amount));
      byMonth.set(date.slice(0, 7), round2((byMonth.get(date.slice(0, 7)) || 0) + amount));
      byDay.set(date, round2((byDay.get(date) || 0) + amount));
    }
    if (!first || date < first) first = date;
    if (!last || date > last) last = date;
  };
  for (const e of entries) {
    if (e.interval === 'once') { if (e.date <= iso) book(e, e.date, e.amount); continue; }
    for (const d of Finance.occurrences(e, parseISO(e.date), t)) book(e, toISO(d), e.amount);
  }
  count = items.filter((x) => !x.future).reduce((n, x) => n + (x.times || 1), 0);
  const months = [...byMonth.keys()].sort();
  const monthList = [];
  if (months.length) {
    for (let d = parseISO(months[0] + '-01'); toISO(d).slice(0, 7) <= months[months.length - 1]; d = addMonths(d, 1)) {
      const k = toISO(d).slice(0, 7);
      monthList.push({ key: k, label: d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' }), value: byMonth.get(k) || 0 });
    }
  }
  // Kurze Zeiträume (eine Reise, ein Umzug): Tage statt Monate, damit das Diagramm etwas zeigt
  const dayList = [];
  if (first && (parseISO(last) - parseISO(first)) / 864e5 <= TAG_DAY_SPAN) {
    const crosses = first.slice(0, 7) !== last.slice(0, 7);
    for (let d = parseISO(first); toISO(d) <= last; d = addDays(d, 1)) {
      const k = toISO(d);
      dayList.push({ key: k, label: crosses ? `${d.getDate()}.${d.getMonth() + 1}.` : `${d.getDate()}.`, value: byDay.get(k) || 0 });
    }
  }
  const meta = Store.state.tagMeta[key] || {};
  return { key, days: dayList.length ? dayList : null, name: (allTags().get(key) || { name: entries[0].tags.find((x) => tagKey(x) === key) }).name, spent, received, net: round2(received - spent), planned, count, first, last,
    byCat: [...byCat.entries()].sort((a, b) => b[1] - a[1]), months: monthList.slice(-24), items: items.sort((a, b) => b.date.localeCompare(a.date)), budget: meta.budget || 0 };
}

/** Eingabefeld mit den zuletzt benutzten Schlagwörtern zum Antippen. */
function tagField(tags) {
  const own = new Set((tags || []).map(tagKey));
  const picks = [...allTags().values()].sort((a, b) => b.last.localeCompare(a.last) || b.count - a.count).slice(0, 10);
  return `<div class="field tag-field"><label for="fTags">Schlagwörter</label>
    <input name="tags" id="fTags" type="text" value="${esc((tags || []).join(', '))}" placeholder="z. B. Urlaub Italien, Umzug" autocomplete="off" enterkeyhint="done">
    ${picks.length ? `<div class="tag-picks" role="group" aria-label="Vorhandene Schlagwörter">${picks.map((x) => `<button type="button" class="tag-pick" data-tag-pick="${esc(x.name)}" aria-pressed="${own.has(x.key)}">#${esc(x.name)}</button>`).join('')}</div>` : ''}
    <em>Mehrere mit Komma trennen – für Auswertungen quer zu den Kategorien, z. B. alles rund um eine Reise.</em></div>`;
}

/** Antippen eines vorhandenen Schlagworts fügt es hinzu oder nimmt es wieder heraus. */
function wireTagField(overlay) {
  const input = overlay.querySelector('#fTags');
  if (!input) return;
  const sync = () => { const keys = new Set(normTags(input.value).map(tagKey)); overlay.querySelectorAll('[data-tag-pick]').forEach((b) => b.setAttribute('aria-pressed', String(keys.has(tagKey(b.dataset.tagPick))))); };
  overlay.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-tag-pick]');
    if (!b) return;
    const list = normTags(input.value), k = tagKey(b.dataset.tagPick);
    input.value = (list.some((x) => tagKey(x) === k) ? list.filter((x) => tagKey(x) !== k) : [...list, b.dataset.tagPick]).join(', ');
    sync();
  });
  input.addEventListener('input', sync);
}

const tagChips = (e) => (e.tags && e.tags.length ? `<span class="tag-chips">${e.tags.map((t) => `<span class="tag-chip">#${esc(t)}</span>`).join('')}</span>` : '');

function renameTag(key, name) {
  const t = normTags([name], false)[0];
  if (!t) { UI.toast('Bitte einen Namen eintragen.'); return false; }
  const nk = tagKey(t);
  const merge = nk !== key && allTags().has(nk);
  Store.update((s) => {
    for (const e of s.entries) if (e.tags) e.tags = normTags(e.tags.map((x) => (tagKey(x) === key || tagKey(x) === nk ? t : x)), false);
    if (s.tagMeta[key] && nk !== key) { if (!s.tagMeta[nk]) s.tagMeta[nk] = s.tagMeta[key]; delete s.tagMeta[key]; }
  });
  tagFocus = nk;
  App.render(false);
  UI.toast(merge ? `Zusammengeführt mit #${t}.` : `Umbenannt in #${t}.`, { label: 'Rückgängig', run: () => { tagFocus = key; Store.undo(); } });
}

function removeTag(key) {
  const name = (allTags().get(key) || {}).name || key;
  Store.update((s) => {
    for (const e of s.entries) if (e.tags) { e.tags = e.tags.filter((x) => tagKey(x) !== key); if (!e.tags.length) delete e.tags; }
    delete s.tagMeta[key];
  });
  tagFocus = null;
  App.render(false);
  UI.toast(`#${name} bei allen Buchungen entfernt – die Buchungen selbst bleiben.`, { label: 'Rückgängig', run: () => { tagFocus = key; Store.undo(); } });
}

function openTagBudgetForm(key) {
  const r = tagReport(key);
  if (!r) return;
  UI.modal({
    title: `Rahmen für #${r.name}`,
    body: field('Wie viel darf es kosten?', `<input name="budget" type="number" step="1" min="0" value="${r.budget || ''}" placeholder="z. B. 800">`, `Bisher ausgegeben: ${Fmt.money(r.spent)}. Leer oder 0 entfernt den Rahmen.`),
    submitLabel: 'Speichern',
    onSubmit: (data) => {
      const b = Math.abs(parseFloat(String(data.budget || '').replace(',', '.'))) || 0;
      Store.update((s) => { if (b > 0) s.tagMeta[key] = { budget: round2(b) }; else delete s.tagMeta[key]; });
      UI.toast(b > 0 ? `Rahmen für #${r.name}: ${Fmt.money(b)}.` : `Rahmen für #${r.name} entfernt.`);
    }
  });
}

function openTagRenameForm(key) {
  const r = tagReport(key);
  if (!r) return;
  UI.modal({
    title: `#${r.name} umbenennen`,
    body: field('Neuer Name', `<input name="name" type="text" maxlength="${TAG_LEN}" value="${esc(r.name)}" required>`, 'Heißt ein anderes Schlagwort schon so, werden beide zusammengeführt.'),
    submitLabel: 'Umbenennen',
    onSubmit: (data) => renameTag(key, data.name)
  });
}

let tagFocus = null; // Berichte → Schlagwörter: geöffnetes Schlagwort (Schlüssel) oder null für die Übersicht

/** Reiter der Berichte (Monat, Jahr, Steuern, Schlagwörter). */
const reportTabs = (active) => `
      <span class="seg seg-sm report-tabs" role="group" aria-label="Berichtsart">
        ${[['month', 'Monat'], ['year', 'Jahr'], ['tax', 'Steuern'], ['tags', 'Schlagwörter'], ['prices', 'Teuerung']].map(([id, label]) => `<button type="button" data-action="report-mode" data-id="${id}" aria-pressed="${id === active}">${label}</button>`).join('')}
      </span>`;

function renderTags() {
  const tags = [...allTags().values()];
  if (tagFocus && !allTags().has(tagFocus)) tagFocus = null;
  if (tagFocus) return renderTagDetail(tagReport(tagFocus));
  const head = `<div class="report-head no-print">${reportTabs('tags')}</div>`;
  if (!tags.length) {
    return `${head}<section class="welcome"><h2>Ausgaben quer zu den Kategorien zusammenfassen</h2>
      <p>Gib Buchungen ein Schlagwort wie <b>Urlaub Italien</b>, <b>Umzug</b> oder <b>Geburtstag</b> – im Formular einer Ausgabe oder Einnahme. Hier siehst du dann, was alles zusammen gekostet hat, nach Kategorie und Monat, auf Wunsch mit einem Rahmen.</p>
      <button type="button" class="btn primary" data-action="expense-new">${icon('plus')}Ausgabe mit Schlagwort erfassen</button></section>`;
  }
  const reports = tags.map((t) => tagReport(t.key)).filter(Boolean).sort((a, b) => b.last.localeCompare(a.last) || b.spent - a.spent);
  const max = Math.max(1, ...reports.map((r) => r.spent));
  const dateDe = (iso) => parseISO(iso).toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' });
  const rows = reports.map((r) => {
    const span = r.first ? (r.first === r.last ? dateDe(r.first) : `${dateDe(r.first)} – ${dateDe(r.last)}`) : 'nur geplant';
    const ratio = r.budget ? r.spent / r.budget : r.spent / max;
    return `<li class="tag-item"><button type="button" class="tag-row" data-action="tag-open" data-id="${esc(r.key)}">
      <span class="tag tone-brand" aria-hidden="true">#</span>
      <span class="row-main"><span class="row-title">${esc(r.name)}</span><span class="row-sub">${r.count} ${r.count === 1 ? 'Buchung' : 'Buchungen'} · ${esc(span)} · ${r.byCat.length} ${r.byCat.length === 1 ? 'Kategorie' : 'Kategorien'}${r.budget ? ` · Rahmen ${Fmt.money(r.budget)}` : ''}</span></span>
      <span class="row-amt"><span class="num amt-out">${Fmt.money(r.spent)}</span>${r.received ? `<span class="row-sub num amt-in">+${Fmt.money(r.received)}</span>` : ''}</span>
      ${icon('chevR')}</button>
      ${bar(ratio, r.budget ? (ratio > 1 ? 'bad' : ratio >= 0.8 ? 'warn' : 'ok') : 'brand', r.budget ? `Rahmen ${r.name}` : `Anteil ${r.name}`)}</li>`;
  }).join('');
  return `${head}<div class="panels"><section class="panel s12"><h2>Deine Schlagwörter</h2>
    <p class="meter-sub">Alles, was du mit einem Schlagwort markiert hast – über alle Kategorien und Monate. Tippe eines an für die Auswertung.</p>
    <ul class="list tag-list">${rows}</ul></section></div>`;
}

  const left = r.budget ? round2(r.budget - r.spent) : 0;

  if (series.length) pendingCharts.push({ id: 'tagChart', build: (w, hh) => svgValueBars(w, hh, series, { label: `Ausgaben ${r.name} je ${r.days ? 'Tag' : 'Monat'}`, color: 'var(--expense)' }) });
  const catRows = r.byCat.map(([cat, sum]) => `
    <li class="meter"><div class="meter-top"><strong>${esc(catLabel(cat))}</strong><span class="num">${Fmt.money(sum)} · ${Fmt.pct(r.spent ? sum / r.spent : 0)}</span></div>${bar(r.spent ? sum / r.spent : 0, 'expense', 'Anteil ' + catLabel(cat))}</li>`).join('') || '<li class="empty">Noch keine Ausgaben mit diesem Schlagwort.</li>';
  const itemRows = r.items.map((x) => {

    const sub = x.times ? `${INTERVALS[e.interval]}, ${x.times} Mal seit ${dateDe(x.from)}` : e.parts ? `Aufgeteilt: ${e.parts.map((p) => catLabel(p.category)).join(' + ')}` : catLabel(e.category);
    const edit = e.kind === 'income' ? 'income-edit' : 'expense-edit';
    return `<li class="row${x.future ? ' is-future' : ''}">
