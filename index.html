<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzplaner</title>
<meta name="description" content="Persönlicher Finanzplaner – offline und privat, alle Daten bleiben auf dem Gerät.">
<meta name="theme-color" content="#050D12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23148C93'/%3E%3Cstop offset='1' stop-color='%23084E55'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cg transform='translate(13 13) scale(.74)'%3E%3Crect x='8' y='58' width='18' height='34' rx='5' fill='%23fff'/%3E%3Crect x='37' y='40' width='18' height='52' rx='5' fill='%23fff'/%3E%3Crect x='66' y='22' width='18' height='70' rx='5' fill='%23fff'/%3E%3Ccircle cx='20' cy='24' r='13' fill='%23F2B84B'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* Immer dunkel; Farbwelt vor dem ersten Rendern setzen – verhindert ein Aufblitzen (Etappe O1) */
  (function () {
    var p = 'petrol';
    try { p = localStorage.getItem('fp.palette') || 'petrol'; } catch (e) {}
    if (!/^(petrol|indigo|warm|aurora)$/.test(p)) p = 'petrol';
    document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.setAttribute('data-palette', p);
  })();
</script>
<style>
/* ============ 1. Design-Tokens (dunkel und kosmisch, Etappe O1) ============ */
/* Farbwelt Petrol ist Standard; die anderen Farbwelten überschreiben nur Grund-, Flächen- und Akzentfarben.
   Weiche Töne entstehen per color-mix aus Akzent bzw. Bedeutungsfarbe und Fläche – so passen sie zu jeder Farbwelt. */
:root {
  --bg: #050D12; --surface: #0C1820; --surface-2: #112029; --line: #1E313B;
  --ink: #E4EEF1; --muted: #8FA5AF;
  --brand: #4FC7CC; --brand-2: #2A8FB8; --on-brand: #031A1D;
  --grad: linear-gradient(135deg, #2A9DA5, #5FD6D2);
  --income: #45C98C; --expense: #F2736E; --saving: #7CA2F7; --warn: #EBA652;
  --brand-soft: color-mix(in srgb, var(--brand) 18%, var(--surface));
  --income-soft: color-mix(in srgb, var(--income) 16%, var(--surface));
  --expense-soft: color-mix(in srgb, var(--expense) 16%, var(--surface));
  --saving-soft: color-mix(in srgb, var(--saving) 16%, var(--surface));
  --warn-soft: color-mix(in srgb, var(--warn) 16%, var(--surface));
  --glow: color-mix(in srgb, var(--brand) 35%, transparent);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 32px -18px rgba(0,0,0,.8);
  /* Kosmische Oberflächen (O2): Karten leicht durchscheinend, oben eine feine Lichtkante */
  --edge: color-mix(in srgb, var(--ink) 8%, transparent);
  --card-edge: inset 0 1px 0 var(--edge);
  --card-bg: linear-gradient(180deg, color-mix(in srgb, var(--surface-2) 90%, transparent), color-mix(in srgb, var(--surface) 84%, transparent) 70%);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --sidebar-w: 252px;
  --fs: 1;
  color-scheme: dark;
}
:root[data-palette="indigo"] {
  --bg: #06071A; --surface: #0E1027; --surface-2: #141733; --line: #242849;
  --ink: #E7E8FA; --muted: #9A9ECB;
  --brand: #9296FF; --brand-2: #5A5EE6; --on-brand: #0A0B2A;
  --grad: linear-gradient(135deg, #7074F2, #A5A8FF);
}
:root[data-palette="warm"] {
  --bg: #0E0908; --surface: #181110; --surface-2: #201715; --line: #352620;
  --ink: #F4EAE5; --muted: #B5A197;
  --brand: #F2B27A; --brand-2: #D96E3E; --on-brand: #251106;
  --grad: linear-gradient(135deg, #D96E3E, #F5BE85);
}
:root[data-palette="aurora"] {
  --bg: #040A13; --surface: #0B1422; --surface-2: #101B2C; --line: #1D2A40;
  --ink: #E6EEF8; --muted: #93A2BC;
  --brand: #48DDB8; --brand-2: #9B6CF2; --on-brand: #031A16;
  --grad: linear-gradient(120deg, #3FE0A0, #38C6E8 50%, #9B6CF2);
}

/* ============ 2. Basis ============ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: calc(15px * var(--fs, 1)); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { letter-spacing: -.02em; }
.num { font-variant-numeric: tabular-nums; }
.neg { color: var(--expense) !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; }
.skip:focus { left: 12px; z-index: 100; background: var(--surface); padding: 8px 12px; border-radius: 8px; }

/* ============ 3. Layout: Sidebar, Topbar, Inhalt ============ */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 80%, transparent); border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 800; font-size: calc(17px * var(--fs, 1)); }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 800; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--muted); text-decoration: none; font-weight: 600; font-size: calc(14px * var(--fs, 1)); transition: background .15s, color .15s;
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.nav-link svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-foot { margin-top: auto; padding-top: 18px; display: grid; gap: 12px; }
.palette-dots { display: flex; justify-content: space-between; gap: 4px; }
.palette-dots button { width: 48px; height: 48px; border: 0; border-radius: 14px; background: none; display: grid; place-items: center; cursor: pointer; }
.palette-dots button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.palette-dots i { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); transition: box-shadow .2s, transform .2s; }
.palette-dots button:hover i { transform: scale(1.08); }
.palette-dots button[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink), 0 0 16px 2px var(--glow); }
.swatches.palettes .swatch i { width: 64px; height: 44px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 0; border-radius: 9px; cursor: pointer; font-size: calc(12.5px * var(--fs, 1)); font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.save-state { display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: calc(12.5px * var(--fs, 1)); color: var(--muted); }
.save-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--income); }
.save-state.off i { background: var(--warn); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 32px 12px;
  background: var(--bg); background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(14px);
}
.topbar h1 { font-size: calc(19px * var(--fs, 1)); margin: 0; }
.icon-btn { width: 40px; height: 40px; display: none; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; }
.content { width: 100%; max-width: 1240px; padding: 6px 32px calc(48px + env(safe-area-inset-bottom)); outline: none; }
.view-enter { animation: fadeIn .25s ease-out; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
.backdrop { display: none; }

/* ============ 4. Dashboard ============ */
.hello { margin: 6px 0 18px; }
.hello h2 { margin: 0; font-size: calc(27px * var(--fs, 1)); font-weight: 800; }
.hello p { margin: 2px 0 0; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.chip { font-size: calc(12px * var(--fs, 1)); font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }

/* Hero: verfügbares Geld + Zahlungsband des Monats (das zentrale Element) */
.hero { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--card-edge), var(--shadow); padding: 26px 28px 20px; margin-bottom: 16px; }
.hero-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px 40px; }
.hero-label { color: var(--muted); font-weight: 700; font-size: calc(14px * var(--fs, 1)); }
.hero-value { font-size: clamp(38px, 7vw, 56px); font-weight: 800; letter-spacing: -.04em; line-height: 1.05; margin-top: 4px; }
.hero-note { color: var(--muted); font-size: calc(13.5px * var(--fs, 1)); margin-top: 6px; }
.hero-side { display: flex; gap: 32px; }
.hero-side span { display: block; font-size: calc(13px * var(--fs, 1)); color: var(--muted); font-weight: 600; }
.hero-side strong { font-size: calc(21px * var(--fs, 1)); font-weight: 800; letter-spacing: -.02em; }
.band { position: relative; height: 40px; margin-top: 22px; }
.band-track, .band-past { position: absolute; left: 0; top: 18px; height: 4px; border-radius: 4px; }
.band-track { right: 0; background: var(--line); }
.band-past { background: var(--brand); transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.band-dot { position: absolute; top: 13px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 3px solid var(--surface); cursor: help; }
.band-dot.in { background: var(--income); }
.band-dot.out { background: var(--expense); }
.band-dot.past { opacity: .4; }
.band-today { position: absolute; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--ink); }
.band-legend { display: flex; justify-content: space-between; gap: 12px; font-size: calc(12.5px * var(--fs, 1)); color: var(--muted); font-weight: 600; }

/* Kennzahlen */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--card-bg); box-shadow: var(--card-edge); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; }
.kpi-head { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: calc(13px * var(--fs, 1)); font-weight: 700; }
.kpi-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.kpi-ico svg { width: 15px; height: 15px; }
.kpi-val { font-size: calc(24px * var(--fs, 1)); font-weight: 800; letter-spacing: -.03em; margin-top: 10px; }
.kpi-sub { font-size: calc(12.5px * var(--fs, 1)); color: var(--muted); margin-top: 2px; }
.tone-income { background: var(--income-soft); color: var(--income); }
.tone-expense { background: var(--expense-soft); color: var(--expense); }
.tone-saving { background: var(--saving-soft); color: var(--saving); }
.tone-warn { background: var(--warn-soft); color: var(--warn); }
.tone-brand { background: var(--brand-soft); color: var(--brand); }

/* Panels */
.panels { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.panel { background: var(--card-bg); box-shadow: var(--card-edge); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; min-width: 0; }
.s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; }
.panel h2 { font-size: calc(16px * var(--fs, 1)); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel h2 a { font-size: calc(13px * var(--fs, 1)); font-weight: 700; color: var(--brand); text-decoration: none; }
.panel h2 a:hover { text-decoration: underline; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.date-chip { width: 46px; flex-shrink: 0; text-align: center; border-radius: 10px; background: var(--surface-2); padding: 4px 0; font-size: calc(11px * var(--fs, 1)); font-weight: 600; color: var(--muted); line-height: 1.25; }
.date-chip b { display: block; font-size: calc(16px * var(--fs, 1)); color: var(--ink); }
.row-main { flex: 1; min-width: 0; display: grid; }
.row-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: calc(12.5px * var(--fs, 1)); color: var(--muted); }
.amt-in { color: var(--income); font-weight: 800; }
.amt-out { color: var(--expense); font-weight: 800; }
.amt-save { color: var(--saving); font-weight: 800; }
.empty { color: var(--muted); padding: 8px 0; }
.meter { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.meter:first-child { border-top: 0; padding-top: 2px; }
.meter-top { display: flex; justify-content: space-between; gap: 10px; font-size: calc(14px * var(--fs, 1)); }
.meter-top span { color: var(--muted); font-size: calc(13px * var(--fs, 1)); white-space: nowrap; }
.meter-sub { font-size: calc(12.5px * var(--fs, 1)); color: var(--muted); }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 8px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.bar.tone-saving > i { background: var(--saving); }
.bar.tone-ok > i { background: var(--income); }
.bar.tone-warn > i { background: var(--warn); }
.bar.tone-bad > i { background: var(--expense); }
.bar[class*="tone-"] { background: var(--surface-2); }
.lvl { font-weight: 700; margin-right: 4px; }
.lvl::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: currentColor; }
.lvl-ok { color: var(--income); } .lvl-warn { color: var(--warn); } .lvl-bad { color: var(--expense); }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: calc(14px * var(--fs, 1)); }
.alert svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; }
.alert.bad { background: var(--expense-soft); } .alert.bad svg { color: var(--expense); }
.alert.warn { background: var(--warn-soft); } .alert.warn svg { color: var(--warn); }
.alert.ok { background: var(--income-soft); } .alert.ok svg { color: var(--income); }

/* Platzhalter für kommende Bereiche */
.soon { text-align: center; padding: 64px 24px; background: var(--card-bg); border: 1px dashed var(--line); border-radius: var(--r-lg); }
.soon svg { width: 40px; height: 40px; color: var(--brand); }
.soon h2 { margin: 12px 0 4px; }
.soon p { color: var(--muted); max-width: 48ch; margin: 0 auto; }
.soon .chip { display: inline-block; margin-top: 16px; }

/* Buttons, Aktionen, Zeilen mit Betrag */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 11px; font-size: calc(14px * var(--fs, 1)); font-weight: 700; cursor: pointer; transition: background .15s, filter .15s; }
.btn svg { width: 16px; height: 16px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { color: var(--on-brand); } /* Verlauf, Rand und Schein: Abschnitt „Leuchten und Schimmern“ (O4) */
.btn.danger { background: var(--expense); border-color: var(--expense); color: var(--surface); }
.btn.danger:hover { background: var(--expense); filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.panel h2 .btn { font-size: calc(13px * var(--fs, 1)); padding: 7px 12px; }
.mini { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; color: var(--muted); cursor: pointer; }
.mini:hover { background: var(--surface-2); color: var(--ink); }
.mini svg { width: 15px; height: 15px; }
.row-actions { display: flex; gap: 6px; }
.mini[disabled] { opacity: .4; cursor: default; }
.head-tools { display: flex; align-items: center; gap: 8px; }
.month-nav { display: flex; align-items: center; gap: 6px; }
.month-nav strong { min-width: 9.5em; text-align: center; font-size: calc(13.5px * var(--fs, 1)); }
.meter-sub.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.shop-form { display: grid; grid-template-columns: 1fr 92px auto; gap: 8px; margin-bottom: 12px; }
.shop-form input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); color: var(--ink); font-weight: 600; }
.shop-form input:focus { border-color: var(--brand); }
.shop-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--brand); cursor: pointer; }
.shop-item.done .row-title { text-decoration: line-through; color: var(--muted); }
.shop-foot { display: grid; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: calc(14px * var(--fs, 1)); }
.shop-foot .between { display: flex; justify-content: space-between; gap: 10px; }
.shop-foot strong { font-size: calc(16px * var(--fs, 1)); }
.badge { display: inline-block; font-size: calc(12px * var(--fs, 1)); font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.goal-actions { display: flex; gap: 6px; align-items: center; }
.check-row { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); font-size: calc(13.5px * var(--fs, 1)); font-weight: 600; color: var(--ink); cursor: pointer; }
.check-row input { width: 18px; height: 18px; accent-color: var(--brand); }
.score { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.score .ring { flex-shrink: 0; }
.score > div { flex: 1; min-width: 180px; }
.score-grade { margin: 0 0 8px; font-size: calc(18px * var(--fs, 1)); font-weight: 800; text-transform: capitalize; }
.score-parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: calc(13px * var(--fs, 1)); }
.score-parts li { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; }
.score-parts b { font-weight: 800; }
.score-parts em { grid-column: 1 / -1; font-style: normal; font-size: calc(12px * var(--fs, 1)); color: var(--muted); }
.chart .ring-value { animation: ringIn 1s cubic-bezier(.3,.8,.3,1) both, glow 4.5s ease-in-out 1s infinite; }
@keyframes ringIn { from { stroke-dashoffset: 999; } }
.slider { display: grid; gap: 6px; margin-bottom: 14px; }
.slider label { display: flex; justify-content: space-between; gap: 10px; font-size: calc(13px * var(--fs, 1)); font-weight: 700; color: var(--muted); }
.slider label b { color: var(--ink); font-variant-numeric: tabular-nums; }
.slider input[type="range"] { width: 100%; accent-color: var(--brand); height: 22px; }
.accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
.account { display: grid; gap: 10px; padding: 16px 18px 18px; background: var(--card-bg); box-shadow: var(--card-edge); border: 1px solid var(--line); border-top: 3px solid var(--acc, var(--brand)); border-radius: var(--r-lg); }
.account-head { display: flex; align-items: center; gap: 10px; }
.account-head > div { flex: 1; min-width: 0; display: grid; }
.account-tag { background: var(--surface-2); color: var(--acc, var(--brand)); }
.account-balance { font-size: calc(26px * var(--fs, 1)); font-weight: 800; letter-spacing: -.03em; }
.spark { display: block; width: 100%; height: 34px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); }
.chart .lbl { fill: var(--muted); font-size: 12px; font-weight: 600; opacity: .9; }
.chart .val { fill: var(--ink); font-size: 20px; font-weight: 800; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .col { transform-box: fill-box; transform-origin: bottom; animation: barGrow .45s cubic-bezier(.22,.9,.3,1) both, pulse 6s ease-in-out infinite; }

/* Dialog & Formular */

/* Toasts */

/* ---------- Einstellungen: Akzent, Kontrast, Dichte, Privatsphäre, Bewegung ---------- */
:root[data-contrast="high"] { --line: #6B7C88; --muted: #D2DBE1; --ink: #F5F9FB; }
[data-contrast="high"] .topbar { backdrop-filter: none; background: var(--bg); }
[data-contrast="high"] .panel, [data-contrast="high"] .kpi, [data-contrast="high"] .account { border-width: 2px; }
[data-contrast="high"] .chart .grid { opacity: 1 !important; }
[data-contrast="high"] :focus-visible { outline-width: 3px; }
[data-density="compact"] .panel { padding: 14px 16px; }
[data-density="compact"] .kpi { padding: 12px 14px; }
[data-density="compact"] .panels, [data-density="compact"] .kpis { gap: 10px; }
[data-density="compact"] .row { padding-top: 5px; padding-bottom: 5px; }
[data-density="compact"] .meter { padding-top: 6px; padding-bottom: 6px; }
[data-density="compact"] .hero { padding: 18px 20px 14px; }
[data-privacy="on"] :is(.num, .kpi-val, .hero-value, .account-balance, .universe-big, .amt-in, .amt-out, .amt-save, .donut-legend b, .score-parts b, .compass-line, .chart text) { filter: blur(7px); }
[data-privacy="on"] .universe-stage canvas { filter: blur(6px); }
[data-motion="off"] *, [data-motion="off"] *::before, [data-motion="off"] *::after { animation: none !important; transition: none !important; }
[data-motion="reduced"] *, [data-motion="reduced"] *::before, [data-motion="reduced"] *::after { animation-iteration-count: 1 !important; }
[data-motion="off"] .chart .line, [data-motion="off"] .chart .line-glow { stroke-dashoffset: 0 !important; }
.toggles { display: grid; margin-top: 10px; }
.cat-row { gap: 10px; }
.letter-input, .letter-preview { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); color: var(--ink); font-family: var(--font); font-size: calc(14px * var(--fs, 1)); font-weight: 600; resize: vertical; }
.letter-input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent), 0 0 18px -6px var(--glow); }
.letter-preview { min-height: 280px; background: var(--surface); font-family: Georgia, 'Times New Roman', serif; font-weight: 400; line-height: 1.5; }
#printLetter { display: none; }
@media print {
  body.printing-letter > *:not(#printLetter) { display: none !important; }
  body.printing-letter #printLetter { display: block !important; white-space: pre-wrap; padding: 18mm 20mm; color: #000; font: 12pt/1.55 Georgia, 'Times New Roman', serif; }
}
.wizard-steps { list-style: none; margin: 0 0 14px; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.wizard-steps li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: calc(12.5px * var(--fs, 1)); font-weight: 700; }
.wizard-steps li b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink); font-size: calc(12px * var(--fs, 1)); flex-shrink: 0; }
.wizard-steps li.on { background: var(--brand-soft); color: var(--brand); }
.wizard-steps li.on b, .wizard-steps li.done b { background: var(--brand); color: var(--on-brand); }
.wiz-back { margin-top: 12px; }

.wiz-check { width: 100%; }
@media (max-width: 640px) { .wizard-steps { grid-template-columns: repeat(2, 1fr); } }
/* ---------- Sternenhimmel hinter den Karten (Etappe O2) ---------- */
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background: radial-gradient(120% 60% at 50% -12%, color-mix(in srgb, var(--brand) 7%, transparent), transparent 62%); }
.sky svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sky-tw i { position: absolute; border-radius: 50%; background: #fff; opacity: .45; box-shadow: 0 0 6px 1px rgba(255,255,255,.4);
  transform: translate(-50%, -50%); animation: twinkle var(--d, 5s) ease-in-out var(--delay, 0s) infinite; }
@keyframes twinkle { 0%, 100% { opacity: .12; transform: translate(-50%, -50%) scale(.7); } 50% { opacity: .95; transform: translate(-50%, -50%) scale(1.15); } }
[data-motion="reduced"] .sky-tw i { animation: none !important; }
body:has(.overlay) .sky-tw i { animation-play-state: paused; }
:root[data-contrast="high"] { --card-bg: var(--surface); }
[data-contrast="high"] .sky { opacity: .35; }
[data-contrast="high"] .sidebar { background: var(--surface); }
@media (max-width: 900px) { .sidebar { background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); } }
@media print { .sky { display: none !important; } }

/* ---------- Lebendige Bewegung (Etappe O3) ---------- */
/* Karten gleiten beim Seitenwechsel gestaffelt ein (--i setzt Motion.afterRender, höchstens 12 Stufen). */
.view-enter :is(.hero, .kpi, .panel, .account, .welcome, .soon, .sem-card, .universe-info) {
  animation: cardIn .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.985); } }
[data-motion="reduced"] .view-enter :is(.hero, .kpi, .panel, .account, .welcome, .soon, .sem-card, .universe-info) { animation: fadeIn .25s ease-out both; }
/* Zahlen zählen: der echte Text bleibt der Endwert (unsichtbar), darüber läuft die Zwischenzahl ohne Screenreader-Text. */
.counting { position: relative; color: transparent !important; }
.counting::after { content: attr(data-count-show); content: attr(data-count-show) / ""; position: absolute; inset: 0; color: var(--count-color, var(--ink)); text-align: inherit; white-space: nowrap; pointer-events: none; }
/* Dialoge und Sheets federn herein und gleiten beim Schließen weg (Abbild ohne Kennungen, nicht bedienbar). */
.overlay-ghost { position: fixed; inset: 0; z-index: 69; display: grid; place-items: end center; pointer-events: none; background: color-mix(in srgb, var(--bg) 66%, transparent); animation: fadeOut .24s ease-in forwards; }
.dialog-ghost { animation: dialogOut .24s cubic-bezier(.4, 0, 1, 1) forwards; }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes dialogOut { to { opacity: 0; transform: translateY(28px) scale(.98); } }
[data-motion="reduced"] .dialog { animation: fade .2s ease-out; }
[data-motion="reduced"] .toast { animation: fade .2s ease-out; }
@media (pointer: coarse) { .kpi-btn:active, .tool-btn:active, .nav-link:active { transform: scale(.97); } }
/* ---------- Leuchten und Schimmern (Etappe O4) ---------- */
/* Farbverlauf der Farbwelt auf Logo, Hauptknöpfen, Plus-Knopf, aktiver Navigation, Zahlungsband und Schaltern. */
.brand-mark { background: var(--grad); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 0 18px -4px var(--glow); }
.btn.primary { background: var(--grad); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 22px -12px var(--glow); }
.btn.primary:hover { background: var(--grad); filter: brightness(1.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 26px -10px var(--glow); }
.fab { background: var(--grad); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 1px color-mix(in srgb, var(--brand) 40%, transparent), 0 12px 32px -10px var(--glow); }
.nav-link { position: relative; }
.nav-link[aria-current="page"] { background: linear-gradient(90deg, var(--brand-soft), color-mix(in srgb, var(--brand-soft) 35%, transparent)); }
.nav-link[aria-current="page"]::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--grad); box-shadow: 0 0 10px 1px var(--glow); }
.nav-link[aria-current="page"] svg { filter: drop-shadow(0 0 6px var(--glow)); }
.band-past { background: var(--grad); box-shadow: 0 0 12px -1px var(--glow); }
.band-today { box-shadow: 0 0 8px color-mix(in srgb, var(--ink) 55%, transparent); }
.switch input:checked + i, .toggle input:checked + i { background: var(--grad); box-shadow: 0 0 12px -3px var(--glow); }
/* Hauptkarte „Noch verfügbar": zarter Schein der Farbwelt aus der Ecke. */
.hero { background: radial-gradient(90% 130% at 0% 0%, color-mix(in srgb, var(--brand) 11%, transparent), transparent 60%), var(--card-bg); border-color: color-mix(in srgb, var(--brand) 22%, var(--line)); }
/* Leuchtränder bei Fokus und Auswahl. */
:focus-visible { outline-color: var(--brand); box-shadow: 0 0 0 5px color-mix(in srgb, var(--brand) 20%, transparent); }
.field input:focus, .field select:focus, .field textarea:focus, .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent), 0 0 18px -6px var(--glow); }

.seg button[aria-pressed="true"] { color: var(--brand); box-shadow: var(--shadow), 0 0 12px -5px var(--glow); }
/* Fortschrittsbalken: Glanz zum Ende hin, Schein in der Balkenfarbe; erreichte Ziele schimmern. */
.bar { overflow: visible; }
.bar > i { position: relative; overflow: hidden; }
.bar.tone-saving { --tone-c: var(--saving); } .bar.tone-ok { --tone-c: var(--income); } .bar.tone-warn { --tone-c: var(--warn); }

.bar[class*="tone-"] > i { background-image: linear-gradient(90deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.22)); box-shadow: 0 0 10px -2px color-mix(in srgb, var(--tone-c, var(--brand)) 65%, transparent); }
.bar.reached > i { box-shadow: 0 0 14px 0 color-mix(in srgb, var(--tone-c) 75%, transparent); }
.bar.reached > i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,.6) 50%, transparent 75%); transform: translateX(-100%); animation: shimmer 3.2s ease-in-out .8s infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 55%, 100% { transform: translateX(100%); } }
/* Leuchtlinien in Diagrammen zeichnen sich mit der Linie. */
.chart .line-glow { stroke-dasharray: 5000; stroke-dashoffset: 5000; animation: drawLine 1.1s cubic-bezier(.3,.8,.3,1) forwards; pointer-events: none; }
[data-contrast="high"] .chart .line-glow { display: none; }
/* ---------- Feinschliff (Etappe O5) ---------- */
/* Roadmap: Mindestbreite je Schritt; wird es zu eng (Hochformat, halbe Breite), lässt sie sich seitlich wischen.
   Leiste und Liste liegen in derselben Rasterzelle, damit die Leiste über die ganze Breite mitläuft. */
.roadmap { display: grid; overflow-x: auto; scrollbar-width: thin; }
.roadmap > .rm-track, .roadmap > ol { grid-area: 1 / 1; }
.rm-track { position: relative; left: auto; right: auto; top: auto; align-self: start; margin: 16px 22px 0; }
.roadmap ol { grid-auto-columns: minmax(96px, 1fr); }
/* Wischbar: Ränder weich ausblenden, damit angeschnittene Schritte als „geht weiter" lesbar sind. */

/* Lange Namen in Listen dürfen zweizeilig werden statt abgeschnitten (z. B. „Krankenversicherung" neben drei Knöpfen). */
.row-title { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; hyphens: auto; }
/* Touch: alles Antippbare mindestens 48 px, ohne das Layout zu verschieben. */
@media (pointer: coarse) {
  .panel h2 a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 10px; margin: -14px -10px; }
  .hours-input, .cat-name { min-height: 48px; }
  .cat-row input[type="color"][data-cat-color], form.cat-add input[type="color"] { width: 48px; height: 48px; }
  .switch { min-height: 48px; align-items: center; }
  .icon-btn { width: 48px; height: 48px; }
  .toast button { min-height: 48px; padding: 0 10px; margin: -12px -6px -12px 0; }
}
@media print {
  :root, :root[data-palette], :root[data-contrast="high"] {

    --brand: #0B6E75; --brand-2: #0B6E75; --on-brand: #FFFFFF; --grad: #0B6E75;
    --income: #178A5A; --expense: #C8433F; --saving: #2E62D9; --warn: #B86E12; --shadow: none; --glow: transparent; color-scheme: light;
  }

}

/* ---------- Jahresrückblick als Geschichte (Etappe E11) ---------- */
@property --rc-accent { syntax: '<color>'; inherits: true; initial-value: #5FD6D2; }
.recap { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: #02050A; color: #F2F6FC; touch-action: none; overscroll-behavior: contain; animation: fade .3s ease-out; }
.recap.rc-out { animation: rcOut .24s ease-in both; }
@keyframes rcOut { to { opacity: 0; transform: scale(.98); } }
.rc-sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.rc-frame { --rc-accent: var(--brand); position: relative; width: min(100%, 600px); height: 100%; display: flex; flex-direction: column; overflow: hidden;
  padding: max(14px, env(safe-area-inset-top)) 22px max(16px, env(safe-area-inset-bottom));
  background: radial-gradient(120% 70% at 85% -5%, color-mix(in srgb, var(--rc-accent) 24%, transparent), transparent 62%),
    radial-gradient(90% 60% at 0% 105%, color-mix(in srgb, var(--brand-2) 16%, transparent), transparent 66%), rgba(4, 8, 16, .58);
  transition: --rc-accent .9s ease, transform .2s ease; }
@media (min-width: 700px) and (min-height: 620px) {

    box-shadow: 0 30px 90px -30px color-mix(in srgb, var(--rc-accent) 50%, transparent), 0 0 0 1px rgba(0,0,0,.4); }
}
.rc-bars { display: flex; gap: 5px; position: relative; z-index: 3; }
.rc-bars i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
.rc-bars b { display: block; height: 100%; background: #fff; transform-origin: left center; transform: scaleX(0); }
.rc-top { display: flex; align-items: center; gap: 8px; margin-top: 10px; position: relative; z-index: 3; }

.rc-btn { width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; border: 1px solid rgba(255,255,255,.16); background: rgba(10,16,28,.6); color: #F2F6FC; display: grid; place-items: center; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

.rc-side-prev { left: calc(50% - 300px - 84px); }
.rc-side-next { right: calc(50% - 300px - 84px); }
@media (min-width: 900px) and (min-height: 620px) { .rc-side { display: grid; } }
.rc-tap { position: absolute; top: 0; bottom: 0; z-index: 1; border: 0; padding: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.rc-tap.rc-prev { left: 0; width: 32%; }

.rc-slide { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 10px 0 4px; animation: rcSlide .6s cubic-bezier(.2, .8, .2, 1) both; }
.rc-slide.rc-s-end { justify-content: flex-start; overflow-y: auto; pointer-events: auto; touch-action: pan-y; padding-top: 18px; scrollbar-width: none; }

.rc-title { margin: 0; font-size: calc(clamp(26px, 2.6vh + 14px, 40px) * var(--fs, 1)); line-height: 1.14; font-weight: 800; letter-spacing: -.025em; color: #F4F7FB; text-wrap: balance; overflow-wrap: anywhere; }
.rc-title b, .rc-text b { color: color-mix(in srgb, var(--rc-accent) 50%, #fff); text-shadow: 0 0 26px color-mix(in srgb, var(--rc-accent) 55%, transparent); font-weight: 800; }

@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .rc-year { background: linear-gradient(100deg, #fff 12%, color-mix(in srgb, var(--rc-accent) 60%, #fff) 55%, color-mix(in srgb, var(--brand-2) 70%, #fff)); -webkit-background-clip: text; background-clip: text; color: transparent; }
}

.rc-axis.on { fill: #fff; }

@keyframes rcRing { from { stroke-dasharray: 0 100; } }
.rc-tick { stroke: #fff; stroke-width: 3; stroke-linecap: round; }
.rc-ring-val { fill: #fff; font: 800 46px var(--font); text-anchor: middle; dominant-baseline: central; letter-spacing: -.02em; }
.rc-ring-sub { fill: rgba(226,234,246,.78); font: 700 14px var(--font); text-anchor: middle; }

.rc-twinkle { animation: rcTw 3s ease-in-out infinite; animation-delay: calc(var(--d, 0) * -.7s); }
@keyframes rcTw { 50% { opacity: .35; } }
.rc-line { fill: none; stroke: var(--rc-accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--rc-accent)); }

.rc-dot { animation: fade .5s ease-out both; animation-delay: calc(var(--c, 0) * 16ms + 200ms); }
.rc-moons { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 14px; width: 100%; max-width: 520px; }
.rc-moon { display: grid; justify-items: center; gap: 4px; min-width: 0; text-align: center; }

.rc-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.rc-list li { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: calc(15px * var(--fs, 1)); font-weight: 700; color: #EEF3FA; }
.rc-list i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--c); box-shadow: 0 0 10px var(--c); }

.rc-tile b { display: block; margin-top: 4px; font-size: calc(20px * var(--fs, 1)); font-weight: 800; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }

.recap .toggle { margin-top: 10px; border-top-color: rgba(255,255,255,.1); }

.rc-chip[aria-pressed="true"] { background: var(--grad); color: var(--on-brand); border-color: transparent; }
body:has(.recap) { overflow: hidden; }

const BASE_CATEGORIES = {

/** Kategorien = Grundkategorien plus eigene Anpassungen (Name, Farbe, ausgeblendet, eigene). */
function categoryDefs(kind) {
  const compute = () => {
    const base = BASE_CATEGORIES[kind];
    const cfg = (Store.state && Store.state.categories && Store.state.categories[kind]) || [];
    const byId = new Map(cfg.map((c) => [c.id, c]));
    const list = Object.entries(base).map(([id, label]) => {
      const c = byId.get(id) || {};
      return { id, label: c.label || label, color: c.color || '', hidden: !!c.hidden, custom: false };
    });
    for (const c of cfg) if (c.custom && !base[c.id]) list.push({ id: c.id, label: c.label || 'Kategorie', color: c.color || '', hidden: !!c.hidden, custom: true });
    return list;
  };
  return Store.state ? Memo.get('cat-' + kind, compute) : compute();
}
const categoryMap = (kind) => {
  const compute = () => Object.fromEntries(categoryDefs(kind).map((c) => [c.id, c.label]));
  return Store.state ? Memo.get('catmap-' + kind, compute) : compute();
};

};

/* ---------- 2. Hilfsfunktionen ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const round2 = (n) => Math.round(n * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');

   Spart bei langen Listen einen Großteil des HTML (D1). */
const icon = (name) => (ICONS[name] ? `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-${name}"/></svg>` : '');
function mountIconSprite() {
  if (document.getElementById('iconSprite')) return;
  const holder = document.createElement('div');
  holder.innerHTML = `<svg id="iconSprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>${Object.entries(ICONS)
    .map(([name, paths]) => `<symbol id="ic-${name}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</symbol>`).join('')}</defs></svg>`;
  document.body.prepend(holder.firstElementChild);
}
const catLabel = (id) => CATEGORIES.expense[id] || CATEGORIES.income[id] || id;

/* Datumsfunktionen – immer lokale Zeit, Format 'YYYY-MM-DD' */
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const addMonths = (d, n) => {
  const y = d.getFullYear(), m = d.getMonth() + n;
  const lastDay = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(d.getDate(), lastDay)); // 31. → 28./30. im kürzeren Monat
};
/* Einstellungen für Rechnungen (Etappe A2) */
const setting = (key) => (Store.state && Store.state.settings ? Store.state.settings[key] : undefined);
const monthStartDay = () => Math.min(28, Math.max(1, Number(setting('monthStartDay')) || 1));
const weekStartDay = () => (Number(setting('weekStart')) === 0 ? 0 : 1);
const weekdayIndex = (d) => (d.getDay() - weekStartDay() + 7) % 7; // 0 = erster Tag der Woche
const savingsTarget = () => { const v = Number(setting('savingsTargetPct')); return (Number.isFinite(v) ? v : 20) / 100; };
const budgetWarn = () => (Number(setting('budgetWarnPct')) || 80) / 100;
const reserveMonths = () => Number(setting('reserveMonths')) || 3;

/** Budgetmonat: beginnt am eingestellten Tag, z. B. am Gehaltstag (28. bis 27.). */
const monthBounds = (offset = 0) => {
  const t = today();
  const start = monthStartDay();
  const base = t.getMonth() - (t.getDate() < start ? 1 : 0);
  return { from: new Date(t.getFullYear(), base + offset, start), to: new Date(t.getFullYear(), base + offset + 1, start - 1) };
};

/** Kalendermonat – für die Monatsansicht im Kalender. */
const calendarBounds = (offset = 0) => {
  const t = today();
  return { from: new Date(t.getFullYear(), t.getMonth() + offset, 1), to: new Date(t.getFullYear(), t.getMonth() + offset + 1, 0) };
};

/** Name eines Budgetmonats; bei verschobenem Monatsbeginn mit Zeitraum. */
function periodLabel(range, withYear = true) {
  const opts = withYear ? { month: 'long', year: 'numeric' } : { month: 'long' };
  const start = monthStartDay();
  if (start === 1) return range.from.toLocaleDateString('de-DE', opts);
  const main = start > 15 ? range.to : range.from;
  const short = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' });
  return `${main.toLocaleDateString('de-DE', opts)} (${short(range.from)}–${short(range.to)})`;
}

/* Formatierung (deutsches Zahlenformat) */
const Fmt = {
  _money: null,
  money(v, withSign = false) {
    if (!this._money) this._money = new Intl.NumberFormat('de-DE', { style: 'currency', currency: Store.state.settings.currency || 'EUR', ...(Store.state.settings.showCents === false ? { minimumFractionDigits: 0, maximumFractionDigits: 0 } : {}) });
    const s = this._money.format(v);
    return withSign && v > 0 ? '+' + s : s;
  },
  pct: (v) => new Intl.NumberFormat('de-DE', { style: 'percent', maximumFractionDigits: 1 }).format(v),
  date: (d) => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }),
  reset() { this._money = null; } // nach Währungswechsel aufrufen
};

    workLog: { weeks: {} }, // abweichende Wochenstunden: { 'Montag als YYYY-MM-DD': Stunden }
    closings: [], // Monatsabschlüsse: { id, month, closedAt, income, expenses, saving, surplus, rate, budgets[], skipRollover[], allocations[] }
    taxYears: {}, // Steuerprofil je Jahr: { '2026': { studyType, gross, withheld, uniKm, uniDays, jobKm, jobDays, homeDays, health } }
    transfers: [],  // { id, name, fromId, toId, amount, interval, date, active }
    templates: [],  // Schnellerfassung (E5): { id, name, kind, amount, category, accountId, note }
    tagMeta: {},    // Schlagwörter (E7): Kleinschreibung des Schlagworts -> { budget }
    personalRules: [], // { id, type: 'min-balance'|'min-saving-rate'|'max-category'|'max-count', value, category }
    achievements: {}   // Erfolgs-ID -> Datum der Freischaltung
  };
}

const SCHEMA_VERSION = 3;
const RESTORE_KEY = 'fp.restore';

/* ---------- Speicherschicht (Etappe E1) ----------
   Daten und Sicherungen liegen in IndexedDB (viel Platz), sonst wie bisher im Browser-Speicher (localStorage).
   Disk.open() liest beim Start beide Schlüssel einmal in den Arbeitsspeicher; danach ist Lesen synchron (Disk.get),
   Schreiben läuft im Hintergrund (Disk.put → Promise). Einmaliger Umzug aus localStorage, erst nach Bestätigung gelöscht.
   Modi: 'idb' | 'local' (kein IndexedDB, z. B. jsdom) | 'broken' (Daten liegen laut Marker in IndexedDB, das sich gerade
   nicht öffnen lässt – dann wird nichts geschrieben, damit nichts überschrieben wird).                                 */
const DISK_DB = 'finanzplaner';
const DISK_STORE = 'kv';
const DISK_MARKER = 'fp.store';
const DISK_KEYS = [STORAGE_KEY, RESTORE_KEY];

const Disk = {
  mode: 'local',
  db: null,
  cache: new Map(),
  migrated: false,
  error: null,
  listeners: [],
  channel: null,

  get(key) {
    if (this.mode === 'local') { try { return localStorage.getItem(key); } catch (e) { return null; } }
    return this.cache.has(key) ? this.cache.get(key) : null;
  },

  /** Schreibt einen Wert; Promise schlägt fehl, wenn der Speicher voll oder nicht erreichbar ist. */
  put(key, value) {
    if (this.mode === 'local') {
      try { localStorage.setItem(key, value); return Promise.resolve(); } catch (e) { return Promise.reject(e); }
    }
    if (this.mode === 'broken') return Promise.reject(this.error || new Error('Speicher nicht erreichbar'));
    const before = this.cache.get(key);
    this.cache.set(key, value);
    return this.request('put', key, value).then(() => this.announce(key, value), (e) => {
      if (this.cache.get(key) === value) { if (before === undefined) this.cache.delete(key); else this.cache.set(key, before); }
      throw e;
    });
  },

  remove(key) {
    if (this.mode === 'local') { try { localStorage.removeItem(key); } catch (e) { /* weiter */ } return Promise.resolve(); }
    this.cache.delete(key);
    if (this.mode === 'broken') return Promise.resolve();
    return this.request('delete', key).then(() => this.announce(key, null)).catch((e) => reportError('Speicher', e));
  },

  request(op, key, value) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(DISK_STORE, 'readwrite', { durability: 'strict' });
      const store = tx.objectStore(DISK_STORE);
      if (op === 'put') store.put(value, key); else store.delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Speichern abgebrochen'));
    });
  },

  read(key) {
    return new Promise((resolve, reject) => {
      const r = this.db.transaction(DISK_STORE, 'readonly').objectStore(DISK_STORE).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },

  /** Andere Fenster über Änderungen informieren (IndexedDB kennt kein „storage“-Ereignis). */
  announce(key, value) {
    if (this.channel) { try { this.channel.postMessage({ key, value }); } catch (e) { /* Fenster zu */ } }
  },
  listen(fn) { this.listeners.push(fn); },

  /** Beim Start: IndexedDB öffnen, Schlüssel lesen, einmalig aus localStorage umziehen. Wirft nie. */
  async open() {
    let marker = null;
    try { marker = localStorage.getItem(DISK_MARKER); } catch (e) { /* ohne Speicher */ }
    const idb = typeof indexedDB !== 'undefined' ? indexedDB : null;
    if (!idb) { this.mode = marker === 'idb' ? 'broken' : 'local'; return this.mode; }
    try {
      this.db = await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('Die App-Datenbank antwortet nicht.')), 4000);
        let req;
        try { req = idb.open(DISK_DB, 1); } catch (e) { clearTimeout(timer); reject(e); return; }
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(DISK_STORE)) req.result.createObjectStore(DISK_STORE); };
        req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
        req.onerror = () => { clearTimeout(timer); reject(req.error); };
      });
      for (const key of DISK_KEYS) { const v = await this.read(key); if (typeof v === 'string') this.cache.set(key, v); }
      const legacy = {};
      for (const key of DISK_KEYS) { try { const v = localStorage.getItem(key); if (v !== null) legacy[key] = v; } catch (e) { /* weiter */ } }
      if (legacy[STORAGE_KEY] !== undefined && !this.cache.has(STORAGE_KEY)) {
        // Umzug: kopieren, zurücklesen, erst dann im alten Speicher löschen
        try {
          for (const key of DISK_KEYS) if (legacy[key] !== undefined) await this.request('put', key, legacy[key]);
          for (const key of DISK_KEYS) if (legacy[key] !== undefined) {
            const back = await this.read(key);
            if (back !== legacy[key]) throw new Error('Umzug der Daten nicht bestätigt');
            this.cache.set(key, back);
          }
        } catch (e) {
          for (const key of DISK_KEYS) { try { await this.request('delete', key); } catch (x) { /* weiter */ } }
          this.cache.clear();
          throw e;
        }
        this.migrated = true;
      } else if (legacy[STORAGE_KEY] !== undefined && legacy[STORAGE_KEY] !== this.cache.get(STORAGE_KEY)) {
        // Beide vorhanden und verschieden: IndexedDB gilt, der andere Stand bleibt als Wiederherstellungspunkt erhalten
        let list = [];
        try { list = JSON.parse(this.cache.get(RESTORE_KEY) || '[]'); } catch (e) { list = []; }
        list.unshift({ at: new Date().toISOString(), reason: 'Stand aus dem Browser-Speicher', data: legacy[STORAGE_KEY] });
        const text = JSON.stringify(list);
        await this.request('put', RESTORE_KEY, text);
        this.cache.set(RESTORE_KEY, text);
      }
      for (const key of Object.keys(legacy)) { try { localStorage.removeItem(key); } catch (e) { /* weiter */ } }
      try { localStorage.setItem(DISK_MARKER, 'idb'); } catch (e) { /* ohne Marker */ }
      this.db.onversionchange = () => this.db.close();
      if (typeof BroadcastChannel === 'function') {
        this.channel = new BroadcastChannel('finanzplaner-disk');
        this.channel.onmessage = (e) => {
          const { key, value } = e.data || {};
          if (!DISK_KEYS.includes(key)) return;
          if (value === null) this.cache.delete(key); else this.cache.set(key, value);
          this.listeners.forEach((fn) => fn({ key, newValue: value }));
        };
      }
      this.mode = 'idb';
    } catch (e) {
      this.error = e;
      if (this.db) { try { this.db.close(); } catch (x) { /* weiter */ } }
      this.db = null;
      this.cache.clear();
      this.mode = marker === 'idb' ? 'broken' : 'local';
      console.warn('App-Datenbank nicht verfügbar:', e);
    }
    return this.mode;
  }
};

const Store = {
  state: null,
  persistent: true,
  timer: null,
  revision: 0,      // steigt bei jeder Änderung – Grundlage für den Rechen-Cache
  undoStack: [],    // Zustände vor den letzten Änderungen (für Rückgängig)
  redoStack: [],
  repaired: 0,      // beim Laden automatisch reparierte Stellen

  /** Lädt gespeicherte Daten; beim ersten Start leer. Gibt true zurück, wenn neu gestartet wurde. */
  load() {
    let raw = null;
    try { raw = Disk.get(STORAGE_KEY); } catch (e) { this.persistent = false; }
    if (raw && Vault.isEnvelope(raw)) {
      // Verschlüsselte Daten: erst nach Eingabe der PIN lesbar
      Vault.enabled = true;
      Vault.locked = true;
      try { const env = JSON.parse(raw); Vault.autoLock = env.autoLock ?? 5; } catch (e) { /* Standardwert bleibt */ }
      return 'locked';
    }
    if (raw) {
      try {
        const result = repairState(this.migrate(JSON.parse(raw)));
        this.state = result.state;
        this.repaired = result.fixes;
        return false;
      } catch (e) {
        console.warn('Gespeicherte Daten unlesbar – sie bleiben als Wiederherstellungspunkt erhalten.', e);
        writeRestorePoint('unlesbarer Speicherstand', raw);
      }
    }
    this.state = createEmptyState();
    this.state.meta.isNew = true;
    this.save();
    return true;
  },

  /** Ergänzt fehlende Felder und hebt ältere Speicherstände auf die aktuelle Version. */
  migrate(saved) {
    const base = createEmptyState();
    const s = { ...base, ...saved, meta: { ...base.meta, ...(saved.meta || {}) }, settings: { ...base.settings, ...(saved.settings || {}) } };
    if (!s.version || s.version < SCHEMA_VERSION) s.version = SCHEMA_VERSION;
    return s;
  },

  /** Merkt die Änderung vor und speichert gebündelt nach 250 ms. */
  save() {
    this.revision++;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 250);
  },

  /** Schreibt in den Browser-Speicher – bei aktiver Sperre verschlüsselt. Einmal täglich eine Sicherung. */
  flush() {
    if (!this.state) return Promise.resolve();
    const day = toISO(today());
    if (this.state.meta.lastRestore !== day && !isEmptyState()) {
      writeRestorePoint('Tagessicherung');
      this.state.meta.lastRestore = day;
    }
    const json = JSON.stringify(this.state);
    const write = (data) => Disk.put(STORAGE_KEY, data)
      .catch(() => {
        if (Disk.mode === 'broken') throw new Error('Speicher nicht erreichbar');
        return trimRestorePoints(2).then(() => Disk.put(STORAGE_KEY, data))
          .then(() => UI.toast('Der Speicher war knapp – ältere Sicherungen wurden entfernt.'));
      })
      .then(() => { this.persistent = true; }, () => {
        this.persistent = false;
        if (Disk.mode !== 'broken') UI.toast('Speichern nicht möglich, der Browser-Speicher ist voll. Bitte exportiere deine Daten.');
      })
      .then(() => UI.renderSaveState());
    if (Vault.enabled) {
      if (!Vault.key) return Promise.resolve(); // gesperrt: niemals Klartext schreiben
      this.pending = (this.pending || Promise.resolve())
        .then(() => Vault.encrypt(json))
        .then(write)
        .catch((e) => reportError('Verschlüsselung', e));
      return this.pending;
    }
    return write(json);
  },

  /** Sofort speichern, z. B. vor dem Sperren oder beim Verlassen der App. */
  flushNow() {
    clearTimeout(this.timer);
    return this.flush();
  },

  /** Zentrale Änderungsfunktion: vorher merken (Rückgängig) → ändern → speichern → neu zeichnen. */
  update(mutator) {
    const snapshot = JSON.stringify(this.state);
    this.undoStack.push(snapshot);
    // große Datenbestände: weniger Schritte, damit der Arbeitsspeicher nicht vollläuft
    while (this.undoStack.length > (snapshot.length > 1e6 ? 12 : 40)) this.undoStack.shift();
    this.redoStack = [];
    mutator(this.state);
    this.save();
    App.render(false);
  },

  /** Kompletten Zustand ersetzen (Import, Wiederherstellung) – ebenfalls rückgängig machbar. */
  replace(next) {
    this.undoStack.push(JSON.stringify(this.state));
    if (this.undoStack.length > 40) this.undoStack.shift();
    this.redoStack = [];
    this.state = next;
    this.save();
    Fmt.reset();
  },

  undo() {
    if (!this.undoStack.length) { UI.toast('Nichts zum Rückgängigmachen.'); return; }
    this.redoStack.push(JSON.stringify(this.state));
    this.state = JSON.parse(this.undoStack.pop());
    this.save();
    Fmt.reset();
    App.render(false);
    UI.toast('Letzte Änderung rückgängig gemacht.', { label: 'Wiederholen', run: () => this.redo() });
  },

  redo() {
    if (!this.redoStack.length) { UI.toast('Nichts zum Wiederholen.'); return; }
    this.undoStack.push(JSON.stringify(this.state));
    this.state = JSON.parse(this.redoStack.pop());
    this.save();
    Fmt.reset();
    App.render(false);
    UI.toast('Änderung wiederhergestellt.');
  }
};

/** Rechen-Cache: Ergebnisse gelten, bis sich Daten oder das Datum ändern. */
const Memo = {
  rev: -1, day: '', map: new Map(),
  get(key, compute) {
    const day = toISO(today());
    if (this.rev !== Store.revision || this.day !== day) { this.map.clear(); this.rev = Store.revision; this.day = day; }
    if (!this.map.has(key)) this.map.set(key, compute());
    return this.map.get(key);
  }
};

/* Wiederherstellungspunkte: die letzten sieben Stände, automatisch gepflegt */
function readRestorePoints() {
  try { return JSON.parse(Disk.get(RESTORE_KEY) || '[]'); } catch (e) { return []; }
}
function writeRestorePoint(reason, rawText) {
  const push = (data) => {
    const list = readRestorePoints();
    list.unshift({ at: new Date().toISOString(), reason, data });
    // Platz für Sicherungen: im Browser-Speicher rund 2 Mio. Zeichen, in der App-Datenbank rund 20 Mio.
    const budget = RESTORE_BUDGET[Disk.mode] || RESTORE_BUDGET.local;
    const keep = Math.min((Store.state && Number(Store.state.settings.restorePoints)) || 7, Math.max(1, Math.floor(budget / Math.max(1, String(data).length))));
    while (list.length > keep) list.pop();
    return Disk.put(RESTORE_KEY, JSON.stringify(list)).catch(() => trimRestorePoints(3));
  };
  if (rawText) { push(rawText); return; }
  if (!Store.state) return;
  const json = JSON.stringify(Store.state); // Stand jetzt festhalten, auch wenn danach sofort geändert wird
  if (Vault.enabled) {
    if (Vault.key) Vault.encrypt(json).then(push).catch((e) => reportError('Sicherung', e));
    return;
  }
  push(json);
}
function trimRestorePoints(keep) {
  return Disk.put(RESTORE_KEY, JSON.stringify(readRestorePoints().slice(0, keep))).catch(() => Disk.remove(RESTORE_KEY));
}
const RESTORE_BUDGET = { local: 2e6, idb: 2e7, broken: 0 };

/**
 * Prüft und repariert Daten: fehlende Listen, ungültige Zahlen und Daten,
 * doppelte Kennungen und Verweise auf gelöschte Konten.
 */
function repairState(s) {
  let fixes = 0;
  const lists = ['accounts', 'entries', 'budgets', 'goals', 'debts', 'shopping', 'wishlist', 'lifeEvents', 'challenges', 'rules', 'transfers', 'personalRules', 'semesters', 'closings', 'templates'];
  for (const key of lists) if (!Array.isArray(s[key])) { s[key] = []; fixes++; }
  const num = (v, fallback) => { const n = Number(v); if (Number.isFinite(n)) return n; fixes++; return fallback || 0; };
  const iso = (v) => { if (/^\d{4}-\d{2}-\d{2}$/.test(v || '')) return v; fixes++; return toISO(today()); };
  const unique = (list) => { const seen = new Set(); return list.filter((x) => x && typeof x === 'object').map((x) => { if (!x.id || seen.has(x.id)) { x.id = uid(); fixes++; } seen.add(x.id); return x; }); };

  s.entries = unique(s.entries).map((e) => ({
    ...e, kind: e.kind === 'income' ? 'income' : 'expense', name: String(e.name || 'Eintrag'),
    amount: Math.abs(num(e.amount)), date: iso(e.date),
    interval: INTERVALS[e.interval] ? e.interval : (fixes++, 'once')
  }));
  s.accounts = unique(s.accounts).map((a) => ({ ...a, interestRate: Math.min(50, Math.max(-10, Number(a.interestRate) || 0)), name: String(a.name || 'Konto'), balance: num(a.balance), type: ACCOUNT_TYPES[a.type] ? a.type : 'sonstige', history: Array.isArray(a.history) ? a.history : [] }));
  s.goals = unique(s.goals).map((g) => ({ ...g, name: String(g.name || 'Sparziel'), target: Math.abs(num(g.target)), saved: Math.abs(num(g.saved)), monthlyRate: Math.abs(num(g.monthlyRate)) }));
  s.budgets = unique(s.budgets).map((b) => ({ ...b, limit: Math.abs(num(b.limit)) }));
  s.debts = unique(s.debts).map((d) => ({ ...d, remaining: Math.abs(num(d.remaining)), monthlyRate: Math.abs(num(d.monthlyRate)) }));
  for (const key of ['shopping', 'wishlist', 'lifeEvents', 'challenges', 'rules', 'personalRules']) s[key] = unique(s[key]);

  const accountIds = new Set(s.accounts.map((a) => a.id));
  for (const e of s.entries) if (e.accountId && !accountIds.has(e.accountId)) { e.accountId = null; fixes++; }
  // Etappe E9: Aufrunden-Regeln – Stufe 1/2/5/10, Beginn als Datum, eingezahlte Monate als Zahlen
  for (const r of s.rules) {
    if (r && (r.type === 'salary-split' || r.type === 'surplus-transfer') && r.params && r.params.paid !== undefined) {
      // Monatsvermerk der Gehalts- und Überschuss-Regel: nur Datum → Betrag
      const paid = {};
      for (const [k, v] of Object.entries(r.params.paid && typeof r.params.paid === 'object' ? r.params.paid : {})) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Number.isFinite(Number(v)) && Number(v) >= 0) paid[k] = round2(Number(v));
      if (JSON.stringify(paid) !== JSON.stringify(r.params.paid)) { r.params = { ...r.params, paid }; fixes++; }
      continue;
    }
    if (!r || r.type !== 'round-up') continue;
    const p0 = r.params && typeof r.params === 'object' ? r.params : {};
    const step = [1, 2, 5, 10].includes(Number(p0.step)) ? Number(p0.step) : 1;
    const since = /^\d{4}-\d{2}-\d{2}$/.test(p0.since || '') ? p0.since : toISO(new Date(today().getFullYear(), today().getMonth(), 1));
    const paid = {};
    for (const [k, v] of Object.entries(p0.paid && typeof p0.paid === 'object' ? p0.paid : {})) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Number.isFinite(Number(v)) && Number(v) >= 0) paid[k] = round2(Number(v));
    const next = { ...p0, step, since, paid };
    if (JSON.stringify(next) !== JSON.stringify(r.params)) { r.params = next; fixes++; }
  }
  // Etappe E7: Schlagwörter – Liste aus Texten, bereinigt, ohne doppelte; Rahmen nur als positive Zahl
  for (const e of s.entries) {
    if (e.tags === undefined) continue;
    const clean = Array.isArray(e.tags) ? normTags(e.tags, false) : [];
    if (JSON.stringify(clean) !== JSON.stringify(e.tags)) fixes++;
    if (clean.length) e.tags = clean; else delete e.tags;
  }
  if (!s.tagMeta || typeof s.tagMeta !== 'object' || Array.isArray(s.tagMeta)) { if (s.tagMeta !== undefined) fixes++; s.tagMeta = {}; }
  for (const [k, v] of Object.entries(s.tagMeta)) {
    const budget = v && Number(v.budget);
    if (!(budget > 0) || !Number.isFinite(budget) || k !== k.toLowerCase()) { delete s.tagMeta[k]; fixes++; } else s.tagMeta[k] = { budget: round2(budget) };
  }
  // Etappe E6: Aufteilungen nur bei einmaligen Ausgaben, mindestens zwei Teile, alle am selben Tag
  const splitGroups = new Map();
  for (const e of s.entries) {
    if (!e.splitId) continue;
    if (e.interval !== 'once' || e.kind !== 'expense') { delete e.splitId; fixes++; continue; }
    if (!splitGroups.has(e.splitId)) splitGroups.set(e.splitId, []);
    splitGroups.get(e.splitId).push(e);
  }
  for (const parts of splitGroups.values()) {
    if (parts.length < 2) { delete parts[0].splitId; fixes++; continue; }
    for (const e of parts) if (e.date !== parts[0].date) { e.date = parts[0].date; fixes++; }
  }
  // Etappe E5: Vorlagen der Schnellerfassung – nur mit Namen und Betrag, Konto muss existieren
  const tplBefore = s.templates.length;
  s.templates = unique(s.templates).filter((t) => String(t.name || '').trim() && Math.abs(Number(t.amount)) > 0 && Number.isFinite(Number(t.amount))).map((t) => {
    const kind = t.kind === 'income' ? 'income' : 'expense';
    if (t.accountId && !accountIds.has(t.accountId)) fixes++;
    return { id: t.id, name: String(t.name).trim().slice(0, 60), kind, amount: round2(Math.abs(Number(t.amount))), category: String(t.category || (kind === 'income' ? 'sonstige' : 'sonstiges')),
      accountId: t.accountId && accountIds.has(t.accountId) ? t.accountId : null, note: String(t.note || '').slice(0, 140) };
  });
  fixes += tplBefore - s.templates.length;
  const entryIds = new Set(s.entries.map((e) => e.id)); // Etappe E3: Preisänderungs-Verweise
  for (const e of s.entries) {
    if (e.replacedBy && !entryIds.has(e.replacedBy)) { delete e.replacedBy; fixes++; }
    if (e.replaces && !entryIds.has(e.replaces)) { delete e.replaces; fixes++; }
    if (e.priceHistory && !Array.isArray(e.priceHistory)) { delete e.priceHistory; fixes++; }
  }
  for (const g of s.goals) {
    if (g.fromId && !accountIds.has(g.fromId)) { g.fromId = null; fixes++; }
    if (g.toId && !accountIds.has(g.toId)) { g.toId = null; fixes++; }
  }
  s.transfers = unique(s.transfers).filter((t) => {
    const ok = accountIds.has(t.fromId) && accountIds.has(t.toId) && num(t.amount) > 0;
    if (!ok) fixes++;
    return ok;
  }).map((t) => ({ ...t, amount: Math.abs(num(t.amount)), date: iso(t.date), interval: INTERVALS[t.interval] ? t.interval : 'monthly' }));
  if (!s.categoryRules || typeof s.categoryRules !== 'object' || Array.isArray(s.categoryRules)) { s.categoryRules = {}; fixes++; }
  if (!s.categories || typeof s.categories !== 'object') { s.categories = { expense: [], income: [] }; fixes++; }
  for (const kind of ['expense', 'income']) if (!Array.isArray(s.categories[kind])) { s.categories[kind] = []; fixes++; }
  if (!s.workLog || typeof s.workLog !== 'object' || typeof s.workLog.weeks !== 'object' || Array.isArray(s.workLog.weeks)) { s.workLog = { weeks: {} }; fixes++; }
  s.semesters = s.semesters.filter((x) => x && typeof x === 'object').map((x) => ({
    ...x, id: x.id || uid(), name: String(x.name || 'Semester'),
    items: Array.isArray(x.items) ? x.items.filter((i) => i && typeof i === 'object').map((i) => ({ ...i, id: i.id || uid(), name: String(i.name || 'Posten'), amount: Math.abs(Number(i.amount) || 0) })) : []
  }));
  const semesterIds = new Set(s.semesters.map((x) => x.id));
  s.entries = s.entries.filter((e) => e.source !== 'semester' || semesterIds.has(e.semesterId)); // verwaiste Planer-Buchungen
  if (!s.taxYears || typeof s.taxYears !== 'object' || Array.isArray(s.taxYears)) { s.taxYears = {}; fixes++; }
  fixes += sanitizeSettings(s);
  s.version = SCHEMA_VERSION;
  return { state: s, fixes };
}

/** Einstellungen auf gültige Werte bringen: Bereiche, Auswahllisten, Jahreswerte. */
function sanitizeSettings(s) {
  let fixes = 0;
  const base = createEmptyState().settings;
  const before = s.settings || {};
  const st = s.settings = { ...base, ...before };
  st.limits = { ...base.limits, ...(st.limits || {}) };
  if (!('palette' in before) && before.accent) st.palette = ACCENT_TO_PALETTE[before.accent] || 'petrol'; // Akzentfarbe bis 3.6
  delete st.accent;
  const clamp = (key, min, max) => {
    const n = Number(st[key]);
    if (!Number.isFinite(n) || n < min || n > max) { st[key] = base[key]; fixes++; } else st[key] = n;
  };
  clamp('fontScale', 85, 140); clamp('defaultInterest', -10, 50); clamp('monthStartDay', 1, 28); clamp('budgetWarnPct', 50, 100);
  clamp('savingsTargetPct', 0, 80); clamp('reserveMonths', 1, 12); clamp('restorePoints', 1, 20);
  const oneOf = (key, list) => { if (!list.includes(st[key])) { st[key] = base[key]; fixes++; } };
  oneOf('palette', Object.keys(PALETTES));
  oneOf('density', ['komfortabel', 'kompakt']);
  oneOf('animations', ['voll', 'reduziert', 'aus']);
  oneOf('chartStyle', ['sanft', 'klar', 'kräftig']);
  oneOf('universeQuality', ['sparsam', 'ausgewogen', 'ultra']);
  oneOf('universeRenderer', ['auto', 'canvas']);
  oneOf('universeGlow', ['aus', 'dezent', 'normal', 'stark']);
  oneOf('universeParticles', ['wenig', 'normal', 'viel']);
  oneOf('universeLabels', ['alle', 'auswahl', 'keine']);
  oneOf('universePalette', ['kosmos', 'aurora', 'violett', 'nacht']);
  oneOf('universeSpeed', ['langsam', 'normal', 'schnell']);
  if (typeof st.universeParallax !== 'boolean') st.universeParallax = true;
  if (typeof st.starfield !== 'boolean') st.starfield = true;
  for (const k of ['universeMeteors', 'universeDrift']) if (typeof st[k] !== 'boolean') st[k] = true;
  for (const [key, list] of [['reminderDays', [7, 14, 30, 45, 60]], ['exportReminderWeeks', [0, 2, 4, 8]]]) {
    const n = Number(st[key]);
    if (!list.includes(n)) { st[key] = base[key]; fixes++; } else st[key] = n;
  }
  for (const key of ['contrast', 'showCents', 'privacy', 'haptics', 'universeSound']) st[key] = !!st[key];
  return fixes;
}

/* ---------- Fehlerschutz: ein Fehler legt nie die ganze App lahm ---------- */
let lastErrorToast = 0;
function reportError(where, error) {
  console.error(`[Finanzplaner] ${where}:`, error);
  if (Date.now() - lastErrorToast < 1500 || typeof UI === 'undefined') return;
  lastErrorToast = Date.now();
  UI.toast(`Da ist etwas schiefgelaufen (${where}). Deine Daten sind sicher.`);
}
function safeCall(fn, where) {
  try { return fn(); } catch (e) { reportError(where, e); return undefined; }
}

/* ---------- 5. Finanzlogik ---------- */
const Finance = {
  /** Alle Termine eines Eintrags im Zeitraum [from, to] (Date-Objekte). */
  occurrences(e, from, to) {
    const start = parseISO(e.date);
    const end = e.endDate ? parseISO(e.endDate) : null;
    const last = end && end < to ? end : to;
    if (start > last) return [];
    if (e.interval === 'once') return start >= from ? [start] : [];
    const out = [];
    if (e.interval === 'daily' || e.interval === 'weekly') {
      const step = e.interval === 'daily' ? 1 : 7;
      const skip = Math.max(0, Math.floor((from - start) / 864e5 / step) - 1);
      for (let d = addDays(start, skip * step); d <= last; d = addDays(d, step)) if (d >= from) out.push(d);
      return out;
    }
    const k = { monthly: 1, quarterly: 3, halfyearly: 6, yearly: 12 }[e.interval] || 1;
    const diff = (from.getFullYear() - start.getFullYear()) * 12 + from.getMonth() - start.getMonth();
    for (let n = Math.max(0, Math.floor(diff / k) - 1); ; n++) {
      const d = addMonths(start, n * k);
      if (d > last) break;
      if (d >= from) out.push(d);
    }
    return out;
  },

  /** Alle Geldbewegungen im Zeitraum, chronologisch (Einnahmen positiv, Ausgaben negativ). */
  flows(from, to) {
    return Memo.get(`flows${toISO(from)}${toISO(to)}`, () => {
      const out = [];
      for (const e of entriesIn(from, to)) {
        for (const date of this.occurrences(e, from, to)) out.push({ date, entry: e, amount: e.kind === 'income' ? e.amount : -e.amount });
      }
      return out.sort((a, b) => a.date - b.date);
    });
  },

  /** Summe einer Art (income/expense) im Zeitraum, optional gefiltert. */
  sum(kind, from, to, filter) {
    const compute = () => {
      let total = 0;
      for (const e of entriesIn(from, to)) if (e.kind === kind && (!filter || filter(e))) total += this.occurrences(e, from, to).length * e.amount;
      return round2(total);
    };
    return filter ? compute() : Memo.get(`sum${kind}${toISO(from)}${toISO(to)}`, compute);
  },

  /** Alle Kennzahlen für den laufenden Monat. */
  summary() { return Memo.get('summary', () => this.computeSummary()); },

  computeSummary() {
    const s = Store.state, t = today();
    const { from, to } = monthBounds();
    const prev = monthBounds(-1);
    const income = this.sum('income', from, to);
    const expenses = this.sum('expense', from, to);
    const fixed = this.sum('expense', from, to, (e) => e.interval !== 'once');
    const saving = s.goals.filter((g) => g.saved < g.target).reduce((a, g) => a + g.monthlyRate, 0);
    const assets = s.accounts.reduce((a, x) => a + x.balance, 0);
    const debts = s.debts.reduce((a, d) => a + d.remaining, 0);
    const cash = s.accounts.filter((a) => LIQUID_TYPES.includes(a.type)).reduce((a, x) => a + x.balance, 0);

    // Prognose: heutiger Kontostand + alle geplanten Buchungen bis Monatsende; tiefster Stand merken
    let run = cash, min = cash, minDate = t;
    for (const f of this.flows(addDays(t, 1), to)) {
      run += f.amount;
      if (run < min) { min = run; minDate = f.date; }
    }
    return {
      income, expenses, fixed, variable: round2(expenses - fixed), saving,
      rest: round2(income - expenses - saving),
      savingsRate: income > 0 ? (income - expenses) / income : 0,
      fixedRatio: income > 0 ? fixed / income : 0,
      assets: round2(assets), debts: round2(debts), netWorth: round2(assets - debts),
      cash: round2(cash), forecast: round2(run), minBalance: round2(min), minDate,
      prevIncome: this.sum('income', prev.from, prev.to), monthEnd: to
    };
  },

  /** Budgetverbrauch pro Kategorie mit Ampelstufe. */
  budgetStatus() { return Memo.get('budgets', () => this.computeBudgetStatus()); },

  computeBudgetStatus() {
    const { from, to } = monthBounds();
    return Store.state.budgets.map((b) => {
      const carry = rolloverFor(b, 0);
      const limit = round2(b.limit + carry);
      const spent = this.sum('expense', from, to, (e) => e.category === b.category);
      const ratio = limit > 0 ? spent / limit : 0;
      return { ...b, baseLimit: b.limit, carry, limit, spent, ratio, level: ratio >= 1 ? 'bad' : ratio >= budgetWarn() ? 'warn' : 'ok' };
    });
  },

  /** Warnungen aus Kennzahlen und Budgets. */
  warnings(k, budgets) {
    const list = [];
    if (k.forecast < 0) list.push(['bad', `Dein Konto rutscht bis Monatsende voraussichtlich ins Minus (${Fmt.money(k.forecast)}).`]);
    else if (k.minBalance < Store.state.settings.criticalBalance) list.push(['warn', `Kritischer Kontostand am ${Fmt.date(k.minDate)}: ${Fmt.money(k.minBalance)}.`]);
    if (k.rest < 0) list.push(['bad', `Ausgaben und Sparraten übersteigen deine Einnahmen um ${Fmt.money(-k.rest)}.`]);
    for (const b of budgets) {
      if (b.level === 'bad') list.push(['bad', `Budget ${esc(catLabel(b.category))} überschritten: ${Fmt.money(b.spent)} von ${Fmt.money(b.limit)}.`]);
      else if (b.level === 'warn') list.push(['warn', `Budget ${esc(catLabel(b.category))} fast aufgebraucht (${Fmt.pct(b.ratio)}).`]);
    }
    for (const e of Store.state.entries) {
      const status = typeof contractStatus === 'function' ? contractStatus(e) : null;
      if (status && status.level === 'bad') list.push(['warn', `${esc(e.name)}: noch ${status.days} Tage zum Kündigen.`]);
    }
    if (typeof evaluatePersonalRules === 'function') {
      for (const x of evaluatePersonalRules()) if (x.status === 'verletzt') list.push(['bad', `Regel verletzt: ${esc(x.title)}. ${esc(x.text)}`]);
    }
    if (workSetup()) {
      for (const c of workStatus().checks) {
        if ((c.id === '26' && c.level !== 'ok') || (c.id === 'lecture' && c.level !== 'ok') || (c.id === 'minijob' && c.level === 'bad')) list.push([c.level, `${esc(c.title)}: ${esc(c.text)}`]);
      }
    }
    for (const rule of Store.state.rules || []) { // Etappe E9: fertig aufgerundete Monate
      if (rule.type !== 'round-up' || !rule.active) continue;
      const st = roundUpStatus(rule);
      if (st.pendingTotal > 0 && st.goal) list.push(['info', `Aufgerundet: ${Fmt.money(st.pendingTotal)} aus ${esc(st.pending.map((m) => m.label).join(', '))} sind bereit für ${esc(st.goal.name)}. <button type="button" class="btn" data-action="rule-run" data-id="${rule.id}">Einzahlen</button>`]);
    }
    const recapYear = recapHintYear(); // Etappe E11
    if (recapYear) list.push(['info', `Dein Jahresrückblick ${recapYear} ist fertig – dein Jahr als Geschichte im Universum. <button type="button" class="btn" data-action="recap-open" data-id="${recapYear}">Abspielen</button>`]);
    const target = closingTarget();
    if (target) list.push(['info', `Monatsabschluss für ${esc(periodLabel(target))} steht an. <button type="button" class="btn" data-action="close-month">Jetzt abschließen</button>`]);
    const exportWeeks = Number(setting('exportReminderWeeks')) || 0;
    if (exportWeeks > 0 && Store.state.entries.length) {
      const last = Store.state.meta.lastExport ? parseISO(Store.state.meta.lastExport) : null;
      const ago = last ? Math.round((today() - last) / 864e5) : null;
      if (ago === null || ago >= exportWeeks * 7) {
        list.push(['warn', `${ago === null ? 'Du hast deine Daten noch nie exportiert.' : `Letzter Export vor ${ago} Tagen.`} <button type="button" class="btn" data-action="backup-create">Verschlüsselt sichern</button> <button type="button" class="btn" data-action="export-json">Jetzt exportieren</button>`]);
      }
    }
    if (k.fixedRatio > 0.6) list.push(['warn', `Fixkosten binden ${Fmt.pct(k.fixedRatio)} deiner Einnahmen – Richtwert sind 50 %.`]);
    return list;
  }
};

/** Übertrag aus dem Vormonat: nicht verbrauchtes Budget, begrenzt durch die Obergrenze. */
function rolloverFor(b, monthOffset) {
  if (!b.rollover || !b.rollover.enabled) return 0;
  const prev = monthBounds((monthOffset || 0) - 1);
  const closing = ((Store.state && Store.state.closings) || []).find((c) => c.month === toISO(prev.from));
  if (closing && (closing.skipRollover || []).includes(b.id)) return 0;
  const spent = Finance.sum('expense', prev.from, prev.to, (e) => e.category === b.category);
  const cap = b.rollover.cap > 0 ? b.rollover.cap : b.limit;
  return round2(Math.min(cap, Math.max(0, b.limit - spent)));
}

/** Übernimmt Darstellungs-Einstellungen: Schriftgröße, Kontrast, Farbwelt, Dichte, Privatsphäre, Bewegung. */
function applySettings() {
  if (!Store.state) return;
  const s = Store.state.settings;
  const root = document.documentElement;
  root.style.setProperty('--fs', String((s.fontScale || 100) / 100));
  root.dataset.contrast = s.contrast ? 'high' : 'normal';
  const palette = PALETTES[s.palette] ? s.palette : 'petrol';
  if (root.dataset.palette !== palette) {
    root.dataset.palette = palette;
    try { localStorage.setItem(PALETTE_KEY, palette); } catch (e) {}
  }
  const themeColor = document.querySelector('meta[name="theme-color"]');
  if (themeColor) themeColor.setAttribute('content', PALETTES[palette].bg);
  document.querySelectorAll('[data-palette-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.paletteSet === palette)));
  Sky.apply();
  root.dataset.density = s.density === 'kompakt' ? 'compact' : 'comfortable';
  root.dataset.privacy = s.privacy ? 'on' : 'off';
  root.dataset.motion = s.animations === 'aus' ? 'off' : s.animations === 'reduziert' ? 'reduced' : 'full';
  const signature = `${s.currency}|${s.showCents}`;
  if (Fmt.signature !== signature) { Fmt.reset(); Fmt.signature = signature; }
  const eye = document.querySelector('[data-history="privacy"]');
  if (eye) { eye.innerHTML = icon(s.privacy ? 'eyeOff' : 'eye'); eye.setAttribute('aria-pressed', String(!!s.privacy)); }
}

/* ---------- Index für große Datenmengen (Etappe D1) ----------
   Einmalige Buchungen liegen nach Datum sortiert; eine Binärsuche liefert die eines Zeitraums.
   Wiederkehrende Buchungen sind wenige und werden immer geprüft. Die Terminberechnung bleibt dieselbe,
   sie läuft nur auf weniger Kandidaten – die Ergebnisse sind identisch.                                */
function entryIndex() {
  return Memo.get('entry-index', () => {
    const once = [], recurring = [];
    for (const e of Store.state.entries) (e.interval === 'once' ? once : recurring).push(e);
    once.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return { once, recurring, dates: once.map((e) => e.date) };
  });
}
const firstAtOrAfter = (dates, iso) => {
  let lo = 0, hi = dates.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (dates[mid] < iso) lo = mid + 1; else hi = mid; }
  return lo;
};
/** Alle Buchungen, die im Zeitraum Termine haben können. */
function entriesIn(from, to) {
  const ix = entryIndex();
  return ix.recurring.concat(ix.once.slice(firstAtOrAfter(ix.dates, toISO(from)), firstAtOrAfter(ix.dates, toISO(addDays(to, 1)))));
}
